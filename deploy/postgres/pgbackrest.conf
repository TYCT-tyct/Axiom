# pgBackRest configuration for the database container (docs/ops/backup-restore.md「WAL 连续归档与时间点恢复」).
# The repository location and credentials come from the environment (PGBACKREST_REPO1_*), which is also what
# `docker compose exec postgres pgbackrest ...` sees; only the values that describe this cluster are here.
#
# The stanza is named for the deployment, not for the host: it is the same stanza on the source and on a restore.
[axiom]
pg1-path=/var/lib/postgresql/18/docker

[global]
repo1-type=s3
# How the bucket is addressed comes from PGBACKREST_REPO1_S3_URI_STYLE (deploy/compose.yaml maps it from
# AXIOM_BACKUP_S3_URI_STYLE): path for SeaweedFS, R2, MinIO and Backblaze, host for AWS S3. The set client's
# AXIOM_BACKUP_S3_FORCE_PATH_STYLE is a different client and does not apply here.

# The archive holds every row, so it is encrypted client-side before it leaves the machine. The passphrase is a
# deployment secret (AXIOM_BACKUP_CIPHER_PASS); losing it loses point-in-time recovery, not the logical sets.
repo1-cipher-type=aes-256-cbc
# Seven full backups kept; the basebackup job decides the interval (daily runs give a week of PITR). There is no
# dependency chain to reason about. WAL is kept for as long as the oldest retained backup needs it, which is
# pgBackRest's default.
repo1-retention-full=7
repo1-retention-full-type=count
repo1-bundle=y
compress-type=zst
# A scheduled backup starts after the next checkpoint instead of waiting for a quiet cluster.
start-fast=y
# The root file system is read-only in the deployment; the lock files live on the volume the deployment mounts there.
lock-path=/var/lib/pgbackrest
log-level-file=off

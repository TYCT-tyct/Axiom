# The program and its database on one machine (docs/architecture.md「部署拓扑」). Start it with `just up`, which also
# writes the passwords this file reads to deploy/.env; deploy/.env.example describes them. The project name, the image
# tag, the host ports and the restart policy are variables so that CI jobs sharing a host keep their stacks apart
# (scripts/ci/deploy-check.sh sets them); local `just up` uses the defaults and the project name axiom.
#
# The backup and restore jobs are here under the profile ops, so that neither `just up` nor the deployment check starts
# or builds them (docs/ops/backup-restore.md). The production edge is not here at all: deploy/compose.edge.yaml adds it
# and the network it needs, because that network pins a subnet and no deployment without an edge should carry it.
name: axiom

x-hardened: &hardened
  cgroup_parent: ${AXIOM_TEST_CGROUP_PARENT:-}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  labels:
    # Marks the stacks scripts/ci/deploy-check.sh may remove when a killed job left one behind: it touches only
    # projects named axiom-ci-* with this label, and only ones older than its step timeout.
    axiom.ci.deploy-check: "true"

# What both backup jobs share: the same image, the same connection to the database, the same bucket. The variables are
# passed empty when they are unset and checked by the scripts, because `docker compose up` interpolates every service in
# this file whether or not its profile starts: a `${VAR:?}` here would stop `just up`, which never runs these jobs.
#
# They are not under x-hardened: the restore writes the key ring with the owner the program runs as, which needs the
# CHOWN capability x-hardened drops, and both write into a temporary directory, which a read-only root would refuse.
x-ops: &ops
  profiles: [ops]
  build: ./ops
  image: ${DEPLOY_OPS_IMAGE:-axiom-ops:local}
  # A one-shot job: a failure is a non-zero exit for the scheduler to report, not a container that restarts forever.
  restart: "no"
  environment: &ops-env
    PGHOST: postgres
    PGDATABASE: axiom
    PGUSER: postgres
    # Empty here and checked where it is needed: the restore's first step runs before any password is known (the set
    # carries them), so a required variable would stop it at the compose level.
    PGPASSWORD: ${AXIOM_POSTGRES_PASSWORD-}
    AXIOM_KEYS_DIR: /keys
    AXIOM_BACKUP_BUCKET: ${AXIOM_BACKUP_BUCKET-}
    AXIOM_BACKUP_PREFIX: ${AXIOM_BACKUP_PREFIX:-axiom}
    AXIOM_BACKUP_STATE_DIR: /state
    # rclone's S3 backend, configured through the environment so no credential is ever an argument: path-style
    # addressing and this region are what MinIO, R2 and Backblaze want; AWS S3 itself wants the bucket in its own region
    # and AXIOM_BACKUP_S3_FORCE_PATH_STYLE=false.
    RCLONE_CONFIG_AXIOM_TYPE: s3
    RCLONE_CONFIG_AXIOM_PROVIDER: Other
    RCLONE_CONFIG_AXIOM_ENDPOINT: ${AXIOM_BACKUP_S3_ENDPOINT-}
    RCLONE_CONFIG_AXIOM_ACCESS_KEY_ID: ${AXIOM_BACKUP_S3_ACCESS_KEY_ID-}
    RCLONE_CONFIG_AXIOM_SECRET_ACCESS_KEY: ${AXIOM_BACKUP_S3_SECRET_ACCESS_KEY-}
    RCLONE_CONFIG_AXIOM_REGION: ${AXIOM_BACKUP_S3_REGION:-us-east-1}
    RCLONE_CONFIG_AXIOM_FORCE_PATH_STYLE: ${AXIOM_BACKUP_S3_FORCE_PATH_STYLE:-true}

services:
  postgres:
    image: postgres:18.6-alpine
    # A CI job sets DEPLOY_RESTART_POLICY=no, so containers a killed job leaves behind never start again; local
    # `just up` keeps the restart the machine wants.
    restart: ${DEPLOY_RESTART_POLICY:-unless-stopped}
    # As the image's postgres user from the start, so its entrypoint needs no capability to change owners and users.
    user: postgres
    tmpfs: [/var/run/postgresql] # the server's socket and lock files; the data are on the volume
    environment:
      POSTGRES_DB: axiom
      POSTGRES_PASSWORD: ${AXIOM_POSTGRES_PASSWORD:?set it in deploy/.env}
      # read by postgres/roles.sh
      AXIOM_APP_PASSWORD: ${AXIOM_APP_PASSWORD:?set it in deploy/.env}
      AXIOM_MIGRATOR_PASSWORD: ${AXIOM_MIGRATOR_PASSWORD:?set it in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while it runs the init scripts, the image's temporary server listens only on its Unix socket.
      test: [CMD, pg_isready, --host, 127.0.0.1, --username, postgres, --dbname, axiom]
      interval: 10s
      start_period: 30s
      start_interval: 1s
    <<: *hardened

  migrate:
    image: ${DEPLOY_IMAGE:-axiom:local}
    command: [migrate]
    environment:
      AXIOM_MIGRATE_DATABASE_URL: postgres://axiom_migrator:${AXIOM_MIGRATOR_PASSWORD}@postgres/axiom?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    <<: *hardened

  # Makes the three key files the program reads at start (internal/platform/README.md「凭证加密」, internal/accounts/README.md
  # 「格式与哈希」) once, in a volume that lives as long as the database does: the master key seals users' TOTP secrets
  # and suppliers' credentials, the hashing key makes API key hashes, and the identity key makes the identifiers sent
  # upstream in place of a client's session and end-user ones. Losing the first two with the database kept would lock
  # users out of their factors and keys and suppliers out of their credentials; losing the third would cost the
  # upstream's prompt caches. Each file is owned by the program's user and readable by it alone, which the program
  # requires.
  # It also makes the shared cache's password, for the program in this volume, and the ACL file with the password's
  # SHA-256 in a volume of its own for the cache (internal/platform/kv/README.md「部署」), so the cache cannot read the
  # three keys above.
  keys:
    image: postgres:18.6-alpine # any image with a shell; this one is pulled for the database anyway
    user: root # only to make the files and hand them over
    entrypoint: [sh, -ec]
    command:
      - |
        umask 277
        # A deployment that shares the key ring between nodes must restore the protected volume, never let each node
        # generate divergent material: with no file and this false, this service refuses instead of making one.
        if [ "$${AXIOM_KEYRING_GENERATE:-true}" = false ]; then
          for name in master hash identity; do
            [ -f /keys/$$name ] || { echo "keys: /keys/$$name is missing and AXIOM_KEYRING_GENERATE is false" >&2; exit 1; }
          done
        fi
        for name in master hash identity; do
          [ -f /keys/$$name ] || echo "1:$$(head -c 32 /dev/urandom | base64)" > /keys/$$name
        done
        # The cache's password is made once with its two copies: the program's, and the cache's with the ACL file that holds
        # only its SHA-256. The root of this container can create and delete files but not read the ones it has handed
        # over (it has only CHOWN), so nothing here reads a file after the chown: when the three exist, they stay.
        if [ ! -f /keys/valkey-password ] || [ ! -f /cache/users.acl ]; then
          rm -f /keys/valkey-password /cache/password /cache/users.acl
          password="$$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')"
          printf '%s\n' "$$password" > /keys/valkey-password
          printf '%s\n' "$$password" > /cache/password
          printf 'user default off\nuser axiom on #%s ~ax:* +hello +auth +ping +client|setinfo +info +time +get +set +del +incr +pexpire +eval\n' \
            "$$(printf '%s' "$$password" | sha256sum | cut -d' ' -f1)" > /cache/users.acl
        fi
        chown 65532:65532 /keys/master /keys/hash /keys/identity /keys/valkey-password
        # The directory stays traversable for root (its group, without the capability to read the files) and writable for
        # the program, which replaces the master file atomically when a rotation distributes or retires a version. Root
        # owns it while its mode is set: this container has CHOWN but not FOWNER, so `chmod` after handing it to 65532
        # would fail and stop the stack, on a fresh volume as well as on a restart.
        chown 0:0 /keys
        chmod 770 /keys
        chown 65532:0 /keys
        chown 999:1000 /cache/password /cache/users.acl
        chmod 755 /cache
    environment:
      AXIOM_KEYRING_GENERATE: ${AXIOM_KEYRING_GENERATE:-true}
    volumes:
      - keys:/keys
      - cache:/cache
    <<: *hardened
    cap_add: [CHOWN]

  # The shared cache: the precheck's rate counts, and later login's attempt buckets and session stickiness
  # (internal/platform/kv/README.md). Its data have no volume, so a restart empties it: everything in it is data whose
  # loss costs a little allowance and no correctness. 999:1000 in `keys` above is this image's valkey user: the tag is
  # pinned, so the ids are too (K1 checked them against the image).
  valkey:
    image: valkey/valkey:9.1.2-alpine
    restart: ${DEPLOY_RESTART_POLICY:-unless-stopped}
    # The image's own user, as postgres runs as its own: the ACL file is readable by that user alone.
    user: valkey
    command:
      - valkey-server
      - --aclfile
      - /etc/valkey/users.acl
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - cache:/etc/valkey:ro
    # 512 MB for the process while maxmemory is 256mb: the rest is fragmentation and output buffers
    # (internal/platform/kv/README.md「内存」).
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$(cat /etc/valkey/password)" valkey-cli --user axiom -p 6379 ping | grep -q PONG']
      interval: 10s
      start_period: 10s
      start_interval: 1s
    depends_on:
      keys: {condition: service_completed_successfully}
    <<: *hardened

  axiom:
    build: .
    image: ${DEPLOY_IMAGE:-axiom:local}
    restart: ${DEPLOY_RESTART_POLICY:-unless-stopped}
    stop_grace_period: 170s # listeners 30s + calls 20s + health probes/cost flush 65s + queue/recorder 30s + cache 10s, with margin
    environment:
      AXIOM_DATABASE_URL: postgres://axiom_app:${AXIOM_APP_PASSWORD}@postgres/axiom?sslmode=disable
      AXIOM_ADMIN_ADDR: ":8082" # the admin app; the program's own default is loopback inside the container, unreachable
      AXIOM_MASTER_KEY_FILE: /keys/master
      AXIOM_KEY_HASH_FILE: /keys/hash
      AXIOM_IDENTITY_KEY_FILE: /keys/identity
      AXIOM_HEALTH_MODE: ${AXIOM_HEALTH_MODE-}
      AXIOM_EXCHANGE_SOURCE: ${AXIOM_EXCHANGE_SOURCE-}
      # The shared cache, in this single-core deployment too: a rate count that survives this process is one more thing
      # a restart does not take, and it is what `AXIOM_CORE_NODES` above 1 will need (internal/platform/kv/README.md
      # 「配置与启动」). The password is the file, never this environment.
      AXIOM_VALKEY_URL: valkey://axiom@valkey:6379
      AXIOM_VALKEY_PASSWORD_FILE: /keys/valkey-password
      # Optional object storage (internal/platform/objectstore/README.md). Empty means off; a partly set group is a
      # startup error naming the missing variable, never a silently disabled archive.
      AXIOM_OBJECTSTORE_ENDPOINT: ${AXIOM_OBJECTSTORE_ENDPOINT-}
      AXIOM_OBJECTSTORE_BUCKET: ${AXIOM_OBJECTSTORE_BUCKET-}
      AXIOM_OBJECTSTORE_REGION: ${AXIOM_OBJECTSTORE_REGION-}
      AXIOM_OBJECTSTORE_ACCESS_KEY_ID: ${AXIOM_OBJECTSTORE_ACCESS_KEY_ID-}
      AXIOM_OBJECTSTORE_SECRET_ACCESS_KEY: ${AXIOM_OBJECTSTORE_SECRET_ACCESS_KEY-}
      AXIOM_OBJECTSTORE_PATH_STYLE: ${AXIOM_OBJECTSTORE_PATH_STYLE-}
    volumes:
      # The ring is read and replaced atomically here. A multi-node deployment must give every node the same protected
      # file (one shared volume or a copy) and set AXIOM_KEYRING_GENERATE=false so a fresh node never makes its own.
      - keys:/keys:rw
    ports:
      # An empty DEPLOY_PORT or DEPLOY_ADMIN_PORT publishes a port the kernel picks, so two jobs on one host cannot take
      # each other's; local `just up` sets neither and gets 8080 and 8082. Both bind this machine only.
      - 127.0.0.1:${DEPLOY_PORT-8080}:8080
      - 127.0.0.1:${DEPLOY_ADMIN_PORT-8082}:8082
    networks:
      default: # listed so that deploy/compose.edge.yaml adds a second network instead of replacing this one
    depends_on:
      migrate: {condition: service_completed_successfully}
      keys: {condition: service_completed_successfully}
      # Not service_healthy: a cache that is slow or broken must cost the node its fallback, not its start
      # (internal/platform/kv/README.md「部署」).
      valkey: {condition: service_started}
    <<: *hardened

  # The scheduled backup (docs/ops/backup-restore.md): `docker compose run --rm backup`. It sees the key ring read-only,
  # the environment file it archives, and a volume for the lock file that keeps two runs from overlapping.
  backup:
    <<: *ops
    entrypoint: [/ops/backup.sh]
    environment:
      <<: *ops-env
      AXIOM_DEPLOY_ENV_FILE: /deploy/.env
      AXIOM_BACKUP_DB_RECIPIENT: ${AXIOM_BACKUP_DB_RECIPIENT-}
      AXIOM_BACKUP_SECRETS_RECIPIENT: ${AXIOM_BACKUP_SECRETS_RECIPIENT-}
      AXIOM_BACKUP_KEEP_SETS: ${AXIOM_BACKUP_KEEP_SETS:-30}
      AXIOM_BACKUP_KEEP_DAYS: ${AXIOM_BACKUP_KEEP_DAYS:-30}
      AXIOM_BACKUP_APP_IMAGE: ${DEPLOY_IMAGE:-axiom:local}
    volumes:
      - keys:/keys:ro
      - ${AXIOM_BACKUP_ENV_FILE:-./.env}:/deploy/.env:ro
      - backup_state:/state
    depends_on:
      postgres: {condition: service_healthy}

  # The restore's half inside the container, driven by scripts/ops/restore.sh, which adds the identities and the output
  # directory per run. It has no dependency on postgres: its first step runs before the cluster exists.
  restore:
    <<: *ops
    entrypoint: [/ops/restore.sh]
    environment:
      <<: *ops-env
      AXIOM_RESTORE_OUT_DIR: /out
      AXIOM_RESTORE_DB_IDENTITY_FILE: /identities/db.key
      AXIOM_RESTORE_SECRETS_IDENTITY_FILE: /identities/keys.key
    volumes:
      - keys:/keys

volumes:
  postgres:
  keys:
  # The backup's lock file; it has to outlive the container that takes it.
  backup_state:
  cache:

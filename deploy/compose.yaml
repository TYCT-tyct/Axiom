# The program and its database on one machine (docs/architecture.md「部署拓扑」). Start it with `just up`, which also
# writes the passwords this file reads to deploy/.env; deploy/.env.example describes them.
name: axiom

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    # As the image's postgres user from the start, so its entrypoint needs no capability to change owners and users.
    user: postgres
    tmpfs: [/var/run/postgresql] # the server's socket and lock files; the data are on the volume
    environment:
      POSTGRES_DB: axiom
      POSTGRES_PASSWORD: ${AXIOM_POSTGRES_PASSWORD:?set it in deploy/.env}
      # read by postgres/roles.sh
      AXIOM_APP_PASSWORD: ${AXIOM_APP_PASSWORD:?set it in deploy/.env}
      AXIOM_MIGRATOR_PASSWORD: ${AXIOM_MIGRATOR_PASSWORD:?set it in deploy/.env}
    volumes:
      - postgres:/var/lib/postgresql
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Over TCP: while it runs the init scripts, the image's temporary server listens only on its Unix socket.
      test: [CMD, pg_isready, --host, 127.0.0.1, --username, postgres, --dbname, axiom]
      interval: 10s
      start_period: 30s
      start_interval: 1s
    <<: *hardened

  migrate:
    image: axiom:local
    command: [migrate]
    environment:
      AXIOM_MIGRATE_DATABASE_URL: postgres://axiom_migrator:${AXIOM_MIGRATOR_PASSWORD}@postgres/axiom?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}
    <<: *hardened

  # Makes the master key (docs/security.md「密钥管理」) once, in a volume of its own, for the program to read: the program
  # refuses a key file that others can read, and the container it runs in has no user of the host's to own one. This is
  # for the machine `just up` sets up; a deployment keeps the key in a protected file with a backup, since the data sealed
  # with it cannot be opened without it.
  keys:
    image: postgres:18.6-alpine # any image with a shell; this one is already pulled for the database
    user: root
    command:
      - sh
      - -c
      - |
        [ -s /keys/master ] || {
          umask 077
          printf '1:%s\n' "$$(head -c 32 /dev/urandom | base64)" > /keys/master
          chmod 0400 /keys/master
          chown 65532:65532 /keys /keys/master # the program's user, not root, owns it; root cannot change it afterwards
        }
    volumes:
      - keys:/keys
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]

  axiom:
    build: .
    image: axiom:local
    restart: unless-stopped
    stop_grace_period: 45s # longer than AXIOM_SHUTDOWN_TIMEOUT (30s by default), so a graceful shutdown is not cut off
    environment:
      AXIOM_DATABASE_URL: postgres://axiom_app:${AXIOM_APP_PASSWORD}@postgres/axiom?sslmode=disable
      AXIOM_ADMIN_ADDR: ":8082" # the admin app; the program's own default is loopback inside the container, unreachable
      AXIOM_MASTER_KEY_FILE: /run/keys/master
    volumes:
      - keys:/run/keys:ro
    ports:
      - 127.0.0.1:8080:8080 # the public listener, reachable from this machine only
      - 127.0.0.1:8082:8082 # the admin listener, likewise
    depends_on:
      migrate: {condition: service_completed_successfully}
      keys: {condition: service_completed_successfully}
    <<: *hardened

volumes:
  postgres:
  keys:

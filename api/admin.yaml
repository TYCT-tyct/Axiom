            examples:
              paid_in_cny:
                summary: A new-api supplier paid in yuan, logged in with a personal access token
                value:
                  name: Example CN
                  kind: newapi
                  origin: https://api.example.cn
                  upstream_account: ops@example.com
                  settlement_currency: CNY
                  login: {access_token: pat-example, access_token_expires_at: "2027-01-01T00:00:00Z"}
                  reason: Second source for the hosted models
              paid_in_usd:
                summary: A sub2api supplier paid in dollars, logged in with tokens taken after a manual sign-in
                value:
                  name: Example US
                  kind: sub2api
                  origin: https://api.example.com
                  upstream_account: ops@example.com
                  settlement_currency: USD
                  login: {access_token: at-example, refresh_token: rt-example, access_token_expires_at: "2026-10-16T08:00:00Z"}
                  reason: Second source for the hosted models
      responses:
        "201":
          description: Connecting.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}

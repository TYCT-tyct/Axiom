              schema: {$ref: "#/components/schemas/RoutingPreset"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateLayerRoutingPreset
      tags: [Routing]
      summary: Change a routing preset of the platform or a site
      description: >-
        Replaces the name, the rules and, for a platform preset, the `currency` of its price limits, at the `revision`
        the page read (409 `stale_revision` when it moved on). Rules or a currency that differ from the current ones are
        a new version, which every key bound to the preset is routed by from the next routing snapshot, within 5
        seconds; a rename keeps the version. A platform preset never serves fewer sites than it did, so the defaults
        and keys on it stay usable: one that limits no price takes no `currency`, and a priced one keeps its currency or
        drops its prices (400). The system preset is 403; a disabled preset, and an account's or a workspace's, are
        404.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LayerRoutingPresetUpdate"}
      responses:
        "200":
          description: The preset as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingPreset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: disableLayerRoutingPreset
      tags: [Routing]
      summary: Disable a routing preset of the platform or a site
      description: >-
        Disables the preset at `revision`. The keys bound to it keep routing by it; no new key or default can choose
        it. A preset any layer's default still points at is refused 409 `preset_in_use`: change those defaults first. A
        disabled preset still counts against what its layer may make. The system preset is 403.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

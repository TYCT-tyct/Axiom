        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the site's refunds, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRefundList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/refunds/{refund_id}/approve:
    post:
      operationId: approvePaymentRefund
      tags: [Payments]
      summary: Approve a refund and release it when its approval rule is met
      description: >-
        Approves a frozen refund. The approver must be a different person from the one who requested it, and the reason
        goes to the audit log. Within the site's refund limit one approval releases it; above the limit the first
        approval records `first_approved_by` and a different person must approve again before it can be sent. A channel
        refund is sent after the releasing approval commits; an offline refund stays frozen for a separate manual
        conclusion. Repeating the approval with the same `Idempotency-Key` returns the stored answer and sends nothing
        again; a refund that is already released is returned unchanged.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: refund_id, in: path, required: true, schema: {$ref: "#/components/schemas/RefundId"}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The refund as it stands after the approval.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRefund"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/refunds/{refund_id}/reject:
    post:
      operationId: rejectPaymentRefund
      tags: [Payments]
      summary: Decline a refund before it is released
      description: >-
        Returns the frozen credits and moves no cash. Only a refund still waiting for release, with no releasing
        approver and nothing sent to a channel, can be rejected (`conflict` means it is past that point; a definitive
        channel outcome is resolved instead). A first approval above the limit does not prevent rejection: the credits
        return and nothing is sent. The reason goes to the audit log. Repeating the rejection with the same
        `Idempotency-Key` returns the stored answer and unfreezes nothing again; an already declined refund is
        returned unchanged.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: refund_id, in: path, required: true, schema: {$ref: "#/components/schemas/RefundId"}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The refund as it stands after the rejection.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRefund"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}

      summary: Give an account credit
      description: >-
        Adds credit to the account: a credit batch, its ledger entries and an audit entry with the reason and the
        source (docs/domains/billing.md「额度批次」). The source `gift` (the default) gives `amount` in the site's
        currency, recorded as a gift expense. The source `offline_payment` records money an administrator received
        outside the payment channels: `payment` says how much, in which currency, and where it was received; the
        ledger books it as a top-up (cash, the user's balance, and across currencies the exchange gain or loss), and
        the credit is what was paid at the current reference exchange rate (none in the site's own currency), rounded
        down. The credit is positive and within the limit for one grant (the money limits of the control plane,
        docs/domains/operations.md), else 422; so is a payment that is not whole minor units of its currency, in a
        currency with no reference rate to the site's, or a gift with a `payment` or a payment with an `amount`. A

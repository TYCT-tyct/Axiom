        - {name: state, in: query, required: false, schema: {$ref: "#/components/schemas/RedeemCodeState"}}
        - name: note
          in: query
          required: false
          description: The beginning of a code batch's note, ignoring case. Omit for every note.
          schema: {type: string, maxLength: 200}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the site's codes, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemCodeList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createRedeemCodes
      tags: [Payments]
      summary: Make a batch of redeem codes. The codes are in this answer only.
      description: >-
        Makes `count` codes for the site, each worth `amount` of its currency, all expiring at `expires_at` (never, if
        absent), with an optional `note` and the `reason` of the audit entry. The answer is the only place the codes
        themselves are ever shown: only a hash is stored, so a lost answer cannot be recovered and the batch must be
        made again. A replay of `Idempotency-Key` answers the same batch (IDs, amounts and hints) but not the codes: the
        stored answer keeps no secret.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RedeemCodeBatchRequest"}
      responses:
        "201":
          description: The codes made, with `code` in each; a replay of the key carries `code` in none of them.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemCodeList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}

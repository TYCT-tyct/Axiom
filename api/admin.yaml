      additionalProperties: false
      properties:
        enabled: {type: boolean}
        notify_users: {type: boolean, default: false, description: "Create the account's user reminder for a detected anomaly. Leave off until every node can dispatch the spend_anomaly notice kind: an older dispatcher would mark it sent without sending it. Detection and alert channels do not depend on it."}
        window_seconds: {type: integer, minimum: 900, maximum: 86400, description: "Recent window compared with the baseline. The detector runs every 10 minutes, so the window is at least 15 minutes and consecutive windows overlap."}
        baseline_seconds: {type: integer, minimum: 900, maximum: 604800, description: "The account's own history immediately before the recent window; at least window_seconds."}
        min_spend_nano: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000000, description: "Absolute floor for a spend spike, in billionths of a credit."}
        spend_ratio: {type: number, format: double, minimum: 1, maximum: 1000, description: "Recent spend divided by the baseline's expected spend for the same window."}
        min_new_region_calls: {type: integer, minimum: 1, maximum: 1000000}
        min_new_model_calls: {type: integer, minimum: 1, maximum: 1000000}
    Retention:
      type: object
      description: "The call log's hot window. Every field is optional so an older node's response is read as the parts it has."
      additionalProperties: false
      properties:
        hot_days: {type: integer, minimum: 0, maximum: 3650, description: "Whole months older than this leave PostgreSQL for the object store. 0 keeps every partition."}
    RetentionRequest:
      type: object
      required: [hot_days, reason]
      additionalProperties: false
      properties:
        hot_days: {type: integer, minimum: 0, maximum: 3650}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertRule:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, minLength: 1, maxLength: 128}
        minimum_severity: {type: string, enum: [info, warning, critical], x-enum-varnames: [AlertInfo, AlertWarning, AlertCritical]}
        threshold: {type: number, minimum: 0, default: 1}
        duration_seconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
        channel: {type: string, maxLength: 64, description: "Empty disables notification for this rule."}
        quiet_start: {type: integer, minimum: 0, maximum: 1439, default: 0}
        quiet_end: {type: integer, minimum: 0, maximum: 1439, default: 0}
        repeat_seconds: {type: integer, minimum: 0, maximum: 604800, default: 0}
    AlertChannel:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        email: {type: string, format: email, maxLength: 254}
        webhook_url: {type: string, format: uri, maxLength: 2048, description: "HTTPS destination, exclusive with email. Configure only after all nodes support webhooks; set its signing secret before use."}
    AlertWebhookSecretRequest:
      type: object
      required: [rev, secret, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 1}
        secret: {type: string, minLength: 1, maxLength: 512, writeOnly: true, description: "32 to 512 UTF-8 bytes shared with the receiver. Rotation retains the old key for one hour; another rotation during that hour returns conflict."}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertConfigurationRequest:
      type: object
      required: [rev, rules, channels, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 1}
        rules: {type: array, maxItems: 32, items: {allOf: [{$ref: "#/components/schemas/AlertRule"}], required: [id, kind, minimum_severity, threshold, duration_seconds, channel, quiet_start, quiet_end, repeat_seconds]}}
        channels: {type: array, maxItems: 32, items: {allOf: [{$ref: "#/components/schemas/AlertChannel"}], required: [id]}}
        spend_detection: {$ref: "#/components/schemas/SpendDetection"}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertTestRequest:
      type: object
      required: [channel, reason]
      properties:
        channel: {type: string, minLength: 1, maxLength: 64}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertTestResult:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
    AlertEventList:
      type: object
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AlertEvent"}}
    AlertEvent:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string}
        key: {type: string}
        severity: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        occurrences: {type: integer, format: int64}
        state: {type: string, enum: [firing, delivered, resolved], x-enum-varnames: [AlertFiring, AlertDelivered, AlertResolved]}
        fired_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
        receipts: {type: array, items: {$ref: "#/components/schemas/AlertReceipt"}}
    AlertReceipt:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        rule_id: {type: string}
        sequence: {type: integer, description: "0 is the first notification; -1 is recovery; positive values are repeats."}
        state: {type: string, enum: [pending, queued, delivered, failed], x-enum-varnames: [AlertPendingReceipt, AlertQueuedReceipt, AlertDeliveredReceipt, AlertFailedReceipt]}
        at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
    ExchangeRateInput:
      type: object
      additionalProperties: false
      required: [base, quote, numerator, denominator, expected_version, kind, reason]
      properties:
        base: {type: string, maxLength: 3}
        quote: {type: string, maxLength: 3}
        numerator: {type: string, maxLength: 19, description: Positive integer at most 10^18}
        denominator: {type: string, maxLength: 19, description: Positive integer at most 10^18}
        expected_version: {type: integer, format: int64}
        kind: {type: string}
        reason: {type: string, maxLength: 1000}
    ExchangeRate:
      type: object
      additionalProperties: false
      required: [id, base, quote, numerator, denominator, version, source, kind, reason, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        base: {type: string}
        quote: {type: string}
        numerator: {type: string}
        denominator: {type: string}
        version: {type: integer, format: int64}
        source: {type: string}
        kind: {type: string}
        reason: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    ExchangeRateList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ExchangeRate"}
    Error:
      type: object
      required: [error]
      description: >-
        The body of every failure. The request ID is in the `X-Request-ID` response header, as on every response.
      properties:
        error: {$ref: "#/components/schemas/ErrorDetail"}
    ErrorDetail:
      type: object
      required: [code, message]
      description: >-
        `code` is what a client branches on and translates; `message` is English text for logs and developers.
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        fields:
          type: array
          description: Which parts of the request broke a constraint, for `invalid_request`.
          items: {$ref: "#/components/schemas/ErrorField"}
    ErrorField:
      type: object
      required: [pointer, message]
      properties:
        pointer: {type: string, description: "JSON pointer into the request body, or the name of a query or path parameter."}
        message: {type: string}
    ErrorCode:
      type: string
      description: >-
        The closed list of failure codes. A code is added in a contract change, so a client that translates every code
        fails to compile until it knows the new one.
      enum:
        - invalid_request
        - unauthenticated
        - invalid_credentials
        - invalid_code
        - forbidden
        - mfa_required
        - consent_required
        - origin_rejected
        - not_found
        - conflict
        - login_domain_locked
        - login_domain_required
        - identity_taken
        - identity_already_linked
        - account_not_linked
        - email_taken
        - name_taken
        - too_many_keys
        - stale_revision
        - idempotency_key_reused
        - invalid_invite
        - registration_closed
        - human_check_failed
        - email_domain_not_allowed
        - invalid_verification
        - weak_password
        - not_ready
        - unprocessable
        - cap_exceeded
        - redeem_code_invalid
        - redeem_code_expired
        - redeem_code_disabled
        - redeem_code_used
        - rate_limited
        - internal
        - not_implemented
        - unavailable
        - preset_not_selectable
        - preset_default_invalid
        - preset_in_use
        - preset_quota
    OperationsOverview:
      type: object
      additionalProperties: false
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
        calls_incomplete:
          type: boolean
          description: >-
            True when the window crosses a month the call log no longer retains, so calls, errors and the two rankings
            omit archived calls; revenue, cost, cash, paid users, monthly revenue and retention still cover the whole
            window. An old node leaves it out, which the page shows as unavailable rather than complete.
        calls_available_since:
          type: string
          format: date-time
          description: >-
            The first instant of the oldest monthly partition the log still has; calls before it were archived.
            Absent with `calls_incomplete` true when no monthly partition remains, so no window can be answered from
            the log.
        revenue:
          $ref: '#/components/schemas/Money'
        cost:
          $ref: '#/components/schemas/Money'
        unknown_cost_calls: {type: integer, format: int64}
        paid_users:
          type: integer
          format: int64
          description: >-
            Distinct accounts with a paid top-up in the window. An old node leaves it out, which the page shows as
            unavailable.
        monthly_revenue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            The credit paid top-ups granted in the window, in the site's accounting currency. It is not call revenue:
            a top-up is prepaid credit, recognized as call revenue when calls settle.
        gross_margin:
          type: integer
          description: >-
            (revenue - cost) / revenue in basis points, rounded half away from zero. Absent when the window has no
            settled revenue or when a call's supplier cost is unknown, because the cost total is then incomplete.
        retention:
          $ref: '#/components/schemas/OperationsRetention'
        cash:
          type: array
          items:
            $ref: '#/components/schemas/CashAmount'
        top_accounts:
          type: array
          items:
            $ref: '#/components/schemas/OverviewAccount'
        top_models:
          type: array
          items:
            $ref: '#/components/schemas/OverviewModel'
        targets:
          $ref: '#/components/schemas/OperationsTargetComparison'
    OperationsTargets:
      type: object
      additionalProperties: false
      required: [site_id, month, rev]
      description: >-
        A site's business targets for one UTC calendar month (docs/domains/operations.md「业务目标」). A target that is
        absent has not been set for that month; a target of zero is set and means zero. `rev` is the optimistic
        concurrency token for the month: 0 before the first write, and one more after every successful write.
      properties:
        site_id: {$ref: '#/components/schemas/SiteId'}
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: The UTC calendar month the targets cover.
        rev:
          type: integer
          format: int64
          minimum: 0
          description: The revision to send back when replacing this month's targets.
        metrics:
          type: array
          description: >-
            The metrics this node stores. A node from before the commercial metrics leaves it out; the page then edits
            only calls, errors, revenue and cost and sends no commercial fields.
          items: {$ref: '#/components/schemas/OperationsTargetMetric'}
        calls: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        errors: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        revenue: {$ref: '#/components/schemas/Money'}
        cost: {$ref: '#/components/schemas/Money'}
        paid_users: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        monthly_revenue: {$ref: '#/components/schemas/Money'}
        gross_margin: {type: integer, minimum: 0, maximum: 10000, description: "Basis points, hundredths of a percent."}
        retention: {type: integer, minimum: 0, maximum: 10000, description: "Basis points, hundredths of a percent."}
    OperationsTargetMetric:
      type: string
      enum: [calls, errors, revenue, cost, paid_users, monthly_revenue, gross_margin, retention]
    OperationsTargetsUpdate:
      type: object
      additionalProperties: false
      required: [reason, rev]
      description: >-
        The whole set of targets for one month: leaving a target out clears it. `rev` is the value read from the
        matching GET; if it has moved, the write is refused with 409 `stale_revision`. Money is in the site's
        accounting currency; another currency is a 400. Counts are calls, errors and paid users; gross margin and
        retention are basis points from 0 to 10000. On `replaceOperationsTargets` both `X-Axiom-Target-Metrics: all`
        and `all_metrics: true` are required. `updateOperationsTargets` refuses both markers and commercial fields,
        leaving those metrics as stored.
      properties:
        reason: {$ref: '#/components/schemas/Reason'}
        rev:
          type: integer
          format: int64
          minimum: 0
          description: The revision the editor read; a changed revision is a 409 `stale_revision`.
        calls: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        errors: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        revenue: {$ref: '#/components/schemas/Money'}
        cost: {$ref: '#/components/schemas/Money'}
        all_metrics:
          type: boolean
          description: >-
            True when the write replaces every metric the node stores; required on
            `replaceOperationsTargets` and refused on `updateOperationsTargets`. The full-replacement path is not
            routed by a node before the commercial metrics, so a full write cannot partly succeed there.
        paid_users: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        monthly_revenue: {$ref: '#/components/schemas/Money'}
        gross_margin: {type: integer, minimum: 0, maximum: 10000, description: "Basis points, hundredths of a percent."}
        retention: {type: integer, minimum: 0, maximum: 10000, description: "Basis points, hundredths of a percent."}
    OperationsTargetComparison:
      type: object
      additionalProperties: false
      description: >-
        The monthly targets with `gap` = actual - target, in the metric's unit. Counts and money are prorated to the
        window; gross margin and retention are the target of the UTC month the window ends in, unchanged. An empty
        object means no monthly target covers the window. The calls and errors gaps are absent while `calls_incomplete`,
        because archived calls would make the actual side incomplete; paid users and monthly revenue come from credit
        batches and keep their gaps. The cost gap is absent while `unknown_cost_calls` is above zero: the cost total
        omits those calls, so a gap would state a conclusion the data does not support. A money target set in another
        currency than the site's accounting currency is absent. Gross margin and retention gaps are absent when their
        actual rate is unavailable. The whole field is absent on a node before targets existed, which the page shows as
        unavailable rather than as no target.
      properties:
        calls: {$ref: '#/components/schemas/OperationsCountTarget'}
        errors: {$ref: '#/components/schemas/OperationsCountTarget'}
        revenue: {$ref: '#/components/schemas/OperationsMoneyTarget'}
        cost: {$ref: '#/components/schemas/OperationsMoneyTarget'}
        paid_users: {$ref: '#/components/schemas/OperationsCountTarget'}
        monthly_revenue: {$ref: '#/components/schemas/OperationsMoneyTarget'}
        gross_margin: {$ref: '#/components/schemas/OperationsRateTarget'}
        retention: {$ref: '#/components/schemas/OperationsRateTarget'}
    OperationsRateTarget:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: integer
          minimum: 0
          maximum: 10000
          description: The monthly rate target in basis points, hundredths of a percent.
        gap:
          type: integer
          description: >-
            Actual minus target in basis points. Absent when the actual rate is unavailable, such as no settled
            revenue or no previous-month cohort.
    OperationsRetention:
      type: object
      additionalProperties: false
      required: [month, cohort, retained]
      description: >-
        Paying-account retention for the UTC month the window ends in. The cohort is the accounts with a paid top-up
        in the previous month; retained is those among them with a paid top-up from this month's first instant
        through the window's end. The current month is therefore month-to-date.
      properties:
        month:
          type: string
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
          description: The UTC calendar month the rate is measured in.
        cohort: {type: integer, format: int64, minimum: 0}
        retained: {type: integer, format: int64, minimum: 0}
        rate:
          type: integer
          minimum: 0
          maximum: 10000
          description: Retained / cohort in basis points, rounded half up. Absent when the cohort is empty.
    OperationsCountTarget:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          type: integer
          format: int64
          minimum: 0
          description: The monthly target, prorated to the part of the window inside its month.
        gap:
          type: integer
          format: int64
          description: >-
            Actual minus target. Absent for calls and errors when the call log is incomplete over the window; paid
            users always state it because it reads credit batches, not the call log.
    OperationsMoneyTarget:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          $ref: '#/components/schemas/Money'
        gap:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >-
            Actual minus target. Absent when the cost total is incomplete (`unknown_cost_calls` above zero, cost only)
            or the target's currency is not the site's current accounting currency. Revenue and monthly revenue always
            state it when the currency matches.
    OverviewAccount:
      type: object
      additionalProperties: false
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
    OverviewModel:
      type: object
      additionalProperties: false
      properties:
        model: {type: string}
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
    CashAmount:
      type: object
      required: [amount, currency]
      description: >-
        An exact cash amount in one payment currency. `amount` is a signed integer in decimal text, in billionths of one
        unit of the currency; `currency` is the currency the payment was made in, which is the site's when they are the
        same (docs/domains/billing.md「钱的表示」). It is text so a JSON number cannot round it, and a report's sum can
        be wider than 64 bits.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]*)$', maxLength: 39, example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    Money:
      type: object
      required: [amount, currency]
      description: >-
        An exact amount of a site's accounting currency. `amount` is a signed integer in decimal text, in billionths of
        one unit of the currency (docs/domains/billing.md「钱的表示」). It is text because a JSON number would round
        above 2^53 (about 9 million units) in the browser. A report sums many stored amounts, so it can be wider than
        64 bits; an amount that is written to the ledger must still fit 64 bits.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]*)$', maxLength: 39, example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: >-
            The program's version line exactly as `axiom version` prints it: the main module's version, which the Go
            toolchain stamps from version control (such as a pseudo-version with the commit time and hash, +dirty for
            uncommitted changes). The console is stamped with the same line and only compares the two whole for
            equality.
          example: axiom v0.0.0-20261014044725-4daa4538fcac
    UserId: {type: string, pattern: '^user_[0-9a-hjkmnp-tv-z]{26}$', description: "A user's ID (TypeID)."}
    AccountId: {type: string, pattern: '^acct_[0-9a-hjkmnp-tv-z]{26}$', description: "An account's ID (TypeID)."}
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 256}
    SessionGrant:
      type: object
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_required]
          description: >-
            `mfa_required`: the password was right and the user has two-step verification, so the cookie is a pending
            session that only `verifyMfa` accepts, for 5 minutes.
        csrf_token: {type: string, description: "Sent as X-CSRF-Token on the requests that change data."}
    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            A TOTP code (6 digits) or a recovery code (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server
            tells them apart by shape.
    SessionLevel:
      type: string
      enum: [pending_mfa, password, mfa]
      description: >-
        What the session has proved: only the password, or two-step verification too (`mfa`). `pending_mfa` is a
        sign-in that waits for its second factor.
    Session:
      type: object
      required: [user, account, level, mfa_enabled, csrf_token, expires_at, permissions]
      properties:
        user:
          type: object
          required: [id, email, invite_code]
          properties:
            id: {$ref: "#/components/schemas/UserId"}
            email: {type: string}
            invite_code: {type: string, description: "The user's own invite code, which a new user registers with."}
        account: {$ref: "#/components/schemas/AccountId"}
        level: {$ref: "#/components/schemas/SessionLevel"}
        mfa_enabled: {type: boolean, description: "Whether the user has a TOTP factor."}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time, description: "When the session ends if it is not used again; the idle timeout moves it."}
        permissions:
          type: array
          description: >-
            The permission names the session holds on its own scope (the user's account on the console, the platform
            on the admin), for showing or hiding what the user cannot do. The server decides again on every request.
          items: {type: string}
        consent:
          allOf: [{$ref: "#/components/schemas/SessionConsent"}]
          description: >-
            What the page must show before the session may do anything else. Optional so a page built before this field
            reads an older node that does not send it.
    SessionConsent:
      type: object
      description: >-
        The legal documents the signed-in user has not accepted. A page built before this field shows nothing and the
        server refuses its requests with `consent_required` instead.
      required: [required]
      properties:
        required:
          type: array
          description: One newest current document per kind this user still has to accept during the compatibility phase; empty when each newest version is accepted.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    LegalDocumentVersion:
      type: object
      description: >-
        A legal document version named by an acceptance or the session's pending list. `locale` is optional for rolling
        compatibility: when an old node's response omits it, the page also omits it from the acceptance, and the server
        resolves the kind and version to the one current document. The page may use `zh` as the display fallback.
      required: [kind, version]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        locale: {$ref: "#/components/schemas/LegalDocumentLocale"}
        version: {type: integer, minimum: 1}
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: {type: string, description: "The new TOTP secret in base32. Nothing is stored yet; confirmTotp sends it back."}
        uri: {type: string, description: "The otpauth:// URI for a QR code."}
    TotpConfirmRequest:
      type: object
      required: [secret, password, code]
      properties:
        secret: {type: string, maxLength: 128}
        password: {type: string, maxLength: 256, description: "The user's password, asked again."}
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    RecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', description: "A current TOTP code."}
    FactorChange:
      type: object
      required: [csrf_token, recovery_codes]
      description: >-
        A changed factor ends every other session of the user and every unused recovery code, and issues this device a
        new `mfa` session: the cookie of the response replaces the old one.
      properties:
        csrf_token: {type: string}
        recovery_codes:
          type: array
          description: "10 one-time codes, each written xxxx-xxxx-xxxx-xxxx. They are shown only here."
          items: {type: string}
    Balance:
      type: object
      required: [balance, reserved, floor, available, spent_this_month]
      description: >-
        An account's money in its site's accounting currency. `available` is `balance - reserved`; a call is admitted
        while `available - floor` covers its reservation, and `floor` is at most 0. `spent_this_month` is what calls
        settled for the current UTC calendar month.
      properties:
        balance: {$ref: "#/components/schemas/Money"}
        reserved: {$ref: "#/components/schemas/Money"}
        floor: {$ref: "#/components/schemas/Money"}
        available: {$ref: "#/components/schemas/Money"}
        spent_this_month: {$ref: "#/components/schemas/Money"}
        batches:
          type: array
          description: >-
            The credit batches that still hold something, oldest credit first, with what is left in each and when it
            stops counting. An account with nothing is an empty array. Read in the same snapshot as the balance:
            absent on a node of the previous release, when the allocation could not be brought up to date in bounded
            time, or when a transaction committed after the last replay. The page then shows this part as unavailable
            rather than a number from a different moment.
          items: {$ref: "#/components/schemas/CreditBatch"}
    CreditBatch:
      type: object
      required: [id, source, amount, remaining, frozen, created_at]
      description: >-
        Credit added in one grant or payment, what is left of it, and how much of that is frozen for refunds. Spending
        takes the earliest expiry first and a batch without `expires_at` last, so `remaining` is what is still in this
        batch, not what the next charge will take.
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The batch's own identity; paid credit uses the order's ID as the batch ID.
        source:
          type: string
          enum: [gift, paid, redeem]
          x-enum-varnames: [CreditBatchGift, CreditBatchPaid, CreditBatchRedeem]
          description: "`gift`: credit given by an operator; `paid`: credit bought through a payment; `redeem`: credit a redeem code gave."
        amount: {$ref: "#/components/schemas/Money"}
        remaining: {$ref: "#/components/schemas/Money"}
        frozen: {$ref: "#/components/schemas/Money"}
        created_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: "When what is left of the batch stops counting. Absent when it never expires."
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: An ID of a supplier, group, model, price row or rule, in the usual lower-case UUID text.
    AdminSite:
      type: object
      required: [name]
      properties:
        name: {type: string}
        logo_url:
          type: string
          description: >-
            Path on this admin host to the site's logo; absent when there is none. A node of the release before this
            field leaves it out, and the app falls back to the name.
    SiteId: {type: string, pattern: '^site_[0-9a-hjkmnp-tv-z]{26}$', description: "A site's ID (TypeID)."}
    TierId: {type: string, pattern: '^tier_[0-9a-hjkmnp-tv-z]{26}$', description: "A tier's ID (TypeID)."}
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,17})(\.[0-9]{1,15})?$'
      description: An exact decimal number in text, never a JSON number, so no digit is lost on the way.
    UnitPrice:
      type: string
      pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,15})?$|^1000$'
      description: >-
        A price per billing unit (one token, or one use) in the currency of its schedule, as exact decimal text with at
        most 15 decimals and at most 1000 per unit.
    Reason:
      type: string
      minLength: 1
      maxLength: 1000
      description: Why the person is doing this. It goes to the audit log.
    OperationsCredentialId: {type: string, pattern: '^opcred_[0-9a-hjkmnp-tv-z]{26}$', description: "An operations credential's ID (TypeID)."}
    OperationsCredential:
      type: object
      additionalProperties: false
      required: [id, name, permissions, platform, proposer_vendors, created_at, expires_at, token_last4]
      properties:
        id: {$ref: "#/components/schemas/OperationsCredentialId"}
        name: {type: string}
        permissions: {type: array, items: {type: string}, description: Sorted; always holds operations.read.}
        sites:
          type: array
          items: {$ref: "#/components/schemas/SiteId"}
          description: The sites it acts on; absent for every site.
        platform: {type: boolean}
        proposer_vendors: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        token_last4: {type: string, description: The last four characters of the current token.}
        previous_token_until:
          type: string
          format: date-time
          description: When the token the last rotation replaced stops working; absent once it has.
    OperationsCapCategory:
      type: string
      enum: [money.top_up]
      description: A kind of money the agent moves, each with its own caps; top-ups of suppliers for now.
    OperationsCapAmount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,17})$
      description: An amount in billionths of one unit of the policy's currency, as integer text.
    OperationsCapLimits:
      type: object
      additionalProperties: false
      required: [single_max, daily_max, weekly_max, object_daily_max, daily_count_max, hard_single_max, hard_daily_max, hard_weekly_max]
      description: >-
        The autonomous limits (a proposal within all of them needs nobody): one proposal, the UTC day, the ISO week, one
        object's UTC day, and the day's number of proposals. The hard limits refuse a proposal outright, approved or
        not: one proposal, the day and the week. Reserved and committed amounts both count.
      properties:
        single_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        weekly_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        object_daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        daily_count_max: {type: integer, format: int32, minimum: 0, maximum: 1000000}
        hard_single_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        hard_daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        hard_weekly_max: {$ref: "#/components/schemas/OperationsCapAmount"}
    OperationsCapPolicy:
      type: object
      additionalProperties: false
      required: [scope, category, currency, limits, rev, updated_at]
      properties:
        scope: {type: string, description: "`platform` or a site's ID."}
        category: {$ref: "#/components/schemas/OperationsCapCategory"}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        limits: {$ref: "#/components/schemas/OperationsCapLimits"}
        rev: {type: integer, format: int64, minimum: 1}
        updated_at: {type: string, format: date-time}
        paused_at:
          type: string
          format: date-time
          description: >-
            When the reconciliation found this scope's counters differ from the money they count; every proposal here
            then waits for the owner until the counters are repaired. Absent when it is not paused, and from a node
            that predates the reconciliation.
    OperationsCapPolicyList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/OperationsCapPolicy"}}
    OperationsCapPolicyUpdate:
      type: object
      additionalProperties: false
      required: [currency, limits, rev, reason]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$', description: "Fixed when the policy is made."}
        limits: {$ref: "#/components/schemas/OperationsCapLimits"}
        rev: {type: integer, format: int64, minimum: 0, description: "The revision read; 0 makes the policy."}
        reason: {type: string, minLength: 1, maxLength: 1000}
    OperationsPriceEnvelope:
      type: object
      additionalProperties: false
      required: [min_margin_bps, model_daily_change_bps, daily_changes, daily_models]
      description: >-
        How far the agent moves a site's sale prices without the owner, in basis points: every price it publishes keeps
        at least `min_margin_bps` of its price over its cost; one model's prices move at most `model_daily_change_bps`
        in a UTC day, up and down added together; a UTC day publishes at most `daily_changes` prices of at most
        `daily_models` models. Publications the owner approves count too.
      properties:
        min_margin_bps: {type: integer, format: int32, minimum: 0, maximum: 10000}
        model_daily_change_bps: {type: integer, format: int64, minimum: 0, maximum: 100000000}
        daily_changes: {type: integer, format: int32, minimum: 0, maximum: 1000000}
        daily_models: {type: integer, format: int32, minimum: 0, maximum: 1000000}
    OperationsPriceEnvelopeSetting:
      type: object
      additionalProperties: false
      required: [site_id, limits, rev, updated_at]
      properties:
        site_id: {$ref: "#/components/schemas/SiteId"}
        limits: {$ref: "#/components/schemas/OperationsPriceEnvelope"}
        rev: {type: integer, format: int64, minimum: 1}
        updated_at: {type: string, format: date-time}
    OperationsPriceEnvelopeList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/OperationsPriceEnvelopeSetting"}}
    OperationsPriceEnvelopeUpdate:
      type: object
      additionalProperties: false
      required: [limits, rev, reason]
      properties:
        limits: {$ref: "#/components/schemas/OperationsPriceEnvelope"}
        rev: {type: integer, format: int64, minimum: 0, description: "The revision read; 0 makes the envelope."}
        reason: {type: string, minLength: 1, maxLength: 1000}
    OperationsCredentialList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/OperationsCredential"}}
        next_cursor: {type: string}
    OperationsCredentialCreate:
      type: object
      additionalProperties: false
      required: [name, permissions, platform, proposer_vendors, expires_at, reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        permissions:
          type: array
          maxItems: 50
          items: {type: string, pattern: '^[a-z_]+\.[a-z_]+$'}
          description: Besides operations.read, which every credential holds.
        sites:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/SiteId"}
          description: Absent for every site.
        platform: {type: boolean, description: Whether it may act on the platform's own resources.}
        proposer_vendors:
          type: array
          minItems: 1
          maxItems: 20
          items: {type: string, pattern: '^[a-z0-9][a-z0-9.-]{0,39}$'}
          description: The vendors of the models that propose through it, which an approving model must differ from.
        expires_at: {type: string, format: date-time}
        reason: {$ref: "#/components/schemas/Reason"}
    OperationsCredentialRotate:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        overlap_hours: {type: integer, minimum: 0, maximum: 24, default: 24}
        reason: {$ref: "#/components/schemas/Reason"}
    OperationsCredentialToken:
      type: object
      additionalProperties: false
      required: [credential_id]
      properties:
        credential_id: {$ref: "#/components/schemas/OperationsCredentialId"}
        token: {type: string, description: Shown once; absent on a replay.}
    OperationsCredentialRevoked:
      type: object
      additionalProperties: false
      required: [credential_id]
      properties:
        credential_id: {$ref: "#/components/schemas/OperationsCredentialId"}
    OperationsAgentStopped:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked: {type: integer, minimum: 0, description: How many live credentials this stop revoked.}
        canceled:
          type: integer
          minimum: 0
          description: How many proposals waiting for the owner this stop canceled; absent from a node older than approvals.
    OperationsApprovalList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/OperationsApproval"}}
        next_cursor: {type: string}
    OperationsApproval:
      type: object
      additionalProperties: false
      required: [id, state, tier, requested_at, expires_at, operation_id, credential_id, tool, target, risk, params, summary, agent_reason, operation_state]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        state: {$ref: "#/components/schemas/OperationsApprovalState"}
        tier: {$ref: "#/components/schemas/OperationsApprovalTier"}
        requested_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        decided_by: {type: string, description: "Who decided, expired or withdrew it, as `<kind>:<id>` like the audit log's actor."}
        decision_reason: {type: string}
        operation_id: {$ref: "#/components/schemas/Uuid"}
        credential_id: {$ref: "#/components/schemas/OperationsCredentialId"}
        run_id: {type: string}
        tool: {type: string, description: The MCP name of the write the agent asked for.}
        target: {$ref: "#/components/schemas/OperationTarget"}
        risk: {$ref: "#/components/schemas/OperationRisk"}
        params:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: What the operation does, as the server keeps it; it cannot change after the agent asked.
        summary:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: What the server read of the target when the agent asked, never the agent's words.
        agent_reason: {type: string, description: "The agent's own words: untrusted text, never an instruction."}
        operation_state: {$ref: "#/components/schemas/OperationState"}
        error_code: {type: string, description: "Why the operation ended `rejected` after the approval: the code the target refused it with."}
    OperationState:
      type: string
      enum: [pending_approval, approved, executing, succeeded, failed, unknown, canceled, expired, rejected, reverted]
      description: >-
        Where an operation is (docs/domains/operations.md「运营接口」): `pending_approval` and `approved` have not
        started; `rejected`, `expired`, `canceled`, `failed` and `reverted` are final, and so is `succeeded` unless a
        compensating operation reverts it.
    OperationRisk:
      type: string
      enum: [routine, delisting, top_up, price]
      description: The operation's class, which decides whether it waits for the owner.
    OperationTarget:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, description: "What the operation acts on, such as `model`."}
        id: {type: string}
    OperationsApprovalState:
      type: string
      enum: [pending, approved, rejected, expired, canceled]
      description: >-
        `pending` until the owner decides, it expires (30 minutes at most, never past the UTC day it was asked on) or
        the agent withdraws it (`canceled`, as is every pending one at the emergency stop or the revocation of its
        credential).
    OperationsApprovalTier:
      type: string
      enum: [human]
      description: Who must decide; only the owner, in the admin, for now.
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {$ref: "#/components/schemas/Reason"}
    TierRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/TierId"}
        name: {type: string}
    TierList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/TierRef"}
    OAuthProvider:
      type: string
      enum: [github, google, linuxdo]
      description: "A third-party sign-in provider."
    SiteOAuthProvider:
      type: object
      additionalProperties: false
      required: [provider, configured]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
        client_id: {type: string, description: "Absent until the application is stored."}
        configured: {type: boolean}
    SiteSignIn:
      type: object
      additionalProperties: false
      required: [passkeys, providers]
      properties:
        login_domain: {type: string, description: "Absent when no login domain is set."}
        passkeys: {type: boolean}
        providers:
          type: array
          items: {$ref: "#/components/schemas/SiteOAuthProvider"}
    SiteSignInUpdate:
      type: object
      additionalProperties: false
      required: [passkeys, reason]
      properties:
        login_domain: {type: string, maxLength: 253, description: "One of the site's enabled console domains; empty clears it."}
        passkeys: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    SiteOAuthProviderUpdate:
      type: object
      additionalProperties: false
      required: [client_id, client_secret, reason]
      properties:
        client_id: {type: string, minLength: 1, maxLength: 200}
        client_secret: {type: string, minLength: 1, maxLength: 500, description: "Sealed at rest; never returned."}
        reason: {type: string, minLength: 1, maxLength: 500}
    SiteSettings:
      type: object
      description: >-
        A site's own values for the sessions and keys its users get, and whether its model prices are public. An
        absent value is unset: the view's `defaults` says what applies, and a write that leaves out
        `model_prices_public` or `billing_preference` keeps the stored value. Turning `model_prices_public` off waits
        until every live gateway node supports hiding prices. Bounds: session times from 300 seconds; the console's
        idle time to 30 days and its longest session to 90 days; the admin's idle time to 12 hours and its longest
        session to 1 day; the daily limit of a new key from 0 to 1,000,000 units.
      properties:
        console_idle_timeout_seconds: {type: integer, minimum: 300, maximum: 2592000}
        console_max_age_seconds: {type: integer, minimum: 300, maximum: 7776000}
        admin_idle_timeout_seconds: {type: integer, minimum: 300, maximum: 43200}
        admin_max_age_seconds: {type: integer, minimum: 300, maximum: 86400}
        new_key_daily_limit: {$ref: "#/components/schemas/Money"}
        model_prices_public:
          type: boolean
          description: >-
            Whether visitors who are not signed in see the site's model prices; absent is `true`. When false, the
            anonymous models endpoint leaves every model's and endpoint's price out, and a signed-in member still sees
            the account's prices. A page built before this field leaves it out, and the server keeps the stored value
            rather than clearing it. Turning it off while a gateway node of a previous release is live is a 400 naming
            this field; until every live node supports it, the anonymous list keeps prices public.
        billing_preference:
          allOf: [{$ref: "#/components/schemas/BillingPreferenceName"}]
          description: >-
            The funding order an account gets until it chooses its own; absent is `subscription_first`. A page built
            before this field leaves it out, and the server keeps the stored value rather than clearing it.
    BillingPreferenceName:
      type: string
      enum: [subscription_first, wallet_first, subscription_only, wallet_only]
      description: >-
        Which source a call uses first. `subscription_first` uses the plan and falls back to the wallet; `wallet_first`
        the reverse; `subscription_only` and `wallet_only` do not fall back (docs/domains/billing.md「资金来源」).
    SubscriptionRefundInput:
      type: object
      additionalProperties: false
      required: [credits, reason]
      properties:
        credits: {$ref: "#/components/schemas/CreditAmount"}
        reason: {$ref: "#/components/schemas/Reason"}
    SubscriptionRefundProposal:
      type: object
      required: [id, grant_id, credits, state, requested_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        grant_id: {$ref: "#/components/schemas/Uuid"}
        credits: {$ref: "#/components/schemas/CreditAmount"}
        state: {type: string, enum: [pending, approved, rejected]}
        requested_by: {$ref: "#/components/schemas/Uuid"}
        approved_by: {$ref: "#/components/schemas/Uuid"}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    SubscriptionRefundApprovalInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {$ref: "#/components/schemas/Reason"}
    SubscriptionRefund:
      type: object
      required: [id, grant_id, credits, amount, windows, unused, revoked, created_at]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        grant_id: {$ref: "#/components/schemas/Uuid"}
        credits: {$ref: "#/components/schemas/CreditAmount"}
        amount: {$ref: "#/components/schemas/Money"}
        windows: {type: integer, minimum: 0, description: "Windows voided by this refund."}
        unused: {$ref: "#/components/schemas/CreditAmount"}
        revoked: {type: boolean}
        created_at: {type: string, format: date-time}
    SiteLogoView:
      type: object
      properties:
        logo:
          allOf: [{$ref: "#/components/schemas/SiteLogo"}]
          description: The logo in force; absent when the site has none.
    SiteLogo:
      type: object
      required: [content_type, hash, size, width, height]
      properties:
        content_type: {type: string, enum: [image/svg+xml, image/png, image/webp]}
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the bytes served, which the logo's public URL carries.
        size: {type: integer, minimum: 1, maximum: 262144, description: "Bytes served."}
        width: {type: integer, minimum: 0, maximum: 1024, description: "Pixels; 0 for an SVG with no intrinsic size."}
        height: {type: integer, minimum: 0, maximum: 1024}
        data_url:
          type: string
          description: >-
            The bytes as a data URL, for the settings page's preview only; the change response leaves it out. Absent on
            a node of the release before this field.
    SiteLogoUpdate:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        logo:
          allOf: [{$ref: "#/components/schemas/SiteLogoUpload"}]
          description: The new logo; left out clears the site's logo.
    SiteLogoUpload:
      type: object
      required: [content_type, data_base64]
      properties:
        content_type: {type: string, enum: [image/svg+xml, image/png, image/webp]}
        data_base64:
          type: string
          format: byte
          minLength: 1
          maxLength: 349528
          description: The file, at most 256 KiB before base64.
    LegalDocumentKind:
      type: string
      enum: [terms, privacy]
    LegalDocumentLocale:
      type: string
      enum: [zh, en]
    LegalDocument:
      type: object
      description: >-
        One version of one of the site's legal documents in one locale; the body is Markdown, never HTML. `locale` is
        absent on a node that predates locale-aware documents; a page uses `zh` only as the display fallback and omits
        the locale from the acceptance.
      required: [kind, version, body, published_at]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        locale: {$ref: "#/components/schemas/LegalDocumentLocale"}
        version: {type: integer, minimum: 1}
        body:
          type: string
          description: Markdown headings, paragraphs, and lists. Rendered as React text, never interpreted as HTML.
        published_at: {type: string, format: date-time}
    LegalDocumentHistory:
      type: object
      required: [documents, next_cursor]
      properties:
        documents:
          type: array
          description: Newest first within a kind, at most `limit` rows.
          items: {$ref: "#/components/schemas/LegalDocument"}
        next_cursor:
          type: string
          nullable: true
          description: >-
            Where the next page starts, or null on the last page. New nodes emit the legacy `kind:version` form for old
            nodes and accept both that and `kind:locale:version`.

    LegalDocumentPublish:
      type: object
      description: >-
        Publish one version of a kind in one locale, with the body and a reason. `locale` is optional while old admin
        clients remain: when absent, the publication is Chinese (`zh`) and takes the next version of the kind.
      required: [kind, body, reason]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        locale: {$ref: "#/components/schemas/LegalDocumentLocale"}
        body: {type: string, minLength: 1, maxLength: 65536}
        reason: {$ref: "#/components/schemas/Reason"}
    SiteSettingsView:
      type: object
      required: [settings, defaults]
      properties:
        settings: {$ref: "#/components/schemas/SiteSettings"}
        defaults:
          description: What applies where `settings` has no value.
          allOf: [{$ref: "#/components/schemas/SiteSettings"}]
    SiteSettingsUpdate:
      type: object
      required: [settings, reason]
      properties:
        settings: {$ref: "#/components/schemas/SiteSettings"}
        reason: {$ref: "#/components/schemas/Reason"}
    SegmentSettings:
      type: object
      description: >-
        How a reservation is split into segments. A value that is absent is the default in code. `output_tokens` is
        the output a segment covers; `overshoot_seconds` is the time the allowance covers at the endpoint's speed,
        and must be at least the node's extension wait (1 second).
      properties:
        output_tokens: {type: integer, format: int64, minimum: 1, maximum: 1000000}
        overshoot_seconds: {type: integer, minimum: 1, maximum: 600}
    SegmentSettingsView:
      type: object
      required: [settings, defaults]
      properties:
        settings: {$ref: "#/components/schemas/SegmentSettings"}
        defaults:
          description: What applies where `settings` has no value.
          allOf: [{$ref: "#/components/schemas/SegmentSettings"}]
    SegmentSettingsUpdate:
      type: object
      required: [settings, reason]
      properties:
        settings: {$ref: "#/components/schemas/SegmentSettings"}
        reason: {$ref: "#/components/schemas/Reason"}
    SourceClassCondition:
      type: object
      additionalProperties: false
      required: [evidence, operator]
      properties:
        evidence: {type: string, enum: [header, usage]}
        name:
          type: string
          maxLength: 256
          description: The response header name for a header condition, canonicalized before it is stored.
        item:
          type: string
          maxLength: 64

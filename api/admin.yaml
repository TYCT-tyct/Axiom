      operationId: getLayerRoutingPreset
      tags: [Routing]
      summary: One routing preset of the platform or a site
      description: >-
        A preset of the platform or of a site, disabled or not, with its current rules. An account's or a workspace's
        preset is 404: those are their owners' to manage.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage

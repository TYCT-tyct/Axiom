              schema: {$ref: "#/components/schemas/SubscriptionPlan"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/accounts/{account_id}/subscription-grants:
    post:
      operationId: grantSubscription
      tags: [Users]
      summary: Sell or give an account a subscription
      description: >-
        Grants the plan to the account, or renews the plan already in force: the term extends from its end (or from
        now when it has ended), and the new windows' credit is credited to the plan's liability in the ledger
        (docs/domains/billing.md「订阅套餐」). The source `gift` (the default) is a gift expense; `offline_payment`
        records money received outside the payment channels, like a credit grant. Another plan in force is a 409: a
        plan is not replaced silently. The ID is the idempotency key; the same key and terms change nothing.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: credits.grant
      parameters:
        - name: account_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/AccountId"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionGrantInput"}
      responses:
        "201":
          description: Granted.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Subscription"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/accounts/{account_id}/subscription-grants/{grant_id}/refunds:
    post:
      operationId: refundSubscriptionGrant
      tags: [Users]
      summary: Request a subscription grant refund
      description: >-
        Requests part or all of a paid grant in site credits and, after a different operator approves it, takes back
        the term it bought from the end (docs/domains/billing.md「订阅套餐」). A request changes no money or term. A refund
        of everything left revokes the subscription; a partial one only removes whole future windows. The grant must
        be the newest of the subscription, a window with a pending reservation is refused, and a gift cannot be
        refunded. The ID is the idempotency key; the same key with the same grant and credits returns the stored
        request.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: credits.grant
      parameters:
        - name: account_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/AccountId"}
        - name: grant_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionRefundInput"}
      responses:
        "202":
          description: Waiting for another operator's approval.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionRefundProposal"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/accounts/{account_id}/subscription-refunds/{refund_id}/approve:
    post:
      operationId: approveSubscriptionRefund
      tags: [Users]
      summary: Approve a subscription grant refund
      description: >-
        Applies a pending subscription refund as an operator other than the requester, using the same second-person
        rule as a payment refund. The refund takes back the grant's term and posts its ledger entries
        (docs/domains/billing.md「订阅套餐」). The ID is the idempotency key; approval replay returns the stored refund
        and posts nothing again.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: credits.grant
      parameters:
        - name: account_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/AccountId"}
        - name: refund_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionRefundApprovalInput"}
      responses:
        "200":
          description: Refunded.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionRefund"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/accounts/{account_id}/subscriptions:
    get:
      operationId: listSubscriptions
      tags: [Users]
      summary: List an account's subscriptions

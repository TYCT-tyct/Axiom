  /api/admin/v1/pricing/rules:
    get:
      operationId: listPricingRules
      tags: [Pricing]
      summary: The platform's pricing rules
      description: >-
        Every rule, enabled or not, most specific target first, then most specific audience (the order in which rules
        are tried, docs/domains/billing.md「定价」). Few enough not to be paged. In M1 these are the main site's rules.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingRuleList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createPricingRule
      tags: [Pricing]
      summary: Add a pricing rule
      description: >-
        A rule says what it prices (target), for whom (audience), how (method) and within what limits (constraints).
        Account, tier and all audiences have independent published prices. It prices a model, an author or everything.
        Reference multipliers explicitly name `face` for a reference already in the site's currency or `exchange` for
        exact conversion at the frozen reference rate; the multiplier and exchange fraction are combined before rounding.
        Fixed schedules and cost-plus pricing use the site's currency. Endpoint, group, supplier and source-type targets
        are refused (422, pointing at `/rule/target/kind`); an omitted conversion points at
        `/rule/method/currency_conversion`. Two rules with the same target and audience cannot both
        exist (409): change the one there is. Prices are published as immutable versions after cost and change-threshold checks; large moves wait for confirmation. The site floor applies unless an explicit audited exception is published.
        What a rule would do is shown by `previewPricing` first.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricingRuleCreate"}
      responses:
        "201":
          description: Added.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/rules/{rule_id}:
    put:
      operationId: updatePricingRule
      tags: [Pricing]
      summary: Change a pricing rule
      description: >-
        Replaces the rule's target, audience, method, constraints and `enabled` as of `rev`. A rule is never deleted,
        so the history stays: disable it. Account and tier audiences are supported. An unchanged legacy rule can always be disabled; other edits must pass current validation.
        Changes of price follow the rules' own limits on the size of a change
        (docs/domains/operations.md「风险分级与审批」).
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"

  /api/admin/v1/payments/refunds:
    get:
      operationId: listPaymentRefunds
      tags: [Payments]
      summary: A site's refunds, newest first, for review and follow-up
      description: >-
        The admin's refund list. `state` is the internal state: `frozen` is held after the request and waits for an
        administrator's approval (`approved_by` absent), a second approval when `second_required` is set, or for
        sending; `sending` and `pending` are with the channel
        and their result is not final; `succeeded` returned the cash; `failed` returned the frozen credits. Filters
        left out do not narrow. The page asks with `state=frozen` for the review queue. Money is exact text: `credits`
        is in the site's accounting currency (billionths), `amount` in the currency the order was paid in (minor units).
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}

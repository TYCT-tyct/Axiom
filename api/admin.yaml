      summary: The paid top-ups behind the dashboard's business figures
      description: >-
        One site's paid credit batches in a window, newest first. A batch's `created_at` is the time both paid users
        and monthly revenue count; it is not an order's creation time, so an order created before the window and
        credited in it is here. `since` is inclusive and `until` exclusive; the window is at most 63 days so a
        retention drill can start at the previous UTC month's first day. Pages use `cursor` and `limit`; `amount` is
        the credit the batch granted in the site's accounting currency, exact decimal text.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:

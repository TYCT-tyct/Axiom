# The admin API: what the admin app calls on the admin listener, which only the admin domains and restricted sources
# reach (docs/architecture.md「技术选型」前端交付). Code on both sides is generated from this file; change the
# contract here first. The conventions it follows, and the reasons, are in internal/platform/README.md「接口约定」;
# `just api` checks them. The operations of the Session tag are the console's, under this surface's path: a session
# is valid on the surface that issued it, so each surface has its own sign-in.
openapi: 3.0.3
info:
  title: Axiom admin API
  version: v1
  description: >-
    The API of the admin app, under `/api/admin/v1` on the admin listener. Every operation outside the Session tag
    acts on the platform, so it needs a session that passed two-step verification (`x-axiom-level: mfa`) and the
    permission named by `x-axiom-permission` among the user's platform grants.


    Every operation that changes data needs the `Origin` of the admin domain, `Content-Type: application/json` and the
    session's `X-CSRF-Token`. Operations outside the Session tag that change data also take an `Idempotency-Key` (a
    UUID chosen by the caller for one intended change; sending it again returns the first result with the header
    `Idempotency-Replayed: true`, and using it for another kind of change is `idempotency_key_reused`) and a
    `reason` of 1 to 1000 characters, which goes to the audit log. A `rev` in a request is the revision the caller
    read; a changed resource is refused with `stale_revision` instead of overwritten. A POST marked
    `x-axiom-safe: true` changes nothing and takes neither. Every response carries `X-Request-ID` and
    `Cache-Control: no-store`.
tags:
  - {name: Calls, description: "Support summaries and operator traces."}
  - {name: Reports, description: "The operations dashboard: calls, revenue, cost and cash over a window."}
  - {name: Operations, description: "The operations agent's control plane: its credentials and the emergency stop."}
  - {name: Audit, description: "Immutable audit search."}
  - {name: Session, description: "Sign-in, two-step verification and the current session."}
  - {name: Site, description: "Site settings."}
  - {name: Quality, description: "Source classes and the fingerprint rules that recognize them."}
  - {name: Routing, description: "The routing presets of the platform and the sites, and their defaults."}
  - {name: Users, description: "Users, accounts and manual credit."}
  - {name: Suppliers, description: "Suppliers, their groups and keys, and the upstream model names waiting to be mapped."}
  - {name: Catalog, description: "Authors, models, their names, specs and reference prices."}
  - {name: Pricing, description: "Pricing rules and their preview."}
  - {name: Alerts, description: "Platform operations alert rules, channels, incidents and receipts."}
  - {name: Observability, description: "Call-log retention and platform observability settings."}
  - {name: Payments, description: "Payment discrepancies and investigation notes."}
paths:
  /api/admin/v1/calls:
    get:
      operationId: listAdminCalls
      tags:
      - Calls
      summary: Support summaries without costs, endpoints or routes. Defaults to 24 hours; at most 31 days, newest
        first.
      description: Support summaries without costs, endpoints or routes. Defaults to 24 hours; at most 31 days, newest
        first.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: calls.search
      parameters:
      - &admin_path_id001
        name: since
        in: query
        schema:
          type: string
          format: date-time
      - &admin_path_id002
        name: until
        in: query
        schema:
          type: string
          format: date-time
      - &admin_path_id003
        $ref: '#/components/parameters/Cursor'
      - &admin_path_id004
        $ref: '#/components/parameters/Limit'
      - name: account_id
        in: query
        schema:
          $ref: '#/components/schemas/AccountId'
      - name: request_id
        in: query
        schema:
          type: string
          format: uuid
      - name: model
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AdminCallStatus'
      - name: site_id
        in: query
        schema:
          $ref: '#/components/schemas/SiteId'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCallList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/calls/{call_id}/trace:
    parameters:
    - name: call_id
      in: path
      required: true
      schema:
        type: string
    get:
      operationId: getAdminCallTrace
      tags:
      - Calls
      summary: Operator-only trace, including costs, route and attempts in sequence order.
      description: Operator-only trace, including costs, route and attempts in sequence order.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: calls.inspect
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCallTrace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/reports/overview:
    get:
      operationId: getOperationsOverview
      tags:
      - Reports
      summary: The site's calls, errors, revenue, cost and cash over a window, with its busiest accounts and models.
      description: >-
        The operations dashboard of the site the request was made on (docs/domains/operations.md「运营看板」). Calls and
        errors are the call log's, over the calls that started in the window. Revenue is what the window's settled calls
        were charged and cost is what the supplier charged the platform where billing could convert it, both in the
        site's accounting currency; `unknown_cost_calls` counts the calls whose cost is unknown, and their cost is not in `cost`. Cash is
        the ledger's cash book — paid credit in and refunds out, in each payment currency — so it is neither revenue nor
        the call log's charge. The window defaults to 24 hours and is at most 31 days.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
      - *admin_path_id001
      - *admin_path_id002
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationsOverview'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/reports/targets/{month}:
    parameters:
      - name: month
        in: path
        required: true
        description: A UTC calendar month, `YYYY-MM`.
        schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
    get:
      operationId: getOperationsTargets
      tags: [Reports]
      summary: The site's business targets for a UTC calendar month.
      description: >-
        The targets the owner set in the admin for one month (docs/domains/operations.md「业务目标」). Calls and errors
        are whole counts; revenue and cost are exact money in the site's accounting currency. `rev` is the month's
        revision: 0 before the first write, one more after every successful write, including a clear. A month with no
        target has no target fields and still carries its revision.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The targets
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsTargets"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateOperationsTargets
      tags: [Reports]
      summary: Set the first-release business targets for a UTC calendar month.
      description: >-
        Replaces the first-release four targets, calls, errors, revenue and cost: a target left out is cleared, not
        kept from before. The request carries the `rev` the editor read; a month that has moved since then is a 409
        `stale_revision`, not a silent overwrite of another administrator's change. Revenue and cost are exact money
        in the site's accounting currency, and another currency is a 400. The commercial metrics (paid users, monthly
        revenue, gross margin and retention) are left as stored, so an editor from a node before them cannot clear
        what it cannot see. A full replacement uses `replaceOperationsTargets`; this operation refuses the full-set
        header, body marker and commercial fields. It remains the write every node has, so a page from before the
        commercial metrics can keep using it during a rolling release. The change is audited with the values it replaced and the reason.
        Targets are administrative data, not site settings, so `updateSiteSettings` leaves them as they are.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TargetMetricSet"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsTargetsUpdate"}
      responses:
        "200":
          description: The targets as stored
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsTargets"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/reports/targets/{month}/all:
    parameters:
      - name: month
        in: path
        required: true
        description: A UTC calendar month, `YYYY-MM`.
        schema: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
    put:
      operationId: replaceOperationsTargets
      tags: [Reports]
      summary: Replace every business target for a UTC calendar month.
      description: >-
        The full-set write, for a page that read all eight metrics. The path is new with the commercial metrics: a
        node before them does not route it and returns 404 before the request can be mistaken for a legacy four-field
        write, so a clear cannot leave the commercial rows behind and still report success. The body replaces every
        metric; a target left out is cleared. `X-Axiom-Target-Metrics: all` and `all_metrics: true` are both required.
        `rev`, currency and audit rules are the same as `updateOperationsTargets`. Targets are administrative data,
        not site settings, so `updateSiteSettings` leaves them as they are.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/TargetMetricSet"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsTargetsUpdate"}
      responses:
        "200":
          description: The targets as stored
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsTargets"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/audit:
    get:
      operationId: listAuditEntries
      tags:
      - Audit
      summary: Immutable audit records, exact filters, newest first. Defaults to 24 hours; at most 31 days.
      description: Immutable audit records, exact filters, newest first. Defaults to 24 hours; at most 31 days.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: audit.view
      parameters:
      - *admin_path_id001
      - *admin_path_id002
      - *admin_path_id003
      - *admin_path_id004
      - name: site_id
        in: query
        schema:
          $ref: '#/components/schemas/SiteId'
      - name: account_id
        in: query
        schema:
          $ref: '#/components/schemas/AccountId'
      - name: request_id
        in: query
        schema:
          type: string
          format: uuid
      - name: actor_kind
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: actor_id
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: action
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: module
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: target_kind
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: target_id
        in: query
        schema:
          type: string
          minLength: 1
          maxLength: 200
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/audit/{entry_id}:
    parameters:
    - name: entry_id
      in: path
      required: true
      schema: &admin_path_id005
        type: string
    get:
      operationId: getAuditEntry
      tags:
      - Audit
      summary: Read an immutable audit entry.
      description: Read an immutable audit entry.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: audit.view
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/sites/{site_id}/system-settings:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SiteId'
    get:
      operationId: getSystemSettings
      tags:
      - Site
      summary: Site name and invite or closed registration policy; omitting registration keeps the current mode, including open.
      description: Site name and invite or closed registration policy; omitting registration keeps the current mode, including open.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    put:
      operationId: setSystemSettings
      tags:
      - Site
      summary: Site name and invite or closed registration policy; omitting registration keeps the current mode, including open.
      description: Site name and invite or closed registration policy; omitting registration keeps the current mode, including open.
      security:
      - session: []
        csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/site:
    get:
      operationId: getAdminSite
      tags: [Session]
      summary: The site the admin host belongs to
      description: >-
        The name and logo of the site whose admin domain this request reached, so the admin app shows the site's brand
        before it has a session. The logo's URL is on this admin host and carries the bytes' SHA-256; it stays available
        for a year and an older logo keeps working under its own hash. No session: these are the same public facts the
        console's `getSite` gives, and the admin host already names the site.
      security: []
      responses:
        "200":
          description: The site's brand.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSite"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/site/logo/{hash}:
    get:
      operationId: getAdminSiteLogo
      tags: [Session]
      summary: The site's logo for the admin app
      description: >-
        The bytes at `getAdminSite.logo_url`. The hash names the content, so the URL never changes meaning and the
        answer is immutable; a hash this site never served is a 404. A page opened before the logo changed keeps its
        image under the old hash.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        "200":
          description: The logo.
          headers:
            Cache-Control:
              required: true
              description: Long-lived and immutable, because the hash in the URL names the bytes.
              schema: {type: string}
          content:
            image/svg+xml:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/sites/{site_id}/brand:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SiteId'
    get:
      operationId: getSiteBrand
      tags:
      - Site
      summary: A site's brand colour.
      description: >-
        The #rrggbb colour the console derives both colour schemes from (docs/frontend.md「主题与自由度」); absent when
        the site uses the default palette. Contrast is not a reason to refuse a colour: the console corrects it.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        '200':
          description: The site's brand colour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteBrand'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Failure'
    put:
      operationId: updateSiteBrand
      tags:
      - Site
      summary: Set or clear a site's brand colour.
      description: >-
        Sets the site's brand colour, or clears it to the default palette when `brand_color` is empty. A value that is
        not #rrggbb is a 400. The change is audited; this node serves it at once and the others follow within their site
        reload interval.
      security:
      - session: []
        csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SiteBrandUpdate'
      responses:
        '200':
          description: The brand colour now in force.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteBrand'
          headers:
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/sites/{site_id}/logo:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SiteId"}
    get:
      operationId: getSiteLogoAdmin
      tags: [Site]
      summary: A site's logo
      description: >-
        The logo the site currently serves and what it is, or no logo. `data_url` carries the bytes as a data URL so the
        settings page can preview them under the content security policy (`img-src 'self' data:`); the pages fetch the
        logo from `getSite` on the console domain or `getAdminSite` on the admin domain, not from this operation.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The site's current logo, or none.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteLogoView"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateSiteLogo
      tags: [Site]
      summary: Replace or clear a site's logo
      description: >-
        Replaces the site's logo with `logo`, or clears it when `logo` is left out. An SVG is sanitised before it is
        stored: scripts, event handlers, styles, images, links and external references are dropped, and the result must
        still be one well-formed SVG. A PNG or WebP must be 1 to 1024 pixels on each side, and every format is at most
        256 KiB. The response describes the new logo; the change is audited, and this node serves it at once while the
        others follow within their site reload interval.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SiteLogoUpdate"}
      responses:
        "200":
          description: The logo now in force.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteLogoView"}
          headers:
            Idempotency-Replayed:
              $ref: "#/components/headers/IdempotencyReplayed"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/sites/{site_id}/system-settings/payments:
    parameters:
    - name: site_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SiteId'
    get:
      operationId: getPaymentSettings
      tags:
      - Site
      summary: Collection switch, accepted credit range and top-up buffer.
      description: Collection switch, accepted credit range and top-up buffer; omitted top-up limits are unrestricted.
      security:
      - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':

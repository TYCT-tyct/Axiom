        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/endpoint-tests:
    post:
      operationId: testSupplierEndpoint
      tags: [Suppliers]
      summary: Test one of a supplier's endpoints with a real generation
      description: >-
        Calls the endpoint as a request would, in the format given, streamed, with the output capped at 16 tokens and no
        reasoning asked for, and reads the whole answer, never cutting it short: a supplier that ignores a disconnect
        bills the generation anyway. The call's cost is booked at a definite upper bound, in the supplier's own unit,
        with a test flag and no tenant: the platform pays it, nothing is reserved and no ledger is settled. The estimate
        is never compared with the supplier's charge, so no test can move the endpoint's cost state.


        `passed`: a 2xx answer read to its normal end. `failed`: a failure the endpoint is at fault for. `inconclusive`:
        anything else — the test's own deadline, the key, the route, the supplier's balance, a rate limit, or the
        request itself — says nothing about the endpoint.


        Limits: 10 a minute per session, because each test is a generation the platform pays for.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndpointTestRequest"}
      responses:
        "201":
          description: What the test found, and what it was booked at.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EndpointTest"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}

      operationId: listMerchants
      tags: [Payments]
      summary: The merchant accounts of a site and their payment methods, without their secrets.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
      responses:

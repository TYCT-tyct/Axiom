    put:
      operationId: updateSubscriptionPlan
      tags: [Pricing]
      summary: Change a subscription plan
      description: >-
        Saves the plan at the revision the caller read. A revision that has moved is a 409, so two administrators cannot
        overwrite each other. Subscriptions already sold keep the terms they were sold with.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"

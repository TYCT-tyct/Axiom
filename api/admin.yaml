        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createSupplier
      tags: [Suppliers]
      summary: Connect a supplier
      description: >-
        Connects the supplier at `origin` as `upstream_account`, with the login `detectSupplier` said its kind needs
        (stored sealed, never returned). It answers at once with the supplier in `connecting`; the first sync logs in,
        reads the groups, keys and models, and moves it to `active`, or to `needs_attention` with the reason, so the
        page polls `getSupplier`. The origin and the account cannot change later, so a changed address cannot carry old
        credentials to a new host; an origin and account already connected is a 409. The address is checked by the
        outbound client like every supplier request, and one it refuses is a 422.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupplierCreate"}
            examples:
              paid_in_cny:
                summary: A new-api supplier paid in yuan, logged in with a personal access token
                value:
                  name: Example CN
                  kind: newapi
                  origin: https://api.example.cn
                  upstream_account: ops@example.com
                  settlement_currency: CNY
                  login: {access_token: pat-example, access_token_expires_at: "2027-01-01T00:00:00Z"}
                  reason: Second source for the hosted models
              paid_in_usd:
                summary: A sub2api supplier paid in dollars, logged in with tokens taken after a manual sign-in
                value:
                  name: Example US
                  kind: sub2api
                  origin: https://api.example.com
                  upstream_account: ops@example.com
                  settlement_currency: USD
                  login: {access_token: at-example, refresh_token: rt-example, access_token_expires_at: "2026-10-16T08:00:00Z"}
                  reason: Second source for the hosted models
      responses:
        "201":
          description: Connecting.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/detections:
    post:
      operationId: detectSupplier
      tags: [Suppliers]
      summary: Find out what system a site runs
      description: >-
        Probes the address through the outbound client, which refuses private and internal addresses, and says which
        adapter kind fits and what login it needs. It stores nothing. A site no adapter recognises answers 200 with no
        `kind`.


        Limits: 10 a minute per session, because each probe is a request to a third party.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      x-axiom-safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DetectionRequest"}
      responses:
        "200":
          description: What the probe found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Detection"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/endpoint-tests:
    post:
      operationId: testSupplierEndpoint
      tags: [Suppliers]
      summary: Test one of a supplier's endpoints with a real generation
      description: >-
        Calls the endpoint as a request would, in the format given, streamed, with the output capped at 16 tokens and no
        reasoning asked for, and reads the whole answer, never cutting it short: a supplier that ignores a disconnect
        bills the generation anyway. The call's cost is booked at a definite upper bound, in the supplier's own unit,
        with a test flag and no tenant: the platform pays it, nothing is reserved and no ledger is settled. The estimate
        is never compared with the supplier's charge, so no test can move the endpoint's cost state.


        `passed`: a 2xx answer read to its normal end. `failed`: a failure the endpoint is at fault for. `inconclusive`:
        anything else — the test's own deadline, the key, the route, the supplier's balance, a rate limit, or the
        request itself — says nothing about the endpoint.


        Limits: 10 a minute per session, because each test is a generation the platform pays for.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EndpointTestRequest"}
      responses:
        "201":
          description: What the test found, and what it was booked at.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/EndpointTest"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}:
    parameters:
      - name: supplier_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/Uuid"}
    get:
      operationId: getSupplier
      tags: [Suppliers]
      summary: One supplier with its groups, keys and endpoints
      description: >-
        The supplier, its groups with their ratios, the keys bound to groups, the keys the supplier lists that are
        bound to none, and its endpoints, by upstream name. Read from what the sync last stored, not from the supplier,
        so it is cheap.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.view
      responses:
        "200":
          description: The supplier
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplierDetail"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/status:
    put:
      operationId: setSupplierStatus
      tags: [Suppliers]
      summary: Pause or resume a supplier
      description: >-
        `paused` takes the supplier out of routing and stops its sync without touching its credentials; `active`
        resumes it. A supplier that is `connecting`, `needs_attention`, `removing` or `removed` is not moved by hand:
        409.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupplierStatusUpdate"}
      responses:
        "200":
          description: The supplier as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/removal:
    post:
      operationId: removeSupplier
      tags: [Suppliers]
      summary: Remove a supplier
      description: >-
        Takes the supplier out of routing at once and ends it `removed`, in one transaction: its login is deleted, the
        sealed key of each credential is cleared and the credential becomes `erased` (the row stays, because calls made
        with it point at it). Calls in flight end with the key they hold. Axiom does not write to the supplier in M1, so
        the keys it used there are not revoked: the credentials stay listed as `erased` with their `upstream_key_ref`, for a person to revoke at the supplier, and the audit
        entry records how many (`keys_to_revoke_count`).
        Sending it again returns the supplier as it is.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The supplier, `removed`.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/login:
    put:
      operationId: replaceSupplierLogin
      tags: [Suppliers]
      summary: Replace the login Axiom uses at a supplier
      description: >-
        Seals the new login in place of the old one and has the sync log in with it. Used when the supplier rejected
        the old one (`needs_attention`) or the person rotates it. The address and the account are not changed. Changing
        a credential is a high-risk operation (docs/domains/operations.md); the audit entry names the actor and the
        reason, not the login.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupplierLoginUpdate"}
      responses:
        "200":
          description: The supplier, `connecting` again.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/unit-value:
    put:
      operationId: confirmSupplierUnitValue
      tags: [Suppliers]
      summary: Confirm what one unit of a supplier's balance is worth
      description: >-
        The person's answer to "1 unit of balance = how much money" (docs/domains/billing.md「供应商成本」), which
        turns the supplier's costs into money. The adapter's hint is in `Supplier.unit_value_hint`. A later value
        applies from now; calls already costed keep theirs. Endpoints of the supplier stay out of routing until a
        value is confirmed.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnitValueUpdate"}
      responses:
        "200":
          description: The supplier as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/groups/{group_id}:
    put:
      operationId: selectSupplierGroup
      tags: [Suppliers]
      summary: Choose whether a supplier's group is used
      description: >-
        A selected group gets its code name (the name users see in place of the group's, made when it is first
        selected and never changed) and its models become endpoints. Unselecting takes the group out of routing and
        keeps the code name.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - name: group_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupSelection"}
      responses:
        "200":
          description: The group as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplierGroup"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/credentials:
    post:
      operationId: bindSupplierKey
      tags: [Suppliers]
      summary: Use one of the supplier's keys for a group
      description: >-
        Axiom does not make keys at suppliers in M1: a person makes one there, and this binds it to a group by the
        supplier's own ID for it (from `unbound_keys` of `getSupplier`). The credential is `binding` until the sync
        has read the key's text from the supplier and sealed it. A key is bound once, and the group must be
        selected. Use a dedicated key. If its model limits or expiry cannot be read, create an unrestricted
        dedicated key upstream and grant permission to read those fields; unreadable permissions deny all models.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BindKey"}
      responses:
        "201":
          description: Binding.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplierCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/credentials/{credential_id}/limits:
    put:
      operationId: setSupplierCredentialLimits
      tags: [Suppliers]
      summary: Set a credential's concurrency and account RPM ceiling
      description: >-
        Concurrency is per credential. RPM counts all requests of the supplier's upstream account across its keys
        and endpoints in a rolling 60-second window, in this node's memory. A credential is eligible while that shared
        count is below its configured ceiling, at most 100000; null adds no RPM ceiling for this credential, but its
        requests still count for the account. Set the same ceiling on keys that share an upstream allowance. RPM
        sharing across nodes comes with Valkey later; concurrency retains the static per-core share design. A change
        reaches a node at its next reload, within seconds.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - name: credential_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CredentialLimits"}
      responses:
        "200":
          description: The credential as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SupplierCredential"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pending-mappings:
    get:
      operationId: listPendingMappings
      tags: [Suppliers]
      summary: Upstream model names that map to no model
      description: >-
        The names suppliers list that the catalog could not recognise and no alias covers. They get no endpoint and
        take no traffic until someone maps them. Oldest first, so the queue is worked in order.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.view
      parameters:
        - {name: supplier_id, in: query, required: false, schema: {$ref: "#/components/schemas/Uuid"}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of names
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PendingMappingList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/model-mappings:
    post:
      operationId: mapSupplierModel
      tags: [Suppliers]
      summary: Map an upstream model name to a model
      description: >-
        Makes an alias of the supplier's: the name means this model, in one group or in the whole supplier. The
        endpoint it creates waits for the authenticity check before it takes traffic. Without rev this creates an
        alias and refuses an existing name in that scope (409 conflict). To correct a group alias, send the current
        revision as rev; a missing or changed alias returns 409 stale_revision. A matching revision appends an audited
        correction, projected at the next sync; the same model leaves the revision unchanged. Supplier-wide aliases
        remain immutable (409).
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelMappingRequest"}
      responses:
        "201":
          description: Mapped.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelMapping"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/authors:
    get:
      operationId: listAuthors
      tags: [Catalog]
      summary: Model authors
      description: Every author, by slug. Few enough not to be paged.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.view
      responses:
        "200":
          description: The authors
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthorList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/authors/{slug}:
    put:
      operationId: saveAuthor
      tags: [Catalog]
      summary: Make an author or rename it
      description: Makes the author if the slug is new, else changes its display name. A slug never changes.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: slug
          in: path
          required: true
          schema: {$ref: "#/components/schemas/AuthorSlug"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AuthorSave"}
      responses:
        "200":
          description: The author as saved
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Author"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models:
    get:
      operationId: listModels
      tags: [Catalog]
      summary: Models
      description: >-
        Models by slug, drafts included (the queue to review is `status=draft`). `slug_prefix` matches the start of
        the slug.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.view
      parameters:
        - {name: status, in: query, required: false, schema: {$ref: "#/components/schemas/ModelStatus"}}
        - {name: author, in: query, required: false, schema: {$ref: "#/components/schemas/AuthorSlug"}}
        - {name: slug_prefix, in: query, required: false, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of models
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createModel
      tags: [Catalog]
      summary: Draft a model
      description: >-
        Makes a draft model, visible to the platform only until it is put on sale. The author is the first part of
        the slug and must exist. The slug is `<author>/<model>`, with `@<version>` when the vendor gives one.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelCreate"}
      responses:
        "201":
          description: Drafted.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}:
    get:
      operationId: getModel
      tags: [Catalog]
      summary: One model with its names and prices
      description: >-
        The model, its names, and its current reference price in each currency that has had one. `rev` is what the
        operations that change the model take back.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.view
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}/spec:
    put:
      operationId: updateModelSpec
      tags: [Catalog]
      summary: Replace a model's baseline spec
      description: >-
        Replaces the spec as of `rev`; the old one stays in the change history. A retired model cannot change. A model
        on sale must still declare `items` and `tiers`, and every current reference price must still price all of
        them, else 422 `not_ready`.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SpecUpdate"}
      responses:
        "200":
          description: The model as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}/names:
    post:
      operationId: addModelName
      tags: [Catalog]
      summary: Give a model another name
      description: >-
        Adds a name written as the vendor writes it. Names are never changed or removed, and compared normalised they
        are unique across all models, so a name never starts to mean another model (`name_taken`). Only a public name
        can be called by users, and the model's standard ID must be one of them before it goes on sale. A retired
        model takes no new names.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NameAdd"}
      responses:
        "200":
          description: The model with the name added
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}/status:
    put:
      operationId: setModelStatus
      tags: [Catalog]
      summary: Put a model on sale or retire it
      description: >-
        `listed` puts a draft model on sale, after the review gate: it declares what an upstream may report, its
        standard ID is a public name, it has a reference price, and every current reference price covers everything
        it declares; a model that fails is 422 `not_ready` with what is missing. `retired` takes a listed model out of
        use for good: its names answer "retired" from then on and are never reused. Any other change of status is a
        409. Both are as of `rev`.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelStatusUpdate"}
      responses:
        "200":
          description: The model as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}/prices:
    post:
      operationId: publishReferencePrice
      tags: [Catalog]
      summary: Publish a reference price in a currency
      description: >-
        Adds a version to the currency's history, which is never rewritten: a correction is another version. `base` is
        the row that was current in that currency when the person decided (absent if the currency has no history);
        another current row is a 409 `stale_revision`. `source` must be the model's price source, and `evidence` a
        non-empty object. A schedule that loses a price the current one has is refused (422), and one whose tier
        basis differs from the current one's needs `confirm_basis_change`. On a model on sale the schedule must price
        everything the model declares.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePublish"}
      responses:
        "200":
          description: The model with the price published
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/models/{model_id}/price-source:
    put:
      operationId: selectPriceSource
      tags: [Catalog]
      summary: Choose where a model's reference price comes from
      description: >-
        Switches the model to another price source and, in one step, publishes the new source's price in each of its
        currencies and withdraws the currencies it has none in, so every current price comes from the new source.
        `bases` lists the current row of every currency that has history, as the person saw them; any difference is a
        409 `stale_revision`. In M1 the source is `official` or `manual`, and `prices` carries the schedules with their
        evidence. A switch that would lose a price the model has is refused.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceSourceSelect"}
      responses:
        "200":
          description: The model as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/exchange-rates:
    get:
      operationId: listExchangeRates
      tags: [Pricing]
      summary: List current exchange rates (manual and automatic)
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      responses:
        "200":
          description: One current version per normalized pair
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeRateList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: setExchangeRate
      tags: [Pricing]
      summary: Append a manual exchange rate
      description: >-
        One base buys numerator/denominator quote. Both directions share a normalized history.
        Every write must be within 10^-6 to 10^6. Ordinary adjustments may differ at most fivefold;
        correction bypasses only that relative check and requires an audited reason.
        The first value requires kind initial and expected_version 0; without a trusted reference a reversed
        first value cannot be detected automatically. A stale expected version returns 409. The range and the fivefold
        limit are rules on the numerator and denominator together, so their 422 points at the whole body (an empty
        pointer).
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeRateInput"}
      responses:
        "201":
          description: The appended normalized version
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeRate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/exchange-rates/{base}/{quote}:
    get:
      operationId: exchangeRateHistory
      tags: [Pricing]
      summary: Read a pair's immutable history
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      parameters:
        - name: base
          in: path
          required: true
          schema: {type: string}
        - name: quote
          in: path
          required: true
          schema: {type: string}
        - name: before_version
          in: query
          description: The version to continue from, exclusive; omit it to start from the newest.
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "200":
          description: At most 100 versions newest first; use the last version as before_version to continue
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeRateList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/rules:
    get:
      operationId: listPricingRules
      tags: [Pricing]
      summary: The platform's pricing rules
      description: >-
        Every rule, enabled or not, most specific target first, then most specific audience (the order in which rules
        are tried, docs/domains/billing.md「定价」). Few enough not to be paged. In M1 these are the main site's rules.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingRuleList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createPricingRule
      tags: [Pricing]
      summary: Add a pricing rule
      description: >-
        A rule says what it prices (target), for whom (audience), how (method) and within what limits (constraints).
        Account, tier and all audiences have independent published prices. It prices a model, an author or everything.
        Reference multipliers explicitly name `face` for a reference already in the site's currency or `exchange` for
        exact conversion at the frozen reference rate; the multiplier and exchange fraction are combined before rounding.
        Fixed schedules and cost-plus pricing use the site's currency. Endpoint, group, supplier and source-type targets
        are refused (422, pointing at `/rule/target/kind`); an omitted conversion points at
        `/rule/method/currency_conversion`. Two rules with the same target and audience cannot both
        exist (409): change the one there is. Prices are published as immutable versions after cost and change-threshold checks; large moves wait for confirmation. The site floor applies unless an explicit audited exception is published.
        What a rule would do is shown by `previewPricing` first.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricingRuleCreate"}
      responses:
        "201":
          description: Added.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/rules/{rule_id}:
    put:
      operationId: updatePricingRule
      tags: [Pricing]
      summary: Change a pricing rule
      description: >-
        Replaces the rule's target, audience, method, constraints and `enabled` as of `rev`. A rule is never deleted,
        so the history stays: disable it. Account and tier audiences are supported. An unchanged legacy rule can always be disabled; other edits must pass current validation.
        Changes of price follow the rules' own limits on the size of a change
        (docs/domains/operations.md「风险分级与审批」).
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - name: rule_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricingRuleUpdate"}
      responses:
        "200":
          description: The rule as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingRule"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/previews:
    post:
      operationId: previewPricing
      tags: [Pricing]
      summary: Preview prices and margins
      description: >-
        What each of up to 100 models would sell for, one row per model using the envelope of callable endpoint costs,
        to one account (with its tier and the rules for it alone) or to a user of one tier, with the stored rules, or
        with `rule` added (or replacing `replaces_rule_id`) when given, and whether its requested price covers the site floor. The scalar margin is unavailable; compare the per-item price and cost schedules.
        Nothing is stored. The publication list separately shows the actual served version and pending proposals.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      x-axiom-safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricingPreviewRequest"}
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricingPreview"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/publications:
    get:
      operationId: listPricePublications
      tags: [Pricing]
      summary: Published prices and pending proposals
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      responses:
        "200":
          description: Current publication state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricePublicationList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/publications/{model_id}:
    post:
      operationId: publishSalePrice
      tags: [Pricing]
      summary: Confirm a sale price version
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePublishInput"}
      responses:
        "200":
          description: Current publication state
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricePublicationList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/policy:
    put:
      operationId: updatePricePolicy
      tags: [Pricing]
      summary: Set the site publication policy
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PricePolicyInput"}
      responses:
        "200":
          description: Current publication state
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PricePublicationList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-axiom_session
      description: >-
        The session cookie (HttpOnly, Secure, SameSite=Lax). Its name loses the `__Host-` prefix only where the site's
        registered origin is `http://localhost`. The sign-in operations set it, and it is valid only on the surface
        that issued it.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, which sign-in, two-step verification and `getSession` return. Every request that
        changes data and carries a session sends it; the request must also carry an `Origin` equal to the origin
        registered for the site and surface, and `Content-Type: application/json`. The API sends no CORS headers.
  headers:
    SetCookie:
      required: true
      description: The new session cookie, or an expired one that ends the session.
      schema: {type: string}
    IdempotencyReplayed:
      required: false
      description: "true when this response is the stored result of an earlier request with the same Idempotency-Key; nothing was done again."
      schema: {type: boolean}
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid for
        the same filters, and a malformed one is a 400.
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the caller chooses for one intended change. Sending the request again with the same key, after a lost
        response, returns the first result instead of doing it twice.
      schema: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
  responses:
    BadRequest:
      description: The request is malformed or breaks a constraint of the contract (`invalid_request`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: >-
        No valid session for this surface, or the credentials of a sign-in are wrong, alike for an unknown email, a
        wrong password and a disabled user (`unauthenticated`, `invalid_credentials`, `invalid_code`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The session may not do this: the permission is missing, the session has not passed two-step verification
        (`mfa_required`), the Origin, content type or CSRF token is wrong (`origin_rejected`), or the current legal
        documents have not been accepted (`consent_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: >-
        There is no such resource, or the session's scope cannot see it. A malformed ID and an unknown one answer
        alike (`not_found`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Failure:
      description: >-
        Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503). A 500 never carries the internal error's text.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    AdminCallStatus:
      type: string
      enum: [ok, error]
      description: >-
        The result of a call: `ok` when its error_kind is empty, `error` otherwise. An old node may leave the filter echo
        out of a list.
    AdminCallSummary:
      type: object
      additionalProperties: false
      properties:
        id: &admin_schema_id001
          type: string
        site_id:
          $ref: '#/components/schemas/SiteId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        at:
          type: string
          format: date-time
        model: *admin_schema_id001
        error_kind: *admin_schema_id001
        latency_ms:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    AdminCallList:
      type: object
      additionalProperties: false
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminCallSummary'
        next_cursor: *admin_schema_id001
        model_filter: *admin_schema_id001
        status_filter:
          $ref: '#/components/schemas/AdminCallStatus'
        site_filter:
          $ref: '#/components/schemas/SiteId'
    AdminAttempt:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
        endpoint_id: *admin_schema_id001
        supplier_id: *admin_schema_id001
        source_class: *admin_schema_id001
        egress: *admin_schema_id001
        outcome: *admin_schema_id001
        error_kind: *admin_schema_id001
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        first_token_ms:
          type: integer
    AdminCallTrace:
      type: object
      additionalProperties: false
      properties:
        summary:
          $ref: '#/components/schemas/AdminCallSummary'
        cost:
          $ref: '#/components/schemas/Money'
        route:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAttempt'
    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id: *admin_schema_id001
        actor_kind: *admin_schema_id001
        actor_id: *admin_schema_id001
        request_id: *admin_schema_id001
        action: *admin_schema_id001
        module: *admin_schema_id001
        target_kind: *admin_schema_id001
        target_id: *admin_schema_id001
        reason: *admin_schema_id001
        at:
          type: string
          format: date-time
        site_id:
          $ref: '#/components/schemas/SiteId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        detail:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
    AuditEntryList:
      type: object
      additionalProperties: false
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        next_cursor: *admin_schema_id001
    SystemSettings:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        registration:
          type: string
          enum:
          - invite
          - closed
          - open
        name_editable:
          type: boolean
          description: >-
            Whether this node accepts a name-only update of the system settings. Absent on a node of the previous release,
            whose contract requires the registration mode with the name; the settings page then keeps the name read-only
            until the node is upgraded.
    SiteBrand:
      type: object
      additionalProperties: false
      properties:
        brand_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
          description: >-
            The site's brand colour, lower case. Absent when the site uses the default palette; a node of the previous
            release has no brand colour and leaves it out.
    SiteBrandUpdate:
      type: object
      additionalProperties: false
      required:
      - brand_color
      - reason
      properties:
        brand_color:
          type: string
          pattern: '^(#[0-9a-fA-F]{6})?$'
          description: >-
            The new brand colour as #rrggbb, or empty to return to the default palette. A value the console corrects for
            contrast is accepted: it picks the accent and the button's ink, not the site owner.
        reason:
          $ref: '#/components/schemas/Reason'
    SystemSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        settings:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 100
            registration:
              type: string
              enum:
              - invite
              - closed
          required:
          - name
        reason:
          $ref: '#/components/schemas/Reason'
      required:
      - settings
      - reason
    PaymentSettings:
      type: object
      additionalProperties: false
      properties:
        open:
          type: boolean
        credits_min:
          $ref: '#/components/schemas/Money'
        credits_max:
          $ref: '#/components/schemas/Money'
        top_up_buffer_ppm:
          type: integer
          minimum: 0
          maximum: 100000
          description: >-
            The buffer on a top-up in millionths: the site's own value, or the default 2% (20000) when it set none. A
            node of the previous release does not return it.
    PaymentSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        settings:
          type: object
          additionalProperties: false
          properties:
            open:
              type: boolean
            credits_min:
              $ref: '#/components/schemas/Money'
            credits_max:
              $ref: '#/components/schemas/Money'
            top_up_buffer_ppm:
              type: integer
              minimum: 0
              maximum: 100000
              description: "The buffer in millionths, 0 to 10%. Omit to keep the current one."
          required:
          - open
        reason:
          $ref: '#/components/schemas/Reason'
      required:
      - settings
      - reason
    MailSettings:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
        host: *admin_schema_id001
        port:
          type: integer
        username: *admin_schema_id001
        from: *admin_schema_id001
        has_password:
          type: boolean
        restart_required:
          type: boolean
        source:
          type: string
          enum:
          - environment
          - database
    MailSettingsUpdate:
      type: object
      additionalProperties: false
      properties:
        settings:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            host:
              type: string
              maxLength: 253
            port:
              type: integer
              minimum: 1
              maximum: 65535
              default: 587
            username:
              type: string
              maxLength: 254
            from:
              type: string
              maxLength: 998
            password:
              type: string
              maxLength: 4096
              writeOnly: true
          required:
          - enabled
        reason:
          $ref: '#/components/schemas/Reason'
      required:
      - settings
      - reason
    ConfigTestResult:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          x-enum-varnames: [ConfigAccepted, ConfigRejected, ConfigFailed, ConfigDisabled, ConfigUnsupported]
          enum:
          - accepted
          - rejected
          - failed
          - disabled
          - unsupported
    MailConfigTest:
      type: object
      additionalProperties: false
      properties:
        to:
          type: string
          minLength: 3
          maxLength: 254
        reason:
          $ref: '#/components/schemas/Reason'
      required:
      - to
      - reason
    RateLimitView:
      type: object
      properties:
        requests: {type: integer, nullable: true, minimum: 0, maximum: 1000000000}
        effective_requests: {type: integer, minimum: 0, maximum: 1000000000}

    AnnouncementId: {type: string, pattern: '^ann_[0-9a-hjkmnp-tv-z]{26}$', description: "A site announcement's ID (TypeID)."}
    Announcement:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/AnnouncementId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 20000}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    AnnouncementRequest:
      type: object
      additionalProperties: false
      required: [site_id, title, body, starts_at, ends_at, reason]
      properties:
        site_id: {$ref: "#/components/schemas/SiteId"}
        title: {type: string, minLength: 1, maxLength: 200}
        body: {type: string, minLength: 1, maxLength: 20000}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        reason: {type: string, minLength: 1, maxLength: 1000}
    AnnouncementResult:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/AnnouncementId"}
    OrderId: {type: string, pattern: '^ord_[0-9a-hjkmnp-tv-z]{26}$', description: "A top-up order's ID (TypeID), also the order number the payment channel sees."}
    PayAmount:
      type: object
      required: [amount, currency]
      description: >-
        An amount in the currency a method is paid in, which is not always the site's. `amount` is a non-negative integer
        in decimal text, in the currency's minor units (cents for USD, fen for CNY, none for JPY).
      properties:
        amount: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$', example: "7300"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: CNY}
    RefundId: {type: string, pattern: '^rfd_[0-9a-hjkmnp-tv-z]{26}$', description: "A refund's ID (TypeID), the refund number of channels that take one."}
    PaymentOrderState:
      type: string
      enum: [pending, paid, expired, cancelled, failed, review, partially_refunded, refunded, charged_back]
      description: >-
        The order's state. `pending` waits for payment; `paid` is credited; `expired` and `cancelled` can still be
        credited if a payment arrives in time; `failed` was refused by the channel; `review` waits for a person; the
        rest follow refunds and chargebacks (docs/domains/payments.md「订单」).
    PaymentRefundState:
      type: string
      enum: [frozen, sending, pending, succeeded, failed]
      description: >-
        The refund's internal state. `frozen` holds the credits and waits for approval (`approved_by` absent) or for
        sending; `sending` and `pending` are with the channel and their result is not final; `succeeded` returned the
        cash and took the credits; `failed` returned the credits and moved no cash.
    PaymentRefund:
      type: object
      description: A refund as the operator's list and decisions show it. Every field is optional during rolling deployment.
      properties:
        id: {$ref: "#/components/schemas/RefundId"}
        order_id: {$ref: "#/components/schemas/OrderId"}
        account_id: {$ref: "#/components/schemas/AccountId"}
        state: {$ref: "#/components/schemas/PaymentRefundState"}
        via: {type: string, enum: [channel, offline], description: "channel sends the cash back; offline waits for a manual conclusion."}
        credits: {$ref: "#/components/schemas/Money"}
        amount: {$ref: "#/components/schemas/PayAmount"}
        reason: {type: string, description: "Why the user asked for the refund."}
        requested_by: {$ref: "#/components/schemas/UserId"}
        approved_by: {$ref: "#/components/schemas/UserId"}
        provider_ref: {type: string, description: "The channel's own refund number, once it has one."}
        created_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
    PaymentRefundList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentRefund"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    PaymentOrder:
      type: object
      description: >-
        A top-up order as the operator's list shows it, with what was quoted, what the channel actually took and
        credited, and its refunds. Every field is optional during rolling deployment.
      properties:
        id: {$ref: "#/components/schemas/OrderId"}
        account_id: {$ref: "#/components/schemas/AccountId"}
        user_id: {$ref: "#/components/schemas/UserId"}
        merchant_id: {$ref: "#/components/schemas/MerchantId"}
        merchant_name: {type: string, description: "The merchant account's name, the channel the order was paid through."}
        method: {type: string}
        state: {$ref: "#/components/schemas/PaymentOrderState"}
        credits: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/PayAmount"}
        fee: {$ref: "#/components/schemas/PayAmount"}
        credited:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: "The credits actually added, when the payment was credited; it can be less than `credits`."
        paid_total:
          allOf: [{$ref: "#/components/schemas/PayAmount"}]
          description: "What the channel actually took, when the payment was credited."
        paid_fee:
          allOf: [{$ref: "#/components/schemas/PayAmount"}]
          description: "The channel's fee on what it actually took."
        trade_no: {type: string, description: "The channel's own order number."}
        created_at: {type: string, format: date-time}
        paid_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        refund_allowed: {type: boolean}
        refunds:
          type: array
          description: The order's refunds, oldest first.
          items: {$ref: "#/components/schemas/PaymentRefund"}
    PaymentOrderList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentOrder"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    CashMovement:
      type: object
      description: >-
        One cash entry of the ledger: a paid credit or a refund. Every field is optional during rolling deployment.
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string, enum: [credit, refund]}
        at: {type: string, format: date-time, description: "The transaction's time, which is what the dashboard's window counted."}
        account_id: {$ref: "#/components/schemas/AccountId"}
        batch_id: {$ref: "#/components/schemas/Uuid"}
        amount: {$ref: "#/components/schemas/Money"}
        order_id:
          allOf: [{$ref: "#/components/schemas/OrderId"}]
          description: "The order behind an online payment; absent for an offline channel."
        offline_channel: {type: string, description: "Where an offline payment was received; absent for an online order."}
    CashMovementList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/CashMovement"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    Merchant:
      type: object
      description: A merchant account of a payment channel, without its secrets. Every field is optional during rolling deployment.
      properties:
        id: {$ref: "#/components/schemas/MerchantId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        kind: {type: string, description: "The compiled-in channel plugin, such as easypay."}
        name: {type: string}
        enabled: {type: boolean}
        currency: {type: string, pattern: '^[A-Z]{3}$', description: "The currency users pay this account in; the callback carries no currency."}
        ttl_seconds: {type: integer, description: "How long an order of this account stays payable."}
        refund_enabled: {type: boolean, description: "Whether refunds of its orders may be sent automatically."}
        user_refund: {type: boolean, description: "Whether users may ask for a refund against this account."}
        sort: {type: integer, description: "Tie-break order among the site's accounts: lower first."}
        rev: {type: integer, format: int64, description: "The revision a change must be decided against."}
        settings:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
          description: "The plugin's non-secret configuration, canonical JSON."
        methods:
          type: array
          items: {$ref: "#/components/schemas/MerchantMethod"}
    MerchantMethod:
      type: object
      description: One payment method a merchant account offers. Every field is optional during rolling deployment.
      properties:
        method: {type: string, description: "The site's method code, such as alipay or usdt.tron."}
        upstream: {type: string, description: "The gateway's own code for the method."}
        fee_ppm: {type: integer, description: "The channel's proportional fee in millionths; 30000 is 3%."}
        fee_fixed: {$ref: "#/components/schemas/Money"}
        single_min: {$ref: "#/components/schemas/Money"}
        single_max: {$ref: "#/components/schemas/Money"}
        daily_limit: {$ref: "#/components/schemas/Money"}
        enabled: {type: boolean}
    MerchantList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Merchant"}
    MerchantCreate:
      type: object
      additionalProperties: false
      required: [site_id, merchant, reason]
      properties:
        site_id: {$ref: "#/components/schemas/SiteId"}
        merchant: {$ref: "#/components/schemas/MerchantInput"}
        reason: {$ref: "#/components/schemas/Reason"}
    MerchantUpdate:
      type: object
      additionalProperties: false
      required: [merchant, reason]
      properties:
        merchant: {$ref: "#/components/schemas/MerchantInput"}
        reason: {$ref: "#/components/schemas/Reason"}
    MerchantInput:
      type: object
      additionalProperties: false
      required: [kind, name, enabled, currency, ttl_seconds, refund_enabled, user_refund, sort, settings, methods]
      properties:
        rev:
          type: integer
          format: int64
          minimum: 1
          description: "The revision the change was decided against; required when updating, ignored when creating."
        kind: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        enabled: {type: boolean}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        ttl_seconds: {type: integer, minimum: 60, maximum: 86400}
        refund_enabled: {type: boolean}
        user_refund: {type: boolean}
        sort: {type: integer, minimum: 0, maximum: 2147483647}
        settings:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
          description: "The plugin's non-secret configuration as a JSON object; the plugin validates its members strictly."
        secrets:
          type: object
          writeOnly: true
          description: >-
            The channel's secrets, such as key, sealed on arrival and never returned. Required when creating; omit on
            update to keep the sealed ones.
          additionalProperties: {type: string, maxLength: 4096}
        methods:
          type: array
          minItems: 1
          maxItems: 32
          items: {$ref: "#/components/schemas/MerchantMethodInput"}
    MerchantMethodInput:
      type: object
      additionalProperties: false
      required: [method, upstream, fee_ppm, fee_fixed, enabled]
      properties:
        method: {type: string, pattern: '^[a-z][a-z0-9_.]{0,31}$'}
        upstream: {type: string, minLength: 1, maxLength: 64}
        fee_ppm: {type: integer, minimum: 0, maximum: 500000}
        fee_fixed: {$ref: "#/components/schemas/Money"}
        single_min: {$ref: "#/components/schemas/Money"}
        single_max: {$ref: "#/components/schemas/Money"}
        daily_limit: {$ref: "#/components/schemas/Money"}
        enabled: {type: boolean}
    MerchantId: {type: string, pattern: '^mch_[0-9a-hjkmnp-tv-z]{26}$', description: "A merchant account's ID (TypeID)."}
    PaymentDiscrepancy:
      type: object
      description: "All fields optional during rolling deployment. Resolved records contain an investigation note, not a financial resolution."
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        account_id: {$ref: "#/components/schemas/AccountId"}
        order_id: {$ref: "#/components/schemas/OrderId"}
        merchant_id: {$ref: "#/components/schemas/MerchantId"}
        kind: {type: string}
        state: {type: string, enum: [open, resolved]}
        detail: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        investigated_by: {type: string}
        investigated_at: {type: string, format: date-time}
        note: {type: string}
    PaymentDiscrepancyList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentDiscrepancy"}
    AlertConfiguration:
      type: object
      properties:
        rev: {type: integer, format: int64, minimum: 1}
        rules: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/AlertRule"}}
        channels: {type: array, maxItems: 32, items: {$ref: "#/components/schemas/AlertChannel"}}
        spend_detection: {$ref: "#/components/schemas/SpendDetection"}
    SpendDetection:
      type: object
      description: "Offline account spend-anomaly thresholds. The object is optional so an older node's configuration replacement leaves the saved thresholds unchanged."
      required: [enabled, window_seconds, baseline_seconds, min_spend_nano, spend_ratio, min_new_region_calls, min_new_model_calls]
      additionalProperties: false
      properties:
        enabled: {type: boolean}
        notify_users: {type: boolean, default: false, description: "Create the account's user reminder for a detected anomaly. Leave off until every node can dispatch the spend_anomaly notice kind: an older dispatcher would mark it sent without sending it. Detection and alert channels do not depend on it."}
        window_seconds: {type: integer, minimum: 900, maximum: 86400, description: "Recent window compared with the baseline. The detector runs every 10 minutes, so the window is at least 15 minutes and consecutive windows overlap."}
        baseline_seconds: {type: integer, minimum: 900, maximum: 604800, description: "The account's own history immediately before the recent window; at least window_seconds."}
        min_spend_nano: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000000, description: "Absolute floor for a spend spike, in billionths of a credit."}
        spend_ratio: {type: number, format: double, minimum: 1, maximum: 1000, description: "Recent spend divided by the baseline's expected spend for the same window."}
        min_new_region_calls: {type: integer, minimum: 1, maximum: 1000000}
        min_new_model_calls: {type: integer, minimum: 1, maximum: 1000000}
    Retention:
      type: object
      description: "The call log's hot window. Every field is optional so an older node's response is read as the parts it has."
      additionalProperties: false
      properties:
        hot_days: {type: integer, minimum: 0, maximum: 3650, description: "Whole months older than this leave PostgreSQL for the object store. 0 keeps every partition."}
    RetentionRequest:
      type: object
      required: [hot_days, reason]
      additionalProperties: false
      properties:
        hot_days: {type: integer, minimum: 0, maximum: 3650}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertRule:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        kind: {type: string, minLength: 1, maxLength: 128}
        minimum_severity: {type: string, enum: [info, warning, critical], x-enum-varnames: [AlertInfo, AlertWarning, AlertCritical]}
        threshold: {type: number, minimum: 0, default: 1}
        duration_seconds: {type: integer, minimum: 0, maximum: 86400, default: 0}
        channel: {type: string, maxLength: 64, description: "Empty disables notification for this rule."}
        quiet_start: {type: integer, minimum: 0, maximum: 1439, default: 0}
        quiet_end: {type: integer, minimum: 0, maximum: 1439, default: 0}
        repeat_seconds: {type: integer, minimum: 0, maximum: 604800, default: 0}
    AlertChannel:
      type: object
      properties:
        id: {type: string, minLength: 1, maxLength: 64}
        email: {type: string, format: email, maxLength: 254}
        webhook_url: {type: string, format: uri, maxLength: 2048, description: "HTTPS destination, exclusive with email. Configure only after all nodes support webhooks; set its signing secret before use."}
    AlertWebhookSecretRequest:
      type: object
      required: [rev, secret, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 1}
        secret: {type: string, minLength: 1, maxLength: 512, writeOnly: true, description: "32 to 512 UTF-8 bytes shared with the receiver. Rotation retains the old key for one hour; another rotation during that hour returns conflict."}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertConfigurationRequest:
      type: object
      required: [rev, rules, channels, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 1}
        rules: {type: array, maxItems: 32, items: {allOf: [{$ref: "#/components/schemas/AlertRule"}], required: [id, kind, minimum_severity, threshold, duration_seconds, channel, quiet_start, quiet_end, repeat_seconds]}}
        channels: {type: array, maxItems: 32, items: {allOf: [{$ref: "#/components/schemas/AlertChannel"}], required: [id]}}
        spend_detection: {$ref: "#/components/schemas/SpendDetection"}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertTestRequest:
      type: object
      required: [channel, reason]
      properties:
        channel: {type: string, minLength: 1, maxLength: 64}
        reason: {$ref: "#/components/schemas/Reason"}
    AlertTestResult:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
    AlertEventList:
      type: object
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AlertEvent"}}
    AlertEvent:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string}
        key: {type: string}
        severity: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        occurrences: {type: integer, format: int64}
        state: {type: string, enum: [firing, delivered, resolved], x-enum-varnames: [AlertFiring, AlertDelivered, AlertResolved]}
        fired_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
        receipts: {type: array, items: {$ref: "#/components/schemas/AlertReceipt"}}
    AlertReceipt:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        rule_id: {type: string}
        sequence: {type: integer, description: "0 is the first notification; -1 is recovery; positive values are repeats."}
        state: {type: string, enum: [pending, queued, delivered, failed], x-enum-varnames: [AlertPendingReceipt, AlertQueuedReceipt, AlertDeliveredReceipt, AlertFailedReceipt]}
        at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
    ExchangeRateInput:
      type: object
      additionalProperties: false
      required: [base, quote, numerator, denominator, expected_version, kind, reason]
      properties:
        base: {type: string, maxLength: 3}
        quote: {type: string, maxLength: 3}
        numerator: {type: string, maxLength: 19, description: Positive integer at most 10^18}
        denominator: {type: string, maxLength: 19, description: Positive integer at most 10^18}
        expected_version: {type: integer, format: int64}
        kind: {type: string}
        reason: {type: string, maxLength: 1000}
    ExchangeRate:
      type: object
      additionalProperties: false
      required: [id, base, quote, numerator, denominator, version, source, kind, reason, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        base: {type: string}
        quote: {type: string}
        numerator: {type: string}
        denominator: {type: string}
        version: {type: integer, format: int64}
        source: {type: string}
        kind: {type: string}
        reason: {type: string}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
    ExchangeRateList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ExchangeRate"}
    Error:
      type: object
      required: [error]
      description: >-
        The body of every failure. The request ID is in the `X-Request-ID` response header, as on every response.
      properties:
        error: {$ref: "#/components/schemas/ErrorDetail"}
    ErrorDetail:
      type: object
      required: [code, message]
      description: >-
        `code` is what a client branches on and translates; `message` is English text for logs and developers.
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        fields:
          type: array
          description: Which parts of the request broke a constraint, for `invalid_request`.
          items: {$ref: "#/components/schemas/ErrorField"}
    ErrorField:
      type: object
      required: [pointer, message]
      properties:
        pointer: {type: string, description: "JSON pointer into the request body, or the name of a query or path parameter."}
        message: {type: string}
    ErrorCode:
      type: string
      description: >-
        The closed list of failure codes. A code is added in a contract change, so a client that translates every code
        fails to compile until it knows the new one.
      enum:
        - invalid_request
        - unauthenticated
        - invalid_credentials
        - invalid_code
        - forbidden
        - mfa_required
        - consent_required
        - origin_rejected
        - not_found
        - conflict
        - login_domain_locked
        - login_domain_required
        - identity_taken
        - identity_already_linked
        - account_not_linked
        - email_taken
        - name_taken
        - too_many_keys
        - stale_revision
        - idempotency_key_reused
        - invalid_invite
        - registration_closed
        - human_check_failed
        - email_domain_not_allowed
        - invalid_verification
        - weak_password
        - not_ready
        - unprocessable
        - redeem_code_invalid
        - redeem_code_expired
        - redeem_code_disabled
        - redeem_code_used
        - rate_limited
        - internal
        - not_implemented
        - unavailable
    OperationsOverview:
      type: object
      additionalProperties: false
      properties:
        site_id:
          $ref: '#/components/schemas/SiteId'
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
        revenue:
          $ref: '#/components/schemas/Money'
        cost:
          $ref: '#/components/schemas/Money'
        unknown_cost_calls: {type: integer, format: int64}
        cash:
          type: array
          items:
            $ref: '#/components/schemas/CashAmount'
        top_accounts:
          type: array
          items:
            $ref: '#/components/schemas/OverviewAccount'
        top_models:
          type: array
          items:
            $ref: '#/components/schemas/OverviewModel'
    OverviewAccount:
      type: object
      additionalProperties: false
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
    OverviewModel:
      type: object
      additionalProperties: false
      properties:
        model: {type: string}
        calls: {type: integer, format: int64}
        errors: {type: integer, format: int64}
    CashAmount:
      type: object
      required: [amount, currency]
      description: >-
        An exact cash amount in one payment currency. `amount` is a signed integer in decimal text, in billionths of one
        unit of the currency; `currency` is the currency the payment was made in, which is the site's when they are the
        same (docs/domains/billing.md「钱的表示」). It is text so a JSON number cannot round it, and a report's sum can
        be wider than 64 bits.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]*)$', maxLength: 39, example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    Money:
      type: object
      required: [amount, currency]
      description: >-
        An exact amount of a site's accounting currency. `amount` is a signed integer in decimal text, in billionths of
        one unit of the currency (docs/domains/billing.md「钱的表示」). It is text because a JSON number would round
        above 2^53 (about 9 million units) in the browser. A report sums many stored amounts, so it can be wider than
        64 bits; an amount that is written to the ledger must still fit 64 bits.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]*)$', maxLength: 39, example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: >-
            The program's version line exactly as `axiom version` prints it: the main module's version, which the Go
            toolchain stamps from version control (such as a pseudo-version with the commit time and hash, +dirty for
            uncommitted changes). The console is stamped with the same line and only compares the two whole for
            equality.
          example: axiom v0.0.0-20261014044725-4daa4538fcac
    UserId: {type: string, pattern: '^user_[0-9a-hjkmnp-tv-z]{26}$', description: "A user's ID (TypeID)."}
    AccountId: {type: string, pattern: '^acct_[0-9a-hjkmnp-tv-z]{26}$', description: "An account's ID (TypeID)."}
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 256}
    SessionGrant:
      type: object
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_required]
          description: >-
            `mfa_required`: the password was right and the user has two-step verification, so the cookie is a pending
            session that only `verifyMfa` accepts, for 5 minutes.
        csrf_token: {type: string, description: "Sent as X-CSRF-Token on the requests that change data."}
    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            A TOTP code (6 digits) or a recovery code (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server
            tells them apart by shape.
    SessionLevel:
      type: string
      enum: [pending_mfa, password, mfa]
      description: >-
        What the session has proved: only the password, or two-step verification too (`mfa`). `pending_mfa` is a
        sign-in that waits for its second factor.
    Session:
      type: object
      required: [user, account, level, mfa_enabled, csrf_token, expires_at, permissions]
      properties:
        user:
          type: object
          required: [id, email, invite_code]
          properties:
            id: {$ref: "#/components/schemas/UserId"}
            email: {type: string}
            invite_code: {type: string, description: "The user's own invite code, which a new user registers with."}
        account: {$ref: "#/components/schemas/AccountId"}
        level: {$ref: "#/components/schemas/SessionLevel"}
        mfa_enabled: {type: boolean, description: "Whether the user has a TOTP factor."}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time, description: "When the session ends if it is not used again; the idle timeout moves it."}
        permissions:
          type: array
          description: >-
            The permission names the session holds on its own scope (the user's account on the console, the platform
            on the admin), for showing or hiding what the user cannot do. The server decides again on every request.
          items: {type: string}
        consent:
          allOf: [{$ref: "#/components/schemas/SessionConsent"}]
          description: >-
            What the page must show before the session may do anything else. Optional so a page built before this field
            reads an older node that does not send it.
    SessionConsent:
      type: object
      description: >-
        The legal documents the signed-in user has not accepted. A page built before this field shows nothing and the
        server refuses its requests with `consent_required` instead.
      required: [required]
      properties:
        required:
          type: array
          description: Current documents this user has not accepted; empty when every one is accepted.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    LegalDocumentVersion:
      type: object
      required: [kind, version]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        version: {type: integer, minimum: 1}
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: {type: string, description: "The new TOTP secret in base32. Nothing is stored yet; confirmTotp sends it back."}
        uri: {type: string, description: "The otpauth:// URI for a QR code."}
    TotpConfirmRequest:
      type: object
      required: [secret, password, code]
      properties:
        secret: {type: string, maxLength: 128}
        password: {type: string, maxLength: 256, description: "The user's password, asked again."}
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    RecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', description: "A current TOTP code."}
    FactorChange:
      type: object
      required: [csrf_token, recovery_codes]
      description: >-
        A changed factor ends every other session of the user and every unused recovery code, and issues this device a
        new `mfa` session: the cookie of the response replaces the old one.
      properties:
        csrf_token: {type: string}
        recovery_codes:
          type: array
          description: "10 one-time codes, each written xxxx-xxxx-xxxx-xxxx. They are shown only here."
          items: {type: string}
    Balance:
      type: object
      required: [balance, reserved, floor, available, spent_this_month]
      description: >-
        An account's money in its site's accounting currency. `available` is `balance - reserved`; a call is admitted
        while `available - floor` covers its reservation, and `floor` is at most 0. `spent_this_month` is what calls
        settled for the current UTC calendar month.
      properties:
        balance: {$ref: "#/components/schemas/Money"}
        reserved: {$ref: "#/components/schemas/Money"}
        floor: {$ref: "#/components/schemas/Money"}
        available: {$ref: "#/components/schemas/Money"}
        spent_this_month: {$ref: "#/components/schemas/Money"}
        batches:
          type: array
          description: >-
            The credit batches that still hold something, oldest credit first, with what is left in each and when it
            stops counting. An account with nothing is an empty array. Read in the same snapshot as the balance:
            absent on a node of the previous release, when the allocation could not be brought up to date in bounded
            time, or when a transaction committed after the last replay. The page then shows this part as unavailable
            rather than a number from a different moment.
          items: {$ref: "#/components/schemas/CreditBatch"}
    CreditBatch:
      type: object
      required: [id, source, amount, remaining, frozen, created_at]
      description: >-
        Credit added in one grant or payment, what is left of it, and how much of that is frozen for refunds. Spending
        takes the earliest expiry first and a batch without `expires_at` last, so `remaining` is what is still in this
        batch, not what the next charge will take.
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The batch's own identity; paid credit uses the order's ID as the batch ID.
        source:
          type: string
          enum: [gift, paid, redeem]
          x-enum-varnames: [CreditBatchGift, CreditBatchPaid, CreditBatchRedeem]
          description: "`gift`: credit given by an operator; `paid`: credit bought through a payment; `redeem`: credit a redeem code gave."
        amount: {$ref: "#/components/schemas/Money"}
        remaining: {$ref: "#/components/schemas/Money"}
        frozen: {$ref: "#/components/schemas/Money"}
        created_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: "When what is left of the batch stops counting. Absent when it never expires."
    Uuid:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: An ID of a supplier, group, model, price row or rule, in the usual lower-case UUID text.
    AdminSite:
      type: object
      required: [name]
      properties:
        name: {type: string}
        logo_url:
          type: string
          description: >-
            Path on this admin host to the site's logo; absent when there is none. A node of the release before this
            field leaves it out, and the app falls back to the name.
    SiteId: {type: string, pattern: '^site_[0-9a-hjkmnp-tv-z]{26}$', description: "A site's ID (TypeID)."}
    TierId: {type: string, pattern: '^tier_[0-9a-hjkmnp-tv-z]{26}$', description: "A tier's ID (TypeID)."}
    Decimal:
      type: string
      pattern: '^-?(0|[1-9][0-9]{0,17})(\.[0-9]{1,15})?$'
      description: An exact decimal number in text, never a JSON number, so no digit is lost on the way.
    UnitPrice:
      type: string
      pattern: '^(0|[1-9][0-9]{0,2})(\.[0-9]{1,15})?$|^1000$'
      description: >-
        A price per billing unit (one token, or one use) in the currency of its schedule, as exact decimal text with at
        most 15 decimals and at most 1000 per unit.
    Reason:
      type: string
      minLength: 1
      maxLength: 1000
      description: Why the person is doing this. It goes to the audit log.
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {$ref: "#/components/schemas/Reason"}
    TierRef:
      type: object
      required: [id, name]
      properties:
        id: {$ref: "#/components/schemas/TierId"}
        name: {type: string}
    TierList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/TierRef"}
    OAuthProvider:
      type: string
      enum: [github, google, linuxdo]
      description: "A third-party sign-in provider."
    SiteOAuthProvider:
      type: object
      additionalProperties: false
      required: [provider, configured]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
        client_id: {type: string, description: "Absent until the application is stored."}
        configured: {type: boolean}
    SiteSignIn:
      type: object
      additionalProperties: false
      required: [passkeys, providers]
      properties:
        login_domain: {type: string, description: "Absent when no login domain is set."}
        passkeys: {type: boolean}
        providers:
          type: array
          items: {$ref: "#/components/schemas/SiteOAuthProvider"}
    SiteSignInUpdate:
      type: object
      additionalProperties: false
      required: [passkeys, reason]
      properties:
        login_domain: {type: string, maxLength: 253, description: "One of the site's enabled console domains; empty clears it."}
        passkeys: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    SiteOAuthProviderUpdate:
      type: object
      additionalProperties: false
      required: [client_id, client_secret, reason]
      properties:
        client_id: {type: string, minLength: 1, maxLength: 200}
        client_secret: {type: string, minLength: 1, maxLength: 500, description: "Sealed at rest; never returned."}
        reason: {type: string, minLength: 1, maxLength: 500}
    SiteSettings:
      type: object
      description: >-
        A site's own values for the sessions and keys its users get. A value that is absent is the default in code.
        Bounds: session times from 300 seconds; the console's idle time to 30 days and its longest session to 90 days;
        the admin's idle time to 12 hours and its longest session to 1 day; the daily limit of a new key from 0 to
        1,000,000 units.
      properties:
        console_idle_timeout_seconds: {type: integer, minimum: 300, maximum: 2592000}
        console_max_age_seconds: {type: integer, minimum: 300, maximum: 7776000}
        admin_idle_timeout_seconds: {type: integer, minimum: 300, maximum: 43200}
        admin_max_age_seconds: {type: integer, minimum: 300, maximum: 86400}
        new_key_daily_limit: {$ref: "#/components/schemas/Money"}
    SiteLogoView:
      type: object
      properties:
        logo:
          allOf: [{$ref: "#/components/schemas/SiteLogo"}]
          description: The logo in force; absent when the site has none.
    SiteLogo:
      type: object
      required: [content_type, hash, size, width, height]
      properties:
        content_type: {type: string, enum: [image/svg+xml, image/png, image/webp]}
        hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 of the bytes served, which the logo's public URL carries.
        size: {type: integer, minimum: 1, maximum: 262144, description: "Bytes served."}
        width: {type: integer, minimum: 0, maximum: 1024, description: "Pixels; 0 for an SVG with no intrinsic size."}
        height: {type: integer, minimum: 0, maximum: 1024}
        data_url:
          type: string
          description: >-
            The bytes as a data URL, for the settings page's preview only; the change response leaves it out. Absent on
            a node of the release before this field.
    SiteLogoUpdate:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 1, maxLength: 500}
        logo:
          allOf: [{$ref: "#/components/schemas/SiteLogoUpload"}]
          description: The new logo; left out clears the site's logo.
    SiteLogoUpload:
      type: object
      required: [content_type, data_base64]
      properties:
        content_type: {type: string, enum: [image/svg+xml, image/png, image/webp]}
        data_base64:
          type: string
          format: byte
          minLength: 1
          maxLength: 349528
          description: The file, at most 256 KiB before base64.
    LegalDocumentKind:
      type: string
      enum: [terms, privacy]
    LegalDocument:
      type: object
      description: One version of one of the site's legal documents; the text is plain text, never HTML.
      required: [kind, version, body, published_at]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        version: {type: integer, minimum: 1}
        body: {type: string}
        published_at: {type: string, format: date-time}
    LegalDocumentHistory:
      type: object
      required: [documents, next_cursor]
      properties:
        documents:
          type: array
          description: Newest first within a kind, at most `limit` rows.
          items: {$ref: "#/components/schemas/LegalDocument"}
        next_cursor:
          type: string
          nullable: true
          description: Where the next page starts, or null on the last page.

    LegalDocumentPublish:
      type: object
      required: [kind, body, reason]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        body: {type: string, minLength: 1, maxLength: 65536}
        reason: {$ref: "#/components/schemas/Reason"}
    SiteSettingsView:
      type: object
      required: [settings, defaults]
      properties:
        settings: {$ref: "#/components/schemas/SiteSettings"}
        defaults:
          description: What applies where `settings` has no value.
          allOf: [{$ref: "#/components/schemas/SiteSettings"}]
    SiteSettingsUpdate:
      type: object
      required: [settings, reason]
      properties:
        settings: {$ref: "#/components/schemas/SiteSettings"}
        reason: {$ref: "#/components/schemas/Reason"}
    LoginLimits:
      type: object
      description: Site overrides. Absence selects code defaults. Refills use the existing IP, email and user windows.
      properties:
        ip_attempt_burst: {type: integer, minimum: 1, maximum: 10000}
        ip_attempts_per_minute: {type: integer, minimum: 1, maximum: 10000}
        email_sign_in_failures: {type: integer, minimum: 1, maximum: 1000}
        user_code_failures: {type: integer, minimum: 1, maximum: 1000}
        challenge_code_attempts: {type: integer, minimum: 1, maximum: 100}
    LoginLimitsView:
      type: object
      properties:
        limits: {$ref: "#/components/schemas/LoginLimits"}
        defaults: {$ref: "#/components/schemas/LoginLimits"}
    LoginLimitsUpdate:
      type: object
      required: [limits, reason]
      properties:
        limits: {$ref: "#/components/schemas/LoginLimits"}
        reason: {$ref: "#/components/schemas/Reason"}
    RegistrationPolicy:
      type: object
      required: [mode, human_check, human_check_bits, domain_burst, domain_per_hour, domain_allow, domain_deny]
      description: >-
        Open registration: `mode` is the site's registration mode; the proof of work the page solves; the domains
        allowed and denied (an entry covers its subdomains, the deny list wins, and an empty allow list takes every
        domain the syntax allows); and the per-domain burst and hourly limits.
      properties:
        mode: {type: string, enum: [invite, closed, open]}
        human_check: {type: boolean}
        human_check_bits: {type: integer, minimum: 12, maximum: 24}
        domain_burst: {type: integer, minimum: 1, maximum: 10000}
        domain_per_hour: {type: integer, minimum: 1, maximum: 100000}
        domain_allow:
          type: array
          maxItems: 100
          items: {type: string, minLength: 3, maxLength: 253, pattern: '^[A-Za-z0-9. -]+$'}
        domain_deny:
          type: array
          maxItems: 100
          items: {type: string, minLength: 3, maxLength: 253, pattern: '^[A-Za-z0-9. -]+$'}
    RegistrationPolicyView:
      type: object
      required: [policy, defaults]
      properties:
        policy: {$ref: "#/components/schemas/RegistrationPolicy"}
        defaults:
          description: What applies where the site sets no value.
          allOf: [{$ref: "#/components/schemas/RegistrationPolicy"}]
    RegistrationPolicyUpdate:
      type: object
      required: [policy, reason]
      properties:
        policy: {$ref: "#/components/schemas/RegistrationPolicy"}
        reason: {$ref: "#/components/schemas/Reason"}
    AccountSuspension:
      type: object
      required: [suspended, reason]
      properties:
        suspended: {type: boolean}
        reason: {$ref: "#/components/schemas/Reason"}
    AccountTierChange:
      type: object
      required: [tier_id, reason]
      properties:
        tier_id: {$ref: "#/components/schemas/TierId"}
        reason: {$ref: "#/components/schemas/Reason"}
    UserSignIn:
      type: object
      required: [disabled, reason]
      properties:
        disabled: {type: boolean}
        reason: {$ref: "#/components/schemas/Reason"}
    PlatformGrantChange:
      type: object
      required: [revoked, reason]
      properties:
        revoked: {type: boolean}
        reason: {$ref: "#/components/schemas/Reason"}
    PlatformGrant:
      type: object
      properties:
        role: {type: string}
        revoked: {type: boolean}
    PlatformGrantList:
      type: object
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PlatformGrant"}
    KeyLimits:
      type: object
      description: >-
        Limits on the call keys of an account: how many it may hold that are not deleted (`max_keys`), and how many it
        may make in an hour, deleted ones too (`creations_per_hour`). A limit that is absent is not set, and the level
        above applies: the site's for an account, the default in code for a site. Each is from 1 to 10,000.
      properties:
        max_keys: {type: integer, minimum: 1, maximum: 10000}
        creations_per_hour: {type: integer, minimum: 1, maximum: 10000}
    EffectiveKeyLimits:
      type: object
      required: [max_keys, creations_per_hour]
      properties:
        max_keys: {type: integer, minimum: 1, maximum: 10000}
        creations_per_hour: {type: integer, minimum: 1, maximum: 10000}
    KeyLimitsView:
      type: object
      required: [limits, effective]
      properties:
        limits:
          description: The limits set at this level.
          allOf: [{$ref: "#/components/schemas/KeyLimits"}]
        effective:
          description: What applies here, `limits` over the level above.
          allOf: [{$ref: "#/components/schemas/EffectiveKeyLimits"}]
    KeyLimitsUpdate:
      type: object
      required: [limits, reason]
      properties:
        limits: {$ref: "#/components/schemas/KeyLimits"}
        reason: {$ref: "#/components/schemas/Reason"}
    UserSummary:
      type: object
      required: [id, account_id, site_id, email, status, tier, mfa_enabled, created_at]
      properties:
        id: {$ref: "#/components/schemas/UserId"}
        account_id: {$ref: "#/components/schemas/AccountId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        email: {type: string}
        status: {type: string, enum: [active, disabled]}
        tier: {$ref: "#/components/schemas/TierRef"}
        mfa_enabled: {type: boolean}
        sign_in_disabled: {type: boolean}
        created_at: {type: string, format: date-time}
    UserList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/UserSummary"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    AccountDetail:
      type: object
      required: [id, site_id, name, kind, status, tier, owner, balance, key_limits, created_at]
      properties:
        calls_suspended: {type: boolean}
        sign_in_disabled:
          type: boolean
          description: >-
            Whether the owner cannot sign in. Absent on a node of the previous release, whose page then shows the
            sign-in part as unavailable.
        id: {$ref: "#/components/schemas/AccountId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        name: {type: string}
        kind: {type: string, enum: [personal, organization]}
        status: {type: string, enum: [active, disabled]}
        tier: {$ref: "#/components/schemas/TierRef"}
        owner:
          type: object
          required: [id, email]
          properties:
            id: {$ref: "#/components/schemas/UserId"}
            email: {type: string}
        balance: {$ref: "#/components/schemas/Balance"}
        key_limits: {$ref: "#/components/schemas/KeyLimitsView"}
        created_at: {type: string, format: date-time}
    CreditGrantRequest:
      type: object
      required: [reason]
      properties:
        source: {$ref: "#/components/schemas/CreditSource"}
        amount: {$ref: "#/components/schemas/Money"}
        payment: {$ref: "#/components/schemas/OfflinePayment"}
        expires_at: {type: string, format: date-time, description: "UTC, in the future. Absent: the credit does not expire."}
        reason: {$ref: "#/components/schemas/Reason"}
      description: "A gift needs `amount`, in the site's currency; an offline payment needs `payment` instead."
    CreditSource:
      type: string
      enum: [gift, offline_payment]
      description: "Where the credit comes from. Absent in a request: gift."
    OfflinePayment:
      type: object
      required: [amount, channel]
      description: >-
        Money received outside the payment channels. `amount` is what was paid, in its own currency, one an exchange
        rate can be kept for, and in whole minor units of it.
      properties:
        amount: {$ref: "#/components/schemas/Money"}
        channel: {type: string, minLength: 1, maxLength: 200, description: "Where it was received, such as a bank account."}
    RedeemCodeId: {type: string, pattern: '^rdm_[0-9a-hjkmnp-tv-z]{26}$', description: "A redeem code's ID (TypeID)."}
    RedeemCodeState:
      type: string
      enum: [enabled, used, disabled, expired]
      description: >-
        A code's state as a page shows it: `expired` is an enabled code past its expiry, the stored state stays enabled.
    RedeemCodeBatchRequest:
      type: object
      additionalProperties: false
      required: [site_id, amount, count, reason]
      properties:
        site_id: {$ref: "#/components/schemas/SiteId"}
        amount: {$ref: "#/components/schemas/Money"}
        count: {type: integer, minimum: 1, maximum: 100, description: "How many codes the batch makes."}
        note: {type: string, maxLength: 200, description: "What the batch is for, shown beside each code. Absent: none."}
        expires_at: {type: string, format: date-time, description: "UTC, in the future. Absent: the codes never expire."}
        reason: {$ref: "#/components/schemas/Reason"}
      description: "One generation of codes: each worth `amount` of the site's currency, all with the same expiry and note."
    RedeemCode:
      type: object
      additionalProperties: false
      required: [id, state, amount, note, hint, created_at, created_by]
      properties:
        id: {$ref: "#/components/schemas/RedeemCodeId"}
        state: {$ref: "#/components/schemas/RedeemCodeState"}
        amount: {$ref: "#/components/schemas/Money"}
        note: {type: string}
        hint: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}$', description: "The code's last four characters; never the code."}
        code:
          type: string
          description: >-
            The code itself, shown only in the answer that made it, and never in a list or a read. Absent there.
        expires_at: {type: string, format: date-time, description: "Absent: the code never expires."}
        created_at: {type: string, format: date-time}
        created_by: {$ref: "#/components/schemas/UserId"}
        redeemed_at: {type: string, format: date-time, description: "When the code was redeemed; absent if it was not."}
    RedeemCodeList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/RedeemCode"}}
        next_cursor: {type: string, description: "Absent on the last page."}
    CreditGrant:
      type: object
      required: [id, account_id, source, amount, created_at, balance_after]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        account_id: {$ref: "#/components/schemas/AccountId"}
        source: {$ref: "#/components/schemas/CreditSource"}
        amount: {$ref: "#/components/schemas/Money"}
        payment: {$ref: "#/components/schemas/OfflinePayment"}
        exchange_rate: {$ref: "#/components/schemas/ExchangeRate"}
        expires_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        balance_after: {$ref: "#/components/schemas/Balance"}
      description: >-
        `amount` is the credit, in the site's currency. An offline payment has `payment`, and `exchange_rate` when it
        was converted from another currency.
    SupplierStatus:
      type: string
      enum: [connecting, active, low_balance, needs_attention, paused, removing, removed]
      description: >-
        `connecting`: not yet read; `active`: syncing, and routable while its balance is above zero; `low_balance`: syncing,
        balance under the alert line, routable on the same condition; `needs_attention`: polling stopped until a person acts, `status_reason` says why; `paused`: stopped on
        purpose; `removed`: see `removeSupplier`; `removing` is only what a removal of an earlier version left behind, and
        removing again ends it.
    Supplier:
      type: object
      required: [id, name, kind, origin, upstream_account, native_unit, settlement_currency, status]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, pattern: '^[a-z][a-z0-9]*$', description: "The adapter's name, such as newapi or sub2api."}
        origin: {type: string, example: "https://api.example.com"}
        upstream_account: {type: string, description: "The email or username Axiom logs in as."}
        generation: {type: string, description: "The system's generation the adapter detected, such as 1.0."}
        detected_version: {type: string}
        native_unit: {type: string, enum: [quota, usd], description: "The unit the supplier counts its balance in."}
        settlement_currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: "#/components/schemas/SupplierStatus"}
        status_reason: {type: string, minLength: 1, maxLength: 200}
        balance_native: {$ref: "#/components/schemas/Decimal"}
        balance_observed_at: {type: string, format: date-time}
        low_balance_threshold: {$ref: "#/components/schemas/Decimal"}
        unit_value: {$ref: "#/components/schemas/Decimal"}
        unit_value_hint: {$ref: "#/components/schemas/Decimal"}
    SupplierList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Supplier"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    SupplierLogin:
      type: object
      description: >-
        What Axiom logs in with. Which members a kind needs is in `Detection.login_fields`; a member the kind does not
        use is a 400. It is sealed on arrival and never returned. For a site that asks for a CAPTCHA or two-step
        verification, a person signs in there by hand once and gives tokens instead of a password. A kind that can
        renew its login (sub2api) takes `access_token`, `refresh_token` and `access_token_expires_at`, and the
        refresh token keeps the login alive; a kind that cannot (new-api takes a personal access token) takes
        `access_token` and, if the token ends, `access_token_expires_at`. `login_fields` lists what the kind takes.
      properties:
        email: {type: string, maxLength: 254}
        password: {type: string, maxLength: 256}
        access_token: {type: string, maxLength: 4096}
        refresh_token: {type: string, maxLength: 4096, description: "With `access_token`, so Axiom renews the login itself when the access token ends."}
        access_token_expires_at: {type: string, format: date-time}
    LoginField:
      type: string
      enum: [email, password, access_token, refresh_token, access_token_expires_at]
    DetectionRequest:
      type: object
      required: [origin]
      properties:
        origin: {type: string, pattern: '^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$', maxLength: 255}
    Detection:
      type: object
      required: [origin, login_fields]
      properties:
        origin: {type: string, description: "The origin as Axiom will store it, lower case."}
        kind: {type: string, description: "The adapter that fits. Absent when none recognised the site."}
        generation: {type: string}
        detected_version: {type: string}
        login_fields:
          type: array
          description: The members of `SupplierLogin` this kind needs; empty when `kind` is absent.
          items: {$ref: "#/components/schemas/LoginField"}
    SupplierCreate:
      type: object
      required: [name, kind, origin, upstream_account, settlement_currency, login, reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        kind: {type: string, pattern: '^[a-z][a-z0-9]*$'}
        origin: {type: string, pattern: '^https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?$', maxLength: 255}
        upstream_account: {type: string, minLength: 1, maxLength: 254}
        settlement_currency:
          type: string
          pattern: '^[A-Z]{3}$'
          description: >-
            The currency Axiom pays this supplier in, such as CNY or USD. The adapter cannot tell it from the
            supplier's unit, so the person says it; it is fixed, and the unit value is always in it. It must be the
            site's currency or one the manual exchange rates support (USD, CNY, EUR, GBP, JPY, HKD, SGD, AUD, CAD, CHF), else
            422 pointing at this member: a supplier in any other would have no rate to convert its costs with.
        login: {$ref: "#/components/schemas/SupplierLogin"}
        reason: {$ref: "#/components/schemas/Reason"}
    SupplierLoginUpdate:
      type: object
      required: [login, reason]
      properties:
        login: {$ref: "#/components/schemas/SupplierLogin"}
        reason: {$ref: "#/components/schemas/Reason"}
    SupplierStatusUpdate:
      type: object
      required: [status, reason]
      properties:
        status: {type: string, enum: [active, paused]}
        reason: {$ref: "#/components/schemas/Reason"}
    UnitValueUpdate:
      type: object
      required: [value, reason]
      properties:
        value:
          description: >-
            What one unit of the supplier's balance is worth, in the supplier's `settlement_currency` (fixed when it was
            added); greater than 0 and at most 1000.
          allOf: [{$ref: "#/components/schemas/Decimal"}]
        reason: {$ref: "#/components/schemas/Reason"}
    SupplierGroup:
      type: object
      required: [id, upstream_ref, name, ratio, selected, present]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        upstream_ref: {type: string, description: "The supplier's own ID of the group."}
        name: {type: string}
        ratio: {$ref: "#/components/schemas/Decimal"}
        selected: {type: boolean}
        codename: {type: string, description: "What users see in place of the group's name. Set when first selected, never changed."}
        present: {type: boolean, description: "False when the supplier no longer lists the group."}
        facts:
          type: object
          description: What the supplier says about the group (platform, subscription type, peak pricing, long context).
          additionalProperties: true
        pool: {$ref: "#/components/schemas/SupplierPool"}
    SupplierPool:
      type: object
      description: What the management API of a pool last said of the group's accounts. Absent when the supplier is not a pool, or a read has not reported it yet.
      required: [accounts, failed, usable, low, observed_at]
      properties:
        accounts: {type: integer, minimum: 1, description: "The accounts assigned to the group."}
        failed: {type: integer, minimum: 0, description: "How many of them the pool marks failed: they cannot serve."}
        usable: {type: integer, minimum: 0, description: "How many of them the pool may schedule now."}
        headroom:
          type: integer
          minimum: 0
          maximum: 100
          description: "The mean room left in the tighter quota window of the accounts that can serve, in percent. Absent when no account reported a window."
        capacity:
          type: integer
          minimum: 0
          maximum: 100
          description: "The effective capacity this leaves: headroom times the share of accounts that can serve, in percent. Absent when no account reported a window."
        low: {type: boolean, description: "Routing halves the group's weight while this is true."}
        observed_at: {type: string, format: date-time, description: "When these numbers were recorded."}
    GroupSelection:
      type: object
      required: [selected, reason]
      properties:
        selected: {type: boolean}
        reason: {$ref: "#/components/schemas/Reason"}
    SupplierCredential:
      type: object
      required: [id, group_id, upstream_key_ref, status, max_concurrency]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        group_id: {$ref: "#/components/schemas/Uuid"}
        upstream_key_ref: {type: string}
        status:
          type: string
          enum: [binding, active, upstream_disabled, quota_exhausted, expired, disabled, erased]
        cooldown_until: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        max_concurrency: {type: integer, minimum: 1}
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 100000
          description: "The upstream account's rolling-minute RPM ceiling for selecting this credential; absent when Axiom adds no ceiling."
    CredentialLimits:
      type: object
      required: [max_concurrency, reason]
      properties:
        max_concurrency:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: The calls the key has in flight at once. A new binding starts at 4.
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 100000
          nullable: true
          description: "Stop selecting this credential when the shared upstream account's rolling-minute count reaches this; absent or null clears the ceiling. At most 100000."
        reason: {$ref: "#/components/schemas/Reason"}
    UpstreamKey:
      type: object
      required: [ref, status]
      description: A key the supplier lists that Axiom has not bound to a group.
      properties:
        ref: {type: string}
        group_ref: {type: string, description: "The supplier's ID of the group the key is for."}
        status: {type: string, enum: [active, disabled, quota_exhausted, expired]}
    SupplierEndpoint:
      type: object
      required: [id, group_id, model_id, upstream_name, formats, cost_state, enabled]
      description: >-
        One model in one of the supplier's groups, as the sync projected it: what testSupplierEndpoint is given. Only an
        enabled endpoint whose cost is `known` can be called, and so tested.
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        group_id: {$ref: "#/components/schemas/Uuid"}
        model_id: {$ref: "#/components/schemas/Uuid"}
        upstream_name: {type: string, description: "The model's name at the supplier."}
        formats:
          type: array
          minItems: 1
          items: {$ref: "#/components/schemas/ModelFormat"}
        cost_state: {type: string, enum: [known, unknown, conflict]}
        enabled: {type: boolean}
    SupplierDetail:
      type: object
      required: [supplier, groups, credentials, unbound_keys, endpoints]
      properties:
        supplier: {$ref: "#/components/schemas/Supplier"}
        groups:
          type: array
          items: {$ref: "#/components/schemas/SupplierGroup"}
        credentials:
          type: array
          items: {$ref: "#/components/schemas/SupplierCredential"}
        endpoints:
          type: array
          items: {$ref: "#/components/schemas/SupplierEndpoint"}
        unbound_keys:
          type: array
          items: {$ref: "#/components/schemas/UpstreamKey"}
    BindKey:
      type: object
      required: [group_id, upstream_key_ref, reason]
      properties:
        group_id: {$ref: "#/components/schemas/Uuid"}
        upstream_key_ref: {type: string, minLength: 1, maxLength: 200}
        reason: {$ref: "#/components/schemas/Reason"}
    ModelFormat:
      type: string
      enum: [messages, responses, chat, embeddings, rerank]
    TestFormat:
      type: string
      description: The generation formats an endpoint test can exercise. Direct formats are listed on the endpoint but are not tested here yet.
      enum: [messages, responses, chat]
    EndpointTestRequest:
      type: object
      required: [endpoint_id, format, reason]
      properties:
        endpoint_id: {$ref: "#/components/schemas/Uuid"}
        format:
          allOf: [{$ref: "#/components/schemas/TestFormat"}]
          description: The format to test it in; it must be one the endpoint serves.
        reason: {$ref: "#/components/schemas/Reason"}
    EndpointTestOutcome:
      type: string
      enum: [passed, failed, inconclusive]
      description: >-
        `passed`: a 2xx read to its normal end. `failed`: a failure the endpoint is at fault for, or a stream that broke.
        `inconclusive`: another scope's failure, something the supplier refused, or the test's own limit — nothing the
        endpoint can be judged by.
    EndpointTestCause:
      type: string
      enum:
        - timeout
        - memory
        - stream_broken
        - upstream_error
        - overloaded
        - rate_limited
        - context_too_long
        - content_rejected
        - bad_request
        - model_not_found
        - not_permitted
        - credential_rejected
        - credential_quota_exhausted
        - supplier_balance_low
        - transport
        - tool_input
        - unknown
      description: Why the test did not pass. `timeout` and `memory` are the test's own limits, not the supplier's.
    EndpointTestProblem:
      type: object
      required: [cause]
      properties:
        cause: {$ref: "#/components/schemas/EndpointTestCause"}
        scope:
          type: string
          enum: [request, egress, endpoint, credential, group, supplier]
          description: >-
            Whose fault it is: the endpoint's, the key's, the group's, the supplier's, the request's, or the route to
            the supplier. Absent when the test's own limit ended it.
    EndpointTest:
      type: object
      required: [request_id, endpoint_id, model_id, upstream_model, format, outcome, total_ms, estimated_native, native_unit]
      properties:
        request_id:
          allOf: [{$ref: "#/components/schemas/Uuid"}]
          description: The platform's own ID of the test, which its cost row and its audit entry are keyed by.
        endpoint_id: {$ref: "#/components/schemas/Uuid"}
        model_id: {$ref: "#/components/schemas/Uuid"}
        upstream_model: {type: string, description: "The model's name at the supplier, which the call sent."}
        format: {$ref: "#/components/schemas/TestFormat"}
        outcome: {$ref: "#/components/schemas/EndpointTestOutcome"}
        problem: {$ref: "#/components/schemas/EndpointTestProblem"}
        upstream_status: {type: integer, minimum: 0, description: "The supplier's HTTP status; 0 when it answered nothing."}
        upstream_request_id:
          type: string
          description: "The supplier's own ID of the call, when it gave one: the key its charge carries."
        first_token_ms: {type: integer, minimum: 0, description: "Absent when no content came."}
        total_ms: {type: integer, minimum: 0, description: "The whole test: waiting for the answer and reading it."}
        estimated_native:
          allOf: [{$ref: "#/components/schemas/Decimal"}]
          description: >-
            Zero when the supplier is known not to have executed the call; otherwise the highest price of the prompt's tokens and of the 16-token cap over every reachable
            context band, in the supplier's unit. A definite upper bound, never what the supplier reported.
        native_unit:
          type: string
          enum: [quota, usd]
          description: The unit the supplier counts its balance in, which the estimate is in.
    PendingMapping:
      type: object
      required: [supplier_id, group_id, upstream_name, formats]
      properties:
        supplier_id: {$ref: "#/components/schemas/Uuid"}
        group_id: {$ref: "#/components/schemas/Uuid"}
        group_codename: {type: string}
        upstream_name: {type: string}
        formats:
          type: array
          items: {$ref: "#/components/schemas/ModelFormat"}
    PendingMappingList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PendingMapping"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    ModelMappingRequest:
      type: object
      required: [upstream_name, model_id, reason]
      properties:
        rev:
          type: integer
          format: int64
          minimum: 1
          description: Current revision for an explicit group correction; omit to create a new alias.
        group_id:
          description: "The group the alias is for. Absent: the whole supplier."
          allOf: [{$ref: "#/components/schemas/Uuid"}]
        upstream_name: {type: string, minLength: 1, maxLength: 200}
        model_id: {$ref: "#/components/schemas/Uuid"}
        reason: {$ref: "#/components/schemas/Reason"}
    ModelMapping:
      type: object
      required: [id, supplier_id, upstream_name, model_id]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          description: Current alias revision; unavailable on older nodes.
        id: {$ref: "#/components/schemas/Uuid"}
        supplier_id: {$ref: "#/components/schemas/Uuid"}
        group_id: {$ref: "#/components/schemas/Uuid"}
        upstream_name: {type: string}
        model_id: {$ref: "#/components/schemas/Uuid"}
    AuthorSlug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$'}
    ModelSlug:
      type: string
      maxLength: 187
      pattern: '^[a-z0-9][a-z0-9-]{0,39}/[a-z0-9][a-z0-9._-]{0,99}(:free)?(@[a-z0-9][a-z0-9._-]{0,39})?$'
      description: "`<author>/<model>`, with optional `:free` and `@<version>` when the vendor gives one; lower case, as the catalog stores it."
    Author:
      type: object
      required: [slug, name]
      properties:
        slug: {$ref: "#/components/schemas/AuthorSlug"}
        name: {type: string, minLength: 1, maxLength: 100}
    AuthorList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Author"}
    AuthorSave:
      type: object
      required: [name, reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        reason: {$ref: "#/components/schemas/Reason"}
    ModelStatus:
      type: string
      enum: [draft, listed, retired]
      description: "`draft`: seen by the platform only; `listed`: on sale; `retired`: out of use for good."
    VersionBasis:
      type: string
      enum: [dated, floating]
      description: "`dated`: the model is one fixed version; `floating`: the vendor moves the model under a name."
    PriceSource:
      type: string
      enum: [litellm, openrouter, official, manual]
    BillingItem:
      type: string
      enum:
        - input
        - cache_read
        - cache_write
        - cache_write_1h
        - output
        - reasoning
        - audio_in
        - audio_out
        - image_in
        - image_out
        - web_search
        - code_execution
    ServiceTier:
      type: string
      enum: [standard, flex, priority, fast]
    ModelSpec:
      type: object
      description: >-
        The baseline facts about a model (context length, modalities, …), which are open for now, plus the two lists
        the review needs. `items` and `tiers` say which billing items and service tiers the upstream may report; a
        model goes on sale only if both are present, even if empty.
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/BillingItem"}
        tiers:
          type: array
          items: {$ref: "#/components/schemas/ServiceTier"}
      additionalProperties: true
    Rates:
      type: object
      description: The price per unit of each billing item the schedule prices; an item left out has no price here.
      additionalProperties: false
      properties:
        input: {$ref: "#/components/schemas/UnitPrice"}
        cache_read: {$ref: "#/components/schemas/UnitPrice"}
        cache_write: {$ref: "#/components/schemas/UnitPrice"}
        cache_write_1h: {$ref: "#/components/schemas/UnitPrice"}
        output: {$ref: "#/components/schemas/UnitPrice"}
        reasoning: {$ref: "#/components/schemas/UnitPrice"}
        audio_in: {$ref: "#/components/schemas/UnitPrice"}
        audio_out: {$ref: "#/components/schemas/UnitPrice"}
        image_in: {$ref: "#/components/schemas/UnitPrice"}
        image_out: {$ref: "#/components/schemas/UnitPrice"}
        web_search: {$ref: "#/components/schemas/UnitPrice"}
        code_execution: {$ref: "#/components/schemas/UnitPrice"}
    ContextTier:
      type: object
      required: [above, rates]
      additionalProperties: false
      properties:
        above: {type: integer, format: int64, minimum: 0, description: "The tier applies when the basis items sum to more than this."}
        rates: {$ref: "#/components/schemas/Rates"}
    ContextTiers:
      type: object
      required: [basis, method, tiers]
      additionalProperties: false
      description: "Whole-request tiers: when the basis items sum past a tier's threshold, the tier's rates replace the base ones."
      properties:
        basis:
          type: array
          items: {$ref: "#/components/schemas/BillingItem"}
        method: {type: string, enum: [whole]}
        tiers:
          type: array
          description: Strictly increasing by `above`.
          items: {$ref: "#/components/schemas/ContextTier"}
    ServiceTierRates:
      type: object
      required: [rates]
      additionalProperties: false
      properties:
        rates: {$ref: "#/components/schemas/Rates"}
        context_tiers:
          type: array
          description: The same thresholds as the schedule's, in order; a tier that changes no price has empty rates.
          items: {$ref: "#/components/schemas/ContextTier"}
    PriceSchedule:
      type: object
      required: [v, currency, rates]
      additionalProperties: false
      description: >-
        A price list in the canonical form the catalog stores (internal/catalog README「价目表」): prices per billing
        item, optional whole-request tiers by size, and a complete set of prices for each service tier other than
        the standard one. A tier that lists no price for an item has none, it does not inherit the standard one.
      properties:
        v: {type: integer, enum: [1]}
        currency: {type: string, pattern: '^[A-Z]{3}$', description: "XXX in a supplier's cost plan, which is in the supplier's own unit."}
        rates: {$ref: "#/components/schemas/Rates"}
        context_tiers: {$ref: "#/components/schemas/ContextTiers"}
        service_tiers:
          type: object
          additionalProperties: false
          properties:
            flex: {$ref: "#/components/schemas/ServiceTierRates"}
            priority: {$ref: "#/components/schemas/ServiceTierRates"}
            fast: {$ref: "#/components/schemas/ServiceTierRates"}
    ModelName:
      type: object
      required: [name, visibility]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        visibility: {type: string, enum: [public, internal], description: "Only public names can be called by users."}
    ReferencePrice:
      type: object
      required: [id, currency, source, published_at]
      description: The current version of a model's reference price in one currency.
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        source: {$ref: "#/components/schemas/PriceSource"}
        schedule:
          description: "Absent when the price was withdrawn: the currency has no price now, but this row is still the current one to build on."
          allOf: [{$ref: "#/components/schemas/PriceSchedule"}]
        published_at: {type: string, format: date-time}
    ModelSummary:
      type: object
      required: [id, slug, author, status, version_basis, price_source, rev]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        slug: {$ref: "#/components/schemas/ModelSlug"}
        author: {$ref: "#/components/schemas/AuthorSlug"}
        status: {$ref: "#/components/schemas/ModelStatus"}
        version_basis: {$ref: "#/components/schemas/VersionBasis"}
        price_source: {$ref: "#/components/schemas/PriceSource"}
        rev: {type: integer, format: int64, minimum: 0}
    ModelList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ModelSummary"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    Model:
      type: object
      required: [id, slug, author, status, version_basis, price_source, rev, spec, names, prices]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        slug: {$ref: "#/components/schemas/ModelSlug"}
        author: {$ref: "#/components/schemas/AuthorSlug"}
        status: {$ref: "#/components/schemas/ModelStatus"}
        version_basis: {$ref: "#/components/schemas/VersionBasis"}
        price_source: {$ref: "#/components/schemas/PriceSource"}
        rev: {type: integer, format: int64, minimum: 0}
        spec: {$ref: "#/components/schemas/ModelSpec"}
        names:
          type: array
          items: {$ref: "#/components/schemas/ModelName"}
        prices:
          type: array
          items: {$ref: "#/components/schemas/ReferencePrice"}
    ModelCreate:
      type: object
      required: [slug, version_basis, price_source, spec, reason]
      properties:
        slug: {$ref: "#/components/schemas/ModelSlug"}
        version_basis: {$ref: "#/components/schemas/VersionBasis"}
        price_source: {$ref: "#/components/schemas/PriceSource"}
        spec: {$ref: "#/components/schemas/ModelSpec"}
        reason: {$ref: "#/components/schemas/Reason"}
    SpecUpdate:
      type: object
      required: [rev, spec, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 0}
        spec: {$ref: "#/components/schemas/ModelSpec"}
        reason: {$ref: "#/components/schemas/Reason"}
    NameAdd:
      type: object
      required: [name, visibility, reason]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        visibility: {type: string, enum: [public, internal]}
        reason: {$ref: "#/components/schemas/Reason"}
    ModelStatusUpdate:
      type: object
      required: [status, rev, reason]
      properties:
        status: {type: string, enum: [listed, retired]}
        rev: {type: integer, format: int64, minimum: 0}
        reason: {$ref: "#/components/schemas/Reason"}
    Evidence:
      type: object
      minProperties: 1
      additionalProperties: true
      description: What supports a price (a page excerpt, a dataset entry), kept as the person entered it.
    PricePublish:
      type: object
      required: [source, schedule, evidence, reason]
      properties:
        base:
          description: The ID of the row that was current in the schedule's currency. Absent when the currency has no history.
          allOf: [{$ref: "#/components/schemas/Uuid"}]
        source: {$ref: "#/components/schemas/PriceSource"}
        schedule: {$ref: "#/components/schemas/PriceSchedule"}
        evidence: {$ref: "#/components/schemas/Evidence"}
        confirm_basis_change: {type: boolean, default: false}
        reason: {$ref: "#/components/schemas/Reason"}
    SourcePrice:
      type: object
      required: [schedule, evidence]
      properties:
        schedule: {$ref: "#/components/schemas/PriceSchedule"}
        evidence: {$ref: "#/components/schemas/Evidence"}
    PriceSourceSelect:
      type: object
      required: [rev, source, bases, prices, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 0}
        source: {type: string, enum: [official, manual]}
        bases:
          type: object
          description: The ID of the current price row of each currency that has history, by currency code.
          additionalProperties: {$ref: "#/components/schemas/Uuid"}
        prices:
          type: array
          minItems: 1
          description: The new source's schedule for each currency it has, one per currency.
          items: {$ref: "#/components/schemas/SourcePrice"}
        confirm_basis_change: {type: boolean, default: false}
        reason: {$ref: "#/components/schemas/Reason"}
    PricingTarget:
      type: object
      required: [kind]
      description: >-
        What a rule prices, from the most specific to the widest: an endpoint, a supplier group, a supplier, a model, a
        model author, a source type, or everything. `id` is that thing's ID (a model author's slug), and absent for
        `all`.
      properties:
        kind: {type: string, enum: [endpoint, group, supplier, model, author, source_type, all]}
        id: {type: string, maxLength: 200}
    PricingAudience:
      type: object
      required: [kind]
      description: >-
        Whom a rule prices for: one account, one tier, or everyone. `id` is the account's or tier's ID, absent for
        `all`. Account and tier IDs must belong to this site.
      properties:
        kind: {type: string, enum: [account, tier, all]}
        id: {type: string, maxLength: 64}
    PricingMethod:
      type: object
      required: [kind]
      description: >-
        How the price is set. `cost_plus`: cost × (1 + `markup_ratio`) + `fixed_markup`, or, with `margin_ratio`
        instead of `markup_ratio`, cost ÷ (1 − `margin_ratio`) + `fixed_markup`; exactly one of the two ratios.
        `reference_multiplier`: the model's reference price × `multiplier`. `face` only uses a reference already in
        the site's currency. `exchange` selects a reference in the site's currency, then USD, then a supported currency
        in alphabetical order; the multiplier and exact exchange fraction are combined before one upward rounding.
        A missing exchange rate stops publication for the matched model, without falling through to another rule
        (docs/domains/billing.md「汇率」). `fixed`: `schedule` is the price. The members of the other kinds must be absent.
      properties:
        kind: {type: string, enum: [cost_plus, reference_multiplier, fixed]}
        markup_ratio: {$ref: "#/components/schemas/Decimal"}
        margin_ratio: {$ref: "#/components/schemas/Decimal"}
        fixed_markup: {$ref: "#/components/schemas/Rates"}
        multiplier: {$ref: "#/components/schemas/Decimal"}
        currency_conversion: {type: string, enum: [exchange, face]}
        schedule: {$ref: "#/components/schemas/PriceSchedule"}
    PricingConstraints:
      type: object
      description: >-
        Limits on the price a rule sets, as ratios. This release does not apply them: a request that carries any
        member (`min_margin_ratio`, `reference_min_ratio`, `reference_max_ratio`) is refused as 422 with the field
        pointer `/rule/constraints/<member>`, so send `{}`. A stored rule that still has one is not priced, and
        saving it without constraints clears them (#234).
      properties:
        min_margin_ratio: {$ref: "#/components/schemas/Decimal"}
        reference_min_ratio: {$ref: "#/components/schemas/Decimal"}
        reference_max_ratio: {$ref: "#/components/schemas/Decimal"}
    PricePublicationList:
      type: object
      properties:
        policy: {$ref: "#/components/schemas/PricePolicy"}
        data:
          type: array
          items: {$ref: "#/components/schemas/PricePublication"}
    PricePolicy:
      type: object
      properties:
        rev: {type: integer, format: int64}
        floor_multiplier: {type: string}
        change_ratio: {type: string}
        max_increase_ratio: {type: string}
    PricePolicyInput:
      type: object
      additionalProperties: false
      required: [rev, floor_multiplier, change_ratio, max_increase_ratio, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 0}
        floor_multiplier: {type: string, maxLength: 34}
        change_ratio: {type: string, maxLength: 34}
        max_increase_ratio: {type: string, maxLength: 34}
        reason: {$ref: "#/components/schemas/Reason"}
    PricePublication:
      type: object
      properties:
        audience: {$ref: "#/components/schemas/PricingAudience"}
        model_id: {$ref: "#/components/schemas/Uuid"}
        candidate_id: {$ref: "#/components/schemas/Uuid"}
        current_id: {$ref: "#/components/schemas/Uuid"}
        status: {type: string, enum: [published, pending, blocked, unpriced]}
        requested: {$ref: "#/components/schemas/PriceSchedule"}
        schedule: {$ref: "#/components/schemas/PriceSchedule"}
        floor: {$ref: "#/components/schemas/PriceSchedule"}
        problem: {type: string}
    PricePublishInput:
      type: object
      additionalProperties: false
      required: [candidate_id, confirmed, override_floor, reason]
      properties:
        candidate_id: {$ref: "#/components/schemas/Uuid"}
        current_id: {$ref: "#/components/schemas/Uuid"}
        confirmed: {type: boolean}
        override_floor: {type: boolean}
        reason: {$ref: "#/components/schemas/Reason"}
    PricingRuleInput:
      type: object
      required: [enabled, target, audience, method, constraints]
      properties:
        enabled: {type: boolean}
        target: {$ref: "#/components/schemas/PricingTarget"}
        audience: {$ref: "#/components/schemas/PricingAudience"}
        method: {$ref: "#/components/schemas/PricingMethod"}
        constraints: {$ref: "#/components/schemas/PricingConstraints"}
    PricingRule:
      type: object
      required: [id, rev, enabled, target, audience, method, constraints, updated_at]
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        rev: {type: integer, format: int64, minimum: 0}
        enabled: {type: boolean}
        target: {$ref: "#/components/schemas/PricingTarget"}
        audience: {$ref: "#/components/schemas/PricingAudience"}
        method: {$ref: "#/components/schemas/PricingMethod"}
        constraints: {$ref: "#/components/schemas/PricingConstraints"}
        updated_at: {type: string, format: date-time}
    PricingRuleList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PricingRule"}
    PricingRuleCreate:
      type: object
      required: [rule, reason]
      properties:
        rule: {$ref: "#/components/schemas/PricingRuleInput"}
        reason: {$ref: "#/components/schemas/Reason"}
    PricingRuleUpdate:
      type: object
      required: [rev, rule, reason]
      properties:
        rev: {type: integer, format: int64, minimum: 0}
        rule: {$ref: "#/components/schemas/PricingRuleInput"}
        reason: {$ref: "#/components/schemas/Reason"}
    PricingPreviewRequest:
      type: object
      required: [model_ids]
      properties:
        model_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: "#/components/schemas/Uuid"}
        tier_id:
          description: "The tier whose price to show. Absent, and without `account_id`: the site's default tier. Not with `account_id`."
          allOf: [{$ref: "#/components/schemas/TierId"}]
        account_id:
          description: "Show what this account pays: its tier, and the rules written for the account itself. Not with `tier_id` (400)."
          allOf: [{$ref: "#/components/schemas/AccountId"}]
        rule:
          description: >-
            A rule to add, or to put in place of `replaces_rule_id`, for this preview only. The site holds one rule
            for each target and audience, and the stored one would price the models, so a rule that would sit beside
            another stored rule with the same target and audience is refused: a rule to add, because it would be a second
            rule for them (409, as creating the rule is), and a replacement, because it would collide with a stored rule
            other than `replaces_rule_id` (422, pointing at `/replaces_rule_id`).
          allOf: [{$ref: "#/components/schemas/PricingRuleInput"}]
        replaces_rule_id: {$ref: "#/components/schemas/Uuid"}
    PricingPreviewRow:
      type: object
      required: [model_id, slug, status]
      properties:
        model_id: {$ref: "#/components/schemas/Uuid"}
        slug: {$ref: "#/components/schemas/ModelSlug"}
        endpoint_id:
          description: "The endpoint this row prices. Absent for a model with no endpoint, which has the one row."
          allOf: [{$ref: "#/components/schemas/Uuid"}]
        status:
          type: string
          enum: [priced, cost_unknown, below_floor, unpriced]
          description: >-
            `priced`: a price; `cost_unknown`: the endpoint's cost is not known, so no floor can be held;
            `below_floor`: the rule's requested price was under the break-even floor; `sale` is protected by the floor or is the retained published price. `unpriced`: no
            rule sets a price for the model by a way of pricing this release has, so the model has no sale price at
            all: its reference price is never sold in its place.
        current_sale:
          description: The published serving price for this account and its current tier; unavailable on older nodes or when sales are stopped.
          allOf: [{$ref: "#/components/schemas/PriceSchedule"}]
        current_version: {$ref: "#/components/schemas/Uuid"}
        sale:
          description: The protected proposal for an unsaved edit; for stored rules with a serving head, the current published price. With unknown cost, only the requested rule price can be shown.
          allOf: [{$ref: "#/components/schemas/PriceSchedule"}]
        cost:
          description: The endpoint's cost, in the site's currency.
          allOf: [{$ref: "#/components/schemas/PriceSchedule"}]
        margin_ratio:
          description: The lowest margin of `sale` over `cost` across billing items and tiers; negative would be a loss.
          allOf: [{$ref: "#/components/schemas/Decimal"}]
    PricingPreview:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PricingPreviewRow"}

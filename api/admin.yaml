  /api/admin/v1/subscription-plans:
    get:
      operationId: listSubscriptionPlans
      tags: [Pricing]
      summary: List the subscription plans
      description: >-
        The site's catalog of subscription plans, by name: what one window of a plan holds, how long its window and its
        term are, and the price it is listed at (docs/domains/billing.md「订阅套餐」). Plans are administrator data;
        nothing here is hard-coded.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      parameters:
        - name: include_inactive
          in: query
          required: false
          schema: {type: boolean, default: false}
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionPlanList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createSubscriptionPlan
      tags: [Pricing]
      summary: Add a subscription plan
      description: >-
        Adds a plan to the catalog. `price` is the list price in whole minor units of the site's currency. `quota` is
        the credit one window holds. A term holds at most 400 windows, and its total credit must fit the ledger. The
        terms are copied into every subscription sold from the plan, so a later change affects only what is sold after
        it.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SubscriptionPlanInput"}
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SubscriptionPlan"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}

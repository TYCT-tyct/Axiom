        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/removal:
    post:
      operationId: removeSupplier
      tags: [Suppliers]
      summary: Remove a supplier
      description: >-
        Takes the supplier out of routing at once and ends it `removed`, in one transaction: its login is deleted, the
        sealed key of each credential is cleared and the credential becomes `erased` (the row stays, because calls made
        with it point at it). Calls in flight end with the key they hold. Axiom does not write to the supplier in M1, so
        the keys it used there are not revoked: the credentials stay listed as `erased` with their `upstream_key_ref`, for a person to revoke at the supplier, and the audit
        entry records how many (`keys_to_revoke_count`).
        Sending it again returns the supplier as it is.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The supplier, `removed`.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}

# The admin API: what the admin app calls on the admin listener, which only the admin domains and restricted sources
# reach (docs/architecture.md「技术选型」前端交付). Code on both sides is generated from this file; change the
# contract here first. The conventions it follows, and the reasons, are in internal/platform/README.md「接口约定」;
# `just api` checks them. The operations of the Session tag are the console's, under this surface's path: a session
# is valid on the surface that issued it, so each surface has its own sign-in.
openapi: 3.0.3
info:
  title: Axiom admin API
  version: v1
  description: >-
    The API of the admin app, under `/api/admin/v1` on the admin listener. Every operation outside the Session tag
    acts on the platform, so it needs a session that passed two-step verification (`x-axiom-level: mfa`) and the
    permission named by `x-axiom-permission` among the user's platform grants.


    Every operation that changes data needs the `Origin` of the admin domain, `Content-Type: application/json` and the
    session's `X-CSRF-Token`. Operations outside the Session tag that change data also take an `Idempotency-Key` (a
    UUID chosen by the caller for one intended change; sending it again returns the first result with the header
    `Idempotency-Replayed: true`, and using it for another kind of change is `idempotency_key_reused`) and a
    `reason` of 1 to 1000 characters, which goes to the audit log. A `rev` in a request is the revision the caller
    read; a changed resource is refused with `stale_revision` instead of overwritten. A POST marked
    `x-axiom-safe: true` changes nothing and takes neither. Every response carries `X-Request-ID` and
    `Cache-Control: no-store`.
tags:
  - {name: Session, description: "Sign-in, two-step verification and the current session."}
  - {name: Site, description: "Site settings."}
  - {name: Users, description: "Users, accounts and manual credit."}
  - {name: Suppliers, description: "Suppliers, their groups and keys, and the upstream model names waiting to be mapped."}
  - {name: Catalog, description: "Authors, models, their names, specs and reference prices."}
  - {name: Pricing, description: "Pricing rules and their preview."}
  - {name: Alerts, description: "Platform operations alert rules, channels, incidents and receipts."}
  - {name: Payments, description: "Payment discrepancies and investigation notes."}
paths:
  /api/admin/v1/payments/discrepancies:
    get:
      operationId: listPaymentDiscrepancies
      tags: [Payments]
      summary: List payment records awaiting or completing investigation
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: before, in: query, schema: {$ref: "#/components/schemas/Uuid"}, description: "Return up to 100 records older than this ID."}
        - {name: state, in: query, schema: {type: string, enum: [open, resolved]}, description: "Omit to list both states. Resolved means investigated only."}
      responses:
        "200":
          description: The persisted payment investigation record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentDiscrepancyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/discrepancies/{discrepancy_id}:
    get:
      operationId: getPaymentDiscrepancy
      tags: [Payments]
      summary: Read a payment discrepancy
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: discrepancy_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      responses:
        "200":
          description: The persisted payment investigation record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentDiscrepancy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/discrepancies/{discrepancy_id}/investigate:
    post:
      operationId: investigatePaymentDiscrepancy
      tags: [Payments]
      summary: Mark investigated with a note without moving funds
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: discrepancy_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "201":
          description: The persisted payment investigation record.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentDiscrepancy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/alerts/configuration:
    get:
      operationId: getAlertConfiguration
      tags: [Alerts]
      summary: Read alert rules and notification channels
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The requested alert data or persisted operation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertConfiguration"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: setAlertConfiguration
      tags: [Alerts]
      summary: Replace alert rules and notification channels
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertConfigurationRequest"}
      responses:
        "201":
          description: The requested alert data or persisted operation.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertConfiguration"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/alerts/events:
    get:
      operationId: listAlertEvents
      tags: [Alerts]
      summary: List alert incidents and delivery receipts
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: before, in: query, schema: {$ref: "#/components/schemas/Uuid"}, description: "Return up to 100 events older than this ID."}
      responses:
        "200":
          description: The requested alert data or persisted operation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertEventList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/alerts/tests:
    post:
      operationId: sendAlertTest
      tags: [Alerts]
      summary: Queue a channel test with a delivery receipt
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertTestRequest"}
      responses:
        "201":
          description: The requested alert data or persisted operation.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/alerts/channels/{channel_id}/secret:
    put:
      operationId: rotateAlertWebhookSecret
      tags: [Alerts]
      summary: Set or rotate a webhook signing secret
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: channel_id, in: path, required: true, schema: {type: string, minLength: 1, maxLength: 64}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AlertWebhookSecretRequest"}
      responses:
        "201":
          description: The requested alert data or persisted operation.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/alerts/events/{event_id}/resolve:
    post:
      operationId: resolveAlertEvent
      tags: [Alerts]
      summary: Close an incident after operator investigation
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - {name: event_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "201":
          description: The requested alert data or persisted operation.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AlertTestResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/version:
    get:
      operationId: getVersion
      tags: [Session]
      summary: The version of the running program
      description: >-
        The console compares it with the version it was built as and offers a reload when they differ, so a page
        left open across a deployment does not keep calling an API it no longer matches.
      security: []
      responses:
        "200":
          description: The running version
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [Session]
      summary: Sign in with email and password
      description: >-
        Sets the session cookie. A user with two-step verification gets a pending session (`mfa_required`) that only
        `verifyMfa` accepts. An unknown email costs a password hash too, so the answer does not tell whether the
        email exists. Needs the `Origin` of the surface, but no session.


        Limits: a token bucket per client IP shared by sign-in, registration and two-step verification (burst 20, 10 a
        minute), and failed sign-ins per email (10 in 15 minutes, then a wait; the account is never locked). A limit
        is a 429 with `Retry-After`. The values are site settings with defaults in code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in, or waiting for the second factor.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/mfa:
    post:
      operationId: verifyMfa
      tags: [Session]
      summary: Pass two-step verification
      description: >-
        Takes the pending session of `signIn` and a TOTP or recovery code. A right code ends the pending session and
        issues a new `mfa` session (new cookie, new CSRF token); a wrong one only counts an attempt (5 per pending
        session, 10 an hour per user), and a recovery code works once. Two requests with codes for the same
        challenge give one session.


        Limits: the per-IP bucket of `signIn`.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaRequest"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Session]
      summary: End the session
      description: Revokes the session of the cookie, whatever its level, and expires the cookie.
      security:
        - session: []
          csrf: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: The current session
      description: >-
        Who is signed in and what the session may do. A page calls it on load to learn whether to show the sign-in
        page, and to get the CSRF token again (the cookie is HttpOnly, so the page keeps the token only in memory).
      security:
        - session: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/totp/setup:
    post:
      operationId: beginTotpSetup
      tags: [Session]
      summary: Start enabling two-step verification
      description: >-
        Makes a new TOTP secret and the URI for its QR code. Nothing is stored, so calling it again just makes another
        secret; `confirmTotpSetup` stores the one the user proved.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: A new secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetup"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/totp/confirm:
    post:
      operationId: confirmTotpSetup
      tags: [Session]
      summary: Finish enabling two-step verification
      description: >-
        Needs the password again and a code from the new secret. Stores the secret, makes the 10 recovery codes
        (shown only in this response) and replaces the user's sessions as described by `FactorChange`. Only for a user
        who has not enabled it: once on, it stays on and cannot be replaced from the console (409); the person
        who runs the deployment can reset it from the command line.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200":
          description: Enabled.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Session]
      summary: Make new recovery codes
      description: >-
        Needs a current TOTP code from a session that passed two-step verification. The old codes stop working, and
        the user's other sessions end.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryCodesRequest"}
      responses:
        "200":
          description: The new codes.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/sites/{site_id}/settings:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SiteId"}
    get:
      operationId: getSiteSettings
      tags: [Site]
      summary: A site's session and key settings
      description: >-
        The values the site sets itself, and the defaults in code that apply where it sets none, so a page can show
        what is in force.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteSettingsView"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateSiteSettings
      tags: [Site]
      summary: Set a site's session and key settings
      description: >-
        Replaces the site's own values: a setting left out falls back to the default in code. Each value has the
        bounds `SiteSettings` states, and a request outside them is a 400. Shorter sessions take effect on the next
        request of every session; the change is audited.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SiteSettingsUpdate"}
      responses:
        "200":
          description: The settings as stored
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SiteSettingsView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/sites/{site_id}/key-limits:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SiteId"}
    get:
      operationId: getSiteKeyLimits
      tags: [Site]
      summary: A site's limits on the keys of an account
      description: >-
        The limits the site sets itself and what they come to over the defaults in code. An account without limits
        of its own is held to these.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The limits
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyLimitsView"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateSiteKeyLimits
      tags: [Site]
      summary: Set a site's limits on the keys of an account
      description: >-
        Replaces the limits the site sets itself: a limit left out falls back to the default in code. These are not
        part of the site's settings (`updateSiteSettings`), so that request, which replaces those whole, leaves them as
        they are. A request outside the bounds `KeyLimits` states is a 400. A node applies the change at once if it
        served the request, and the others when they reload the sites, within 30 seconds; the change is audited.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyLimitsUpdate"}
      responses:
        "200":
          description: The limits as stored
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyLimitsView"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/sites/{site_id}/login-limits:
    parameters:
      - name: site_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SiteId"}
    get:
      operationId: getSiteLoginLimits
      tags: [Site]
      summary: A site's login brute-force limits
      description: The site's own limits and the code defaults; absent members are unavailable on older nodes.
      security:
        - session: []

    get:
      operationId: listSourceClasses
      tags: [Quality]
      summary: The source classes in recognition order and their fingerprint rules.
      description: >-
        The live classes, lowest position first. `relay` is the fallback an endpoint belongs to until a rule matches or
        while it has no successful response. Nodes reread this table within 5 seconds and reclassify endpoints from
        their last response; the routing snapshot publishes the new class within another snapshot interval.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      responses:
        "200":
          description: The live source classes.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceClassList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createSourceClass
      tags: [Quality]
      summary: Add a source class and its fingerprint rules.
      description: >-
        The slug is stable: presets and call records name it, and a retired class keeps it reserved. A missing position
        is placed after the last class before the fallback. The rules are validated here and again when a node loads
        them; a bad rule names its path (`/rules/conditions/0/operator`) in the 400.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceClassCreate"}
      responses:
        "201":
          description: Created.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceClass"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/source-classes/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: {type: string, maxLength: 32}
    put:
      operationId: updateSourceClass
      tags: [Quality]
      summary: Change a source class at the revision the caller read.
      description: >-
        Changes names, description, position and rules. A stale `rev` is a 409 and changes nothing. A seeded class keeps
        its slug and cannot be retired; the fallback keeps its position and has no rules. Endpoints are reclassified
        from their last successful response. A header the new rules read but the old ones did not is unknown until the
        next response: present and absent conditions for it do not match, so the endpoint may fall to the fallback in
        the meantime.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceClassUpdate"}
      responses:
        "200":
          description: The class as stored.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SourceClass"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: deleteSourceClass
      tags: [Quality]
      summary: Retire a source class.
      description: >-
        The class stops matching and leaves the list; its row and slug stay reserved, so a preset naming it simply
        stops matching (fail closed) instead of silently pointing at a later class. A seeded class cannot be retired.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SourceClassDelete"}
      responses:
        "204":
          description: Retired; the same Idempotency-Key replays this answer without a second change.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}

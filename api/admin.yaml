      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
        - {name: account_id, in: query, schema: {$ref: "#/components/schemas/AccountId"}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "Transactions at or after this time."}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: "Transactions before this time."}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the site's cash movements, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashMovementList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}

  /api/admin/v1/payments/orders:
    get:
      operationId: listPaymentOrders
      tags: [Payments]
      summary: A site's top-up orders, newest first, with their refunds
      description: >-
        The admin's order list: one site's orders with what was quoted, what the channel actually took and credited,
        and each order's refunds. Filters left out do not narrow. `account_id` is the paying account, `user_id` the user who ordered, `merchant_id`
        the merchant account (the channel), and `since`/`until` are the order's creation time, `since` inclusive and
        `until` exclusive. Pages use `cursor` and `limit`; the answer's `next_cursor` is null on the last page. Money
        is exact text: `credits` is in the site's accounting currency (billionths), while the amounts are in the
        currency the order was paid in (minor units).
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
        - {name: account_id, in: query, schema: {$ref: "#/components/schemas/AccountId"}}
        - {name: user_id, in: query, schema: {$ref: "#/components/schemas/UserId"}}
        - {name: merchant_id, in: query, schema: {$ref: "#/components/schemas/MerchantId"}}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/PaymentOrderState"}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "Orders created at or after this time."}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: "Orders created before this time."}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the site's orders, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentOrderList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/cash:
    get:
      operationId: listCashMovements
      tags: [Payments]
      summary: The cash behind the dashboard, by ledger time
      description: >-
        One site's cash movements in a window, newest first: paid credits in and refunds out, with the batch, order or
        offline channel they came from. The time is the ledger transaction's, not an order's creation time, so a
        refund of an older order and an offline top-up are both in the window the dashboard counted. `since` is
        inclusive and `until` exclusive; `account_id` narrows to one payer. Pages use `cursor` and `limit`; money is
        exact text in the payment's currency, and the site's accounting currency where the ledger leaves it NULL.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
        - {name: account_id, in: query, schema: {$ref: "#/components/schemas/AccountId"}}
        - {name: since, in: query, schema: {type: string, format: date-time}, description: "Transactions at or after this time."}
        - {name: until, in: query, schema: {type: string, format: date-time}, description: "Transactions before this time."}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the site's cash movements, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CashMovementList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/payments/refunds:
    get:
      operationId: listPaymentRefunds
      tags: [Payments]
      summary: A site's refunds, newest first, for review and follow-up
      description: >-
        The admin's refund list. `state` is the internal state: `frozen` is held after the request and waits for an
        administrator's approval (`approved_by` absent) or for sending; `sending` and `pending` are with the channel
        and their result is not final; `succeeded` returned the cash; `failed` returned the frozen credits. Filters
        left out do not narrow. The page asks with `state=frozen` for the review queue. Money is exact text: `credits`
        is in the site's accounting currency (billionths), `amount` in the currency the order was paid in (minor units).
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
        - {name: site_id, in: query, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
        - {name: state, in: query, schema: {$ref: "#/components/schemas/PaymentRefundState"}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: One page of the site's refunds, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentRefundList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}

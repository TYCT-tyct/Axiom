      tags: [Suppliers]
      summary: Replace the login Axiom uses at a supplier
      description: >-
        Seals the new login in place of the old one and has the sync log in with it. Used when the supplier rejected
        the old one (`needs_attention`) or the person rotates it. The address and the account are not changed. Changing
        a credential is a high-risk operation (docs/domains/operations.md); the audit entry names the actor and the
        reason, not the login.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SupplierLoginUpdate"}
      responses:
        "200":
          description: The supplier, `connecting` again.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/unit-value:
    put:
      operationId: confirmSupplierUnitValue
      tags: [Suppliers]
      summary: Confirm what one unit of a supplier's balance is worth
      description: >-
        The person's answer to "1 unit of balance = how much money" (docs/domains/billing.md「供应商成本」), which
        turns the supplier's costs into money. The adapter's hint is in `Supplier.unit_value_hint`. A later value
        applies from now; calls already costed keep theirs. Endpoints of the supplier stay out of routing until a
        value is confirmed.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UnitValueUpdate"}
      responses:
        "200":
          description: The supplier as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Supplier"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/groups/{group_id}:
    put:
      operationId: selectSupplierGroup
      tags: [Suppliers]
      summary: Choose whether a supplier's group is used
      description: >-
        A selected group gets its code name (the name users see in place of the group's, made when it is first
        selected and never changed) and its models become endpoints. Unselecting takes the group out of routing and
        keeps the code name.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - name: group_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GroupSelection"}

        slug: {type: string}
        name: {type: string}
        name_zh: {type: string}
        description: {type: string}
        position: {type: integer}
        fallback: {type: boolean}
        system: {type: boolean}
        rules: {$ref: "#/components/schemas/SourceClassRules"}
        revision: {type: integer, format: int64}
        updated_at: {type: string, format: date-time}
    SourceClassList:

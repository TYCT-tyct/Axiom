              schema: {$ref: "#/components/schemas/PendingMappingList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/suppliers/{supplier_id}/model-mappings:
    post:
      operationId: mapSupplierModel
      tags: [Suppliers]
      summary: Map an upstream model name to a model
      description: >-
        Makes an alias of the supplier's: the name means this model, in one group or in the whole supplier. The
        endpoint it creates waits for the authenticity check before it takes traffic. An alias is never changed; a
        wrong one is corrected by a new alias in the narrower scope. A name that already has an alias in that scope
        is a 409.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: suppliers.manage
      parameters:
        - name: supplier_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ModelMappingRequest"}
      responses:
        "201":
          description: Mapped.
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ModelMapping"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/authors:

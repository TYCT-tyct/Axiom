  /api/admin/v1/operations/credentials:
    get:
      operationId: listOperationsCredentials
      tags: [Operations]
      summary: The operations credentials
      description: >-
        Every operations credential, newest first, revoked ones included: its permissions, sites, platform grant,
        proposer vendors, expiry, last use and the last four characters of its current token. Never a token.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of credentials
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCredentialList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createOperationsCredential
      tags: [Operations]
      summary: Make an operations credential
      description: >-
        Makes a credential for the operations agent and returns its token once. It always holds `operations.read`; it
        may hold any other declared permission except `operations.manage` and `platform_grants.manage`, which are the
        control plane's. Without `sites` it acts on every site; `platform` lets it read the platform's own resources.
        It expires at `expires_at`, which the owner chooses for each credential and must be in the future. A replay of the same key returns
        the credential without the token: a lost token is replaced by a rotation.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsCredentialCreate"}
      responses:
        "201":
          description: The credential, and its token unless this is a replay
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCredentialToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/credentials/{credential_id}/rotate:
    parameters:
      - {name: credential_id, in: path, required: true, schema: {$ref: "#/components/schemas/OperationsCredentialId"}}
    post:
      operationId: rotateOperationsCredential
      tags: [Operations]
      summary: Give an operations credential a new token
      description: >-
        Returns a new token once. The token it replaces keeps working for `overlap_hours` (0 to 24, 24 when absent),
        for the MCP bridge to swap its file; a token an earlier rotation replaced stops now. A replay of the same key
        returns no token: rotate again.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsCredentialRotate"}
      responses:
        "200":
          description: The new token unless this is a replay
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCredentialToken"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/credentials/{credential_id}/revoke:
    parameters:
      - {name: credential_id, in: path, required: true, schema: {$ref: "#/components/schemas/OperationsCredentialId"}}
    post:
      operationId: revokeOperationsCredential
      tags: [Operations]
      summary: Revoke an operations credential
      description: >-
        From the next request every token of the credential is refused, and it never comes back; a revoked or expired
        credential is not found.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: Revoked
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCredentialRevoked"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/agent/stop:
    post:
      operationId: stopOperationsAgent
      tags: [Operations]
      summary: Emergency stop of the operations agent
      description: >-
        Revokes every live operations credential in one transaction, so the operations listener refuses the next
        request of any of them. Resuming is making a new credential; a revoked one never comes back. Stopping again
        revokes nothing and is not an error.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: Stopped
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsAgentStopped"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/cap-policies:
    get:
      operationId: listOperationsCapPolicies
      tags: [Operations]
      summary: The caps on the money the operations agent moves
      description: >-
        Every cap policy, by category and scope (the platform's first). A scope and category without one moves no money.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      responses:
        "200":
          description: The policies
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCapPolicyList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/cap-policies/{scope}/{category}:
    parameters:
      - name: scope
        in: path
        required: true
        description: "`platform`, for what no site owns such as a platform supplier, or a site's ID."
        schema: {type: string, pattern: '^(platform|site_[0-9a-hjkmnp-tv-z]{26})$'}
      - {name: category, in: path, required: true, schema: {$ref: "#/components/schemas/OperationsCapCategory"}}
    put:
      operationId: setOperationsCapPolicy
      tags: [Operations]
      summary: Set the caps of a scope and category
      description: >-
        Makes the policy (`rev` 0) or replaces its limits (`rev` as read; another is a 409 `stale_revision`). A policy
        keeps the currency it was made with (another is a 409 `conflict`), and every hard limit is at least its
        autonomous one (otherwise a 400). A proposal waiting for the owner is weighed again against the hard limits when
        it is approved: one they no longer hold ends `rejected` with `stale_revision`; loosening leaves it alone.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsCapPolicyUpdate"}
      responses:
        "200":
          description: The policy as it is now
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCapPolicy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/cap-policies/{scope}/{category}/repair:
    parameters:
      - name: scope
        in: path
        required: true
        description: "`platform`, for what no site owns such as a platform supplier, or a site's ID."
        schema: {type: string, pattern: '^(platform|site_[0-9a-hjkmnp-tv-z]{26})$'}
      - {name: category, in: path, required: true, schema: {$ref: "#/components/schemas/OperationsCapCategory"}}
    post:
      operationId: repairOperationsCapCounters
      tags: [Operations]
      summary: Recompute the cap counters and resume the scope
      description: >-
        Sets each counter of the scope and category in the current UTC day and ISO week to what its money actions add
        up to, with every proposal there held off meanwhile, and resumes a scope the reconciliation paused. Every
        counter it changed is recorded in the audit log, as it was and as it is now. A scope and category without a
        policy is a 404.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The policy, resumed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsCapPolicy"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/price-envelopes:
    get:
      operationId: listOperationsPriceEnvelopes
      tags: [Operations]
      summary: The envelopes the operations agent changes sale prices within
      description: >-
        Every site's price envelope. A site without one has none of its sale prices changed by the agent.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      responses:
        "200":
          description: The envelopes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsPriceEnvelopeList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/price-envelopes/{site_id}:
    parameters:
      - {name: site_id, in: path, required: true, schema: {$ref: "#/components/schemas/SiteId"}}
    put:
      operationId: setOperationsPriceEnvelope
      tags: [Operations]
      summary: Set a site's price envelope
      description: >-
        Makes the envelope (`rev` 0) or replaces its limits (`rev` as read; another is a 409 `stale_revision`). It
        decides only whether the agent's publication of a sale price needs the owner; the owner's approval of one
        outside it publishes it all the same, and every publication counts against the day.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OperationsPriceEnvelopeUpdate"}
      responses:
        "200":
          description: The envelope as it is now
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsPriceEnvelopeSetting"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/approvals:
    get:
      operationId: listOperationsApprovals
      tags: [Operations]
      summary: What the operations agent asked the owner to approve
      description: >-
        Every approval newest first, optionally in one state, with the operation it holds back: what the agent asked
        for, the summary the server read of the target when it asked, and the agent's reason, which is untrusted text.
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: operations.approve
      parameters:
        - {name: state, in: query, required: false, schema: {$ref: "#/components/schemas/OperationsApprovalState"}}
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of approvals
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsApprovalList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/approvals/{approval_id}:
    get:
      operationId: getOperationsApproval
      tags: [Operations]
      summary: One approval with its operation
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: operations.approve
      parameters:
        - {name: approval_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
      responses:
        "200":
          description: The approval
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsApproval"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/approvals/{approval_id}/approve:
    post:
      operationId: approveOperationsApproval
      tags: [Operations]
      summary: Approve what the operations agent asked for
      description: >-
        Approves a pending approval and runs its operation at once, in the same transaction, as the agent's: the
        operation ends `succeeded`, or `rejected` with the code the target refused it with when the target changed
        since the agent asked (such as `stale_revision`). If the credential that proposed it is no longer live
        (revoked, stopped or expired), nothing runs: the approval and its operation end `canceled`. One already
        decided, withdrawn or past its expiry is a 409 `conflict`.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.approve
      parameters:
        - {name: approval_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The approval, approved, with where its operation ended
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsApproval"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/operations/approvals/{approval_id}/reject:
    post:
      operationId: rejectOperationsApproval
      tags: [Operations]
      summary: Reject what the operations agent asked for
      description: >-
        Rejects a pending approval: its operation ends `rejected` and nothing is changed. One already decided,
        withdrawn or past its expiry is a 409 `conflict`.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: operations.approve
      parameters:
        - {name: approval_id, in: path, required: true, schema: {$ref: "#/components/schemas/Uuid"}}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReasonRequest"}
      responses:
        "200":
          description: The approval, rejected
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationsApproval"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-axiom_session
      description: >-
        The session cookie (HttpOnly, Secure, SameSite=Lax). Its name loses the `__Host-` prefix only where the site's
        registered origin is `http://localhost`. The sign-in operations set it, and it is valid only on the surface
        that issued it.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, which sign-in, two-step verification and `getSession` return. Every request that
        changes data and carries a session sends it; the request must also carry an `Origin` equal to the origin
        registered for the site and surface, and `Content-Type: application/json`. The API sends no CORS headers.
  headers:
    SetCookie:
      required: true
      description: The new session cookie, or an expired one that ends the session.
      schema: {type: string}
    IdempotencyReplayed:
      required: false
      description: "true when this response is the stored result of an earlier request with the same Idempotency-Key; nothing was done again."
      schema: {type: boolean}
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid for
        the same filters, and a malformed one is a 400.
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the caller chooses for one intended change. Sending the request again with the same key, after a lost
        response, returns the first result instead of doing it twice.
      schema: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
    TargetMetricSet:
      name: X-Axiom-Target-Metrics
      in: header
      required: false
      description: >-
        `all` is required by `replaceOperationsTargets` and refused by `updateOperationsTargets`; it makes a target
        write replace every metric the node stores, including paid users, monthly revenue, gross margin and retention.
        It must be paired with `all_metrics: true` in the body. A node from before the commercial metrics does not
        route the full-replacement path, so a full replacement cannot clear only the legacy four there.
      schema: {type: string, enum: [all]}
  responses:
    BadRequest:
      description: >-
        The request is malformed or breaks a constraint of the contract (`invalid_request`), or names a routing preset
        it may not choose (`preset_not_selectable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: >-
        No valid session for this surface, or the credentials of a sign-in are wrong, alike for an unknown email, a
        wrong password and a disabled user (`unauthenticated`, `invalid_credentials`, `invalid_code`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The session may not do this: the permission is missing, the session has not passed two-step verification
        (`mfa_required`), the Origin, content type or CSRF token is wrong (`origin_rejected`), or the current legal
        documents have not been accepted (`consent_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: >-
        There is no such resource, or the session's scope cannot see it. A malformed ID and an unknown one answer
        alike (`not_found`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`, `preset_default_invalid`, `preset_in_use`, `preset_quota`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`, `cap_exceeded`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Failure:
      description: >-
        Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503). A 500 never carries the internal error's text.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    AdminCallStatus:
      type: string
      enum: [ok, error]
      description: >-
        The result of a call: `ok` when its error_kind is empty, `error` otherwise. An old node may leave the filter echo
        out of a list.
    AdminCallSummary:
      type: object
      additionalProperties: false
      properties:
        id: &admin_schema_id001
          type: string
        site_id:
          $ref: '#/components/schemas/SiteId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        at:
          type: string
          format: date-time
        model: *admin_schema_id001
        error_kind: *admin_schema_id001
        latency_ms:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    AdminCallList:
      type: object
      additionalProperties: false
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminCallSummary'
        next_cursor: *admin_schema_id001
        model_filter: *admin_schema_id001
        status_filter:
          $ref: '#/components/schemas/AdminCallStatus'
        site_filter:
          $ref: '#/components/schemas/SiteId'
        incomplete:
          type: boolean
          description: >-
            True when the window crosses a month the call log no longer retains (archived and dropped): calls in that
            month are missing, so an empty page does not mean the window had no calls. Calls before `available_since`
            were archived. An old node leaves it out, which the page shows as unavailable rather than complete.
        available_since:
          type: string
          format: date-time
          description: >-
            The first instant of the oldest monthly partition the log still has; calls before it were archived.
            Absent with `incomplete` true when no monthly partition remains, so no window can be answered from the
            log.
    AdminAttempt:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
        endpoint_id: *admin_schema_id001
        supplier_id: *admin_schema_id001
        source_class: *admin_schema_id001
        egress: *admin_schema_id001
        outcome: *admin_schema_id001
        error_kind: *admin_schema_id001
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        first_token_ms:
          type: integer
    AdminCallTrace:
      type: object
      additionalProperties: false
      properties:
        summary:
          $ref: '#/components/schemas/AdminCallSummary'
        cost:
          $ref: '#/components/schemas/Money'
        route:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAttempt'
    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id: *admin_schema_id001
        actor_kind: *admin_schema_id001
        actor_id: *admin_schema_id001
        request_id: *admin_schema_id001
        action: *admin_schema_id001
        module: *admin_schema_id001
        target_kind: *admin_schema_id001
        target_id: *admin_schema_id001
        reason: *admin_schema_id001
        at:
          type: string
          format: date-time
        site_id:
          $ref: '#/components/schemas/SiteId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        detail:
          x-go-type: jsonx.Raw
          type: object

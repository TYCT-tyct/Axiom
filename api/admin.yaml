        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: catalog.manage
      parameters:
        - name: model_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/Uuid"}
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PriceSourceSelect"}
      responses:
        "200":
          description: The model as changed
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Model"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/exchange-rates:
    get:
      operationId: listExchangeRates
      tags: [Pricing]
      summary: List current exchange rates (manual and automatic)
      security:
        - session: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.view
      responses:
        "200":
          description: One current version per normalized pair
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeRateList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: setExchangeRate
      tags: [Pricing]
      summary: Append a manual exchange rate
      description: >-
        One base buys numerator/denominator quote. Both directions share a normalized history.
        Every write must be within 10^-6 to 10^6. Ordinary adjustments may differ at most fivefold;
        correction bypasses only that relative check and requires an audited reason.
        The first value requires kind initial and expected_version 0; without a trusted reference a reversed
        first value cannot be detected automatically. A stale expected version returns 409. The range and the fivefold
        limit are rules on the numerator and denominator together, so their 422 points at the whole body (an empty
        pointer).
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: pricing.manage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ExchangeRateInput"}
      responses:
        "201":
          description: The appended normalized version
          headers:
            Idempotency-Replayed: {$ref: "#/components/headers/IdempotencyReplayed"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ExchangeRate"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/admin/v1/pricing/exchange-rates/{base}/{quote}:
    get:
      operationId: exchangeRateHistory

        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Failure'
  /api/admin/v1/settings/mail/tests:
    post:
      operationId: testMailSettings
      tags:
      - Site
      summary: Send one fixed test mail using the saved transport. Accepted means SMTP acceptance; failed may be an
        unknown result. No automatic resend. Ten tests per session per minute.
      description: Send one fixed test mail using the saved transport. Accepted means SMTP acceptance; failed may
        be an unknown result. No automatic resend. Ten tests per session per minute.
      security:
      - session: []
        csrf: []
      x-axiom-level: mfa
      x-axiom-permission: sites.manage
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailConfigTest'
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigTestResult'
          headers:
            Idempotency-Replayed:

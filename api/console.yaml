# The console's API: what the user console calls on the public listener. Code on both sides is generated from this
# file (docs/architecture.md「仓库结构与契约文件」); change the contract here first. The conventions it follows, and
# the reasons, are in internal/platform/README.md「接口约定」; `just api` checks them.
openapi: 3.0.3
info:
  title: Axiom console API
  version: v1
  description: >-
    The API of the user console, under `/api/console/v1` on the public listener. A user signs in on a console domain
    of a site and works on their own account.


    Every operation that changes data needs the `Origin` of the site's console, `Content-Type: application/json`, and,
    with a session, the `X-CSRF-Token` of the session (security schemes `session` and `csrf`). `x-axiom-level` says
    what the session must have proved (`any`; `signed_in`, a password or better; `mfa`; `pending_mfa`) and
    `x-axiom-permission` which permission it needs on its account (`none` for no permission). A request without a
    session on an operation that needs one is a 401, one without the permission a 403. Every response carries
    `X-Request-ID` and `Cache-Control: no-store`.
tags:
  - {name: Session, description: "Sign-in, two-step verification and the current session."}
  - {name: Keys, description: "API keys."}
  - {name: Balance, description: "The account's money."}
  - {name: Calls, description: "The account's call log."}
  - {name: Top-ups, description: "Buying credits through the site's payment channels."}
paths:
  /api/console/v1/profile/name:
    get:
      operationId: getDisplayName
      tags: [Session]
      summary: Read the current display name
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The personal account display name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: {type: string, description: "Optional so older nodes can be handled as unavailable."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: changeDisplayName
      tags: [Session]
      summary: Change the display name
      description: >-
        Trims the personal account name; accepts 1 to 100 Unicode characters after trimming. Audits changes without storing the name in the audit log.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string, description: "Trimmed length must be 1 to 100 Unicode characters."}
      responses:
        "204": {description: "Accepted."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/profile/email:
    post:
      operationId: requestEmailChange
      tags: [Session]
      summary: Request a verified email change
      description: >-
        Requires the current password and a session that passed MFA when a second factor is enabled. Returns 409 email_taken only to the authenticated owner. Sends a 24-hour verification link to the new address; a second request replaces the first. The current email and sessions stay unchanged until confirmation. An invalid current email returns 422 before sending or spending the sending budget.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, current_password]
              properties:
                email: {type: string, minLength: 3, maxLength: 254}
                current_password: {type: string, minLength: 1, maxLength: 256}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "202": {description: "Accepted."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/profile/email/confirm:
    post:
      operationId: confirmEmailChange
      tags: [Session]
      summary: Confirm the email change
      description: >-
        Requires the same signed-in user and MFA when enabled. Consumes the token once, switches the verified email, audits masked before and after addresses and notifies the old address atomically. Raises the factor version, ends old sessions and recovery codes, and issues this device a replacement session at its existing level, with replacement recovery codes when TOTP is enabled. Invalid, replaced or used tokens return 422 invalid_verification; an expired current token returns the same code with an expiry message. If another user registered the address while pending, returns 409 email_taken.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: {type: string, minLength: 1, maxLength: 256}
      responses:
        "200":
          description: Email changed and current session replaced.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token: {type: string}
                  recovery_codes:
                    type: array
                    items: {type: string}
                    description: Replacement codes, returned only when TOTP is enabled.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/provider-keys:
    get:
      operationId: listProviderKeys
      tags: [Provider keys]
      summary: The account's own provider keys
      description: >-
        The provider keys the account saved, newest first. A key is never returned: only its last four characters are,
        so two keys of the same provider can be told apart. `status`, `enabled` and `rejected` say whether routing may
        use it; `fallback` says whether it may fall back to Axiom's endpoints for a model it covers
        (docs/domains/accounts.md「自带的供应商 key（BYOK）」).
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: The account's provider keys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderKeyList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createProviderKey
      tags: [Provider keys]
      summary: Add a provider key
      description: >-
        Saves the account's own key for one provider. The key is sealed with the same envelope encryption as a supplier
        credential and is never returned, logged or shown again; only its last four characters are. A provider this node
        cannot call answers 422 in `fields./provider`. Taking no idempotency key matches creating an API key: a lost
        response leaves a key the account can see and delete.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderKeyCreate"}
      responses:
        "201":
          description: The key as it is stored.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/provider-keys/{provider_key_id}:
    parameters:
      - name: provider_key_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      operationId: deleteProviderKey
      tags: [Provider keys]
      summary: Remove a provider key
      description: >-
        Takes the key out of routing and erases its sealed value. Attempts already made keep their rows. Another
        account's key is 404, the same answer as a key that does not exist.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "204":
          description: Removed.
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/provider-keys/{provider_key_id}/enabled:
    parameters:
      - name: provider_key_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: setProviderKeyEnabled
      tags: [Provider keys]
      summary: Switch a provider key on or off
      description: >-
        A disabled key is not picked by routing and its sealed value stays. Enabling a key a provider refused does not
        make it work; only a successful test clears `rejected`.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProviderKeyEnabled"}
      responses:
        "200":
          description: The key.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/provider-keys/{provider_key_id}/test:
    parameters:
      - name: provider_key_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: testProviderKey
      tags: [Provider keys]
      summary: Test a provider key
      description: >-
        Asks the provider whether the key works, with one small request. Success makes the key usable again, a refusal
        marks it rejected and routing skips it. A provider that is merely unreachable leaves the status as it was and
        answers `ok: false` with `inconclusive: true`, so an outage does not break a working key.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "200":
          description: What the test found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProviderKeyTest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/presets:
    get:
      operationId: listPresets
      tags: [Keys]
      summary: listPresets
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PresetList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createPreset
      tags: [Keys]
      summary: createPreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresetRequest"}
      responses:
        "201":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/presets/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$'}
    get:
      operationId: getPreset
      tags: [Keys]
      summary: getPreset
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updatePreset
      tags: [Keys]
      summary: updatePreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresetReplacement"}
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: deletePreset
      tags: [Keys]
      summary: deletePreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "204":
          description: Account preset result.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/routing-presets:
    get:
      operationId: listRoutingPresets
      tags: [Keys]
      summary: The routing presets the account's keys may use
      description: >-
        The live routing presets a key of the workspace may be bound to, the widest layer first: the platform's (those
        that limit prices only in the site's currency), the site's, the account's and the workspace's own. Without
        `workspace_id` the workspace is the account's default one, where the console makes keys. The system preset that
        keys made before presets route by is not among them. Disabled presets are not listed; `getRoutingPreset` still
        reads them. Routing presets are not the request presets of `/presets`: they choose which endpoints a key is
        routed to (docs/domains/routing.md「路由预设」).
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      parameters:
        - in: query
          name: workspace_id
          description: A workspace of the account; another account's, or a deleted one, is 404.
          schema: {$ref: "#/components/schemas/WorkspaceId"}
      responses:
        "200":
          description: The presets.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingPresetList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createRoutingPreset
      tags: [Keys]
      summary: Make a routing preset of the account or one of its workspaces
      description: >-
        Makes an account preset with its first version of rules, or with `workspace_id` a preset of that workspace,
        which only the workspace's keys and default may choose (404 for another account's workspace or a deleted one).
        The rules are checked whole: a member the format does not have, an override that widens what it inherits, or
        the platform's `advanced` settings are a 400 naming `/rules`. The slug is the layer's own, unique among its live
        presets (409 `name_taken`). An account holds at most 20 live presets and makes at most 200 in all, disabled ones
        counted; a workspace at most 10 and 100, which count against its account's too (409 `preset_quota`). A key bound
        to a new preset may be refused 503 `preset_unavailable` for up to 5 seconds, until every node has read it.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoutingPresetCreate"}
      responses:
        "201":
          description: The preset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingPreset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/routing-presets/checks:
    post:
      operationId: checkRoutingRules
      tags: [Keys]
      summary: Check a routing preset's rules before saving them
      description: >-
        Checks rules as `createRoutingPreset` and `updateRoutingPreset` would (400 naming `/rules` for what they refuse)
        and says what a list shows of them (`summary`) and which rules keep no endpoint the account's keys can see now
        (`unmatched`), so an editor refuses a preset that would fail every call without knowing which endpoints exist.
        Nothing is stored, and a write still takes rules that keep nothing: the endpoints change, and the answer is
        only true of now (docs/domains/routing.md「接口、权限与审计」).
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      x-axiom-safe: true
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoutingRulesCheckRequest"}
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingRulesCheck"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/routing-presets/{preset_id}:
    parameters:
      - in: path
        name: preset_id
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getRoutingPreset
      tags: [Keys]
      summary: One routing preset
      description: A preset the account can read, disabled or not, with its current rules.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: The preset.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingPreset"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateRoutingPreset
      tags: [Keys]
      summary: Change a routing preset of the account
      description: >-
        Replaces the name and the rules of one of the account's presets or its workspaces', at the `revision` the page read (409
        `stale_revision` when it moved on). Rules that differ from the current ones are a new version, which every key
        bound to the preset is routed by from the next routing snapshot, within 5 seconds; a rename keeps the version.
        A preset of the platform or the site is 403; a disabled one is 404.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RoutingPresetUpdate"}
      responses:
        "200":
          description: The preset as changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RoutingPreset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: disableRoutingPreset
      tags: [Keys]
      summary: Disable a routing preset of the account
      description: >-
        Disables one of the account's presets or its workspaces' at `revision`. The keys bound to it keep routing by it; no new key or
        default can choose it. A preset a default still points at is refused 409 `preset_in_use`: change the default
        first. A disabled preset still counts against the 200 the account may make.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      parameters:
        - in: query
          name: revision
          required: true
          schema: {type: integer, format: int64, minimum: 1}
      responses:
        "204": {description: Disabled.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/routing-default:
    get:
      operationId: getRoutingDefault
      tags: [Keys]
      summary: The account's default routing preset
      description: >-
        The preset the account's new keys are bound to, when the account sets one; absent `preset_id` means the
        account sets none and new keys take the site's or the platform's default. `new_keys_preset_id` names the
        preset a key made now in the account's default workspace takes, where the console makes keys, so a page can
        show which keys are bound to another; a default of that workspace's own comes before the account's.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: The account's default.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountRoutingDefault"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: setRoutingDefault
      tags: [Keys]
      summary: Set the account's default routing preset
      description: >-
        Points the account's default at a live preset of the platform, the site or the account, or clears it with a
        null `preset_id`, at the `version` the page read (409 `stale_revision` when it moved on). Only keys made after
        the change take it; the keys already made keep their presets. The system preset, a disabled preset and one the
        account cannot use are 400 `preset_not_selectable`.
      security:
        - session: []

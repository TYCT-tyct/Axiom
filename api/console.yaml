      description: >-
        The console compares it with the version it was built as and offers a reload when they differ, so a page
        left open across a deployment does not keep calling an API it no longer matches.
      security: []
      responses:
        "200":
          description: The running version
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [Session]
      summary: Sign in with email and password
      description: >-
        Sets the session cookie. A user with two-step verification gets a pending session (`mfa_required`) that only
        `verifyMfa` accepts. An unknown email costs a password hash too, so the answer does not tell whether the
        email exists. Needs the `Origin` of the surface, but no session.


        Limits: a token bucket per client IP shared by sign-in, registration and two-step verification (burst 20, 10 a
        minute), and failed sign-ins per email (10 in 15 minutes, then a wait; the account is never locked). A limit
        is a 429 with `Retry-After`. The values are site settings with defaults in code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in, or waiting for the second factor.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Session]
      summary: Request a password reset email
      description: >-
        Returns the same empty 202 for every valid email. Account lookup and email issuance run after acceptance.
        A later request immediately supersedes previous links. Links expire 30 minutes after the request.
        If no email arrives, wait and retry. Mail and processing failures alert the operator through the queue.
        Limited per email using the site sign-in email setting (default 10 per 15 minutes), independently counted,
        and by the sign-in IP bucket, with the same cache fallback.
        Email disabled or queue unavailable is an error for all addresses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, minLength: 3, maxLength: 254}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "202": {description: "Accepted; if the address is registered, a reset email will arrive. Retry later if none arrives."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/password-reset/complete:
    post:
      operationId: resetPassword
      tags: [Session]
      summary: Reset a forgotten password
      description: >-
        Consumes a single-use reset token on its own site and replaces the password. Invalid, expired, used,
        superseded and factor-stale tokens all return the same 422. Ends all sessions and recovery codes;
        TOTP stays enabled and sign-in is required. Password validation and hashing match registration.
        Consumption, password change, audit and password-changed notice commit together. Uses the sign-in IP limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: {type: string, minLength: 1, maxLength: 256}
                new_password: {type: string, minLength: 12, maxLength: 256}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "204": {description: "Password reset; sign in again."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/password:
    post:
      operationId: changePassword
      tags: [Session]
      summary: Change the signed-in user's password
      description: >-
        Requires the current password. With TOTP enabled the session must have passed MFA; a pending session
        cannot change a password. Issues a replacement session at the same level, ends all other sessions and
        old recovery codes (returning replacements when TOTP is enabled), invalidates reset tokens, audits the change and queues a localized notification atomically.
        Uses registration password validation and hashing; wrong current passwords spend the user failure bucket.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string, minLength: 1, maxLength: 256}
                new_password: {type: string, minLength: 12, maxLength: 256}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "200":
          description: Password changed and current session replaced.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  csrf_token: {type: string}
                  recovery_codes:
                    type: array
                    items: {type: string}
                    description: Replacement recovery codes, returned only when TOTP is enabled.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/mfa:
    post:
      operationId: verifyMfa
      tags: [Session]
      summary: Pass two-step verification
      description: >-
        Takes the pending session of `signIn` and a TOTP or recovery code. A right code ends the pending session and
        issues a new `mfa` session (new cookie, new CSRF token); a wrong one only counts an attempt (5 per pending
        session, 10 an hour per user), and a recovery code works once. Two requests with codes for the same
        challenge give one session.


        Limits: the per-IP bucket of `signIn`.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaRequest"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Session]
      summary: End the session
      description: Revokes the session of the cookie, whatever its level, and expires the cookie.
      security:
        - session: []
          csrf: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: The current session
      description: >-
        Who is signed in and what the session may do. A page calls it on load to learn whether to show the sign-in
        page, and to get the CSRF token again (the cookie is HttpOnly, so the page keeps the token only in memory).
      security:
        - session: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/sessions:
    get:
      operationId: listSessions
      tags: [Session]
      summary: The signed-in devices
      description: >-
        This user's live console sessions, newest first and at most 100, with when each was made and last used, the
        network it was signed in from and a short client description. `current` marks the session of this request. The
        network is the group the sign-in limits count (an IPv4 address as it is, an IPv6 allocation as its /64), and
        `client` is derived from the stored User-Agent, which is not returned. A sign-in that still waits for its
        second factor is not a signed-in device and is not listed; another surface's sessions (the admin's) and
        sessions ended by a factor change are not listed either.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The signed-in devices.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: revokeOtherSessions
      tags: [Session]
      summary: End every other session
      description: >-
        Revokes all other console sessions of the user, pending sign-ins included, and leaves the session of this
        request signed in. Returns how many ended. Another surface's sessions are not touched; replacing a factor
        ends those. The change and its audit entry commit together.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The other sessions ended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionRevocation"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SessionId"}
    delete:
      operationId: revokeSession
      tags: [Session]
      summary: End one other session
      description: >-
        Revokes one console session of the user. The asking session is ended by `signOut`, not here, so it is not
        found; neither is another user's, another surface's or one already ended. The change and its audit entry
        commit together.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "204": {description: "Ended."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/setup:
    post:
      operationId: beginTotpSetup
      tags: [Session]
      summary: Start enabling two-step verification
      description: >-
        Makes a new TOTP secret and the URI for its QR code. Nothing is stored, so calling it again just makes another
        secret; `confirmTotpSetup` stores the one the user proved.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: A new secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetup"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/confirm:
    post:
      operationId: confirmTotpSetup
      tags: [Session]
      summary: Finish enabling two-step verification
      description: >-
        Needs the password again and a code from the new secret. Stores the secret, makes the 10 recovery codes
        (shown only in this response) and replaces the user's sessions as described by `FactorChange`. Only for a user
        who has not enabled it: once on, it stays on and cannot be replaced from the console (409); the person
        who runs the deployment can reset it from the command line.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200":
          description: Enabled.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/replace:
    post:
      operationId: replaceTotp
      tags: [Session]
      summary: Replace two-step verification's secret
      description: >-
        Needs a session that passed two-step verification and proof of the factor being replaced: a current TOTP
        code or an unused recovery code in `current_code`. It also needs a code from the new secret, taken from
        `beginTotpSetup`, which stores nothing until this call. The old secret and every unused recovery code stop
        working, the user's other sessions end, and this device gets a new `mfa` session as `FactorChange` describes,
        all in one transaction with the audit entry. A factor that is not on is a 409; a user who lost both the
        authenticator and the recovery codes is reset from the command line.


        Limits: failed current or new codes count against the user's 10 an hour, like sign-in's second factor.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpReplaceRequest"}
      responses:
        "200":
          description: Replaced.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Session]
      summary: Make new recovery codes
      description: >-
        Needs a current TOTP code from a session that passed two-step verification. The old codes stop working, and
        the user's other sessions end.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryCodesRequest"}
      responses:
        "200":
          description: The new codes.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/recovery-codes/take:
    post:
      operationId: takeRecoveryCodes
      tags: [Session]
      summary: Take the recovery codes a provider link left for this session
      description: >-
        A provider link answers with a redirect, so the new recovery codes it makes cannot come back in that response.
        They are kept on the session the link issued, encrypted under its token, and this call reads them under the
        session row's lock and clears them in the same transaction: the first call returns them and later calls return
        none. Needs a signed-in console session; the codes belong to it.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The codes left for this session, or an empty list.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ShownRecoveryCodes"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/start:
    post:
      operationId: startOAuthSignIn
      tags: [Session]
      summary: Start signing in with a third-party provider
      description: >-
        Makes a single-use state and, where the provider supports it, a PKCE verifier, stores them with the site's
        callback URI and a nonce cookie, and returns the provider's authorization URL. The callback must carry that
        nonce or it signs no browser in: state alone would let a completed callback be used to sign another browser
        in to the account that began it. The flow is for one site and expires in 10
        minutes. Needs the `Origin` of the console and no session; a site that has not stored the provider's
        application is a 404, and a request on a console domain that is not the site's login domain is refused because
        the callback and its cookie belong to that domain. Limits: the sign-in per-IP bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthStartRequest"}
      responses:
        "200":
          description: The URL to send the browser to, with the nonce cookie the callback must return.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthStart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/link/start:
    post:
      operationId: startOAuthLink
      tags: [Session]
      summary: Start linking a third-party provider to the signed-in user
      description: >-
        The same flow as `startOAuthSignIn`, bound to this user and session. It is a credential change: a user with a
        second factor must be in an `mfa` session. The callback must return to this same browser and session, or it
        links nothing. Limits: the sign-in per-IP bucket.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthStartRequest"}
      responses:
        "200":
          description: The URL to send the browser to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthStart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      tags: [Session]
      summary: The provider's redirect back to the site
      description: >-
        Spends the state, exchanges the code for the stored callback URI, and reads the provider's subject. A sign-in
        matches that subject against linked identities only: an unknown one is not registered and its email never
        joins accounts (no automatic merge). A link attaches the subject to the session that began the flow, raises
        the user's factor version and issues a new session. Answers 303 under the console mount: `/console/` after a
        sign-in, `/console/security` after a link, and `/console/sign-in?oauth=failed` when the round trip fails, so a
        browser never lands on JSON. The path's provider must be the one the state was made for.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OAuthProvider"}
        - name: code
          in: query
          required: false
          schema: {type: string, maxLength: 2048}
        - name: state
          in: query
          required: false
          schema: {type: string, maxLength: 512}
      responses:
        "303":
          description: The browser goes to the console page for the outcome; the cookie is set on success.
          headers:
            Location: {required: true, schema: {type: string}}
            Set-Cookie:
              description: The new session cookie, on success.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/begin:
    post:
      operationId: beginPasskeySignIn
      tags: [Session]
      summary: Start signing in with a passkey
      description: >-
        A discoverable assertion: the browser offers every passkey for the site's login domain and the chosen one
        carries its user, so nobody types an email first and an unknown caller learns nothing about who exists. The
        ceremony requires user verification and expires in 5 minutes. Needs the `Origin` of the console and no session;
        the site must have passkeys on and a login domain. Limits: the sign-in per-IP bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The assertion challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/finish:
    post:
      operationId: finishPasskeySignIn
      tags: [Session]
      summary: Finish signing in with a passkey
      description: >-
        Verifies the assertion against the stored public key and the counter, then issues an `mfa` session: the
        authenticator verified the person and proved possession. A counter that goes backwards is refused; zero is
        what synced passkeys report and stays accepted. The body is the browser's credential JSON; `flow_id` is the
        one `beginPasskeySignIn` returned. Needs the `Origin` of the console and no session. Limits: the sign-in per-IP
        bucket.
      security: []
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/mfa/begin:
    post:
      operationId: beginPasskeyMfa
      tags: [Session]
      summary: Start the passkey factor of a pending sign-in
      description: >-
        The pending session a password sign-in issued is the only credential needed. The challenge names the user's
        credentials and requires user verification; it expires in 5 minutes.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The assertion challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/mfa/finish:
    post:
      operationId: finishPasskeyMfa
      tags: [Session]
      summary: Finish the passkey factor of a pending sign-in
      description: >-
        Verifies the assertion, ends the pending session and issues an `mfa` session. A failed ceremony counts one of
        the pending session's five attempts, as a wrong code does. The body is the browser's credential JSON;
        `flow_id` is the one `beginPasskeyMfa` returned.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys:
    get:
      operationId: listPasskeys
      tags: [Session]
      summary: The signed-in user's passkeys
      description: The credentials the account page offers to delete, newest last.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Passkeys"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [Session]
      summary: Start adding a passkey
      description: >-
        The current password is required, and a user with a second factor must be in an `mfa` session: a passkey can
        sign in on its own, so adding one from a password-only session would let a stolen password bypass the second
        factor. The challenge excludes the user's credentials and requires user verification; it expires in 5 minutes.
        At most 10 passkeys per user.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationRequest"}
      responses:
        "200":
          description: The creation challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Session]
      summary: Finish adding a passkey
      description: >-
        Verifies the attestation, stores the credential with the name the begin stored, raises the user's factor
        version, ends every other session and issues this browser an `mfa` session. The body is the browser's
        credential JSON; `flow_id` is the one `beginPasskeyRegistration` returned.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: The new passkey and the replacement session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Passkey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [Session]
      summary: Remove a passkey
      description: >-
        Requires the current password, and an `mfa` session when the user has another second factor. Raises the factor
        version, ends every other session and issues this browser a new session at the same level; audits the removal.
        The password remains a way in.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PasskeyId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyDeleteRequest"}
      responses:
        "200":
          description: The replacement session's CSRF token.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CredentialChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/identities:
    get:
      operationId: listIdentities
      tags: [Session]
      summary: The signed-in user's linked third-party accounts
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The linked identities.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identities"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/identities/{provider}:
    delete:
      operationId: unlinkIdentity
      tags: [Session]
      summary: Unlink a third-party account
      description: >-
        Requires an `mfa` session when the user has a second factor. Raises the factor version, ends every other
        session and issues this browser a new session at the same level; audits the removal. The password remains a
        way in.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: provider
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OAuthProvider"}
      responses:
        "200":
          description: The replacement session's CSRF token.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CredentialChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/legal:
    get:
      operationId: getLegalDocuments
      tags: [Session]
      summary: The site's current legal documents
      description: >-
        The terms of service and the privacy policy the site has published, at their current versions, in every
        published locale. Each body is Markdown (headings and paragraphs; never HTML). During the rolling-release
        compatibility phase a page takes the newest version of each kind, as an old node does, and uses its language
        only to choose the locale within that version; after old nodes exit the cleanup can enable independent per-locale
        streams. If an old node omits `locale`, the page treats the document as `zh` for display but omits the locale in
        the acceptance so the server resolves the version. It sends exactly the shown versions back with the
        registration or with `acceptLegalDocuments`. A site that publishes none answers an empty list and requires no
        acceptance. The text is public: no session is needed.
      security: []
      parameters:
        - name: locales
          in: query
          required: false
          description: >-
            `all` asks for every published locale. Omit it to preserve the pre-locale response of one current document
            per kind for an old page. A new page sends it; during the compatibility phase it still selects the newest
            version of each kind and only chooses the locale within that version.
          schema:
            type: string
            enum: [all]
      responses:
        "200":
          description: >-
            The current documents; one per kind and locale with `locales=all`, otherwise one per kind as an old node
            answered.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegalDocuments"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/legal/accept:
    post:
      operationId: acceptLegalDocuments
      tags: [Session]
      summary: Accept the current legal documents
      description: >-
        Records the signed-in user's acceptance of the current version of each kind, with the time. A page names the
        locale only when the response named one; when it read an old node's response, the acceptance omits the locale
        and the server resolves the kind and version to the one current document. A missing, stale or duplicate kind is
        `consent_required`: the page sends exactly one current document per kind, as `getLegalDocuments` returned it.
        Accepting the same version again changes nothing. A session may call this while the rest of the console is
        refused for want of acceptance.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegalAcceptance"}
      responses:
        "204": {description: Accepted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/site:
    get:
      operationId: getSite
      tags: [Session]
      summary: The site the request's domain belongs to
      description: >-
        What the sign-in and registration pages need before anyone is signed in: the site's name and logo for the
        brand, whether registration needs an invite, and, on a site with open registration, the proof-of-work
        difficulty the page must solve. The site is found from the `Host`, which must be a domain registered for the
        console; any other host gets a 404.
      security: []
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/site/logo/{hash}:
    get:
      operationId: getSiteLogo
      tags: [Session]
      summary: The site's logo
      description: >-
        The logo the site configures, at the URL `getSite` gives while the site has one. The URL carries the SHA-256 of
        the bytes served, so a logo never changes under its URL and a browser may keep it for a year. A hash the site
        never served is a 404; an earlier logo stays available under its own hash, so a page opened before the logo
        changed keeps its image.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        "200":
          description: The logo.
          headers:
            Cache-Control:
              required: true
              description: Long-lived and immutable, because the hash in the URL names the bytes.
              schema: {type: string}
          content:
            image/svg+xml:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/register:
    post:
      operationId: register
      tags: [Session]
      summary: Register with an invite code or open registration
      description: >-
        On a site registering by invitation, makes the user, their personal account, its default workspace and
        balance, in the site's default tier, and answers 201. It does not sign the user in: the page calls `signIn`
        next with the same credentials. An unusable code (unknown, its user disabled, or the site not registering by
        invitation) is one `invalid_invite`; a taken email is `email_taken`, and the whole registration is undone.


        On a site with open registration, checks the address against the site's domain lists and the proof of work,
        stores one pending registration without a password, and queues a single-use verification link; the answer is
        always 202 for a well-formed address, whether or not it is registered already, so an anonymous caller cannot
        learn which addresses exist. A password in this request is ignored: the verification page sets it after the
        address is proved, so a caller cannot choose the password of an address it does not own. A duplicate is found
        when the link is clicked and answered with `email_taken` there. A site that sets open registration but cannot
        send mail answers `unavailable`, and a closed site `registration_closed`.


        Limits: the per-IP bucket of `signIn`, and on open registration, the email domain's bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: Registered with an invite code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Registered"}
        "202":
          description: Open registration accepted; a verification link is on its way.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationPending"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Session]
      summary: Verify an open registration's email
      description: >-
        Turns the single-use token from the verification mail and the password chosen by the mailbox owner into the
        user, their personal account, its default workspace and balance. The password is validated and hashed only
        after the token is found; no password is kept before this request. The token is bound to the console domain
        and the pending registration; an unknown, expired or already used one is one `invalid_verification`, and an
        address registered in the meantime is `email_taken`. The user is not signed in: the page sends them to sign in
        with the password they chose. Limits: the per-IP bucket of `signIn`; an attempt spends one before the token is
        looked up or the password is hashed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyEmailRequest"}
      responses:
        "204": {description: Verified.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/keys:
    get:
      operationId: listKeys
      tags: [Keys]
      summary: The account's API keys
      description: >-
        Every key of the session's account that is not deleted, disabled and expired ones included, newest first by
        making. `name` and `prefix` search part of a key's name or prefix, ignoring case; `status` keeps active,
        disabled or expired keys; `created_after` and `created_before` keep the keys made in a range; `workspace_id` keeps one workspace's keys. A page reads the
        keys in the index's order and applies the filters as it goes, so a later page starts after the last key read,
        whatever the filters match. The text of a key is never returned again after `createKey`.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      parameters:
        - $ref: "#/components/parameters/KeyName"
        - $ref: "#/components/parameters/KeyPrefix"
        - $ref: "#/components/parameters/KeyStatus"
        - $ref: "#/components/parameters/KeyCreatedAfter"
        - $ref: "#/components/parameters/KeyCreatedBefore"
        - $ref: "#/components/parameters/KeyWorkspace"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of keys
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createKey
      tags: [Keys]
      summary: Make an API key
      description: >-
        Makes a call or management key in the workspace named, or the account's default one, with the site's prefix. A call key without
        `spend_limit` gets the site's daily default. A management key requires `expires_at` and both api_keys.manage
        and api_keys.view. It does not use the site's default spending limit: omitted `spend_limit` means its
        delegation ceiling is unrestricted; child call keys created with an omitted limit inherit that ceiling.
        The key text is in this response only; only its hash is
        stored. This operation takes no idempotency key: if the response is lost, the key shows in the list unused,
        and the user deletes it. The site may cap the keys an account holds, answered 409 `too_many_keys`, and the keys it
        makes in an hour, answered 429 with `Retry-After`; the message names the limit and how many the account has.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyCreate"}
      responses:
        "201":
          description: The key and its text.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/KeyId"}
    get:
      operationId: getKey
      tags: [Keys]
      summary: One API key
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateKey
      tags: [Keys]
      summary: Change an API key's settings
      description: >-
        Replaces every setting the user may change: what the request leaves out is unrestricted (no spend limit, any
        model, any IP), so a page sends back all of the key's current settings with its edit. The routing preset is
        the exception: left out, the key keeps its preset. The expiry cannot be changed after the key is made. Disabling takes effect on the next call on every node; `disabled: false`
        enables the key again.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeySettings"}
      responses:
        "200":
          description: The key as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: deleteKey
      tags: [Keys]
      summary: Delete an API key
      description: Deletes the key for good; it cannot be restored, and its calls stay in the call list.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/balance:
    get:
      operationId: getBalance
      tags: [Balance]
      summary: The account's balance
      description: >-
        What the user sees on arrival: the balance and what is left to spend. OpenRouter's `GET /api/v1/credits`
        returns total credits and total usage; Axiom returns the figures a call is admitted by, so the page can say
        why a call was refused.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The balance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/subscriptions:
    get:
      operationId: listAccountSubscriptions
      tags: [Balance]
      summary: The account's subscription
      description: >-
        The account's subscriptions, newest first, each with its current window: what the window holds, what it has
        used, what is held by calls in flight, and what is left (docs/domains/billing.md「订阅套餐」). A window's unused
        credit does not carry over. Calls draw on the plan first and on the balance when the window cannot cover them.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The subscriptions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccountSubscriptionList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/statement:
    get:
      operationId: listStatement
      tags: [Balance]
      summary: The account's credit statement
      description: >-
        Every credit event, newest first in ledger commit order: top-up, gift, call charge or reversal, expiry,
        refund freeze, unfreeze or completed refund. Corrections can create multiple events for one call.
        `reference` identifies the call for charges/reversals and the batch otherwise (the order ID for paid credit).
        Freezes change frozen credits but leave the total balance unchanged. No ledger entry, book or platform account appears. An event that commits while the pages
        are being read lands above the cursor and shifts none of the pages already read. Each page scans at most eight
        bounded candidate batches; zero-effect events are skipped. An empty `data` with a non-null `next_cursor`
        means continue through an empty segment, not end of history.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/statement.csv:
    get:
      operationId: exportStatement
      tags: [Balance]
      summary: The account's credit statement as a CSV file
      description: >-
        The rows of `listStatement`, newest first, as comma-separated text under a header row: `at` (RFC 3339, UTC),
        `kind`, `amount`, `balance_after` (empty where the row's balance after is null), `currency`, `reference`,
        `frozen_change`, `frozen_after`.
        All amounts are exact decimals in site credits. At most the newest 10 000 events are streamed in cursor pages
        using bounded memory. Empty continuation pages are traversed. A failure after output starts closes the
        connection rather than completing a truncated CSV. Older events remain accessible through `listStatement`.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The statement, at most the newest 10 000 movements.
          headers:
            Content-Disposition:
              required: true
              description: An attachment named for its contents.
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls:
    get:
      operationId: listCalls
      tags: [Calls]
      summary: The account's calls
      description: >-
        The calls of the session's account, newest first, as the call log keeps them: no conversation content, and no
        supplier costs or credentials. attempt_count is read from the call row. A new call arriving does not shift the pages already read.
        A filter by model or client application reads that filter's index, so a rare model costs what it matches, not
        what the account holds. `since` is inclusive and `until` exclusive.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - name: fell_back
          in: query
          schema: {type: boolean}
          description: When true, only calls with attempt_count greater than one.
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of calls
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/usage/statistics:
    get:
      operationId: getUsageStatistics
      tags: [Calls]
      summary: Usage trends and totals from hourly rollups
      description: >-
        Account-scoped, eventually consistent statistics; never scans call detail. Defaults to the last 30 days
        ending at the latest closed UTC hour, or 7 days for hour granularity. Both bounds must be whole UTC hours;
        partial hours, empty windows, ranges over 90 days (7 days for hour), and over 10000 result rows return 400
        invalid_request. Day buckets start at UTC midnight; weeks start Monday UTC. Partial day/week edge buckets
        contain only hours inside [since,until). Missing buckets and groups are omitted, meaning zero requests and
        spend; empty totals arrays also mean zero. Currencies stay separate. Tokens sum only reported fields;
        an absent token kind means no reports, and a present sum may cover only some requests. input includes
        non-cache text, audio and image tokens; output includes reasoning, audio and image tokens. cache_write combines
        five-minute and one-hour writes. Cache hit rate is cache_read divided by physical input, using only calls
        reporting both; cache_rate_requests states their count. Missing or zero denominators omit the rate.
        Success means empty error_kind. Pending billing records are excluded, as in listCalls. compare=previous
        returns totals for [since-(until-since),since) from the same snapshot with the same filters. Historical
        backfill covers existing hot call records, not already archived records; backfill_complete=false means
        history is still incomplete; recent data may also lag while backfill and live ingestion compete for capacity.
        Each batch can consume its backfilled events plus another batch of live events. Rollups survive call-log archival. No content, supplier identity, cost or routing
        data. New response members are optional for rolling release; old nodes return 404 for this operation.
        Ten-second request deadline.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - name: granularity
          in: query
          schema: {type: string, enum: [hour, day, week], default: day}
        - name: group_by
          in: query
          schema: {type: string, enum: [model, key, workspace]}
        - name: compare
          in: query
          schema: {type: string, enum: [previous]}
      responses:
        "200":
          description: Complete rollup result for the selected window, subject to asynchronous ingestion and backfill
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UsageStatistics"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/aggregate:
    get:
      operationId: aggregateCalls
      tags: [Calls]
      summary: Calls and user charges grouped by UTC day, model or key
      description: >-
        All matching calls in the window, independent of list pagination. Defaults to the last 30 days ending now;
        at most 31 days and 1000 groups. A larger result is refused with 400; narrow the window or filters.
        Currencies are grouped separately. Charges are exact integer text in billionths, never supplier cost.
        No conversation content, endpoint or routing data. Ten-second request deadline.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [day, model, key], default: day}
      responses:
        "200":
          description: Complete totals for the selected window
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallAggregates"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/export:
    get:
      operationId: exportCalls
      tags: [Calls]
      summary: Stream the account's call metadata as CSV
      description: >-
        Same filters and newest-first cursor order as listCalls, from one database snapshot. Defaults to the last
        30 days ending now, at most 31 days. At most 10000 matching rows, streamed in pages of 200.
        Before writing CSV, a bounded ordered key probe in the same snapshot reads at most 10001 matching keys.
        More than 10000 matches is a 400 response: narrow the window or filters. A successful CSV contains
        every matching row after the optional cursor; it is never silently truncated. No HTTP trailers are needed.
        X-Export-Since and X-Export-Until return the effective window, including defaults.
        A failure after streaming starts aborts the connection.
        Ten-second request deadline includes writes, and cancellation releases the snapshot.
        Amounts are exact decimal text in currency units with nine fractional digits. Cells whose first
        non-whitespace character is =, +, -, or @ are prefixed with an apostrophe; CSV quoting alone is insufficient.
        No conversation content, credentials, supplier cost, endpoint or route.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Complete CSV of the selected calls, never a truncated chunk
          headers:
            Content-Disposition:
              schema: {type: string}
            X-Export-Since:
              description: Effective inclusive start, including the default window.
              schema: {type: string, format: date-time}
            X-Export-Until:
              description: Effective exclusive end, including the default window.
              schema: {type: string, format: date-time}
          content:
            text/csv:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/{call_id}:
    get:
      operationId: getCall
      tags: [Calls]
      summary: One call
      description: >-
        The call with this ID (the `X-Request-ID` of its response), if it is the session's account's. Includes attempts in sequence order and a safe routing summary. No supplier names, egress or credentials.
        New fields are optional across rolling releases; missing legacy attempts return an empty array and route may be absent.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - name: call_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/CallId"}
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Call"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/models/account:
    get:
      operationId: listAccountModels
      tags: [Models]
      summary: List the published models at the signed-in account's prices
      description: >-
        The same projection as `listPublicModels`, priced for the session's account and its current tier. A signed-in user
        sees the price a call would be charged at, so a tier change shows on the next request. The endpoints and their
        prices are the account's own, exactly as a call from its key would see them. Prices are present whether or not
        the site publishes them to visitors: the caller is a member of the site. The account is read in the same scope
        as the rest of the console; no supplier name, upstream name, route or cost is ever part of the answer.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - $ref: "#/components/parameters/ModelQuery"
        - $ref: "#/components/parameters/ModelAuthor"
        - $ref: "#/components/parameters/ModelAbility"
      responses:
        "200":
          description: The published models at the account's prices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicModelList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/models:
    get:
      operationId: listPublicModels
      tags: [Models]
      summary: List the published models and the site's sale prices
      description: >-
        The public projection of the catalog: the models the node serves and prices, under their public names, with
        their limits, abilities, the endpoints that serve each model and, when the site publishes prices, the sale
        prices of the site's default tier. It is the price a visitor pays after registering, and the same data the
        website's models and prices page shows. A site may keep its prices to signed-in members
        (`model_prices_public` in the admin settings): this anonymous projection then leaves every `pricing` out and
        still lists the models and their endpoints, so the page shows a no-price state rather than an error. While a
        gateway node of a previous release is live, every node keeps prices public; the setting applies only after
        every live node supports it. Each
        endpoint carries the group's stable public codename — the identity `provider.only`, `provider.ignore` and
        presets accept — its attributes and, when prices are published, its own price; a directly connected official
        API shows its real name. It carries no supplier name, upstream name, route, cost, internal name, price source
        or evidence. An anonymous request is answered for the site of the `Host`, like `getSite`; any other host is a
        404.
      security: []
      parameters:
        - $ref: "#/components/parameters/ModelQuery"
        - $ref: "#/components/parameters/ModelAuthor"
        - $ref: "#/components/parameters/ModelAbility"
      responses:
        "200":
          description: The published models at the site's default-tier prices
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicModelList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [Top-ups]
      summary: What some credits cost through each payment method
      description: >-
        For the top-up page: every payment method the site takes for this amount that has a merchant account able to
        take it now, with what the user would pay through it, fee included, in the currency that method is paid in
        (not the site's). A method whose accounts are all over a limit, unusable, or in a currency without an exchange
        rate is left out. The price is a quote: `createOrder` locks the rate and the merchant account when it places
        the order. A site that has not opened top-ups is `not_ready`; an amount outside the site's limits is
        `unprocessable`.


        Needs `balance.view`, like every operation of the account's money in this version of the roles.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: credits
          in: query
          required: true
          description: "The credits to buy, in billionths of one unit of the site's currency, as a positive integer in decimal text."
          schema: {type: string, pattern: '^[1-9][0-9]{0,18}$', example: "10000000000"}
      responses:
        "200":
          description: The methods, in the order the site lists them
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMethodList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders:
    get:
      operationId: listOrders
      tags: [Top-ups]
      summary: The account's top-up orders
      description: >-
        Newest first, `limit` per page, continued with `next_cursor`. Only the account's own orders; another account's
        never appear. Each order carries its refunds, oldest first, so the page can show where a request stands without
        a second call. A node of the previous release sends no `refunds`, `refund_allowed` or paid facts; the page then
        shows refunds and receipts as unavailable instead of guessing.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the account's orders
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createOrder
      tags: [Top-ups]
      summary: Place a top-up order
      description: >-
        Places an order for credits paid by a method and, in the same request, asks the payment channel for the page to
        pay on. The server picks the merchant account and locks the price and the exchange rate for the order's
        lifetime. The address the browser comes back to is built by the server from the console's registered origin;
        the request cannot carry one. Needs `balance.view`, like every operation of the account's money in this version
        of the roles.


        `Idempotency-Key` makes the request happen once per account: the same key with the same request returns the
        order it made, even if top-ups were closed since, and the same key with another method or amount is
        `idempotency_key_reused`. A new key is a new order. Read the answer by its status, never by "no error":
        `201` is a waiting order with `checkout` to send the user to (its `client_secret`, when the channel gives one,
        is in this response only and never in a replay); `202` is a waiting order the channel has not confirmed (the
        request failed in transit or is still running, so the order may exist at the gateway, and a replay of the key
        answers `202` again): it has no `checkout`, the user must not pay it, and the page cancels it or lets it
        expire; `200` is an order that is no longer waiting (paid, cancelled, expired, in review, ...), shown as its
        `state` says and without `checkout`; `422` is an order the channel refused, which stays refused for this key,
        so the page starts a new top-up with a new key (and another method if it happens again).


        Limits (each refuses the request, with what to do next): at most a few orders waiting for payment per account
        (`conflict`: pay or cancel one first); cancellations per account per hour (`rate_limited`); the site's daily
        limit per account and the limit of a first top-up (`unprocessable`); and per IP group, orders per hour and
        failed orders per hour (`rate_limited`, `Retry-After` the time until the hour is over). An IPv6 address counts
        by its /64. If the counting itself fails, the request is refused (`internal`), never let through.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "A key the caller chooses for one intended top-up, 1 to 128 of letters, digits and `._:-` (a UUID is fine)."
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderCreate"}
      responses:
        "200":
          description: The order is no longer waiting (a replay), without a checkout.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "201":
          description: A waiting order with the page to pay on.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "202":
          description: A waiting order the channel has not confirmed. It has no checkout and is not to be paid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    get:
      operationId: getOrder
      tags: [Top-ups]
      summary: One top-up order
      description: >-
        The account's own order, as it is now. Only a waiting order has a `checkout`. An order of another account is
        a 404 like one that does not exist, so no one reads another account's receipt. Once paid it carries the facts a
        receipt renders: `paid_at`, `paid_total`, `credited` and its refunds.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}/cancel:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    post:
      operationId: cancelOrder
      tags: [Top-ups]
      summary: Cancel an order that waits for payment
      description: >-
        The order stops being payable here and frees its place among the account's waiting orders; the channel is then
        asked to close it. Cancelling a cancelled order answers with it again. An order that is paid, expired or
        otherwise past waiting is `conflict`. Cancellations count against the account's hourly limit.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      responses:
        "200":
          description: The order, cancelled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}/verify:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    post:
      operationId: verifyOrder
      tags: [Top-ups]
      summary: Ask the payment channel about an order now
      description: >-
        The page's "I have paid" button. Asks the payment channel once whether the order was paid and credits it if so;
        the answer is the order as it is afterwards, so a payment that has not arrived yet leaves it waiting. The page
        shows success only when `state` is `paid`. Each order may be asked about once a minute (`rate_limited`,
        `Retry-After` 60). A channel that does not answer is `unavailable`; the payment is not lost, the callback or
        the next query credits it.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}/refunds:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    post:
      operationId: requestRefund
      tags: [Top-ups]
      summary: Ask for a refund of unused credits from an order
      description: >-
        The order page's refund request. It only works for an order paid through a merchant account that lets users
        request refunds, and only for the part of that order's paid credits that is neither spent, expired nor already
        frozen: `credits` is what the user asks to give back, and the answer's `credits` is what was actually frozen,
        which can be less. The cash quote is computed from the batch's own payment and the site's refund policy, never
        from the order's quote at the time. The request waits for a different administrator to approve it, so the
        answer's `state` is `pending_review`; the order keeps its state meanwhile. A channel that cannot refund, or an order
        whose merchant does not allow user requests, is `forbidden`; a second request while one is in flight is
        `conflict`; an amount with nothing refundable left is `unprocessable`. `Idempotency-Key` makes the request
        happen once per order: the same key with the same credits and reason returns the stored refund, and another
        request under it is `idempotency_key_reused`.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "A key the caller chooses for one intended refund, 1 to 128 of letters, digits and `._:-` (a UUID is fine)."
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RefundRequest"}
      responses:
        "201":
          description: The refund, frozen and waiting for approval.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrderRefund"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/redeem-codes:
    get:
      operationId: listRedemptions
      tags: [Top-ups]
      summary: The redeem codes this account redeemed, newest first
      description: >-
        One page of the credit this account got from redeem codes, newest first: each redemption's credit, when it was
        redeemed, and when the credit expires. It never shows a code, only its last four characters, so the history is
        not a way to recover one. Needs `balance.view`, like every read of the account's money.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the account's redemptions, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemCodeHistory"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: redeemCode
      tags: [Top-ups]
      summary: Redeem a code into credit
      description: >-
        Turns a code the site issued into a credit batch of the account's currency, with the code's expiry, and records
        it in the account's history. A code credits once, whichever account redeems it: `201` is the credit this
        request made, `200` is the credit an earlier request with the same `Idempotency-Key` made (the answer was lost;
        the key is reused, not the code), and a code already redeemed with another key is `conflict`. A code that is
        unknown, expired or disabled is `unprocessable`; a code is never echoed in an answer or an error.


        Attempts that fail are limited per account and per network, an hour at a time: past the limit the request is
        `rate_limited` with `Retry-After` the seconds until the window is over, and the attempt is counted before the
        code is looked at. A replay of the key is not an attempt. If the counting itself fails, the request is refused
        (`internal`), never let through.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "A key the caller chooses for one intended redemption, 1 to 128 of letters, digits and `._:-` (a UUID is fine)."
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RedeemCodeRequest"}
      responses:
        "200":
          description: The credit an earlier request with this key made.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemCodeRedemption"}
        "201":
          description: The credit this code made.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RedeemCodeRedemption"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-axiom_session
      description: >-
        The session cookie (HttpOnly, Secure, SameSite=Lax). Its name loses the `__Host-` prefix only where the site's
        registered origin is `http://localhost`. The sign-in operations set it, and it is valid only on the surface
        that issued it.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, which sign-in, two-step verification and `getSession` return. Every request that
        changes data and carries a session sends it; the request must also carry an `Origin` equal to the origin
        registered for the site and surface, and `Content-Type: application/json`. The API sends no CORS headers.
  headers:
    SetCookie:
      required: true
      description: The new session cookie, or an expired one that ends the session.
      schema: {type: string}
  parameters:
    CallSince:
      name: since
      in: query
      schema: {type: string, format: date-time}
    CallUntil:
      name: until
      in: query
      schema: {type: string, format: date-time}
    CallModel:
      name: model
      in: query
      description: Exactly the model name the client asked for.
      schema: {type: string, maxLength: 200}
    CallClientApp:
      name: client_app
      in: query
      schema: {type: string, maxLength: 200}
    ModelQuery:
      name: q
      in: query
      description: Part of a model's public ID or display name, ignoring case. Omit for every model.
      schema: {type: string, maxLength: 100}
    ModelAuthor:
      name: author
      in: query
      description: The exact author slug, ignoring case. Omit for every author.
      schema: {type: string, maxLength: 100}
    ModelAbility:
      name: ability
      in: query
      description: Only models that declare this ability. Omit for every ability.
      schema: {$ref: "#/components/schemas/ModelAbility"}
    CallKey:
      name: key_id
      in: query
      schema: {$ref: "#/components/schemas/KeyId"}
    CallWorkspace:
      name: workspace_id
      in: query
      schema: {$ref: "#/components/schemas/WorkspaceId"}
    CallStatus:
      name: status
      in: query
      description: success means empty error_kind; error means nonempty error_kind. Omit for both.
      schema: {$ref: "#/components/schemas/CallStatus"}
    CallRequestId:
      name: request_id
      in: query
      schema: {$ref: "#/components/schemas/CallId"}
    KeyName:
      name: name
      in: query
      description: Part of a key's name, ignoring case. Omit for every name.
      schema: {type: string, maxLength: 100}
    KeyPrefix:
      name: prefix
      in: query
      description: The beginning of a key's prefix, ignoring case. Omit for every prefix.
      schema: {type: string, maxLength: 16}
    KeyStatus:
      name: status
      in: query
      description: A key's state as the list shows it. Omit for every state.
      schema: {$ref: "#/components/schemas/KeyStatus"}
    KeyCreatedAfter:
      name: created_after
      in: query
      description: Keys the database stamped at or after this instant.
      schema: {type: string, format: date-time}
    KeyCreatedBefore:
      name: created_before
      in: query
      description: Keys the database stamped before this instant.
      schema: {type: string, format: date-time}
    KeyWorkspace:
      name: workspace_id
      in: query
      description: Keys of this workspace only; another account's workspace has none.
      schema: {$ref: "#/components/schemas/WorkspaceId"}
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid for
        the same filters, and a malformed one is a 400.
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    BadRequest:
      description: >-
        The request is malformed or breaks a constraint of the contract (`invalid_request`), or names a routing preset
        it may not choose (`preset_not_selectable`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: >-
        No valid session for this surface, or the credentials of a sign-in are wrong, alike for an unknown email, a
        wrong password and a disabled user (`unauthenticated`, `invalid_credentials`, `invalid_code`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The session may not do this: the permission is missing, the session has not passed two-step verification
        (`mfa_required`), the Origin, content type or CSRF token is wrong (`origin_rejected`), or the current legal
        documents have not been accepted (`consent_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: >-
        There is no such resource, or the session's scope cannot see it. A malformed ID and an unknown one answer
        alike (`not_found`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`, `preset_default_invalid`, `preset_in_use`, `preset_quota`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`, `cap_exceeded`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Failure:
      description: >-
        Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503), `presets_suspended` (503, a routing preset or default write, or a key's choice of a preset, while the
        platform has suspended routing presets). A 500 never carries the internal error's text.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    RoutingRules:
      x-go-type: jsonx.Raw
      type: object
      description: >-
        A preset's rules (docs/domains/routing.md「规则内容」): `default`, the rule every model is held to, and `rules`,
        up to 100 overrides by model `author` or `model`, each only narrowing what it inherits; a member an override
        leaves out is what it inherits. At most 16 KiB. The server checks them whole, and refuses a member it does not
        know (400 naming `/rules`), so a member a newer node added and an older one cannot read keeps that preset
        unavailable there rather than half applied; a page that edits rules keeps every member it does not show. A
        member written `null`, and a `sort` written `""`, is the same as leaving it out, as the server has always read
        them, so rules stored that way can be written back unchanged.
      properties:
        default:
          allOf: [{$ref: "#/components/schemas/RoutingRule"}]
          nullable: true
        rules:
          type: array
          nullable: true
          maxItems: 100
          items: {$ref: "#/components/schemas/RoutingRuleOverride"}
        advanced:
          allOf: [{$ref: "#/components/schemas/RoutingAdvanced"}]
          nullable: true
    RoutingSort:
      type: string
      enum: [balanced, price, throughput, latency, quality]
      description: >-
        How a rule orders the endpoints it keeps: `balanced` (price-weighted random, the default rule's when it names
        none), `price`, `throughput`, `latency`, or `quality` (operations quality: fast and steady, not the product
        score).
    RoutingRule:
      type: object
      description: The rule every model is held to, or the conditions of an override.
      properties:
        sort:
          nullable: true
          anyOf:
            - $ref: "#/components/schemas/RoutingSort"
            - {type: string, enum: [""]}
        classes:
          type: array
          nullable: true
          minItems: 1
          items: {type: string}
          description: >-
            The source classes kept, by slug (the classes `listRoutingSourceClasses` names), or `["*"]` for every class
            now and later. A slug the node does not know matches no endpoint.
        policies:
          type: array
          nullable: true
          minItems: 1
          items:
            type: string
            enum: ["*", no_retention, retained, may_train]
          description: The data policies kept, or `["*"]` for every one.
        min_score: {type: number, nullable: true, minimum: 0, maximum: 100, description: "The product score an endpoint needs (official direct = 100). An endpoint without a valid score never meets it, even at 0."}
        min_score_confidence: {type: number, nullable: true, minimum: 0, maximum: 1, description: "The confidence of that score an endpoint needs. An endpoint without a valid score never meets it, even at 0."}
        verified_only: {type: boolean, nullable: true, description: "Only endpoints verified as the model they claim; an override cannot turn it off."}
        max_price:
          allOf: [{$ref: "#/components/schemas/RoutingPriceLimit"}]
          nullable: true
    RoutingRuleOverride:
      description: >-
        A rule for one model author or one model, by its catalog slug: exactly one of `author` and `model`, each named
        at most once in a preset. A model's rule narrows its author's rule when there is one, the default otherwise.
      allOf:
        - $ref: "#/components/schemas/RoutingRule"
        - type: object
          properties:
            author: {type: string, nullable: true, description: "A catalog author slug, such as `anthropic`."}
            model: {type: string, nullable: true, description: "A catalog model slug, such as `anthropic/claude-opus-4.1`."}
    RoutingPriceLimit:
      type: object
      description: >-
        The highest unit price an endpoint may sell at, per item, in the preset's currency, as decimal strings, never JSON
        numbers: `prompt` and `completion` per million tokens (0 to 10^9, at most 9 decimals), `request` per call (0 to
        1000, at most 15 decimals). An item left out is not limited; 0 keeps only endpoints that charge nothing for it.
      properties:
        prompt: {type: string, nullable: true, pattern: '^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]{1,3})?$'}
        completion: {type: string, nullable: true, pattern: '^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]{1,3})?$'}
        request: {type: string, nullable: true, pattern: '^[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]{1,3})?$'}
    RoutingAdvanced:
      type: object
      description: >-
        The platform's run-time settings, which only a platform preset may hold: `order`, supplier group codenames tried
        first (at most 20); `no_fallbacks`, only those groups (needs an order); `max_attempts` (0 to 4, 0 the router's
        default); `sticky_ttl` (0 to 86400 seconds) and `attempt_window` (0 to 600 seconds), 0 the router's defaults;
        `min_quality` and `min_confidence`, the operations quality floor (0 to 1).
      properties:
        order:
          type: array
          nullable: true
          maxItems: 20
          items: {type: string}
        no_fallbacks: {type: boolean, nullable: true}
        max_attempts: {type: integer, nullable: true, minimum: 0, maximum: 4}
        sticky_ttl: {type: integer, nullable: true, format: int64, minimum: 0, maximum: 86400}
        attempt_window: {type: integer, nullable: true, format: int64, minimum: 0, maximum: 600}
        min_quality: {type: number, nullable: true, minimum: 0, maximum: 1}
        min_confidence: {type: number, nullable: true, minimum: 0, maximum: 1}
    RoutingRulesSummary:
      type: object
      required: [sort, verified_only, priced, overrides]
      description: >-
        What a list shows of a preset's rules, worked out by the server so every page says the same: the default rule's
        `sort` (`balanced` when it names none) and `classes` (absent when it keeps every class), whether it keeps only
        verified endpoints, whether any rule limits a price, and how many overrides follow.
      properties:
        sort: {$ref: "#/components/schemas/RoutingSort"}
        classes:
          type: array
          items: {type: string}
        verified_only: {type: boolean}
        priced: {type: boolean}
        overrides: {type: integer, minimum: 0, maximum: 100}
    RoutingRuleUnmatched:
      type: object
      required: [fields]
      description: >-
        A rule that keeps none of the endpoints in view, judged as a model list judges a key's endpoints: hard
        conditions only, the price at the standard tier and the shortest prompt, nothing transient such as load or a
        tripped breaker. An override is judged against its author's or model's endpoints, and one whose author or model
        has none in view is not judged.
      properties:
        index:
          type: integer
          minimum: 0
          description: The override's index in `rules`; absent for the default rule.
        fields:
          type: array
          description: >-
            The conditions the rule itself writes that alone keep no endpoint, by their names in the rule
            (`max_price.prompt` for an item of its price limit). Empty when only the conditions together keep none, or
            when the rule keeps none because of what it inherits, which the rule above is named for.
          items:
            type: string
            enum: [classes, policies, min_score, min_score_confidence, verified_only, max_price.prompt, max_price.completion, max_price.request]
    RoutingRulesCheck:
      type: object
      required: [summary, unmatched]
      properties:
        summary: {$ref: "#/components/schemas/RoutingRulesSummary"}
        unmatched:
          type: array
          maxItems: 101
          items: {$ref: "#/components/schemas/RoutingRuleUnmatched"}
          description: The rules that keep no endpoint, the default first, then the overrides in order; empty when every rule keeps one.
    RoutingRulesCheckRequest:
      type: object
      additionalProperties: false
      required: [rules]
      properties:
        rules: {$ref: "#/components/schemas/RoutingRules"}
    RoutingPresetScope:
      type: string
      enum: [platform, site, account, workspace]
      description: The layer the preset belongs to.
    RoutingPreset:
      type: object
      required: [id, scope, slug, name, revision, version, rules, disabled, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        scope: {$ref: "#/components/schemas/RoutingPresetScope"}
        slug: {type: string}
        name: {type: string}
        revision: {type: integer, format: int64, description: "Moves on every change; a change names the revision it read."}
        version: {type: integer, format: int64, description: "The rules' version, which moves only when the rules change."}
        currency: {type: string, description: "The currency of a platform preset's price limits; absent for the others, which are in the site's."}
        workspace_id:
          allOf: [{$ref: "#/components/schemas/WorkspaceId"}]
          description: The workspace of a workspace's preset; absent for the other layers' and from older nodes.
        rules: {$ref: "#/components/schemas/RoutingRules"}
        disabled: {type: boolean}
        keys: {type: integer, format: int64, minimum: 0, description: "The keys bound to the preset that are not deleted: the caller's account's in the console, every account's in the admin API. Given when a preset is listed or read, never for the system preset, which every unbound key also follows; absent from nodes that do not count them."}
        summary:
          allOf: [{$ref: "#/components/schemas/RoutingRulesSummary"}]
          description: What a list shows of the rules; absent from older nodes and for rules this node cannot read, which a page then says it does not know.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RoutingPresetList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/RoutingPreset"}
    RoutingPresetCreate:
      type: object
      additionalProperties: false
      required: [slug, name, rules]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: "Unique among the layer's live presets; it cannot be changed."}
        name: {type: string, minLength: 1, maxLength: 100}
        rules: {$ref: "#/components/schemas/RoutingRules"}
        workspace_id:
          allOf: [{$ref: "#/components/schemas/WorkspaceId"}]
          description: Makes the preset the workspace's; absent makes it the account's.
    RoutingPresetUpdate:
      type: object
      additionalProperties: false
      required: [name, rules, revision]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        rules: {$ref: "#/components/schemas/RoutingRules"}
        revision: {type: integer, format: int64, minimum: 1}
    RoutingPresetSummary:
      type: object
      required: [id, name, scope, version]
      description: The preset a key is bound to, as the key list shows it.
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        scope: {$ref: "#/components/schemas/RoutingPresetScope"}
        version: {type: integer, format: int64}
        disabled: {type: boolean}
    AccountRoutingDefault:
      type: object
      required: [version]
      properties:
        preset_id: {type: string, format: uuid, description: "Absent when the layer sets no default."}
        version: {type: integer, format: int64, minimum: 0, description: "0 when the layer has no default; a change names the version it read."}
        new_keys_preset_id:
          type: string
          format: uuid
          description: >-
            The preset a call key made now is bound to: the default of the first layer that sets one, from the
            workspace (the account's default workspace, for the account's default) up to the account, the site and the
            platform, else the system preset (the zero UUID). Absent when that default cannot be used
            (`new_keys_refused`) and from older nodes.
        new_keys_refused:
          type: boolean
          description: >-
            True when the deepest default set is one the key cannot use, so a call key made now without a preset
            is refused 409 `preset_default_invalid` until that default is changed. Absent otherwise.
        new_keys_layer:
          allOf: [{$ref: "#/components/schemas/RoutingPresetScope"}]
          description: >-
            The layer whose default decides what a key made now takes: the one `new_keys_preset_id` follows, or the
            one whose default refuses (`new_keys_refused`); `platform` when no layer sets one and new keys take the
            system preset. `workspace` on the account's default means the default workspace sets its own, which comes
            before the account's. Absent from older nodes.
    RoutingDefaultUpdate:
      type: object
      additionalProperties: false
      required: [preset_id, version]
      properties:
        preset_id: {type: string, format: uuid, nullable: true, description: "null clears the layer's default."}
        version: {type: integer, format: int64, minimum: 0}
    SourceClassName:
      type: object
      required: [slug, name, name_zh]
      properties:
        slug: {type: string}
        name: {type: string}
        name_zh: {type: string, description: "The Chinese name; empty when the platform gave none."}
    SourceClassNameList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/SourceClassName"}
    PresetConfig:
      x-go-type: jsonx.Raw
      type: object
      additionalProperties: true
      description: >-
        Inference defaults a call that names the preset starts from, its own members overriding them
        (docs/domains/routing.md「命名预设」): only deliberate configuration, never messages, input, stream or session identifiers. At most 16 KiB.
        The members it may hold are listed; any other is refused with 422. They are request members of the call
        formats (Chat Completions, Responses, Messages), whose shapes differ by format and are checked by the gateway
        when a call merges them, so this contract names them without typing them: typing would restate three request
        schemas here, and would move the refusal of a bad value from the server's 422 to the contract's 400. On saving,
        the server checks the values of only the five members whose description gives a rule.
      properties:
        model: {description: "The model, a string of 1 to 200 characters that names no other preset (`@preset/`)."}
        models: {description: "Fallback models, an array of at most 8 strings like `model`; without `model` the first is the main one."}
        system: {description: "A system prompt, a string; added to a request that has none (docs/domains/routing.md「命名预设」)."}
        cache_enabled: {description: "Whether calls with this preset use the response cache, a boolean. Never sent upstream."}
        cache_ttl_seconds: {description: "How long a cached response lives, an integer from 1 to 86400. Never sent upstream."}
        provider: {description: "As the request member of the same name in the call format the preset is used with."}
        route: {description: "As the request member of the same name in the call format the preset is used with."}
        temperature: {description: "As the request member of the same name in the call format the preset is used with."}
        top_p: {description: "As the request member of the same name in the call format the preset is used with."}
        top_k: {description: "As the request member of the same name in the call format the preset is used with."}
        min_p: {description: "As the request member of the same name in the call format the preset is used with."}
        max_tokens: {description: "As the request member of the same name in the call format the preset is used with."}
        max_completion_tokens: {description: "As the request member of the same name in the call format the preset is used with."}
        max_output_tokens: {description: "As the request member of the same name in the call format the preset is used with."}
        frequency_penalty: {description: "As the request member of the same name in the call format the preset is used with."}
        presence_penalty: {description: "As the request member of the same name in the call format the preset is used with."}
        repetition_penalty: {description: "As the request member of the same name in the call format the preset is used with."}
        seed: {description: "As the request member of the same name in the call format the preset is used with."}
        stop: {description: "As the request member of the same name in the call format the preset is used with."}
        stop_sequences: {description: "As the request member of the same name in the call format the preset is used with."}
        logit_bias: {description: "As the request member of the same name in the call format the preset is used with."}
        logprobs: {description: "As the request member of the same name in the call format the preset is used with."}
        top_logprobs: {description: "As the request member of the same name in the call format the preset is used with."}
        response_format: {description: "As the request member of the same name in the call format the preset is used with."}
        text: {description: "As the request member of the same name in the call format the preset is used with."}
        reasoning: {description: "As the request member of the same name in the call format the preset is used with."}
        reasoning_effort: {description: "As the request member of the same name in the call format the preset is used with."}
        thinking: {description: "As the request member of the same name in the call format the preset is used with."}
        output_config: {description: "As the request member of the same name in the call format the preset is used with."}
        output_format: {description: "As the request member of the same name in the call format the preset is used with."}
        tools: {description: "As the request member of the same name in the call format the preset is used with."}
        tool_choice: {description: "As the request member of the same name in the call format the preset is used with."}
        parallel_tool_calls: {description: "As the request member of the same name in the call format the preset is used with."}
        max_tool_calls: {description: "As the request member of the same name in the call format the preset is used with."}
        service_tier: {description: "As the request member of the same name in the call format the preset is used with."}
        speed: {description: "As the request member of the same name in the call format the preset is used with."}
        cache_control: {description: "As the request member of the same name in the call format the preset is used with."}
        context_management: {description: "As the request member of the same name in the call format the preset is used with."}
        plugins: {description: "As the request member of the same name in the call format the preset is used with."}
        transforms: {description: "As the request member of the same name in the call format the preset is used with."}
    PresetRequest:
      type: object
      additionalProperties: false
      required: [slug, name, config]
      properties:
        slug: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 100}
        config: {$ref: "#/components/schemas/PresetConfig"}
    PresetReplacement:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        config: {$ref: "#/components/schemas/PresetConfig"}
    Preset:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        config: {$ref: "#/components/schemas/PresetConfig"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PresetList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Preset"}
        total_count: {type: integer}
    CallStatus:
      type: string
      enum: [success, error]
    CallAggregates:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/CallAggregate"}
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        group_by: {type: string, enum: [day, model, key]}
    UsageStatistics:
      type: object
      additionalProperties: false
      properties:
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        granularity: {type: string, enum: [hour, day, week]}
        group_by: {type: string, enum: [model, key, workspace]}
        backfill_complete: {type: boolean}
        buckets:
          type: array
          items: {$ref: "#/components/schemas/UsageBucket"}
        totals:
          type: array
          items: {$ref: "#/components/schemas/UsageMetrics"}
        previous:
          type: array
          description: Present only for compare=previous; currencies remain separate.
          items: {$ref: "#/components/schemas/UsageMetrics"}
    UsageBucket:
      type: object
      additionalProperties: false
      properties:
        at: {type: string, format: date-time}
        group: {type: string, description: "Public model name or key/workspace TypeID; absent without group_by."}
        metrics: {$ref: "#/components/schemas/UsageMetrics"}
    UsageMetrics:
      type: object
      additionalProperties: false
      properties:
        spend: {$ref: "#/components/schemas/CallAggregateMoney"}
        requests: {type: string, pattern: '^[0-9]+$'}
        successes: {type: string, pattern: '^[0-9]+$'}
        tokens: {$ref: "#/components/schemas/UsageTokens"}
        cache_rate_requests: {type: string, pattern: '^[0-9]+$'}
        cache_hit_rate: {type: number, format: double, minimum: 0, maximum: 1}
        success_rate: {type: number, format: double, minimum: 0, maximum: 1}
    UsageTokens:
      type: object
      additionalProperties: false
      properties:
        input: {type: string, pattern: '^[0-9]+$'}
        output: {type: string, pattern: '^[0-9]+$'}
        cache_read: {type: string, pattern: '^[0-9]+$'}
        cache_write: {type: string, pattern: '^[0-9]+$'}
    CallAggregateMoney:
      type: object
      additionalProperties: false
      description: A sum of user charges, in billionths. Unlike a single charge, this can exceed int64 and 19 digits.
      properties:
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    CallAggregate:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
          description: UTC date, exact model name, or public key ID, according to group_by.
        calls:
          type: string
          pattern: '^[0-9]+$'
        price: {$ref: "#/components/schemas/CallAggregateMoney"}
    PublicModelList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PublicModel"}
    PublicModel:
      type: object
      additionalProperties: false
      description: >-
        One published model as a visitor may see it: its public name and limits, the abilities its spec declares, the
        sale prices of the audience that asked when the site publishes prices, and the endpoints that serve it with
        their own prices. No supplier name, upstream name, route, cost or internal name.
      required: [id, name, author, context_length, max_output, streams, abilities]
      properties:
        id: {type: string, description: "The public model ID, such as acme/claude-sonnet."}
        name: {type: string, description: "The vendor's name for the model, the part of the public ID after the author."}
        author: {type: string, description: "The author slug, the part of the public ID before the slash."}
        context_length: {type: integer, format: int64, minimum: 1}
        max_output: {type: integer, format: int64, minimum: 1}
        streams: {type: boolean, description: Whether the vendor streams the model's replies.}
        abilities:
          type: array
          items: {$ref: "#/components/schemas/ModelAbility"}
        pricing:
          allOf: [{$ref: "#/components/schemas/ModelPricing"}]
          description: >-
            The model's sale prices at the cheapest endpoint. Absent when this request is anonymous and the site keeps
            its prices to signed-in members (docs/domains/gateway.md); the same page then shows the models without
            prices rather than an unavailable-price error. The signed-in account's projection always carries it.
        endpoints:
          type: array
          description: >-
            The endpoints that serve this model, in codename order, each at the price this audience pays at it. Absent
            from a node that does not publish endpoints yet; a page shows that part as unavailable rather than as an
            empty list. An endpoint's own `pricing` is absent under the same rule as the model's.
          items: {$ref: "#/components/schemas/PublicEndpoint"}
    PublicEndpoint:
      type: object
      additionalProperties: false
      description: >-
        One endpoint of a published model: the group's public identity that routing accepts — its stable anonymous
        codename for a reseller group, or the real name of a directly connected official API — with the limits and
        abilities it serves and, when the site publishes prices, the sale price this audience pays at it. No supplier
        name, upstream name, internal id or cost.
      required: [name, context_length, max_output, streams, abilities, verified]
      properties:
        name:
          type: string
          description: >-
            The group's public identity: its codename, the same value `provider.only`, `provider.ignore` and presets
            accept. It is assigned once per group, stays the same on every model, and never changes when the endpoint
            set does.
        context_length: {type: integer, format: int64, minimum: 1}
        max_output: {type: integer, format: int64, minimum: 1}
        streams: {type: boolean}
        abilities:
          type: array
          items: {$ref: "#/components/schemas/ModelAbility"}
        quantization:
          type: string
          description: The level an operator recorded for the endpoint; absent when none is recorded.
        verified:
          type: boolean
          description: Whether the endpoint passed the model-identity check.
        pricing:
          allOf: [{$ref: "#/components/schemas/ModelPricing"}]
          description: >-
            The endpoint's sale prices. Absent when this request is anonymous and the site keeps its prices to
            signed-in members, under the same rule as the model's `pricing`.
    ModelAbility:
      type: string
      enum: [tools, images, documents, reasoning, prompt_cache, structured_output, web_search, code_execution, file_search]
    ModelPricing:
      type: object
      additionalProperties: false
      description: >-
        Every unit price the model's sale schedule sets, for each service tier and context band. A price is decimal
        text in the pricing currency, per the item's unit; an item the schedule does not price is absent.
      required: [currency, basis, rates]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        basis:
          type: array
          description: >-
            The items whose counts add up to the prompt length the context bands compare; empty when the schedule has
            no context tiers.
          items: {$ref: "#/components/schemas/ModelItem"}
        rates:
          type: array
          items: {$ref: "#/components/schemas/ModelRate"}
        search_engines:
          type: array
          description: >-
            What one web search through each enabled backend costs, per search plus each result after the first. A
            backend whose published per-search price is zero sells at the model's web_search rate instead. Absent
            from a node that serves no backend.
          items: {$ref: "#/components/schemas/ModelSearchEnginePrice"}
    ModelSearchEnginePrice:
      type: object
      additionalProperties: false
      required: [name, price_per_search, price_per_extra_result, default]
      properties:
        name: {type: string, description: "The engine a request's web plugin names; \"native\" is the provider's own search."}
        price_per_search: {type: string, description: "Decimal currency units per search; zero means the model's web_search price."}
        price_per_extra_result: {type: string, description: "Decimal currency units for each result after the first."}
        default: {type: boolean, description: "The backend a request that names none falls back to."}
    ModelRate:
      type: object
      additionalProperties: false
      required: [service_tier, item, unit, amount]
      properties:
        service_tier: {$ref: "#/components/schemas/ModelServiceTier"}
        above:
          type: integer
          format: int64
          minimum: 0
          description: >-
            The prompt length above which this rate applies. Absent for the base band that applies below every
            threshold; 0 is an explicit first band above 0 and is not the base band.
        item: {$ref: "#/components/schemas/ModelItem"}
        unit: {$ref: "#/components/schemas/ModelUnit"}
        amount: {type: string, description: "Exact currency units per unit, decimal text with up to 15 fractional digits."}
        headline:
          type: boolean
          description: >-
            Whether this is the rate a model list shows as the item's price: for each item, the standard tier's base
            band, or the first offered tier's base band when the standard tier does not price the item. Exactly one
            rate is true for each item that has a base-band price; an item priced only above a context threshold has
            no headline, and a list shows its price as unavailable. Absent from a node that does not name it yet; a
            page then shows the list price as unavailable rather than choosing one.
        display_amount:
          type: string
          description: >-
            The price of `display_per` units, exactly `amount` × `display_per` as decimal text with up to 15
            fractional digits (at most 9 for tokens), so every page shows the same number without moving the decimal
            point itself. Absent together with `display_per` from a node that does not send them.
        display_per:
          type: integer
          format: int64
          enum: [1, 1000000]
          description: >-
            How many units `display_amount` is the price of: 1000000 for a token item (shown per million tokens, as
            OpenRouter's models page does), 1 for every other unit.
    ModelServiceTier:
      type: string
      enum: [standard, flex, priority, fast]
    ModelItem:
      type: string
      enum: [input, cache_read, cache_write, cache_write_1h, audio_in, image_in, output, reasoning, audio_out, image_out, web_search, code_execution, file_search, file_parse, image_in_piece, image_out_piece, audio_in_second, audio_out_second, character_in, request]
    ModelUnit:
      type: string
      enum: [token, use, piece, second, character]
    SiteId: {type: string, pattern: '^site_[0-9a-hjkmnp-tv-z]{26}$', description: "A site's ID (TypeID)."}
    AnnouncementId: {type: string, pattern: '^ann_[0-9a-hjkmnp-tv-z]{26}$', description: "A site announcement's ID (TypeID)."}
    BillingPreferenceName:
      type: string
      enum: [subscription_first, wallet_first, subscription_only, wallet_only]
      description: >-
        Which source a call uses first. `subscription_first` uses the plan and falls back to the wallet; `wallet_first`
        the reverse; `subscription_only` and `wallet_only` do not fall back (docs/domains/billing.md「资金来源」).
    BillingPreference:
      type: object
      required: [preference, source, site_default]
      properties:
        preference: {$ref: "#/components/schemas/BillingPreferenceName"}
        source:
          type: string
          enum: [account, site]
          description: "`account` when you chose it; `site` when the site's default applies."
        site_default: {$ref: "#/components/schemas/BillingPreferenceName"}
    BillingPreferenceRequest:
      type: object
      additionalProperties: false
      required: [preference]
      properties:
        preference:
          type: string
          enum: [site, subscription_first, wallet_first, subscription_only, wallet_only]
          description: "`site` clears your choice."
    Announcement:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/AnnouncementId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 20000}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        low_balance: {type: boolean}
        top_up: {type: boolean}
        factor_changed: {type: boolean, description: "Controls background factor-change email and webhooks. Password-change security email is always sent."}
        spend_anomaly: {type: boolean, description: "Controls account spend-anomaly email and webhooks. Absent from a node that predates the preference; a client must then neither show the switch nor send the field."}
        threshold: {type: string, pattern: '^[0-9]+$', maxLength: 19, description: "Billionths of site credits."}
        webhook_url: {type: string, maxLength: 2048}
        language: {type: string, enum: [en, zh]}
    NotificationPreferencesRequest:
      type: object
      additionalProperties: false
      required: [low_balance, top_up, factor_changed, threshold, webhook_url, language]
      properties:
        low_balance: {type: boolean}
        top_up: {type: boolean}
        factor_changed: {type: boolean, description: "Controls background factor-change email and webhooks. Password-change security email is always sent."}
        spend_anomaly: {type: boolean, description: "Controls account spend-anomaly email and webhooks. Omit to keep the stored value."}
        threshold: {type: string, pattern: '^[0-9]+$', maxLength: 19, description: "Billionths of site credits."}
        webhook_url: {type: string, maxLength: 2048}
        language: {type: string, enum: [en, zh]}
    AnnouncementList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Announcement"}
    Error:
      type: object
      required: [error]
      description: >-
        The body of every failure. The request ID is in the `X-Request-ID` response header, as on every response.
      properties:
        error: {$ref: "#/components/schemas/ErrorDetail"}
    ErrorDetail:
      type: object
      required: [code, message]
      description: >-
        `code` is what a client branches on and translates; `message` is English text for logs and developers.
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        fields:
          type: array
          description: Which parts of the request broke a constraint, for `invalid_request`.
          items: {$ref: "#/components/schemas/ErrorField"}
    ErrorField:
      type: object
      required: [pointer, message]
      properties:
        pointer: {type: string, description: "JSON pointer into the request body, or the name of a query or path parameter."}
        message: {type: string}
    ErrorCode:
      type: string
      description: >-
        The closed list of failure codes. A code is added in a contract change, so a client that translates every code
        fails to compile until it knows the new one.
      enum:
        - invalid_request
        - unauthenticated
        - invalid_credentials
        - invalid_code
        - forbidden
        - mfa_required
        - consent_required
        - origin_rejected
        - not_found
        - conflict
        - login_domain_locked
        - login_domain_required
        - identity_taken
        - identity_already_linked
        - account_not_linked
        - email_taken
        - name_taken
        - too_many_keys
        - stale_revision
        - idempotency_key_reused
        - invalid_invite
        - registration_closed
        - human_check_failed
        - email_domain_not_allowed
        - invalid_verification
        - weak_password
        - not_ready
        - unprocessable
        - cap_exceeded
        - redeem_code_invalid
        - redeem_code_expired
        - redeem_code_disabled
        - redeem_code_used
        - rate_limited
        - internal
        - not_implemented
        - unavailable
        - preset_not_selectable
        - preset_default_invalid
        - preset_in_use
        - preset_quota
        - presets_suspended
    SubscriptionCredit:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      maxLength: 19
      description: >-
        An exact amount of credit in billionths of one unit of the site's currency, as text so a JSON number cannot
        round it.
      example: "5000000000"
    AccountSubscriptionWindow:
      type: object
      required: [seq, starts_at, ends_at, quota, used, reserved, remaining]
      properties:
        seq: {type: integer, minimum: 1}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        quota: {$ref: "#/components/schemas/SubscriptionCredit"}
        used: {$ref: "#/components/schemas/SubscriptionCredit"}
        reserved: {$ref: "#/components/schemas/SubscriptionCredit"}
        remaining: {$ref: "#/components/schemas/SubscriptionCredit"}
    AccountSubscriptionStanding:
      type: string
      enum: [active, expired]
      x-enum-varnames: [SubscriptionActive, SubscriptionExpired]
      description: "`expired`: the term ended; `closed_at` is when what was left of it was written off."
    AccountSubscription:
      type: object
      required: [id, plan_name, state, starts_at, ends_at, current_window]
      properties:
        id: {type: string, format: uuid}
        plan_name: {type: string, description: "The plan's name when it was bought; a later rename does not change it."}
        state: {$ref: "#/components/schemas/AccountSubscriptionStanding"}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        closed_at: {type: string, format: date-time, description: "When what was left was written off; absent until then."}
        current_window: {$ref: "#/components/schemas/AccountSubscriptionWindow"}
    AccountSubscriptionList:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/AccountSubscription"}}
    Money:
      type: object
      required: [amount, currency]
      description: >-
        An exact amount of a site's accounting currency. `amount` is a signed integer in decimal text, in billionths of
        one unit of the currency (docs/domains/billing.md「钱的表示」). It is text because a JSON number would round
        above 2^53 (about 9 million units) in the browser. A report sums many stored amounts, so it can be wider than
        64 bits; an amount that is written to the ledger must still fit 64 bits.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]*)$', maxLength: 39, example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    RedeemCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: "The code as issued, with or without its dashes or spaces, in any case."
    RedeemCodeRedemption:
      type: object
      additionalProperties: false
      required: [id, amount, code_hint, redeemed_at]
      properties:
        id: {type: string, pattern: '^rdn_[0-9a-hjkmnp-tv-z]{26}$', description: "The redemption's ID (TypeID), also the credit batch's."}
        amount: {$ref: "#/components/schemas/Money"}
        code_hint: {type: string, pattern: '^[0-9A-HJKMNP-TV-Z]{4}$', description: "The code's last four characters; never the code."}
        expires_at: {type: string, format: date-time, description: "When the credit expires; absent: never."}
        redeemed_at: {type: string, format: date-time}
    RedeemCodeHistory:
      type: object
      required: [data]
      properties:
        data: {type: array, items: {$ref: "#/components/schemas/RedeemCodeRedemption"}}
        next_cursor: {type: string, description: "Absent on the last page."}
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: >-
            The program's version line exactly as `axiom version` prints it: the main module's version, which the Go
            toolchain stamps from version control (such as a pseudo-version with the commit time and hash, +dirty for
            uncommitted changes). The console is stamped with the same line and only compares the two whole for
            equality.
          example: axiom v0.0.0-20261014044725-4daa4538fcac
    UserId: {type: string, pattern: '^user_[0-9a-hjkmnp-tv-z]{26}$', description: "A user's ID (TypeID)."}
    AccountId: {type: string, pattern: '^acct_[0-9a-hjkmnp-tv-z]{26}$', description: "An account's ID (TypeID)."}
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 256}
    SessionGrant:
      type: object
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_required]
          description: >-
            `mfa_required`: the password was right and the user has two-step verification, so the cookie is a pending
            session that only `verifyMfa` accepts, for 5 minutes.
        csrf_token: {type: string, description: "Sent as X-CSRF-Token on the requests that change data."}
    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            A TOTP code (6 digits) or a recovery code (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server
            tells them apart by shape.
    SessionLevel:
      type: string
      enum: [pending_mfa, password, mfa]
      description: >-
        What the session has proved: only the password, or two-step verification too (`mfa`). `pending_mfa` is a
        sign-in that waits for its second factor.
    LegalDocumentKind:
      type: string
      enum: [terms, privacy]
    LegalDocumentLocale:
      type: string
      enum: [zh, en]
    LegalDocument:
      type: object
      description: >-
        One version of one of the site's legal documents in one locale; the body is Markdown, never HTML. `locale` is
        absent on a node that predates locale-aware documents; a page uses `zh` only as the display fallback and omits
        the locale from the acceptance.
      required: [kind, version, body, published_at]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        locale: {$ref: "#/components/schemas/LegalDocumentLocale"}
        version: {type: integer, minimum: 1}
        body:
          type: string
          description: Markdown headings, paragraphs, and lists. Rendered as React text, never interpreted as HTML.
        published_at: {type: string, format: date-time}
    LegalDocumentVersion:
      type: object
      description: >-
        A legal document version named by an acceptance or the session's pending list. `locale` is optional for rolling
        compatibility: when an old node's response omits it, the page also omits it from the acceptance, and the server
        resolves the kind and version to the one current document. The page may use `zh` as the display fallback.
      required: [kind, version]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        locale: {$ref: "#/components/schemas/LegalDocumentLocale"}
        version: {type: integer, minimum: 1}
    LegalDocuments:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          description: >-
            The current version of each kind in each published locale, at most one per kind and locale. An old node
            returns one per kind without locale.
          items: {$ref: "#/components/schemas/LegalDocument"}
    LegalAcceptance:
      type: object
      required: [consent]
      properties:
        consent:
          type: array
          description: >-
            One current document per kind, as getLegalDocuments returned it. A page includes the locale only when the
            response named one; the server resolves an omitted locale from the kind and version.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    SessionConsent:
      type: object
      description: >-
        The legal documents the signed-in user has not accepted. A page built before this field shows nothing and the
        server refuses its requests with `consent_required` instead.
      required: [required]
      properties:
        required:
          type: array
          description: One newest current document per kind this user still has to accept during the compatibility phase; empty when each newest version is accepted.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    Session:
      type: object
      required: [user, account, level, mfa_enabled, csrf_token, expires_at, permissions]
      properties:
        user:
          type: object
          required: [id, email, invite_code]
          properties:
            id: {$ref: "#/components/schemas/UserId"}
            email: {type: string}
            invite_code: {type: string, description: "The user's own invite code, which a new user registers with."}
        account: {$ref: "#/components/schemas/AccountId"}
        level: {$ref: "#/components/schemas/SessionLevel"}
        mfa_enabled: {type: boolean, description: "Whether the user has a TOTP factor."}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time, description: "When the session ends if it is not used again; the idle timeout moves it."}
        permissions:
          type: array
          description: >-
            The permission names the session holds on its own scope (the user's account on the console, the platform
            on the admin), for showing or hiding what the user cannot do. The server decides again on every request.
          items: {type: string}
        consent:
          allOf: [{$ref: "#/components/schemas/SessionConsent"}]
          description: >-
            What the page must show before the session may do anything else. Optional so a page built before this field
            reads an older node that does not send it.
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          description: Newest first, at most 100. A page that gets no `sessions` shows the list as unavailable.
          items: {$ref: "#/components/schemas/SessionDevice"}
    SessionDevice:
      type: object
      description: >-
        One signed-in console session. Every field is optional so a page built before it reads an older node that does
        not send it.
      properties:
        id: {$ref: "#/components/schemas/SessionId"}
        current: {type: boolean, description: "Whether this is the session of the request."}
        created_at: {type: string, format: date-time, description: "When the session was signed in."}
        last_seen_at: {type: string, format: date-time, description: "When a request was last charged to it, accurate to about a minute."}
        ip_group:
          type: string
          description: >-
            The network the session was signed in from, grouped as the sign-in limits count it: an IPv4 address as it
            is, an IPv6 allocation as its /64. Empty when no address was recorded.
        client:
          type: string
          description: >-
            A short browser and platform summary derived from the User-Agent recorded at sign-in, such as
            `Chrome on macOS`, or `Unknown client`. The raw header is not returned.
    SessionRevocation:
      type: object
      properties:
        revoked: {type: integer, minimum: 0, description: "How many other sessions ended."}
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: {type: string, description: "The new TOTP secret in base32. Nothing is stored yet; confirmTotp sends it back."}
        uri: {type: string, description: "The otpauth:// URI for a QR code."}
    TotpConfirmRequest:
      type: object
      required: [secret, password, code]
      properties:
        secret: {type: string, maxLength: 128}
        password: {type: string, maxLength: 256, description: "The user's password, asked again."}
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    TotpReplaceRequest:
      type: object
      required: [secret, current_code, code]
      properties:
        secret: {type: string, maxLength: 128, description: "The new TOTP secret in base32, from `beginTotpSetup`."}
        current_code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            Proof of the factor being replaced: a current TOTP code (6 digits) or an unused recovery code
            (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server tells them apart by shape.
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    RecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', description: "A current TOTP code."}
    ShownRecoveryCodes:
      type: object
      required: [recovery_codes]
      description: The recovery codes a link round trip left for the session, read once.
      properties:
        recovery_codes:
          type: array
          items: {type: string}
    FactorChange:
      type: object
      required: [csrf_token, recovery_codes]
      description: >-
        A changed factor ends every other session of the user and every unused recovery code, and issues this device a
        new `mfa` session: the cookie of the response replaces the old one.
      properties:
        csrf_token: {type: string}
        recovery_codes:
          type: array
          description: "10 one-time codes, each written xxxx-xxxx-xxxx-xxxx. They are shown only here."
          items: {type: string}
    Balance:
      type: object
      required: [balance, reserved, floor, available, spent_this_month]
      description: >-
        An account's money in its site's accounting currency. `available` is `balance - reserved`; a call is admitted
        while `available - floor` covers its reservation, and `floor` is at most 0. `spent_this_month` is what calls
        settled for the current UTC calendar month.
      properties:
        balance: {$ref: "#/components/schemas/Money"}
        reserved: {$ref: "#/components/schemas/Money"}
        floor: {$ref: "#/components/schemas/Money"}
        available: {$ref: "#/components/schemas/Money"}
        spent_this_month: {$ref: "#/components/schemas/Money"}
        batches:
          type: array
          description: >-
            The credit batches that still hold something, oldest credit first, with what is left in each and when it
            stops counting. An account with nothing is an empty array. Read in the same snapshot as the balance:
            absent on a node of the previous release, when the allocation could not be brought up to date in bounded
            time, or when a transaction committed after the last replay. The page then shows this part as unavailable
            rather than a number from a different moment.
          items: {$ref: "#/components/schemas/CreditBatch"}
    CreditBatch:
      type: object
      required: [id, source, amount, remaining, frozen, created_at]
      description: >-
        Credit added in one grant or payment, what is left of it, and how much of that is frozen for refunds. Spending
        takes the earliest expiry first and a batch without `expires_at` last, so `remaining` is what is still in this
        batch, not what the next charge will take.
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The batch's own identity; paid credit uses the order's ID as the batch ID.
        source:
          type: string
          enum: [gift, paid, redeem]
          x-enum-varnames: [CreditBatchGift, CreditBatchPaid, CreditBatchRedeem]
          description: "`gift`: credit given by an operator; `paid`: credit bought through a payment; `redeem`: credit a redeem code gave."
        amount: {$ref: "#/components/schemas/Money"}
        remaining: {$ref: "#/components/schemas/Money"}
        frozen: {$ref: "#/components/schemas/Money"}
        created_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: "When what is left of the batch stops counting. Absent when it never expires."
    StatementKind:
      type: string
      enum: [top_up, gift, redeem, spend, expiry, refund, reversal, freeze, unfreeze, chargeback, chargeback_reversal]
      description: >-
        What a statement row did to the account's credits: credit bought with a payment or an offline channel, credit
        given, credit a redeem code gave, a call's charge or reversal, expiry, cash refund (negative balance change),
        freeze or unfreeze, a chargeback's debit or the reversal of that debit after a won dispute.
    StatementRow:
      type: object
      required: [id, at, kind, amount, balance_after, reference, frozen_change, frozen_after]
      description: >-
        One movement of the account's credits. `amount` is positive when the balance rose, so a charge is negative, and
        `balance_after` is the account's balance once this movement was recorded, or null for a movement recorded before
        the ledger numbered them: those are listed by their timestamps, which do not prove the order they were posted in,
        so the balance between two of them is not known.
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The row's own identity, to tell two rows apart; it names no ledger entry.
        at: {type: string, format: date-time, description: When the movement was recorded.}
        kind: {$ref: "#/components/schemas/StatementKind"}
        amount: {$ref: "#/components/schemas/Money"}
        balance_after:
          allOf: [{$ref: "#/components/schemas/Money"}]
          nullable: true
        frozen_change:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: Signed change in credits frozen for refunds; zero for ordinary balance changes.
        frozen_after:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: Credits frozen after this event; included in balance_after, unavailable for new spending.
        reference:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: >-
            The call ID for charges and reversals; otherwise the credit batch ID (the order ID for paid credit,
            or the offline credit ID). No payment credentials or internal account IDs are included.
    Statement:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/StatementRow"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    KeyId: {type: string, pattern: '^key_[0-9a-hjkmnp-tv-z]{26}$', description: "An API key's ID (TypeID)."}
    SessionId: {type: string, pattern: '^sess_[0-9a-hjkmnp-tv-z]{26}$', description: "A session's ID (TypeID)."}
    WorkspaceId: {type: string, pattern: '^ws_[0-9a-hjkmnp-tv-z]{26}$', description: "A workspace's ID (TypeID)."}
    Workspace:
      type: object
      required: [id, name, is_default, disabled]
      description: >-
        A part of the account with its own keys, budget and default routing preset. Every account has one default
        workspace, which cannot be disabled; keys made without naming a workspace go there.
      properties:
        id: {$ref: "#/components/schemas/WorkspaceId"}
        name: {type: string, minLength: 1, maxLength: 100}
        is_default: {type: boolean}
        disabled: {type: boolean, description: "A disabled workspace's keys are refused on every call."}
    WorkspaceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Workspace"}
    WorkspaceCreate:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: "Unique among the account's live workspaces, ignoring case."}
    WorkspaceSettings:
      type: object
      required: [name, disabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: "Unique among the account's live workspaces, ignoring case."}
        disabled: {type: boolean}
    WorkspaceBudget:
      type: object
      description: >-
        A workspace's budget, which all its keys share, and the current window's use of it. Every field is absent for
        a workspace without a budget.
      properties:
        limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        used:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: >-
            What the workspace's keys were charged in the current window, and what calls in flight hold: the figure
            admission compares with `limit`. It can pass `limit` when calls already admitted are charged.
        limit_remaining:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: "`limit` less `used`, not below zero."
        resets_at:
          type: string
          format: date-time
          description: When the current window ends and `used` starts again, in UTC; absent for a budget that never resets.
    WorkspaceBudgetSettings:
      type: object
      properties:
        limit:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: >-
            In the site's currency and not negative. 0 refuses every call that would reserve anything; a call quoted at zero still passes, as under any limit. Absent removes the budget.
        limit_reset:
          allOf: [{$ref: "#/components/schemas/LimitReset"}]
          description: "When `used` starts again; absent never. It needs a `limit`."
    CallId:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: "A call's ID, which is the request ID that every response of a model call carries as `X-Request-ID`."
    Site:
      type: object
      required: [name, key_prefix, registration, currency]
      properties:
        id: {$ref: "#/components/schemas/SiteId"}
        name: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD, description: "The site's accounting currency, the one of every `Money` its API shows. It never changes."}
        brand_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
          description: >-
            The site's brand colour, lower case, from which the console derives both colour schemes' accent and primary
            button (docs/frontend.md「主题与自由度」). Absent when the site uses the default palette or the node predates
            the field.
        logo_url:
          type: string
          description: >-
            The path of the site's logo on this host. Absent when the site has no logo. It is long-cached, because its
            hash names the bytes; a page shows the site's name when the image does not load.
        key_prefix: {type: string, example: sk-ax-v1-, description: "What the site's API keys start with."}
        email_verification:
          type: boolean
          description: "Whether open registration verifies the address by mail before the user exists. Absent on a node of the previous release."
        human_check:
          type: object
          description: "The proof of work the open-registration page must solve. Absent when the site does not check, or when the node predates open registration."
          required: [bits]
          properties:
            bits: {type: integer, minimum: 12, maximum: 24, description: "Leading zero bits the SHA-256 of `axiom-registration-v1`, the site id, the normalized email and the decimal nonce must have."}
        api_base_url:
          type: string
          format: uri
          example: https://api.example.com
          description: >-
            Where a key's calls go: the origin of the site's API domain, which serves `/v1/...`. The console shows it
            to the user because the console's own host is a different one; it is never built from the request's Host.
            Absent when the site has no enabled API domain.
        registration:
          type: string
          enum: [invite, closed, open]
          description: "`invite` needs an invite code; `closed` takes no one; `open` verifies the address by mail, with the site's human check, domain lists and limits."
        login_domain:
          type: string
          description: >-
            The console domain third-party sign-in returns to and passkeys bind to. Absent until an operator sets it;
            the sign-in page sends visitors to `login_origin` when the Host is another console domain.
        login_origin:
          type: string
          format: uri
          description: "The registered origin of `login_domain`. Absent with it, or when that domain is disabled."
        passkeys:
          type: boolean
          description: "Whether the site offers passkeys. False on an older node that does not know the field."
        oauth_providers:
          type: array
          description: "The third-party providers the site configured, for the sign-in page's buttons."
          items: {$ref: "#/components/schemas/OAuthProvider"}
    OAuthProvider:
      type: string
      enum: [github, google, linuxdo]
      description: "A third-party sign-in provider."
    OAuthStartRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
    OAuthStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          format: uri
          description: "The provider's authorization endpoint with this flow's client, state and, where supported, PKCE challenge."
    WebAuthnCredential:
      type: object
      additionalProperties: true
      x-go-type: jsonx.Raw
      description: >-
        WebAuthn JSON, whose shape is the WebAuthn specification's (https://www.w3.org/TR/webauthn-3/), not this
        contract's, so it is not typed here: restating a standard's dictionaries would only let the two drift. In a
        challenge (`public_key`) it is the options for `navigator.credentials.create()` or `get()`, as `{"publicKey":
        …}` holding a `PublicKeyCredentialCreationOptionsJSON` or `PublicKeyCredentialRequestOptionsJSON`; in a finish
        request it is the credential the browser returned, a `RegistrationResponseJSON` or
        `AuthenticationResponseJSON`, passed through to the WebAuthn verifier unchanged. Binary members are unpadded
        base64url text both ways, where the browser API takes and gives buffers.
    PasskeyChallenge:
      type: object
      required: [flow_id, public_key]
      properties:
        flow_id: {type: string, maxLength: 64, description: "The ceremony to finish; single use, expires in 5 minutes."}
        public_key:
          $ref: "#/components/schemas/WebAuthnCredential"
    PasskeyId: {type: string, pattern: '^pk_[0-9a-hjkmnp-tv-z]{26}$', description: "A passkey's ID (TypeID)."}
    PasskeyRegistrationRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        name: {type: string, maxLength: 100, description: "A label for the credential; absent means Passkey."}
        password: {type: string, minLength: 1, maxLength: 256, description: "The current password, asked again."}
    PasskeyDeleteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 256}
    Passkey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: {$ref: "#/components/schemas/PasskeyId"}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        backup_eligible: {type: boolean, description: "Whether the credential can be synced or backed up between devices."}
        recovery_codes:
          type: array
          items: {type: string}
          description: >-
            Replacement recovery codes, present only on the answer that adds the passkey and only when TOTP is on:
            raising the factor version stops the old ones.
    Passkeys:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: {$ref: "#/components/schemas/Passkey"}
    Identity:
      type: object
      required: [provider, display_name, created_at]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: {$ref: "#/components/schemas/Identity"}
    CredentialChange:
      type: object
      required: [csrf_token]
      description: >-
        A credential was removed: every other session ended and the response's cookie replaces this browser's session.
      properties:
        csrf_token: {type: string}
        recovery_codes:
          type: array
          items: {type: string}
          description: Replacement recovery codes when TOTP is on; absent otherwise.
    RegisterRequest:
      type: object
      required: [email]
      properties:
        invite_code: {type: string, minLength: 1, maxLength: 64, description: "Required on an invite-only site; ignored where registration is open."}
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 256, description: "Required on an invite-only site. Open registration does not keep it: the page chooses the password on the verification page, so an unauthenticated caller cannot choose the password of an address it does not own."}
        human_check: {type: string, pattern: '^[0-9]{1,20}$', description: "The decimal nonce that solves the site's proof of work. Required where `human_check` is present."}
        language: {type: string, enum: [zh, en], description: "The language of the verification mail; absent means en. The page sends its own."}
        consent:
          type: array
          description: >-
            The current legal documents the person accepted. Required on a site that publishes any, where a missing or
            stale version is `consent_required`; open registration checks it at verify-email instead, because no user
            exists yet.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    Registered:
      type: object
      required: [user_id]
      properties:
        user_id: {$ref: "#/components/schemas/UserId"}
    RegistrationPending:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [verification_sent]}
    VerifyEmailRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 20, maxLength: 100}
        password: {type: string, minLength: 12, maxLength: 256, description: "The password chosen by the mailbox owner when the link is clicked."}
        consent:
          type: array
          description: >-
            The current legal documents the person accepted, shown on the verification page. Required on a site that
            publishes any; a missing or stale version is `consent_required`.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    KeyCreator:
      type: object
      description: Creator identity; unavailable names use the explicit placeholder Unknown user.
      required: [user_id, display_name]
      properties:
        user_id: {$ref: "#/components/schemas/UserId"}
        display_name: {type: string}
    KeyDailySpend:
      type: object
      required: [date, amount]
      properties:
        date: {type: string, format: date}
        amount: {$ref: "#/components/schemas/Money"}
    Key:
      type: object
      required: [id, name, prefix, last4, workspace_id, created_at, disabled]
      description: >-
        A call or management key as the page shows it. The text is `prefix` and 49 more characters, of which only `last4` is kept
        besides the hash, so the page shows `prefix…last4`. `limit_remaining` is what is left of `spend_limit` in the
        current window; both are absent for a key without a limit.
      properties:
        id: {$ref: "#/components/schemas/KeyId"}
        kind: {type: string, enum: [call, management], description: "Defaults to call. Management keys require expires_at and cannot call models."}
        name: {type: string, minLength: 1, maxLength: 100}
        prefix: {type: string}
        last4: {type: string}
        workspace_id: {$ref: "#/components/schemas/WorkspaceId"}
        created_at: {type: string, format: date-time}
        created_by: {$ref: "#/components/schemas/KeyCreator"}
        last_used_at:
          type: string
          format: date-time
          description: >-
            Latest successful key admission check observed by an upgraded node. Absent when never observed.
            Asynchronous best-effort activity hint; may lag or miss observations during overload, failure or rolling upgrades.
        daily_spend:
          type: array
          maxItems: 14
          description: >-
            Settled spend for the last 14 UTC days including today, oldest first. Missing days mean zero;
            an unused key returns an empty array. Absent on older nodes. Reservations are excluded.
          items: {$ref: "#/components/schemas/KeyDailySpend"}
        expires_at: {type: string, format: date-time, description: "Absent for a key that does not expire."}
        disabled: {type: boolean}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        limit_remaining: {$ref: "#/components/schemas/Money"}
        models:
          type: array
          description: The model names the key may call; absent means any model.
          items: {type: string, maxLength: 200}
        retired_models:
          type: array
          description: >-
            The names in `models` that the catalog has retired, so calls to them cannot succeed. Absent when none is
            retired or the reading node has no catalog snapshot; a page shows no hint then.
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          description: The client addresses (IP or CIDR) the key may be used from; absent means any.
          items: {type: string, maxLength: 64}
        preset_id:
          type: string
          format: uuid
          description: >-
            The routing preset a call key is routed by. Absent for a management key, for a call key made before keys
            were bound to presets, which the system preset routes, and from a node that predates the field.
        preset: {$ref: "#/components/schemas/RoutingPresetSummary"}
    KeyStatus:
      type: string
      enum: [active, disabled, expired]
      x-enum-varnames: [KeyStatusActive, KeyStatusDisabled, KeyStatusExpired]
      description: >-
        The state the key list shows: `active` is enabled and not expired, `disabled` is disabled and not expired,
        and `expired` is past its `expires_at` whether enabled or not.
    KeyFilterEcho:
      type: object
      description: >-
        The filters this node applied to the page. Absent on nodes that predate key filters: those nodes ignore the
        filter parameters and return every key, so a filtered page cannot show their rows.
      properties:
        name: {type: string, description: "The applied name filter, ignoring case in the match."}
        prefix: {type: string, description: "The applied prefix filter, ignoring case in the match."}
        status: {$ref: "#/components/schemas/KeyStatus"}
        created_after: {type: string, format: date-time, description: The applied inclusive lower bound.}
        created_before: {type: string, format: date-time, description: The applied exclusive upper bound.}
        workspace_id:
          allOf: [{$ref: "#/components/schemas/WorkspaceId"}]
          description: The applied workspace filter. Absent from a node that predates it, which returned every workspace's keys.
    LimitReset:
      type: string
      enum: [daily, weekly, monthly]
      description: >-
        When the spend limit's count starts again, at midnight UTC, Monday midnight UTC, or the first of the month.
        Absent means never; it needs a `spend_limit`.
    KeyCreate:
      type: object
      required: [name]
      properties:
        kind: {type: string, enum: [call, management], description: "Defaults to call. Management keys require expires_at and cannot call models."}
        name: {type: string, minLength: 1, maxLength: 100}
        workspace_id:
          allOf: [{$ref: "#/components/schemas/WorkspaceId"}]
          description: >-
            The enabled workspace of the account the key belongs to, for good; absent is the default workspace. Another
            account's or a deleted one is 400, a disabled one 409 `conflict`. A node that predates workspaces ignores
            it and makes the key in the default workspace, so a page compares the response's `workspace_id`.
        expires_at: {type: string, format: date-time, description: "UTC, in the future. It cannot be set later."}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        models:
          type: array
          maxItems: 256
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 64}
        preset_id:
          type: string
          format: uuid
          description: >-
            The routing preset a call key is routed by: a live preset of the platform, the site or the account. Absent,
            a new key takes its layers' default and a changed key keeps its preset. The system preset, a disabled one,
            another tenant's and any for a management key are 400 `preset_not_selectable`.
    KeySettings:
      type: object
      required: [name, disabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        disabled: {type: boolean}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        models:
          type: array
          maxItems: 256
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 64}
        preset_id:
          type: string
          format: uuid
          description: >-
            The routing preset a call key is routed by: a live preset of the platform, the site or the account. Absent,
            a new key takes its layers' default and a changed key keeps its preset. The system preset, a disabled one,
            another tenant's and any for a management key are 400 `preset_not_selectable`.
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: {$ref: "#/components/schemas/Key"}
        secret: {type: string, description: "The key's text, to copy now: it is never shown again."}
    ProviderKey:
      type: object
      required: [id, name, provider, status, enabled, rejected, fallback, created_at]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        provider: {type: string}
        hint:
          type: string
          description: The last four characters of the key, and never more.
        status: {type: string, enum: [active, disabled, rejected]}
        enabled: {type: boolean}
        rejected:
          type: boolean
          description: The provider refused this key; routing skips it until a test succeeds.
        fallback:
          type: boolean
          description: Whether the key may fall back to Axiom's endpoints for a model it covers.
        created_at: {type: string, format: date-time}
    ProviderKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/ProviderKey"}
    ProviderKeyCreate:
      type: object
      additionalProperties: false
      required: [name, provider, key]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        provider: {type: string, enum: [openai]}
        key: {type: string, minLength: 8, maxLength: 4096}
        fallback:
          type: boolean
          default: true
          description: Whether routing may use Axiom's endpoints for a model this key covers when the key cannot serve it.
    ProviderKeyEnabled:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
    ProviderKeyTest:
      type: object
      required: [ok, status]
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [active, disabled, rejected]}
        inconclusive:
          type: boolean
          description: The provider could not be asked; the key's status did not change.
    KeyList:
      type: object
      required: [data, next_cursor]
      properties:
        filters:
          $ref: "#/components/schemas/KeyFilterEcho"
        data:
          type: array
          items: {$ref: "#/components/schemas/Key"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    CallAttempt:
      type: object
      properties:
        sequence: {type: integer, minimum: 1}
        endpoint_code: {type: string, description: Public group codename; absent when no longer available in the routing snapshot.}
        source_class: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        first_token_ms: {type: integer, minimum: 0}
        result:
          type: string
          enum: [committed, failed, unknown]
          x-enum-varnames: [CallAttemptCommitted, CallAttemptFailed, CallAttemptUnknown]
        error_kind: {type: string}
        charged: {type: boolean, description: "Whether this attempt was charged; absent when attribution is unavailable (including model-side loops)."}
    OwnCallRoutePreset:
      type: object
      properties:
        id: {type: string}
        version: {type: integer, format: int64}
    OwnCallRoute:
      type: object
      properties:
        preset: {$ref: "#/components/schemas/OwnCallRoutePreset"}
        excluded_reasons:
          type: object
          additionalProperties: {type: integer, minimum: 0}
        excluded_more: {type: integer, minimum: 0, description: Count omitted by the writer; no individual candidates are reconstructed.}
        selected_endpoint: {type: string, description: Public codename of the first planned endpoint; absent if unavailable.}
        fastest_unmeasured: {type: boolean}
        preset_unavailable: {type: boolean}
    Call:
      type: object
      required:
        - id
        - at
        - workspace_id
        - key_id
        - ip
        - client_app
        - session_id
        - subagent_id
        - request_class
        - model
        - usage
        - service_tier
        - price
        - free
        - latency_ms
        - first_token_ms
        - finish_reason
        - error_kind
      description: >-
        One call as its owner sees it. `price` is what the user paid, zero for a free call. Text that the call did not
        have is the empty string, and `first_token_ms` is 0 when no token came, as in the call log. The app-attribution
        members are absent when the client named no application, or when the call was recorded before they existed.
      properties:
        attempt_count: {type: integer, minimum: 0}
        attempts:
          type: array
          description: Detail only; empty when no attempts were written. Optional on older nodes.
          items: {$ref: "#/components/schemas/CallAttempt"}
        route: {$ref: "#/components/schemas/OwnCallRoute"}
        charge_details:
          $ref: "#/components/schemas/ChargeDetails"
        price_version:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Published sale version locked at admission; absent for legacy or uncharged calls.
        id: {$ref: "#/components/schemas/CallId"}
        at: {type: string, format: date-time, description: When the request started.}
        workspace_id: {$ref: "#/components/schemas/WorkspaceId"}
        key_id: {$ref: "#/components/schemas/KeyId"}
        ip: {type: string, description: The client address the call came from.}
        client_app: {type: string, description: "The tool that made the call, such as Claude Code."}
        app_referer:
          type: string
          maxLength: 2048
          description: >-
            The application's URL, from the client's `HTTP-Referer` header: OpenRouter's primary app-attribution
            identifier. Trimmed, bounded and free of control characters; absent when the client named none.
        app_title:
          type: string
          maxLength: 200
          description: >-
            The application's display name, from `X-OpenRouter-Title` (or the older `X-Title`). Trimmed, bounded and
            free of control characters; absent when the client named none.
        app_categories:
          type: string
          maxLength: 64
          description: >-
            The application's marketplace categories, from `X-OpenRouter-Categories`: at most two lowercase
            hyphen-separated names, comma-separated. Absent when the client named none.
        session_id:
          type: string
          description: >-
            The session the client named: the body's `session_id`, else the `X-Session-Id`, `X-Claude-Code-Session-Id`
            or `session_id` header, cut to 128 characters. Empty when it named none.
        subagent_id: {type: string, description: "Empty: no call format carries a subagent identifier, so it is unknown."}
        request_class:
          type: string
          description: "The kind of call, by the endpoint it came to: `chat`, `completions`, `embeddings`, `rerank` or `compact`."
        model: {type: string, description: The model name the client asked for.}
        usage:
          type: object
          description: >-
            How much of each billing item the call used (`input`, `output`, `cache_read`, …), by the item's name. An
            item the call did not use is absent.
          additionalProperties: {type: integer, format: int64, minimum: 0}
        service_tier: {type: string}
        price: {$ref: "#/components/schemas/Money"}
        free: {type: boolean, description: "Waived under the free-of-charge rule (docs/domains/billing.md「免单规则」)."}
        latency_ms: {type: integer, minimum: 0, description: "From the request's arrival, before admission, to the end of the call."}
        first_token_ms:
          type: integer
          minimum: 0
          description: >-
            From the request's arrival, before admission, to the first content of the attempt that answered it. 0 when none answered with
            content, for embeddings, rerank and compact replies, which arrive whole, and for a cache hit.
        finish_reason: {type: string}
        error_kind:
          type: string
          description: >-
            The unified error type the call was answered with, such as `upstream_error` or `timeout` (`internal_error`
            when the node failed while running it). Empty when the call succeeded or the client left first, which
            `finish_reason` `cancelled` says.
        cache_hit:
          type: boolean
          description: >-
            The answer came from the response cache: no upstream attempt was made, so usage counts are zero and price is zero.
            Different from `free`, which is a charge the free-of-charge rules waived.
    ChargeItem:
      type: object
      description: One billed item of a sampling or the attempt's request, at its frozen sale price; no supplier or cost information.
      properties:
        item: {type: string, description: "Billing item, or unknown_tokens / unknown_uses for unmapped usage."}
        quantity: {type: integer, format: int64, minimum: 0}
        unit: {type: string, enum: [token, use, piece, second, character]}
        unit_price: {type: string, description: "Exact currency units per billing unit (token, use, piece, second or character), decimal text with up to 15 fractional digits."}
        amount: {type: string, description: "Exact quantity times unit_price, before call-level rounding and balance adjustment."}
        sampling: {type: integer, minimum: 1, description: "Which sampling of the attempt this item belongs to, from 1; absent for an attempt-level item such as request."}
        service_tier: {type: string}
        context_band: {type: integer, minimum: 0, description: "Zero is the base band; subsequent bands follow the locked schedule's thresholds."}
        price_version: {type: string, description: "Frozen published sale version; absent when not recorded."}
        estimated: {type: boolean}
        fallback: {type: boolean, description: "An unknown item or missing/undeclared tier used the locked fallback sale price."}
    ChargeDetails:
      type: object
      description: >-
        Optional invoice from the immutable reservation, unavailable for historical or old-writer calls.
        All amounts are exact decimal currency units: subtotal + rounding + balance_adjustment = charged.
        Waived model items are omitted; tools remain chargeable. An unexecuted call has an empty items array.
      properties:
        currency: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/ChargeItem"}}
        subtotal: {type: string}
        rounding: {type: string, description: "Adjustment when the complete subtotal is rounded up once to a billionth; extreme totals saturate at the amount limit."}
        balance_adjustment: {type: string, description: "Non-positive reduction imposed by the balance floor."}
        charged: {type: string, description: "Actual debit in currency units, matching Call.price after converting its billionths."}
        estimated: {type: boolean}
    CallList:
      type: object
      required: [data, next_cursor]
      properties:
        fell_back_filter: {type: boolean, description: Applied fell_back filter; absent on older nodes.}
        status_filter:
          description: Echoes an applied status filter. Missing on old nodes; recent errors are unavailable then.
          allOf:
            - $ref: "#/components/schemas/CallStatus"
        data:
          type: array
          items: {$ref: "#/components/schemas/Call"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    OrderId: {type: string, pattern: '^ord_[0-9a-hjkmnp-tv-z]{26}$', description: "A top-up order's ID (TypeID), also the order number the payment channel sees."}
    PayAmount:
      type: object
      required: [amount, currency]
      description: >-
        An amount in the currency a method is paid in, which is not always the site's. `amount` is a non-negative integer
        in decimal text, in the currency's minor units (cents for USD, fen for CNY, none for JPY).
      properties:
        amount: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$', example: "7300"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: CNY}
    PaymentMethod:
      type: object
      required: [method, total, fee]
      properties:
        method: {type: string, example: alipay, description: "The method's code, which `createOrder` takes."}
        total: {$ref: "#/components/schemas/PayAmount"}
        fee: {$ref: "#/components/schemas/PayAmount"}
    PaymentMethodList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentMethod"}
    OrderCreate:
      type: object
      additionalProperties: false
      required: [method, credits]
      properties:
        method: {type: string, pattern: '^[a-z][a-z0-9_.]{0,31}$', example: alipay}
        credits: {$ref: "#/components/schemas/Money"}
    OrderState:
      type: string
      enum: [pending, paid, expired, cancelled, failed, review, partially_refunded, refunded, charged_back]
      description: >-
        `pending` waits for payment; `paid` is credited; `expired` and `cancelled` can still be credited if a payment
        arrives in time; `failed` was refused by the channel; `review` waits for a person (the amount did not match,
        among others) and the user needs do nothing; the rest follow refunds and chargebacks
        (docs/domains/payments.md「订单」).
    Checkout:
      type: object
      description: >-
        Where to send the user to pay: a link to open (`pay_url`), a code to show (`qr_code`), or what the channel's own
        page needs (`client_secret`, in the response that made the order only).
      properties:
        pay_url: {type: string, format: uri}
        qr_code: {type: string}
        client_secret: {type: string}
    Order:
      type: object
      description: >-
        A top-up order, with the facts a receipt renders once it is paid. A receipt is this order read, not a second
        record: nothing in it can change after the payment settles.
      required: [id, state, method, credits, total, fee, created_at, expires_at]
      properties:
        id: {$ref: "#/components/schemas/OrderId"}
        state: {$ref: "#/components/schemas/OrderState"}
        method: {type: string}
        credits: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/PayAmount"}
        fee: {$ref: "#/components/schemas/PayAmount"}
        paid_at:
          type: string
          format: date-time
          description: >-
            When the payment was confirmed, the time a receipt shows. Absent while the order is unpaid, and on a node of
            the previous release, where the page offers no receipt.
        paid_total:
          allOf: [{$ref: "#/components/schemas/PayAmount"}]
          description: >-
            What the channel took, in the payment currency. It differs from `total` when a payment arrived late and was
            converted at the arrival rate, or when an amount that did not match the quote was credited as it came.
            Absent while the order is unpaid, and on a node of the previous release.
        credited:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: >-
            The credits entered into the account, in the site's currency. It differs from `credits`, the amount asked
            for, for the same reasons as `paid_total`. Absent while the order is unpaid, and on a node of the previous
            release.
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: "When a waiting order stops being payable."}
        checkout: {$ref: "#/components/schemas/Checkout"}
        refund_allowed:
          type: boolean
          description: >-
            Whether this order's merchant account lets the account request refunds. Absent on a node of the previous
            release; the page then shows no refund action. True does not promise the channel can refund: the request
            itself still answers with the current policy.
        refunds:
          type: array
          description: >-
            The order's refunds, oldest first. Absent on a node of the previous release, and on responses that do not
            read them (creating, cancelling and verifying an order); the page reads the order again for them.
          items: {$ref: "#/components/schemas/OrderRefund"}
    OrderList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Order"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    RefundId: {type: string, pattern: '^rfd_[0-9a-hjkmnp-tv-z]{26}$', description: "A refund's ID (TypeID), the refund number of channels that take one."}
    RefundState:
      type: string
      enum: [pending_review, processing, succeeded, declined]
      x-enum-varnames: [RefundPendingReview, RefundProcessing, RefundSucceeded, RefundDeclined]
      description: >-
        `pending_review` waits for an administrator's approval; `processing` is with the payment channel and its result
        is not final; `succeeded` returned the cash and took the credits from the balance; `declined` returned the
        frozen credits and moved no cash.
    OrderRefund:
      type: object
      required: [id, state, credits, amount, created_at]
      properties:
        id: {$ref: "#/components/schemas/RefundId"}
        state: {$ref: "#/components/schemas/RefundState"}
        credits: {$ref: "#/components/schemas/Money"}
        amount:
          allOf: [{$ref: "#/components/schemas/PayAmount"}]
          description: The cash due back, in the currency the order was paid in, quoted from the batch's payment and the site's refund policy.
        created_at: {type: string, format: date-time}
        finished_at:
          type: string
          format: date-time
          description: When the refund reached `succeeded` or `declined`; absent while it is not final.
    RefundRequest:
      type: object
      additionalProperties: false
      required: [credits, reason]
      properties:
        credits: {$ref: "#/components/schemas/Money"}
        reason: {type: string, minLength: 1, maxLength: 1000}

# The console's API: what the user console calls on the public listener. Code on both sides is generated from this
# file (docs/architecture.md「仓库结构与契约文件」); change the contract here first. The conventions it follows, and
# the reasons, are in internal/platform/README.md「接口约定」; `just api` checks them.
openapi: 3.0.3
info:
  title: Axiom console API
  version: v1
  description: >-
    The API of the user console, under `/api/console/v1` on the public listener. A user signs in on a console domain
    of a site and works on their own account.


    Every operation that changes data needs the `Origin` of the site's console, `Content-Type: application/json`, and,
    with a session, the `X-CSRF-Token` of the session (security schemes `session` and `csrf`). `x-axiom-level` says
    what the session must have proved (`any`; `signed_in`, a password or better; `mfa`; `pending_mfa`) and
    `x-axiom-permission` which permission it needs on its account (`none` for no permission). A request without a
    session on an operation that needs one is a 401, one without the permission a 403. Every response carries
    `X-Request-ID` and `Cache-Control: no-store`.
tags:
  - {name: Session, description: "Sign-in, two-step verification and the current session."}
  - {name: Keys, description: "API keys."}
  - {name: Balance, description: "The account's money."}
  - {name: Calls, description: "The account's call log."}
  - {name: Top-ups, description: "Buying credits through the site's payment channels."}
paths:
  /api/console/v1/presets:
    get:
      operationId: listPresets
      tags: [Keys]
      summary: listPresets
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      parameters:
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: offset
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PresetList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createPreset
      tags: [Keys]
      summary: createPreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresetRequest"}
      responses:
        "201":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/presets/{slug}:
    parameters:
      - in: path
        name: slug
        required: true
        schema: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$'}
    get:
      operationId: getPreset
      tags: [Keys]
      summary: getPreset
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updatePreset
      tags: [Keys]
      summary: updatePreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PresetReplacement"}
      responses:
        "200":
          description: Account preset result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Preset"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: deletePreset
      tags: [Keys]
      summary: deletePreset
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "204":
          description: Account preset result.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [Session]
      summary: Read your notification preferences
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The requested notification data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: setNotificationPreferences
      tags: [Session]
      summary: Replace your notification preferences
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationPreferencesRequest"}
      responses:
        "200":
          description: The requested notification data.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/announcements:
    get:
      operationId: listAnnouncements
      tags: [Session]
      summary: Read active announcements for this site
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: Active announcements for the current site.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AnnouncementList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/version:
    get:
      operationId: getVersion
      tags: [Session]
      summary: The version of the running program
      description: >-
        The console compares it with the version it was built as and offers a reload when they differ, so a page
        left open across a deployment does not keep calling an API it no longer matches.
      security: []
      responses:
        "200":
          description: The running version
          headers:
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Version"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/sign-in:
    post:
      operationId: signIn
      tags: [Session]
      summary: Sign in with email and password
      description: >-
        Sets the session cookie. A user with two-step verification gets a pending session (`mfa_required`) that only
        `verifyMfa` accepts. An unknown email costs a password hash too, so the answer does not tell whether the
        email exists. Needs the `Origin` of the surface, but no session.


        Limits: a token bucket per client IP shared by sign-in, registration and two-step verification (burst 20, 10 a
        minute), and failed sign-ins per email (10 in 15 minutes, then a wait; the account is never locked). A limit
        is a 429 with `Retry-After`. The values are site settings with defaults in code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignInRequest"}
      responses:
        "200":
          description: Signed in, or waiting for the second factor.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [Session]
      summary: Request a password reset email
      description: >-
        Returns the same empty 202 for every valid email. Account lookup and email issuance run after acceptance.
        A later request immediately supersedes previous links. Links expire 30 minutes after the request.
        If no email arrives, wait and retry. Mail and processing failures alert the operator through the queue.
        Limited per email using the site sign-in email setting (default 10 per 15 minutes), independently counted,
        and by the sign-in IP bucket, with the same cache fallback.
        Email disabled or queue unavailable is an error for all addresses.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: {type: string, minLength: 3, maxLength: 254}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "202": {description: "Accepted; if the address is registered, a reset email will arrive. Retry later if none arrives."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/password-reset/complete:
    post:
      operationId: resetPassword
      tags: [Session]
      summary: Reset a forgotten password
      description: >-
        Consumes a single-use reset token on its own site and replaces the password. Invalid, expired, used,
        superseded and factor-stale tokens all return the same 422. Ends all sessions and recovery codes;
        TOTP stays enabled and sign-in is required. Password validation and hashing match registration.
        Consumption, password change, audit and password-changed notice commit together. Uses the sign-in IP limit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, new_password]
              properties:
                token: {type: string, minLength: 1, maxLength: 256}
                new_password: {type: string, minLength: 12, maxLength: 256}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "204": {description: "Password reset; sign in again."}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/password:
    post:
      operationId: changePassword
      tags: [Session]
      summary: Change the signed-in user's password
      description: >-
        Requires the current password. With TOTP enabled the session must have passed MFA; a pending session
        cannot change a password. Issues a replacement session at the same level, ends all other sessions and
        old recovery codes (returning replacements when TOTP is enabled), invalidates reset tokens, audits the change and queues a localized notification atomically.
        Uses registration password validation and hashing; wrong current passwords spend the user failure bucket.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: {type: string, minLength: 1, maxLength: 256}
                new_password: {type: string, minLength: 12, maxLength: 256}
                language: {type: string, enum: [zh, en], default: en}
      responses:
        "200":
          description: Password changed and current session replaced.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  csrf_token: {type: string}
                  recovery_codes:
                    type: array
                    items: {type: string}
                    description: Replacement recovery codes, returned only when TOTP is enabled.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/mfa:
    post:
      operationId: verifyMfa
      tags: [Session]
      summary: Pass two-step verification
      description: >-
        Takes the pending session of `signIn` and a TOTP or recovery code. A right code ends the pending session and
        issues a new `mfa` session (new cookie, new CSRF token); a wrong one only counts an attempt (5 per pending
        session, 10 an hour per user), and a recovery code works once. Two requests with codes for the same
        challenge give one session.


        Limits: the per-IP bucket of `signIn`.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MfaRequest"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/sign-out:
    post:
      operationId: signOut
      tags: [Session]
      summary: End the session
      description: Revokes the session of the cookie, whatever its level, and expires the cookie.
      security:
        - session: []
          csrf: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/session:
    get:
      operationId: getSession
      tags: [Session]
      summary: The current session
      description: >-
        Who is signed in and what the session may do. A page calls it on load to learn whether to show the sign-in
        page, and to get the CSRF token again (the cookie is HttpOnly, so the page keeps the token only in memory).
      security:
        - session: []
      x-axiom-level: any
      x-axiom-permission: none
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/sessions:
    get:
      operationId: listSessions
      tags: [Session]
      summary: The signed-in devices
      description: >-
        This user's live console sessions, newest first and at most 100, with when each was made and last used, the
        network it was signed in from and a short client description. `current` marks the session of this request. The
        network is the group the sign-in limits count (an IPv4 address as it is, an IPv6 allocation as its /64), and
        `client` is derived from the stored User-Agent, which is not returned. A sign-in that still waits for its
        second factor is not a signed-in device and is not listed; another surface's sessions (the admin's) and
        sessions ended by a factor change are not listed either.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The signed-in devices.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: revokeOtherSessions
      tags: [Session]
      summary: End every other session
      description: >-
        Revokes all other console sessions of the user, pending sign-ins included, and leaves the session of this
        request signed in. Returns how many ended. Another surface's sessions are not touched; replacing a factor
        ends those. The change and its audit entry commit together.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The other sessions ended.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionRevocation"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/SessionId"}
    delete:
      operationId: revokeSession
      tags: [Session]
      summary: End one other session
      description: >-
        Revokes one console session of the user. The asking session is ended by `signOut`, not here, so it is not
        found; neither is another user's, another surface's or one already ended. The change and its audit entry
        commit together.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "204": {description: "Ended."}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/setup:
    post:
      operationId: beginTotpSetup
      tags: [Session]
      summary: Start enabling two-step verification
      description: >-
        Makes a new TOTP secret and the URI for its QR code. Nothing is stored, so calling it again just makes another
        secret; `confirmTotpSetup` stores the one the user proved.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: A new secret
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TotpSetup"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/confirm:
    post:
      operationId: confirmTotpSetup
      tags: [Session]
      summary: Finish enabling two-step verification
      description: >-
        Needs the password again and a code from the new secret. Stores the secret, makes the 10 recovery codes
        (shown only in this response) and replaces the user's sessions as described by `FactorChange`. Only for a user
        who has not enabled it: once on, it stays on and cannot be replaced from the console (409); the person
        who runs the deployment can reset it from the command line.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpConfirmRequest"}
      responses:
        "200":
          description: Enabled.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/totp/replace:
    post:
      operationId: replaceTotp
      tags: [Session]
      summary: Replace two-step verification's secret
      description: >-
        Needs a session that passed two-step verification and proof of the factor being replaced: a current TOTP
        code or an unused recovery code in `current_code`. It also needs a code from the new secret, taken from
        `beginTotpSetup`, which stores nothing until this call. The old secret and every unused recovery code stop
        working, the user's other sessions end, and this device gets a new `mfa` session as `FactorChange` describes,
        all in one transaction with the audit entry. A factor that is not on is a 409; a user who lost both the
        authenticator and the recovery codes is reset from the command line.


        Limits: failed current or new codes count against the user's 10 an hour, like sign-in's second factor.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TotpReplaceRequest"}
      responses:
        "200":
          description: Replaced.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      tags: [Session]
      summary: Make new recovery codes
      description: >-
        Needs a current TOTP code from a session that passed two-step verification. The old codes stop working, and
        the user's other sessions end.


        Limits: failed codes count against the user's 10 an hour.
      security:
        - session: []
          csrf: []
      x-axiom-level: mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryCodesRequest"}
      responses:
        "200":
          description: The new codes.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FactorChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/start:
    post:
      operationId: startOAuthSignIn
      tags: [Session]
      summary: Start signing in with a third-party provider
      description: >-
        Makes a single-use state and, where the provider supports it, a PKCE verifier, stores them with the site's
        callback URI and a nonce cookie, and returns the provider's authorization URL. The callback must carry that
        nonce or it signs no browser in: state alone would let a completed callback be used to sign another browser
        in to the account that began it. The flow is for one site and expires in 10
        minutes. Needs the `Origin` of the console and no session; a site that has not stored the provider's
        application is a 404, and a request on a console domain that is not the site's login domain is refused because
        the callback and its cookie belong to that domain. Limits: the sign-in per-IP bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthStartRequest"}
      responses:
        "200":
          description: The URL to send the browser to, with the nonce cookie the callback must return.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthStart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/link/start:
    post:
      operationId: startOAuthLink
      tags: [Session]
      summary: Start linking a third-party provider to the signed-in user
      description: >-
        The same flow as `startOAuthSignIn`, bound to this user and session. It is a credential change: a user with a
        second factor must be in an `mfa` session. The callback must return to this same browser and session, or it
        links nothing. Limits: the sign-in per-IP bucket.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OAuthStartRequest"}
      responses:
        "200":
          description: The URL to send the browser to.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OAuthStart"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/oauth/{provider}/callback:
    get:
      operationId: completeOAuth
      tags: [Session]
      summary: The provider's redirect back to the site
      description: >-
        Spends the state, exchanges the code for the stored callback URI, and reads the provider's subject. A sign-in
        matches that subject against linked identities only: an unknown one is not registered and its email never
        joins accounts (no automatic merge). A link attaches the subject to the session that began the flow, raises
        the user's factor version and issues a new session. Answers 303 under the console mount: `/console/` after a
        sign-in, `/console/security` after a link, and `/console/sign-in?oauth=failed` when the round trip fails, so a
        browser never lands on JSON. The path's provider must be the one the state was made for.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OAuthProvider"}
        - name: code
          in: query
          required: false
          schema: {type: string, maxLength: 2048}
        - name: state
          in: query
          required: false
          schema: {type: string, maxLength: 512}
      responses:
        "303":
          description: The browser goes to the console page for the outcome; the cookie is set on success.
          headers:
            Location: {required: true, schema: {type: string}}
            Set-Cookie:
              description: The new session cookie, on success.
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/begin:
    post:
      operationId: beginPasskeySignIn
      tags: [Session]
      summary: Start signing in with a passkey
      description: >-
        A discoverable assertion: the browser offers every passkey for the site's login domain and the chosen one
        carries its user, so nobody types an email first and an unknown caller learns nothing about who exists. The
        ceremony requires user verification and expires in 5 minutes. Needs the `Origin` of the console and no session;
        the site must have passkeys on and a login domain. Limits: the sign-in per-IP bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The assertion challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/finish:
    post:
      operationId: finishPasskeySignIn
      tags: [Session]
      summary: Finish signing in with a passkey
      description: >-
        Verifies the assertion against the stored public key and the counter, then issues an `mfa` session: the
        authenticator verified the person and proved possession. A counter that goes backwards is refused; zero is
        what synced passkeys report and stays accepted. The body is the browser's credential JSON; `flow_id` is the
        one `beginPasskeySignIn` returned. Needs the `Origin` of the console and no session. Limits: the sign-in per-IP
        bucket.
      security: []
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/mfa/begin:
    post:
      operationId: beginPasskeyMfa
      tags: [Session]
      summary: Start the passkey factor of a pending sign-in
      description: >-
        The pending session a password sign-in issued is the only credential needed. The challenge names the user's
        credentials and requires user verification; it expires in 5 minutes.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: The assertion challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/mfa/finish:
    post:
      operationId: finishPasskeyMfa
      tags: [Session]
      summary: Finish the passkey factor of a pending sign-in
      description: >-
        Verifies the assertion, ends the pending session and issues an `mfa` session. A failed ceremony counts one of
        the pending session's five attempts, as a wrong code does. The body is the browser's credential JSON;
        `flow_id` is the one `beginPasskeyMfa` returned.
      security:
        - session: []
          csrf: []
      x-axiom-level: pending_mfa
      x-axiom-permission: none
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: Signed in with an `mfa` session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionGrant"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys:
    get:
      operationId: listPasskeys
      tags: [Session]
      summary: The signed-in user's passkeys
      description: The credentials the account page offers to delete, newest last.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Passkeys"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/register/begin:
    post:
      operationId: beginPasskeyRegistration
      tags: [Session]
      summary: Start adding a passkey
      description: >-
        The current password is required, and a user with a second factor must be in an `mfa` session: a passkey can
        sign in on its own, so adding one from a password-only session would let a stolen password bypass the second
        factor. The challenge excludes the user's credentials and requires user verification; it expires in 5 minutes.
        At most 10 passkeys per user.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyRegistrationRequest"}
      responses:
        "200":
          description: The creation challenge.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PasskeyChallenge"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/register/finish:
    post:
      operationId: finishPasskeyRegistration
      tags: [Session]
      summary: Finish adding a passkey
      description: >-
        Verifies the attestation, stores the credential with the name the begin stored, raises the user's factor
        version, ends every other session and issues this browser an `mfa` session. The body is the browser's
        credential JSON; `flow_id` is the one `beginPasskeyRegistration` returned.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: flow_id
          in: query
          required: true
          schema: {type: string, maxLength: 64}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WebAuthnCredential"}
      responses:
        "200":
          description: The new passkey and the replacement session.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Passkey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/passkeys/{id}:
    delete:
      operationId: deletePasskey
      tags: [Session]
      summary: Remove a passkey
      description: >-
        Requires the current password, and an `mfa` session when the user has another second factor. Raises the factor
        version, ends every other session and issues this browser a new session at the same level; audits the removal.
        The password remains a way in.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/PasskeyId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PasskeyDeleteRequest"}
      responses:
        "200":
          description: The replacement session's CSRF token.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CredentialChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/identities:
    get:
      operationId: listIdentities
      tags: [Session]
      summary: The signed-in user's linked third-party accounts
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      responses:
        "200":
          description: The linked identities.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Identities"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/identities/{provider}:
    delete:
      operationId: unlinkIdentity
      tags: [Session]
      summary: Unlink a third-party account
      description: >-
        Requires an `mfa` session when the user has a second factor. Raises the factor version, ends every other
        session and issues this browser a new session at the same level; audits the removal. The password remains a
        way in.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      parameters:
        - name: provider
          in: path
          required: true
          schema: {$ref: "#/components/schemas/OAuthProvider"}
      responses:
        "200":
          description: The replacement session's CSRF token.
          headers:
            Set-Cookie: {$ref: "#/components/headers/SetCookie"}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CredentialChange"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/legal:
    get:
      operationId: getLegalDocuments
      tags: [Session]
      summary: The site's current legal documents
      description: >-
        The terms of service and the privacy policy the site has published, at their current versions, as plain text.
        The registration page shows them and sends their versions back with the registration or with
        `acceptLegalDocuments`. A site that publishes none answers an empty list and requires no acceptance. The text
        is public: no session is needed.
      security: []
      responses:
        "200":
          description: The current documents, one per kind, oldest kind first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LegalDocuments"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/legal/accept:
    post:
      operationId: acceptLegalDocuments
      tags: [Session]
      summary: Accept the current legal documents
      description: >-
        Records the signed-in user's acceptance of every current document at the version the request names, with the
        time. A missing, stale or extra version is `consent_required`: the page must send exactly what
        `getLegalDocuments` returned. Accepting the same version again changes nothing. A session may call this while
        the rest of the console is refused for want of acceptance.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/LegalAcceptance"}
      responses:
        "204": {description: Accepted.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/site:
    get:
      operationId: getSite
      tags: [Session]
      summary: The site the request's domain belongs to
      description: >-
        What the sign-in and registration pages need before anyone is signed in: the site's name and logo for the
        brand, whether registration needs an invite, and, on a site with open registration, the proof-of-work
        difficulty the page must solve. The site is found from the `Host`, which must be a domain registered for the
        console; any other host gets a 404.
      security: []
      responses:
        "200":
          description: The site
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Site"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/site/logo/{hash}:
    get:
      operationId: getSiteLogo
      tags: [Session]
      summary: The site's logo
      description: >-
        The logo the site configures, at the URL `getSite` gives while the site has one. The URL carries the SHA-256 of
        the bytes served, so a logo never changes under its URL and a browser may keep it for a year. A hash the site
        never served is a 404; an earlier logo stays available under its own hash, so a page opened before the logo
        changed keeps its image.
      security: []
      parameters:
        - name: hash
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      responses:
        "200":
          description: The logo.
          headers:
            Cache-Control:
              required: true
              description: Long-lived and immutable, because the hash in the URL names the bytes.
              schema: {type: string}
          content:
            image/svg+xml:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
            image/webp:
              schema: {type: string, format: binary}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/register:
    post:
      operationId: register
      tags: [Session]
      summary: Register with an invite code or open registration
      description: >-
        On a site registering by invitation, makes the user, their personal account, its default workspace and
        balance, in the site's default tier, and answers 201. It does not sign the user in: the page calls `signIn`
        next with the same credentials. An unusable code (unknown, its user disabled, or the site not registering by
        invitation) is one `invalid_invite`; a taken email is `email_taken`, and the whole registration is undone.


        On a site with open registration, checks the address against the site's domain lists and the proof of work,
        stores one pending registration without a password, and queues a single-use verification link; the answer is
        always 202 for a well-formed address, whether or not it is registered already, so an anonymous caller cannot
        learn which addresses exist. A password in this request is ignored: the verification page sets it after the
        address is proved, so a caller cannot choose the password of an address it does not own. A duplicate is found
        when the link is clicked and answered with `email_taken` there. A site that sets open registration but cannot
        send mail answers `unavailable`, and a closed site `registration_closed`.


        Limits: the per-IP bucket of `signIn`, and on open registration, the email domain's bucket.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RegisterRequest"}
      responses:
        "201":
          description: Registered with an invite code.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Registered"}
        "202":
          description: Open registration accepted; a verification link is on its way.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RegistrationPending"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Session]
      summary: Verify an open registration's email
      description: >-
        Turns the single-use token from the verification mail and the password chosen by the mailbox owner into the
        user, their personal account, its default workspace and balance. The password is validated and hashed only
        after the token is found; no password is kept before this request. The token is bound to the console domain
        and the pending registration; an unknown, expired or already used one is one `invalid_verification`, and an
        address registered in the meantime is `email_taken`. The user is not signed in: the page sends them to sign in
        with the password they chose. Limits: the per-IP bucket of `signIn`; an attempt spends one before the token is
        looked up or the password is hashed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VerifyEmailRequest"}
      responses:
        "204": {description: Verified.}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/keys:
    get:
      operationId: listKeys
      tags: [Keys]
      summary: The account's API keys
      description: >-
        Every key of the session's account that is not deleted, disabled ones included, newest first. The text of a
        key is never returned again after `createKey`.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of keys
          content:
            application/json:
              schema: {$ref: "#/components/schemas/KeyList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
    post:
      operationId: createKey
      tags: [Keys]
      summary: Make an API key
      description: >-
        Makes a call or management key in the account's default workspace, with the site's prefix. A call key without
        `spend_limit` gets the site's daily default. A management key requires `expires_at` and both api_keys.manage
        and api_keys.view. It does not use the site's default spending limit: omitted `spend_limit` means its
        delegation ceiling is unrestricted; child call keys created with an omitted limit inherit that ceiling.
        The key text is in this response only; only its hash is
        stored. This operation takes no idempotency key: if the response is lost, the key shows in the list unused,
        and the user deletes it. The site may cap the keys an account holds, answered 409 `too_many_keys`, and the keys it
        makes in an hour, answered 429 with `Retry-After`; the message names the limit and how many the account has.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeyCreate"}
      responses:
        "201":
          description: The key and its text.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CreatedKey"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/keys/{key_id}:
    parameters:
      - name: key_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/KeyId"}
    get:
      operationId: getKey
      tags: [Keys]
      summary: One API key
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.view
      responses:
        "200":
          description: The key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    put:
      operationId: updateKey
      tags: [Keys]
      summary: Change an API key's settings
      description: >-
        Replaces every setting the user may change: what the request leaves out is unrestricted (no spend limit, any
        model, any IP), so a page sends back all of the key's current settings with its edit. The expiry cannot be
        changed after the key is made. Disabling takes effect on the next call on every node; `disabled: false`
        enables the key again.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/KeySettings"}
      responses:
        "200":
          description: The key as changed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Key"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
    delete:
      operationId: deleteKey
      tags: [Keys]
      summary: Delete an API key
      description: Deletes the key for good; it cannot be restored, and its calls stay in the call list.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: api_keys.manage
      responses:
        "204": {description: Deleted.}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/balance:
    get:
      operationId: getBalance
      tags: [Balance]
      summary: The account's balance
      description: >-
        What the user sees on arrival: the balance and what is left to spend. OpenRouter's `GET /api/v1/credits`
        returns total credits and total usage; Axiom returns the figures a call is admitted by, so the page can say
        why a call was refused.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The balance
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Balance"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/statement:
    get:
      operationId: listStatement
      tags: [Balance]
      summary: The account's credit statement
      description: >-
        Every credit event, newest first in ledger commit order: top-up, gift, call charge or reversal, expiry,
        refund freeze, unfreeze or completed refund. Corrections can create multiple events for one call.
        `reference` identifies the call for charges/reversals and the batch otherwise (the order ID for paid credit).
        Freezes change frozen credits but leave the total balance unchanged. No ledger entry, book or platform account appears. An event that commits while the pages
        are being read lands above the cursor and shifts none of the pages already read. Each page scans at most eight
        bounded candidate batches; zero-effect events are skipped. An empty `data` with a non-null `next_cursor`
        means continue through an empty segment, not end of history.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of the statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/statement.csv:
    get:
      operationId: exportStatement
      tags: [Balance]
      summary: The account's credit statement as a CSV file
      description: >-
        The rows of `listStatement`, newest first, as comma-separated text under a header row: `at` (RFC 3339, UTC),
        `kind`, `amount`, `balance_after` (empty where the row's balance after is null), `currency`, `reference`,
        `frozen_change`, `frozen_after`.
        All amounts are exact decimals in site credits. At most the newest 10 000 events are streamed in cursor pages
        using bounded memory. Empty continuation pages are traversed. A failure after output starts closes the
        connection rather than completing a truncated CSV. Older events remain accessible through `listStatement`.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The statement, at most the newest 10 000 movements.
          headers:
            Content-Disposition:
              required: true
              description: An attachment named for its contents.
              schema: {type: string}
          content:
            text/csv:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls:
    get:
      operationId: listCalls
      tags: [Calls]
      summary: The account's calls
      description: >-
        The calls of the session's account, newest first, as the call log keeps them: no conversation content, and no
        cost, endpoint or route, only what the user paid. A new call arriving does not shift the pages already read.
        A filter by model or client application reads that filter's index, so a rare model costs what it matches, not
        what the account holds. `since` is inclusive and `until` exclusive.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of calls
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/aggregate:
    get:
      operationId: aggregateCalls
      tags: [Calls]
      summary: Calls and user charges grouped by UTC day, model or key
      description: >-
        All matching calls in the window, independent of list pagination. Defaults to the last 30 days ending now;
        at most 31 days and 1000 groups. A larger result is refused with 400; narrow the window or filters.
        Currencies are grouped separately. Charges are exact integer text in billionths, never supplier cost.
        No conversation content, endpoint or routing data. Ten-second request deadline.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - name: group_by
          in: query
          required: false
          schema: {type: string, enum: [day, model, key], default: day}
      responses:
        "200":
          description: Complete totals for the selected window
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CallAggregates"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/export:
    get:
      operationId: exportCalls
      tags: [Calls]
      summary: Stream the account's call metadata as CSV
      description: >-
        Same filters and newest-first cursor order as listCalls, from one database snapshot. Defaults to the last
        30 days ending now, at most 31 days. At most 10000 matching rows, streamed in pages of 200.
        Before writing CSV, a bounded ordered key probe in the same snapshot reads at most 10001 matching keys.
        More than 10000 matches is a 400 response: narrow the window or filters. A successful CSV contains
        every matching row after the optional cursor; it is never silently truncated. No HTTP trailers are needed.
        X-Export-Since and X-Export-Until return the effective window, including defaults.
        A failure after streaming starts aborts the connection.
        Ten-second request deadline includes writes, and cancellation releases the snapshot.
        Amounts are exact decimal text in currency units with nine fractional digits. Cells whose first
        non-whitespace character is =, +, -, or @ are prefixed with an apostrophe; CSV quoting alone is insufficient.
        No conversation content, credentials, supplier cost, endpoint or route.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - $ref: "#/components/parameters/CallSince"
        - $ref: "#/components/parameters/CallUntil"
        - $ref: "#/components/parameters/CallModel"
        - $ref: "#/components/parameters/CallClientApp"
        - $ref: "#/components/parameters/CallKey"
        - $ref: "#/components/parameters/CallWorkspace"
        - $ref: "#/components/parameters/CallStatus"
        - $ref: "#/components/parameters/CallRequestId"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Complete CSV of the selected calls, never a truncated chunk
          headers:
            Content-Disposition:
              schema: {type: string}
            X-Export-Since:
              description: Effective inclusive start, including the default window.
              schema: {type: string, format: date-time}
            X-Export-Until:
              description: Effective exclusive end, including the default window.
              schema: {type: string, format: date-time}
          content:
            text/csv:
              schema: {type: string}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/calls/{call_id}:
    get:
      operationId: getCall
      tags: [Calls]
      summary: One call
      description: >-
        The call with this ID (the `X-Request-ID` of its response), if it is the session's account's. The same fields
        as the list for now; the attempts, route and cost breakdown the detail page will show come as further fields
        when the modules that keep them can serve users.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: calls.view
      parameters:
        - name: call_id
          in: path
          required: true
          schema: {$ref: "#/components/schemas/CallId"}
      responses:
        "200":
          description: The call
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Call"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/payment-methods:
    get:
      operationId: listPaymentMethods
      tags: [Top-ups]
      summary: What some credits cost through each payment method
      description: >-
        For the top-up page: every payment method the site takes for this amount that has a merchant account able to
        take it now, with what the user would pay through it, fee included, in the currency that method is paid in
        (not the site's). A method whose accounts are all over a limit, unusable, or in a currency without an exchange
        rate is left out. The price is a quote: `createOrder` locks the rate and the merchant account when it places
        the order. A site that has not opened top-ups is `not_ready`; an amount outside the site's limits is
        `unprocessable`.


        Needs `balance.view`, like every operation of the account's money in this version of the roles.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: credits
          in: query
          required: true
          description: "The credits to buy, in billionths of one unit of the site's currency, as a positive integer in decimal text."
          schema: {type: string, pattern: '^[1-9][0-9]{0,18}$', example: "10000000000"}
      responses:
        "200":
          description: The methods, in the order the site lists them
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PaymentMethodList"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders:
    post:
      operationId: createOrder
      tags: [Top-ups]
      summary: Place a top-up order
      description: >-
        Places an order for credits paid by a method and, in the same request, asks the payment channel for the page to
        pay on. The server picks the merchant account and locks the price and the exchange rate for the order's
        lifetime. The address the browser comes back to is built by the server from the console's registered origin;
        the request cannot carry one. Needs `balance.view`, like every operation of the account's money in this version
        of the roles.


        `Idempotency-Key` makes the request happen once per account: the same key with the same request returns the
        order it made, even if top-ups were closed since, and the same key with another method or amount is
        `idempotency_key_reused`. A new key is a new order. Read the answer by its status, never by "no error":
        `201` is a waiting order with `checkout` to send the user to (its `client_secret`, when the channel gives one,
        is in this response only and never in a replay); `202` is a waiting order the channel has not confirmed (the
        request failed in transit or is still running, so the order may exist at the gateway, and a replay of the key
        answers `202` again): it has no `checkout`, the user must not pay it, and the page cancels it or lets it
        expire; `200` is an order that is no longer waiting (paid, cancelled, expired, in review, ...), shown as its
        `state` says and without `checkout`; `422` is an order the channel refused, which stays refused for this key,
        so the page starts a new top-up with a new key (and another method if it happens again).


        Limits (each refuses the request, with what to do next): at most a few orders waiting for payment per account
        (`conflict`: pay or cancel one first); cancellations per account per hour (`rate_limited`); the site's daily
        limit per account and the limit of a first top-up (`unprocessable`); and per IP group, orders per hour and
        failed orders per hour (`rate_limited`, `Retry-After` the time until the hour is over). An IPv6 address counts
        by its /64. If the counting itself fails, the request is refused (`internal`), never let through.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: "A key the caller chooses for one intended top-up, 1 to 128 of letters, digits and `._:-` (a UUID is fine)."
          schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,128}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/OrderCreate"}
      responses:
        "200":
          description: The order is no longer waiting (a replay), without a checkout.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "201":
          description: A waiting order with the page to pay on.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "202":
          description: A waiting order the channel has not confirmed. It has no checkout and is not to be paid.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    get:
      operationId: getOrder
      tags: [Top-ups]
      summary: One top-up order
      description: >-
        The account's own order, as it is now. Only a waiting order has a `checkout`. An order of another account is
        a 404 like one that does not exist.
      security:
        - session: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.view
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}/cancel:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    post:
      operationId: cancelOrder
      tags: [Top-ups]
      summary: Cancel an order that waits for payment
      description: >-
        The order stops being payable here and frees its place among the account's waiting orders; the channel is then
        asked to close it. Cancelling a cancelled order answers with it again. An order that is paid, expired or
        otherwise past waiting is `conflict`. Cancellations count against the account's hourly limit.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      responses:
        "200":
          description: The order, cancelled
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        default: {$ref: "#/components/responses/Failure"}
  /api/console/v1/orders/{order_id}/verify:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {$ref: "#/components/schemas/OrderId"}
    post:
      operationId: verifyOrder
      tags: [Top-ups]
      summary: Ask the payment channel about an order now
      description: >-
        The page's "I have paid" button. Asks the payment channel once whether the order was paid and credits it if so;
        the answer is the order as it is afterwards, so a payment that has not arrived yet leaves it waiting. The page
        shows success only when `state` is `paid`. Each order may be asked about once a minute (`rate_limited`,
        `Retry-After` 60). A channel that does not answer is `unavailable`; the payment is not lost, the callback or
        the next query credits it.
      security:
        - session: []
          csrf: []
      x-axiom-level: signed_in
      x-axiom-permission: balance.top_up
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Order"}
        "401": {$ref: "#/components/responses/Unauthenticated"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
        default: {$ref: "#/components/responses/Failure"}
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: __Host-axiom_session
      description: >-
        The session cookie (HttpOnly, Secure, SameSite=Lax). Its name loses the `__Host-` prefix only where the site's
        registered origin is `http://localhost`. The sign-in operations set it, and it is valid only on the surface
        that issued it.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        The session's CSRF token, which sign-in, two-step verification and `getSession` return. Every request that
        changes data and carries a session sends it; the request must also carry an `Origin` equal to the origin
        registered for the site and surface, and `Content-Type: application/json`. The API sends no CORS headers.
  headers:
    SetCookie:
      required: true
      description: The new session cookie, or an expired one that ends the session.
      schema: {type: string}
  parameters:
    CallSince:
      name: since
      in: query
      schema: {type: string, format: date-time}
    CallUntil:
      name: until
      in: query
      schema: {type: string, format: date-time}
    CallModel:
      name: model
      in: query
      description: Exactly the model name the client asked for.
      schema: {type: string, maxLength: 200}
    CallClientApp:
      name: client_app
      in: query
      schema: {type: string, maxLength: 200}
    CallKey:
      name: key_id
      in: query
      schema: {$ref: "#/components/schemas/KeyId"}
    CallWorkspace:
      name: workspace_id
      in: query
      schema: {$ref: "#/components/schemas/WorkspaceId"}
    CallStatus:
      name: status
      in: query
      description: success means empty error_kind; error means nonempty error_kind. Omit for both.
      schema: {$ref: "#/components/schemas/CallStatus"}
    CallRequestId:
      name: request_id
      in: query
      schema: {$ref: "#/components/schemas/CallId"}
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid for
        the same filters, and a malformed one is a 400.
      schema: {type: string, minLength: 1, maxLength: 512}
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
  responses:
    BadRequest:
      description: The request is malformed or breaks a constraint of the contract (`invalid_request`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unauthenticated:
      description: >-
        No valid session for this surface, or the credentials of a sign-in are wrong, alike for an unknown email, a
        wrong password and a disabled user (`unauthenticated`, `invalid_credentials`, `invalid_code`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Forbidden:
      description: >-
        The session may not do this: the permission is missing, the session has not passed two-step verification
        (`mfa_required`), the Origin, content type or CSRF token is wrong (`origin_rejected`), or the current legal
        documents have not been accepted (`consent_required`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NotFound:
      description: >-
        There is no such resource, or the session's scope cannot see it. A malformed ID and an unknown one answer
        alike (`not_found`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Failure:
      description: >-
        Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503). A 500 never carries the internal error's text.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    PresetConfig:
      x-go-type: jsonx.Raw
      type: object
      additionalProperties: true
      description: Inference defaults. Only deliberate configuration, no transient input.
    PresetRequest:
      type: object
      additionalProperties: false
      required: [slug, name, config]
      properties:
        slug: {type: string, minLength: 1, maxLength: 100, pattern: '^[a-zA-Z0-9_-]+$'}
        name: {type: string, minLength: 1, maxLength: 100}
        config: {$ref: "#/components/schemas/PresetConfig"}
    PresetReplacement:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        config: {$ref: "#/components/schemas/PresetConfig"}
    Preset:
      type: object
      additionalProperties: false
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        config: {$ref: "#/components/schemas/PresetConfig"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    PresetList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Preset"}
        total_count: {type: integer}
    CallStatus:
      type: string
      enum: [success, error]
    CallAggregates:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/CallAggregate"}
        since: {type: string, format: date-time}
        until: {type: string, format: date-time}
        group_by: {type: string, enum: [day, model, key]}
    CallAggregateMoney:
      type: object
      additionalProperties: false
      description: A sum of user charges, in billionths. Unlike a single charge, this can exceed int64 and 19 digits.
      properties:
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)$'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    CallAggregate:
      type: object
      additionalProperties: false
      properties:
        bucket:
          type: string
          description: UTC date, exact model name, or public key ID, according to group_by.
        calls:
          type: string
          pattern: '^[0-9]+$'
        price: {$ref: "#/components/schemas/CallAggregateMoney"}
    SiteId: {type: string, pattern: '^site_[0-9a-hjkmnp-tv-z]{26}$', description: "A site's ID (TypeID)."}
    AnnouncementId: {type: string, pattern: '^ann_[0-9a-hjkmnp-tv-z]{26}$', description: "A site announcement's ID (TypeID)."}
    Announcement:
      type: object
      additionalProperties: false
      properties:
        id: {$ref: "#/components/schemas/AnnouncementId"}
        site_id: {$ref: "#/components/schemas/SiteId"}
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 20000}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
    NotificationPreferences:
      type: object
      additionalProperties: false
      properties:
        low_balance: {type: boolean}
        top_up: {type: boolean}
        factor_changed: {type: boolean, description: "Controls background factor-change email and webhooks. Password-change security email is always sent."}
        threshold: {type: string, pattern: '^[0-9]+$', maxLength: 19, description: "Billionths of site credits."}
        webhook_url: {type: string, maxLength: 2048}
        language: {type: string, enum: [en, zh]}
    NotificationPreferencesRequest:
      type: object
      additionalProperties: false
      required: [low_balance, top_up, factor_changed, threshold, webhook_url, language]
      properties:
        low_balance: {type: boolean}
        top_up: {type: boolean}
        factor_changed: {type: boolean, description: "Controls background factor-change email and webhooks. Password-change security email is always sent."}
        threshold: {type: string, pattern: '^[0-9]+$', maxLength: 19, description: "Billionths of site credits."}
        webhook_url: {type: string, maxLength: 2048}
        language: {type: string, enum: [en, zh]}
    AnnouncementList:
      type: object
      additionalProperties: false
      properties:
        data:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/Announcement"}
    Error:
      type: object
      required: [error]
      description: >-
        The body of every failure. The request ID is in the `X-Request-ID` response header, as on every response.
      properties:
        error: {$ref: "#/components/schemas/ErrorDetail"}
    ErrorDetail:
      type: object
      required: [code, message]
      description: >-
        `code` is what a client branches on and translates; `message` is English text for logs and developers.
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message: {type: string}
        fields:
          type: array
          description: Which parts of the request broke a constraint, for `invalid_request`.
          items: {$ref: "#/components/schemas/ErrorField"}
    ErrorField:
      type: object
      required: [pointer, message]
      properties:
        pointer: {type: string, description: "JSON pointer into the request body, or the name of a query or path parameter."}
        message: {type: string}
    ErrorCode:
      type: string
      description: >-
        The closed list of failure codes. A code is added in a contract change, so a client that translates every code
        fails to compile until it knows the new one.
      enum:
        - invalid_request
        - unauthenticated
        - invalid_credentials
        - invalid_code
        - forbidden
        - mfa_required
        - consent_required
        - origin_rejected
        - not_found
        - conflict
        - login_domain_locked
        - login_domain_required
        - identity_taken
        - identity_already_linked
        - account_not_linked
        - email_taken
        - name_taken
        - too_many_keys
        - stale_revision
        - idempotency_key_reused
        - invalid_invite
        - registration_closed
        - human_check_failed
        - email_domain_not_allowed
        - invalid_verification
        - weak_password
        - not_ready
        - unprocessable
        - rate_limited
        - internal
        - not_implemented
        - unavailable
    Money:
      type: object
      required: [amount, currency]
      description: >-
        An exact amount of a site's accounting currency. `amount` is a signed integer in decimal text, in billionths of
        one unit of the currency (docs/domains/billing.md「钱的表示」). It is text because a JSON number would round
        above 2^53 (about 9 million units) in the browser.
      properties:
        amount: {type: string, pattern: '^-?(0|[1-9][0-9]{0,18})$', example: "1500000000"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD}
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          description: >-
            The program's version line exactly as `axiom version` prints it: the main module's version, which the Go
            toolchain stamps from version control (such as a pseudo-version with the commit time and hash, +dirty for
            uncommitted changes). The console is stamped with the same line and only compares the two whole for
            equality.
          example: axiom v0.0.0-20261014044725-4daa4538fcac
    UserId: {type: string, pattern: '^user_[0-9a-hjkmnp-tv-z]{26}$', description: "A user's ID (TypeID)."}
    AccountId: {type: string, pattern: '^acct_[0-9a-hjkmnp-tv-z]{26}$', description: "An account's ID (TypeID)."}
    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 1, maxLength: 256}
    SessionGrant:
      type: object
      required: [status, csrf_token]
      properties:
        status:
          type: string
          enum: [signed_in, mfa_required]
          description: >-
            `mfa_required`: the password was right and the user has two-step verification, so the cookie is a pending
            session that only `verifyMfa` accepts, for 5 minutes.
        csrf_token: {type: string, description: "Sent as X-CSRF-Token on the requests that change data."}
    MfaRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            A TOTP code (6 digits) or a recovery code (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server
            tells them apart by shape.
    SessionLevel:
      type: string
      enum: [pending_mfa, password, mfa]
      description: >-
        What the session has proved: only the password, or two-step verification too (`mfa`). `pending_mfa` is a
        sign-in that waits for its second factor.
    LegalDocumentKind:
      type: string
      enum: [terms, privacy]
    LegalDocument:
      type: object
      description: One version of one of the site's legal documents; the text is plain text, never HTML.
      required: [kind, version, body, published_at]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        version: {type: integer, minimum: 1}
        body: {type: string}
        published_at: {type: string, format: date-time}
    LegalDocumentVersion:
      type: object
      required: [kind, version]
      properties:
        kind: {$ref: "#/components/schemas/LegalDocumentKind"}
        version: {type: integer, minimum: 1}
    LegalDocuments:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          description: The current version of each kind, at most one per kind.
          items: {$ref: "#/components/schemas/LegalDocument"}
    LegalAcceptance:
      type: object
      required: [consent]
      properties:
        consent:
          type: array
          description: Every current document at its current version, as getLegalDocuments returned it.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    SessionConsent:
      type: object
      description: >-
        The legal documents the signed-in user has not accepted. A page built before this field shows nothing and the
        server refuses its requests with `consent_required` instead.
      required: [required]
      properties:
        required:
          type: array
          description: Current documents this user has not accepted; empty when every one is accepted.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    Session:
      type: object
      required: [user, account, level, mfa_enabled, csrf_token, expires_at, permissions]
      properties:
        user:
          type: object
          required: [id, email, invite_code]
          properties:
            id: {$ref: "#/components/schemas/UserId"}
            email: {type: string}
            invite_code: {type: string, description: "The user's own invite code, which a new user registers with."}
        account: {$ref: "#/components/schemas/AccountId"}
        level: {$ref: "#/components/schemas/SessionLevel"}
        mfa_enabled: {type: boolean, description: "Whether the user has a TOTP factor."}
        csrf_token: {type: string}
        expires_at: {type: string, format: date-time, description: "When the session ends if it is not used again; the idle timeout moves it."}
        permissions:
          type: array
          description: >-
            The permission names the session holds on its own scope (the user's account on the console, the platform
            on the admin), for showing or hiding what the user cannot do. The server decides again on every request.
          items: {type: string}
        consent:
          allOf: [{$ref: "#/components/schemas/SessionConsent"}]
          description: >-
            What the page must show before the session may do anything else. Optional so a page built before this field
            reads an older node that does not send it.
    SessionList:
      type: object
      properties:
        sessions:
          type: array
          description: Newest first, at most 100. A page that gets no `sessions` shows the list as unavailable.
          items: {$ref: "#/components/schemas/SessionDevice"}
    SessionDevice:
      type: object
      description: >-
        One signed-in console session. Every field is optional so a page built before it reads an older node that does
        not send it.
      properties:
        id: {$ref: "#/components/schemas/SessionId"}
        current: {type: boolean, description: "Whether this is the session of the request."}
        created_at: {type: string, format: date-time, description: "When the session was signed in."}
        last_seen_at: {type: string, format: date-time, description: "When a request was last charged to it, accurate to about a minute."}
        ip_group:
          type: string
          description: >-
            The network the session was signed in from, grouped as the sign-in limits count it: an IPv4 address as it
            is, an IPv6 allocation as its /64. Empty when no address was recorded.
        client:
          type: string
          description: >-
            A short browser and platform summary derived from the User-Agent recorded at sign-in, such as
            `Chrome on macOS`, or `Unknown client`. The raw header is not returned.
    SessionRevocation:
      type: object
      properties:
        revoked: {type: integer, minimum: 0, description: "How many other sessions ended."}
    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret: {type: string, description: "The new TOTP secret in base32. Nothing is stored yet; confirmTotp sends it back."}
        uri: {type: string, description: "The otpauth:// URI for a QR code."}
    TotpConfirmRequest:
      type: object
      required: [secret, password, code]
      properties:
        secret: {type: string, maxLength: 128}
        password: {type: string, maxLength: 256, description: "The user's password, asked again."}
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    TotpReplaceRequest:
      type: object
      required: [secret, current_code, code]
      properties:
        secret: {type: string, maxLength: 128, description: "The new TOTP secret in base32, from `beginTotpSetup`."}
        current_code:
          type: string
          minLength: 6
          maxLength: 19
          description: >-
            Proof of the factor being replaced: a current TOTP code (6 digits) or an unused recovery code
            (xxxx-xxxx-xxxx-xxxx, case and hyphens ignored). The server tells them apart by shape.
        code: {type: string, pattern: '^[0-9]{6}$', description: "A code from the new secret."}
    RecoveryCodesRequest:
      type: object
      required: [code]
      properties:
        code: {type: string, pattern: '^[0-9]{6}$', description: "A current TOTP code."}
    FactorChange:
      type: object
      required: [csrf_token, recovery_codes]
      description: >-
        A changed factor ends every other session of the user and every unused recovery code, and issues this device a
        new `mfa` session: the cookie of the response replaces the old one.
      properties:
        csrf_token: {type: string}
        recovery_codes:
          type: array
          description: "10 one-time codes, each written xxxx-xxxx-xxxx-xxxx. They are shown only here."
          items: {type: string}
    Balance:
      type: object
      required: [balance, reserved, floor, available, spent_this_month]
      description: >-
        An account's money in its site's accounting currency. `available` is `balance - reserved`; a call is admitted
        while `available - floor` covers its reservation, and `floor` is at most 0. `spent_this_month` is what calls
        settled for the current UTC calendar month.
      properties:
        balance: {$ref: "#/components/schemas/Money"}
        reserved: {$ref: "#/components/schemas/Money"}
        floor: {$ref: "#/components/schemas/Money"}
        available: {$ref: "#/components/schemas/Money"}
        spent_this_month: {$ref: "#/components/schemas/Money"}
    StatementKind:
      type: string
      enum: [top_up, gift, spend, expiry, refund, reversal, freeze, unfreeze]
      description: >-
        What a statement row did to the account's credits: credit bought with a payment or an offline channel, credit
        given, a call's charge or reversal, expiry, cash refund (negative balance change), freeze or unfreeze.
    StatementRow:
      type: object
      required: [id, at, kind, amount, balance_after, reference, frozen_change, frozen_after]
      description: >-
        One movement of the account's credits. `amount` is positive when the balance rose, so a charge is negative, and
        `balance_after` is the account's balance once this movement was recorded, or null for a movement recorded before
        the ledger numbered them: those are listed by their timestamps, which do not prove the order they were posted in,
        so the balance between two of them is not known.
      properties:
        id:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: The row's own identity, to tell two rows apart; it names no ledger entry.
        at: {type: string, format: date-time, description: When the movement was recorded.}
        kind: {$ref: "#/components/schemas/StatementKind"}
        amount: {$ref: "#/components/schemas/Money"}
        balance_after:
          allOf: [{$ref: "#/components/schemas/Money"}]
          nullable: true
        frozen_change:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: Signed change in credits frozen for refunds; zero for ordinary balance changes.
        frozen_after:
          allOf: [{$ref: "#/components/schemas/Money"}]
          description: Credits frozen after this event; included in balance_after, unavailable for new spending.
        reference:
          type: string
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          description: >-
            The call ID for charges and reversals; otherwise the credit batch ID (the order ID for paid credit,
            or the offline credit ID). No payment credentials or internal account IDs are included.
    Statement:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/StatementRow"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    KeyId: {type: string, pattern: '^key_[0-9a-hjkmnp-tv-z]{26}$', description: "An API key's ID (TypeID)."}
    SessionId: {type: string, pattern: '^sess_[0-9a-hjkmnp-tv-z]{26}$', description: "A session's ID (TypeID)."}
    WorkspaceId: {type: string, pattern: '^ws_[0-9a-hjkmnp-tv-z]{26}$', description: "A workspace's ID (TypeID)."}
    CallId:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: "A call's ID, which is the request ID that every response of a model call carries as `X-Request-ID`."
    Site:
      type: object
      required: [name, key_prefix, registration, currency]
      properties:
        id: {$ref: "#/components/schemas/SiteId"}
        name: {type: string}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: USD, description: "The site's accounting currency, the one of every `Money` its API shows. It never changes."}
        brand_color:
          type: string
          pattern: '^#[0-9a-f]{6}$'
          description: >-
            The site's brand colour, lower case, from which the console derives both colour schemes' accent and primary
            button (docs/frontend.md「主题与自由度」). Absent when the site uses the default palette or the node predates
            the field.
        logo_url:
          type: string
          description: >-
            The path of the site's logo on this host. Absent when the site has no logo. It is long-cached, because its
            hash names the bytes; a page shows the site's name when the image does not load.
        key_prefix: {type: string, example: sk-ax-v1-, description: "What the site's API keys start with."}
        email_verification:
          type: boolean
          description: "Whether open registration verifies the address by mail before the user exists. Absent on a node of the previous release."
        human_check:
          type: object
          description: "The proof of work the open-registration page must solve. Absent when the site does not check, or when the node predates open registration."
          required: [bits]
          properties:
            bits: {type: integer, minimum: 12, maximum: 24, description: "Leading zero bits the SHA-256 of `axiom-registration-v1`, the site id, the normalized email and the decimal nonce must have."}
        api_base_url:
          type: string
          format: uri
          example: https://api.example.com
          description: >-
            Where a key's calls go: the origin of the site's API domain, which serves `/v1/...`. The console shows it
            to the user because the console's own host is a different one; it is never built from the request's Host.
            Absent when the site has no enabled API domain.
        registration:
          type: string
          enum: [invite, closed, open]
          description: "`invite` needs an invite code; `closed` takes no one; `open` verifies the address by mail, with the site's human check, domain lists and limits."
        login_domain:
          type: string
          description: >-
            The console domain third-party sign-in returns to and passkeys bind to. Absent until an operator sets it;
            the sign-in page sends visitors to `login_origin` when the Host is another console domain.
        login_origin:
          type: string
          format: uri
          description: "The registered origin of `login_domain`. Absent with it, or when that domain is disabled."
        passkeys:
          type: boolean
          description: "Whether the site offers passkeys. False on an older node that does not know the field."
        oauth_providers:
          type: array
          description: "The third-party providers the site configured, for the sign-in page's buttons."
          items: {$ref: "#/components/schemas/OAuthProvider"}
    OAuthProvider:
      type: string
      enum: [github, google, linuxdo]
      description: "A third-party sign-in provider."
    OAuthStartRequest:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
    OAuthStart:
      type: object
      required: [authorize_url]
      properties:
        authorize_url:
          type: string
          format: uri
          description: "The provider's authorization endpoint with this flow's client, state and, where supported, PKCE challenge."
    WebAuthnCredential:
      type: object
      additionalProperties: true
      x-go-type: jsonx.Raw
      description: >-
        The browser's `PublicKeyCredential` JSON, passed through to the WebAuthn verifier unchanged. Its shape is the
        WebAuthn specification's, not this contract's.
    PasskeyChallenge:
      type: object
      required: [flow_id, public_key]
      properties:
        flow_id: {type: string, maxLength: 64, description: "The ceremony to finish; single use, expires in 5 minutes."}
        public_key:
          $ref: "#/components/schemas/WebAuthnCredential"
    PasskeyId: {type: string, pattern: '^pk_[0-9a-hjkmnp-tv-z]{26}$', description: "A passkey's ID (TypeID)."}
    PasskeyRegistrationRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        name: {type: string, maxLength: 100, description: "A label for the credential; absent means Passkey."}
        password: {type: string, minLength: 1, maxLength: 256, description: "The current password, asked again."}
    PasskeyDeleteRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password: {type: string, minLength: 1, maxLength: 256}
    Passkey:
      type: object
      required: [id, name, created_at, backup_eligible]
      properties:
        id: {$ref: "#/components/schemas/PasskeyId"}
        name: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        backup_eligible: {type: boolean, description: "Whether the credential can be synced or backed up between devices."}
    Passkeys:
      type: object
      required: [passkeys]
      properties:
        passkeys:
          type: array
          items: {$ref: "#/components/schemas/Passkey"}
    Identity:
      type: object
      required: [provider, display_name, created_at]
      properties:
        provider: {$ref: "#/components/schemas/OAuthProvider"}
        display_name: {type: string}
        created_at: {type: string, format: date-time}
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: {$ref: "#/components/schemas/Identity"}
    CredentialChange:
      type: object
      required: [csrf_token]
      description: >-
        A credential was removed: every other session ended and the response's cookie replaces this browser's session.
      properties:
        csrf_token: {type: string}
    RegisterRequest:
      type: object
      required: [email]
      properties:
        invite_code: {type: string, minLength: 1, maxLength: 64, description: "Required on an invite-only site; ignored where registration is open."}
        email: {type: string, minLength: 3, maxLength: 254}
        password: {type: string, minLength: 12, maxLength: 256, description: "Required on an invite-only site. Open registration does not keep it: the page chooses the password on the verification page, so an unauthenticated caller cannot choose the password of an address it does not own."}
        human_check: {type: string, pattern: '^[0-9]{1,20}$', description: "The decimal nonce that solves the site's proof of work. Required where `human_check` is present."}
        language: {type: string, enum: [zh, en], description: "The language of the verification mail; absent means en. The page sends its own."}
        consent:
          type: array
          description: >-
            The current legal documents the person accepted. Required on a site that publishes any, where a missing or
            stale version is `consent_required`; open registration checks it at verify-email instead, because no user
            exists yet.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    Registered:
      type: object
      required: [user_id]
      properties:
        user_id: {$ref: "#/components/schemas/UserId"}
    RegistrationPending:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [verification_sent]}
    VerifyEmailRequest:
      type: object
      required: [token, password]
      properties:
        token: {type: string, minLength: 20, maxLength: 100}
        password: {type: string, minLength: 12, maxLength: 256, description: "The password chosen by the mailbox owner when the link is clicked."}
        consent:
          type: array
          description: >-
            The current legal documents the person accepted, shown on the verification page. Required on a site that
            publishes any; a missing or stale version is `consent_required`.
          items: {$ref: "#/components/schemas/LegalDocumentVersion"}
    Key:
      type: object
      required: [id, name, prefix, last4, workspace_id, created_at, disabled]
      description: >-
        A call or management key as the page shows it. The text is `prefix` and 49 more characters, of which only `last4` is kept
        besides the hash, so the page shows `prefix…last4`. `limit_remaining` is what is left of `spend_limit` in the
        current window; both are absent for a key without a limit.
      properties:
        id: {$ref: "#/components/schemas/KeyId"}
        kind: {type: string, enum: [call, management], description: "Defaults to call. Management keys require expires_at and cannot call models."}
        name: {type: string, minLength: 1, maxLength: 100}
        prefix: {type: string}
        last4: {type: string}
        workspace_id: {$ref: "#/components/schemas/WorkspaceId"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: "Absent for a key that does not expire."}
        disabled: {type: boolean}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        limit_remaining: {$ref: "#/components/schemas/Money"}
        models:
          type: array
          description: The model names the key may call; absent means any model.
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          description: The client addresses (IP or CIDR) the key may be used from; absent means any.
          items: {type: string, maxLength: 64}
    LimitReset:
      type: string
      enum: [daily, weekly, monthly]
      description: >-
        When the spend limit's count starts again, at midnight UTC, Monday midnight UTC, or the first of the month.
        Absent means never; it needs a `spend_limit`.
    KeyCreate:
      type: object
      required: [name]
      properties:
        kind: {type: string, enum: [call, management], description: "Defaults to call. Management keys require expires_at and cannot call models."}
        name: {type: string, minLength: 1, maxLength: 100}
        expires_at: {type: string, format: date-time, description: "UTC, in the future. It cannot be set later."}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        models:
          type: array
          maxItems: 256
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 64}
    KeySettings:
      type: object
      required: [name, disabled]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        disabled: {type: boolean}
        spend_limit: {$ref: "#/components/schemas/Money"}
        limit_reset: {$ref: "#/components/schemas/LimitReset"}
        models:
          type: array
          maxItems: 256
          items: {type: string, maxLength: 200}
        ip_allow:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 64}
    CreatedKey:
      type: object
      required: [key, secret]
      properties:
        key: {$ref: "#/components/schemas/Key"}
        secret: {type: string, description: "The key's text, to copy now: it is never shown again."}
    KeyList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/Key"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    Call:
      type: object
      required:
        - id
        - at
        - workspace_id
        - key_id
        - ip
        - client_app
        - session_id
        - subagent_id
        - request_class
        - model
        - usage
        - service_tier
        - price
        - free
        - latency_ms
        - first_token_ms
        - finish_reason
        - error_kind
      description: >-
        One call as its owner sees it. `price` is what the user paid, zero for a free call. Text that the call did not
        have is the empty string, and `first_token_ms` is 0 when no token came, as in the call log. The app-attribution
        members are absent when the client named no application, or when the call was recorded before they existed.
      properties:
        charge_details:
          $ref: "#/components/schemas/ChargeDetails"
        price_version:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Published sale version locked at admission; absent for legacy or uncharged calls.
        id: {$ref: "#/components/schemas/CallId"}
        at: {type: string, format: date-time, description: When the request started.}
        workspace_id: {$ref: "#/components/schemas/WorkspaceId"}
        key_id: {$ref: "#/components/schemas/KeyId"}
        ip: {type: string, description: The client address the call came from.}
        client_app: {type: string, description: "The tool that made the call, such as Claude Code."}
        app_referer:
          type: string
          maxLength: 2048
          description: >-
            The application's URL, from the client's `HTTP-Referer` header: OpenRouter's primary app-attribution
            identifier. Trimmed, bounded and free of control characters; absent when the client named none.
        app_title:
          type: string
          maxLength: 200
          description: >-
            The application's display name, from `X-OpenRouter-Title` (or the older `X-Title`). Trimmed, bounded and
            free of control characters; absent when the client named none.
        app_categories:
          type: string
          maxLength: 64
          description: >-
            The application's marketplace categories, from `X-OpenRouter-Categories`: at most two lowercase
            hyphen-separated names, comma-separated. Absent when the client named none.
        session_id: {type: string}
        subagent_id: {type: string}
        request_class: {type: string}
        model: {type: string, description: The model name the client asked for.}
        usage:
          type: object
          description: >-
            How much of each billing item the call used (`input`, `output`, `cache_read`, …), by the item's name. An
            item the call did not use is absent.
          additionalProperties: {type: integer, format: int64, minimum: 0}
        service_tier: {type: string}
        price: {$ref: "#/components/schemas/Money"}
        free: {type: boolean, description: "Waived under the free-of-charge rule (docs/domains/billing.md「免单规则」)."}
        latency_ms: {type: integer, minimum: 0}
        first_token_ms: {type: integer, minimum: 0}
        finish_reason: {type: string}
        error_kind: {type: string, description: "What failed, empty when the call succeeded."}
    ChargeItem:
      type: object
      description: One billed item of a sampling at its frozen sale price; no supplier or cost information.
      properties:
        item: {type: string, description: "Billing item, or unknown_tokens / unknown_uses for unmapped usage."}
        quantity: {type: integer, format: int64, minimum: 0}
        unit: {type: string, enum: [token, use, piece, second, character]}
        unit_price: {type: string, description: "Exact currency units per billing unit (token, use, piece, second or character), decimal text with up to 15 fractional digits."}
        amount: {type: string, description: "Exact quantity times unit_price, before call-level rounding and balance adjustment."}
        sampling: {type: integer, minimum: 1}
        service_tier: {type: string}
        context_band: {type: integer, minimum: 0, description: "Zero is the base band; subsequent bands follow the locked schedule's thresholds."}
        price_version: {type: string, description: "Frozen published sale version; absent when not recorded."}
        estimated: {type: boolean}
        fallback: {type: boolean, description: "An unknown item or missing/undeclared tier used the locked fallback sale price."}
    ChargeDetails:
      type: object
      description: >-
        Optional invoice from the immutable reservation, unavailable for historical or old-writer calls.
        All amounts are exact decimal currency units: subtotal + rounding + balance_adjustment = charged.
        Waived model items are omitted; tools remain chargeable. An unexecuted call has an empty items array.
      properties:
        currency: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/ChargeItem"}}
        subtotal: {type: string}
        rounding: {type: string, description: "Adjustment when the complete subtotal is rounded up once to a billionth; extreme totals saturate at the amount limit."}
        balance_adjustment: {type: string, description: "Non-positive reduction imposed by the balance floor."}
        charged: {type: string, description: "Actual debit in currency units, matching Call.price after converting its billionths."}
        estimated: {type: boolean}
    CallList:
      type: object
      required: [data, next_cursor]
      properties:
        status_filter:
          description: Echoes an applied status filter. Missing on old nodes; recent errors are unavailable then.
          allOf:
            - $ref: "#/components/schemas/CallStatus"
        data:
          type: array
          items: {$ref: "#/components/schemas/Call"}
        next_cursor: {type: string, nullable: true, description: "Null on the last page."}
    OrderId: {type: string, pattern: '^ord_[0-9a-hjkmnp-tv-z]{26}$', description: "A top-up order's ID (TypeID), also the order number the payment channel sees."}
    PayAmount:
      type: object
      required: [amount, currency]
      description: >-
        An amount in the currency a method is paid in, which is not always the site's. `amount` is a non-negative integer
        in decimal text, in the currency's minor units (cents for USD, fen for CNY, none for JPY).
      properties:
        amount: {type: string, pattern: '^(0|[1-9][0-9]{0,18})$', example: "7300"}
        currency: {type: string, pattern: '^[A-Z]{3}$', example: CNY}
    PaymentMethod:
      type: object
      required: [method, total, fee]
      properties:
        method: {type: string, example: alipay, description: "The method's code, which `createOrder` takes."}
        total: {$ref: "#/components/schemas/PayAmount"}
        fee: {$ref: "#/components/schemas/PayAmount"}
    PaymentMethodList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: "#/components/schemas/PaymentMethod"}
    OrderCreate:
      type: object
      additionalProperties: false
      required: [method, credits]
      properties:
        method: {type: string, pattern: '^[a-z][a-z0-9_.]{0,31}$', example: alipay}
        credits: {$ref: "#/components/schemas/Money"}
    OrderState:
      type: string
      enum: [pending, paid, expired, cancelled, failed, review, partially_refunded, refunded, charged_back]
      description: >-
        `pending` waits for payment; `paid` is credited; `expired` and `cancelled` can still be credited if a payment
        arrives in time; `failed` was refused by the channel; `review` waits for a person (the amount did not match,
        among others) and the user needs do nothing; the rest follow refunds and chargebacks
        (docs/domains/payments.md「订单」).
    Checkout:
      type: object
      description: >-
        Where to send the user to pay: a link to open (`pay_url`), a code to show (`qr_code`), or what the channel's own
        page needs (`client_secret`, in the response that made the order only).
      properties:
        pay_url: {type: string, format: uri}
        qr_code: {type: string}
        client_secret: {type: string}
    Order:
      type: object
      required: [id, state, method, credits, total, fee, created_at, expires_at]
      properties:
        id: {$ref: "#/components/schemas/OrderId"}
        state: {$ref: "#/components/schemas/OrderState"}
        method: {type: string}
        credits: {$ref: "#/components/schemas/Money"}
        total: {$ref: "#/components/schemas/PayAmount"}
        fee: {$ref: "#/components/schemas/PayAmount"}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time, description: "When a waiting order stops being payable."}
        checkout: {$ref: "#/components/schemas/Checkout"}

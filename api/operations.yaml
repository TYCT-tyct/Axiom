  /api/operations/v1/prices/{model_id}/publish:
    post:
      operationId: pricePublish
      summary: Publish a sale price proposal
      description: >-
        Publishes the proposal `candidate_id` of the model, read against its current version `current_id` (absent when
        the model has none), as the admin's confirmation does: never below the site's floor. The server weighs it
        against the main site's price envelope (docs/domains/operations.md「售价的累计变动上限」) from the prices it
        reads, never the agent's: within the least margin over cost, the model's daily move and the day's publications
        and models it is published at once (200, `succeeded`); outside any of them, with an unknown cost, or with a move
        no share of the old price measures (a first price, a price added or lost, zero to non-zero) it waits for the
        owner (202). A site without an envelope is a 422 `cap_exceeded`. A proposal or version that is no longer the
        model's is a 409 `stale_revision`, at once or when the owner approves; one with nothing waiting is a 409
        `conflict`. The result has the version published, `change_bps` and `margin_bps`. With `dry_run` the same
        checks run and nothing is written.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: price_publish
      parameters:
        - {in: path, name: model_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SalePricePublication'}}}
      responses:
        '200':
          description: The publication, run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The publication, waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/pricing/rules:
    get:
      operationId: pricingRulesList
      summary: The main site's pricing rules
      description: >-
        Every rule of the main site, enabled or not, in the order they are tried, as the admin reads them
        (docs/domains/billing.md「定价」). A rule's `rev` is what `pricingRuleUpdate` changes it as of. A credential kept
        to sites other than the main site reads none of them (404), the platform grant notwithstanding.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.view
      x-axiom-scope: platform
      x-mcp-name: pricing_rules_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The rules
          content: {application/json: {schema: {$ref: '#/components/schemas/PricingRuleList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: pricingRuleCreate
      summary: Add a pricing rule
      description: >-
        Adds a rule to the main site as the admin does, with the same checks (`createPricingRule`), and weighs every sale
        price the rule moves at once against the main site's price envelope (docs/domains/operations.md「售价的累计变动上限」):
        the publisher's own threshold publishes small moves at once, so the server makes the change, refreshes the
        prices and measures each change in what a buyer pays, as billing selects it from the audience layers (each tier,
        and each account with a price of its own in its tier; a new layer for a more specific target can move an
        account whose own layer did not change), never taking the agent's numbers. Moves within the least
        margin over cost, the models' daily moves and the day's publications and models, all of them together, are
        kept and counted (200, `succeeded`), and this node routes at the new prices at once; a change that moves no
        price is kept. Otherwise the change is taken back and waits for the owner (202), who sees each move; so does a
        change that gives a model its first price, takes one away or moves one no share of the old price measures, and
        one that sets a price for a model that cannot be sold yet (no endpoint, an endpoint switched off, or an unknown
        cost), which the publisher would otherwise publish by itself once the model can be served. Moves over the publisher's threshold wait
        as proposals, which `pricePublish` publishes within the envelope. A site without an envelope is a 422
        `cap_exceeded`; a rule for a target and audience that have one is a 409 `conflict`, at once or when the owner
        approves; a rule over 8 KiB as JSON is a 422 `unprocessable`. The result has `rule_id`, `rev`, `moves_total` and `moves`: up to 12 of the moves, each with
        `model_id`, `slug`, `audience` (the tier or account first seen paying it), `change_bps` and `margin_bps`. With `dry_run` the same checks run, nothing is written
        and `result` has `moves_total` and `moves` the change would make now.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: pricing_rule_create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PricingRuleWrite'}}}
      responses:
        '200':
          description: The rule added, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The rule, waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/pricing/rules/{rule_id}:
    put:
      operationId: pricingRuleUpdate
      summary: Change a pricing rule
      description: >-
        Replaces the rule's target, audience, method, constraints and `enabled` as of `rev`, as the admin does
        (`updatePricingRule`), and weighs every sale price it moves against the main site's price envelope as
        `pricingRuleCreate` does, with the same answers and result. A rule changed since `rev` is a 409
        `stale_revision`, at once or when the owner approves.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: pricing_rule_update
      parameters:
        - {in: path, name: rule_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PricingRuleChange'}}}
      responses:
        '200':
          description: The rule changed, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The change, waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals:
    get:
      operationId: approvalsList
      summary: The approvals the credential's proposals asked for
      description: >-
        Each approval one of the credential's own writes waits or waited on, newest first, optionally in one state, with
        the operation as it is now; another credential's are not listed. `pending` lists what still waits for the owner.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approvals_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: state, required: false, schema: {$ref: '#/components/schemas/OperationsApprovalState'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations, each with its approval
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}:
    get:
      operationId: approvalGet
      summary: The operation waiting on an approval
      description: The credential's operation that waits or waited on this approval, as it is now; another credential's is not found. Only the owner decides an approval, in the admin.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approval_get
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The operation
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}/wait:
    get:
      operationId: approvalWait
      summary: Wait for the owner to decide an approval
      description: >-
        Reads the credential's operation that waits on this approval, as `approvalGet` does, and while the owner can
        still decide it reads it again every second, answering as soon as it is decided, withdrawn, canceled or past its
        expiry, or when `wait_seconds` have passed (10 at most), whichever comes first. An answer whose approval is
        still `pending` means nobody decided in the wait: wait again or do something else first. Another credential's
        approval is not found, at once.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approval_wait
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: wait_seconds, required: false, description: How long to wait at most., schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
      responses:
        '200':
          description: The operation, decided or still waiting
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}/withdraw:
    post:
      operationId: approvalWithdraw
      summary: Withdraw a pending proposal
      description: >-
        Takes back one of the credential's own proposals while it waits for the owner: its operation ends `canceled`.
        One already decided, expired or withdrawn is a 409 `conflict`; another credential's is not found. With
        `dry_run` the same checks run and nothing is written.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.write
      x-axiom-scope: self
      x-mcp-name: approval_withdraw
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawRequest'}}}
      responses:
        '200':
          description: The operation, canceled, or the preview of its withdrawal
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
components:
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: >-
        An operations credential's token, `op-ax-v1-` and 49 base62 characters, which the admin shows once when it is
        made or rotated. A missing, malformed, unknown, retired, revoked or expired token is answered alike.
  headers:
    IdempotencyReplayed:
      required: false
      description: "true when this response is the stored result of an earlier request with the same Idempotency-Key; nothing was done again."
      schema: {type: boolean}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the caller chooses for one intended change. Sending the request again with the same key, after a lost
        response, returns the first result instead of doing it twice.
      schema: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
    Reason:
      in: query
      name: reason
      required: true
      description: Why the agent calls this, in its own words; recorded in the operation log as untrusted text.
      schema: {type: string, minLength: 1, maxLength: 1000}
    RunId:
      in: header
      name: X-Axiom-Run-ID
      required: false
      description: The agent's own ID of the task this call belongs to, recorded with it.
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$'}
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid
        for the same filters, and a malformed one is a 400.'
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`, `preset_default_invalid`, `preset_in_use`, `preset_quota`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`, `cap_exceeded`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CredentialRejected:
      description: No live operations credential, or a missing, malformed, unknown, retired, revoked or expired token (`unauthenticated`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    CredentialForbidden:
      description: The credential does not hold the permission the operation names (`forbidden`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    OutOfScope:
      description: >-
        There is no such resource, or it is outside the credential's scope: a site it is not given, or the platform's
        own resources without the platform grant. A malformed ID and an unknown one answer alike (`not_found`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BadRequest:
      description: The request is malformed or breaks a constraint of the contract (`invalid_request`), or names a routing
        preset it may not choose (`preset_not_selectable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Failure:
      description: 'Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503), `presets_suspended` (503, a routing preset or default write, or a key''s choice of a preset, while the
        platform has suspended routing presets). A 500 never carries the internal error''s text.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AgentSelf:
      type: object
      additionalProperties: false
      required: [id, name, permissions, platform, proposer_vendors, expires_at]
      properties:
        id: {type: string, description: "The credential's ID, an `opcred_` TypeID."}
        name: {type: string}
        permissions: {type: array, items: {type: string}, description: Sorted.}
        sites:
          type: array
          items: {$ref: '#/components/schemas/SiteId'}
          description: The sites the credential acts on; absent for every site.
        platform: {type: boolean, description: Whether it may act on the platform's own resources.}
        proposer_vendors: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
    OperationLogList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OperationLogEntry'}}
        next_cursor: {type: string}
    OperationLogEntry:
      type: object
      additionalProperties: false
      required: [id, tool, reason, input, status, request_id, started_at, ended_at]
      properties:
        id: {type: string, description: "The entry's ID, which `cursor` takes to read on from it."}
        run_id: {type: string}
        tool: {type: string, description: The MCP name of the operation.}
        reason: {type: string, description: The agent's own words; untrusted.}
        input:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: >-
            The request's path and query parameters and a write's body, all but the reason, or its size alone past 8
            KiB.
        status: {type: integer, description: The HTTP status of the answer.}
        error_code: {type: string}
        request_id: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        operation_id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The operation a write made or found under its key.
    ModelStatusChange:
      type: object
      additionalProperties: false
      required: [status, rev, reason]
      properties:
        status: {type: string, enum: [listed, retired]}
        rev: {type: integer, format: int64, minimum: 0}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: nothing is written and the model is not changed."}
    EndpointEnabledChange:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: {type: boolean, description: "Whether the endpoint may be routed to."}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    GroupSelectionChange:
      type: object
      additionalProperties: false
      required: [selected, reason]
      properties:
        selected: {type: boolean, description: "Whether the group is used."}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    ModelMappingChange:
      type: object
      additionalProperties: false
      required: [upstream_name, model_id, reason]
      properties:
        upstream_name: {type: string, minLength: 1, maxLength: 200, description: "The name as the group lists it."}
        model_id: {$ref: '#/components/schemas/Uuid'}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    TopUpProposal:
      type: object
      additionalProperties: false
      required: [amount_native, reason]
      properties:
        amount_native:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
          description: How much of the supplier's own unit (`native_unit`) to pay in, as exact decimal text above zero.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written or reserved."}
    TopUpConfirmation:
      type: object
      additionalProperties: false
      required: [proof, reason]
      properties:
        proof:
          type: string
          minLength: 1
          maxLength: 500
          description: What shows the payment arrived, such as the supplier's receipt number or the balance seen after it; recorded as untrusted text.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    CreditGrantProposal:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        expires_at: {type: string, format: date-time, description: "When the credit expires, in the future. Absent: it does not expire."}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written or reserved."}
    RefundProposal:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount:
          allOf: [{$ref: '#/components/schemas/Money'}]
          description: The credits to refund, in the currency of the order's site; the cash returned is the server's quote.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, the quote included, and nothing is written or reserved."}
    AlertKey:
      type: string
      pattern: '^[A-Za-z0-9._:/-]{1,128}$'
      description: >-
        The incident the alert is about, in the agent's own words, such as `supplier/<id>/balance`: the same key is the
        same incident until it is resolved.
    AlertRaise:
      type: object
      additionalProperties: false
      required: [key, severity, summary, reason]
      properties:
        key: {$ref: '#/components/schemas/AlertKey'}
        severity: {type: string, enum: [info, warning, critical], description: "Which rules notify the owner of it."}
        summary:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\x00]+$'
          description: >-
            What the owner reads in the notification: at most 512 bytes of UTF-8 (about 170 Chinese characters), no
            NUL. It is shown as the agent's untrusted text.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    AlertResolve:
      type: object
      additionalProperties: false
      required: [key, reason]
      properties:
        key: {$ref: '#/components/schemas/AlertKey'}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    OperationsAlertList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
        next_cursor: {type: string}
    AlertEvent:
      $ref: "admin.yaml#/components/schemas/AlertEvent"
    AlertReceipt:
      $ref: "admin.yaml#/components/schemas/AlertReceipt"
    AgentReason:
      type: string
      minLength: 1
      maxLength: 1000
      description: Why the agent asks for this, in its own words; recorded with the operation as untrusted text.
    WithdrawRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    OperationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Operation'}}
        next_cursor: {type: string}
    OrderId: {type: string, pattern: '^ord_[0-9a-hjkmnp-tv-z]{26}$', description: "A top-up order's ID (TypeID), also the order number the payment channel sees."}
    Operation:
      type: object
      additionalProperties: false
      required: [tool, target, risk, state, dry_run]
      description: >-
        One write the agent asked for. It acts on one object and is never reused: a retry under its key finds it as it
        is now. A preview (`dry_run`) has no ID, approval or times, and its `state` is where the operation would
        start: `approved` when it would run at once, `pending_approval` when it would wait for the owner; a previewed
        withdrawal answers `canceled`, where it would leave the operation.
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        tool: {type: string, description: The MCP name of the write.}
        target: {$ref: '#/components/schemas/OperationTarget'}
        risk: {$ref: '#/components/schemas/OperationRisk'}
        state: {$ref: '#/components/schemas/OperationState'}
        dry_run: {type: boolean}
        approval: {$ref: '#/components/schemas/OperationApproval'}
        result:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: >-
            What the change answered, once it succeeded; for a preview of `pricingRuleCreate` or `pricingRuleUpdate`,
            the sale prices the change would move now.
        error_code: {type: string, description: "Why it ended `rejected`, the code the target refused the change with; or `target_failed` when it ended `failed`, its target having reported the change failed (a refund the channel did not return); or `window_ended` when it ended `expired`, its run having waited past the end of its reservation's UTC day."}
        next_check_after_seconds: {type: integer, minimum: 1, description: "While it waits: when to read it again."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OperationsCapUsageList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OperationsCapUsage'}}
        price_envelopes: {type: array, items: {$ref: '#/components/schemas/OperationsPriceEnvelopeUsage'}}
    OperationsCapUsage:
      type: object
      additionalProperties: false
      required: [scope, category, currency, limits, rev, paused, day, week]
      properties:
        scope: {type: string, description: "`platform` or a site's ID."}
        category: {$ref: '#/components/schemas/OperationsCapCategory'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        limits: {$ref: '#/components/schemas/OperationsCapLimits'}
        rev: {type: integer, format: int64, minimum: 1}
        paused: {type: boolean, description: "Whether every proposal waits for the owner until the owner repairs the counters."}
        day: {$ref: '#/components/schemas/OperationsCapWindow'}
        week: {$ref: '#/components/schemas/OperationsCapWindow'}
    OperationsCapWindow:
      type: object
      additionalProperties: false
      required: [start, reserved, committed, count]
      description: >-
        What the category holds in one window. Reserved is proposed and not yet confirmed or ended; committed was
        confirmed and stays, whatever happens to the money later. Both count against every limit.
      properties:
        start: {type: string, format: date-time}
        reserved: {$ref: '#/components/schemas/OperationsCapAmount'}
        committed: {$ref: '#/components/schemas/OperationsCapAmount'}
        count: {type: integer, format: int32, minimum: 0, description: "Every proposal made in the window, however it ended."}
    OperationsCapCategory:
      $ref: "admin.yaml#/components/schemas/OperationsCapCategory"
    OperationsCapAmount:
      $ref: "admin.yaml#/components/schemas/OperationsCapAmount"
    OperationsCapLimits:

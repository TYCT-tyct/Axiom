  /api/operations/v1/orders/{order_id}/refunds:
    post:
      operationId: refundRequest
      summary: Propose refunding part of a paid order
      description: >-
        Proposes returning `amount` of the order's unused credits, in the currency of its site, through the payment
        channel the order was paid with, as an administrator's refund: the order must be paid or partly refunded, the
        credits unused and unexpired, the merchant account must refund through its channel, and no other refund of the
        order may be in flight. The server quotes the cash it would return as the refund review does; that cash,
        converted to the currency of the site's `money.refund` cap policy at the current reference rate and rounded up
        to 10⁻⁹, is reserved against those caps. The owner always approves it (202). The approval freezes the credits
        and approves the refund as the owner's in its transaction, with the credential as its requester, and leaves
        the operation `executing`; the refund poller sends it within about two minutes, and above the site's refund approval limit
        it waits in the refund review for a second administrator. Within about a minute of the refund's outcome the
        operation ends `succeeded`, its reservation committed, or `failed` with `target_failed`, its reservation
        released; the reservation stays in the day it was approved in whatever day the outcome comes. When the order
        changed under the proposal so that the approval would freeze or return another amount, the approval ends it
        `rejected` with `stale_revision` and nothing is frozen; an approval whose run waited past UTC midnight of the
        day the proposal was reserved in ends it `expired` with `window_ended`, nothing frozen, and it is proposed again. Over a hard limit, or without a policy, it is a 422
        `cap_exceeded` and nothing is written. An amount in another currency than the site's is a 400; more than the
        order's unused credits, an order that is not paid, or a currency pair without a rate is a 422
        `unprocessable`; a merchant account that does not refund through its channel, or a refund of the order still
        in flight, is a 409 `conflict`; an order outside the credential's sites is not found. A proposal that waited
        past UTC midnight is a 409 `conflict`: propose it again. A retry under the key finds the first proposal. With
        `dry_run` the same checks run, the quote included, and nothing is written.
      tags: [Payments]
      security: [{credential: []}]
      x-axiom-permission: refunds.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: refund_request
      parameters:
        - {in: path, name: order_id, required: true, schema: {$ref: '#/components/schemas/OrderId'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/RefundProposal'}}}
      responses:
        '200':
          description: The proposal found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The proposal, reserved and waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}

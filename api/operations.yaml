        tier: {$ref: '#/components/schemas/OperationsApprovalTier'}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        reasons:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/OperationsApprovalReason'}
          description: >-
            Why it waits for the owner, as the server decided it when the operation was proposed: which cap or envelope
            limit it goes over, a paused scope, or a class that always asks. Absent when an older node proposed it.

  /api/operations/v1/suppliers/{supplier_id}/top-ups:
    post:
      operationId: supplierTopUpPropose
      summary: Propose topping a supplier up
      description: >-
        Proposes that the owner pay `amount_native` of the supplier's own unit into it. The server values it with the
        supplier's confirmed unit value and the current exchange rate into the currency of the cap policy of the
        supplier's owner (the platform, or its site), rounded up to 10⁻⁹, and reserves that against the caps: within
        every autonomous limit the proposal succeeds at once (200); over one it waits for the owner (202); over a hard
        limit, or without a policy, it is a 422 `cap_exceeded` and nothing is written. The agent never pays: the
        reservation holds until it confirms the money arrived (`supplierTopUpConfirm`) or the UTC day ends. A supplier
        without a confirmed unit value, or a currency pair without a rate, is a 422 `unprocessable`; a removed supplier,
        an account's own key, or a proposal that waited past UTC midnight (propose it again), is a 409 `conflict`. A
        retry under the key finds the first proposal whatever has happened to the supplier since. With `dry_run` the same checks run and nothing is written.

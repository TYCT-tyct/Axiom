      security: [{credential: []}]
      x-axiom-permission: suppliers.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: supplier_top_up_propose
      parameters:
        - {in: path, name: supplier_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TopUpProposal'}}}
      responses:
        '200':
          description: The proposal, reserved, found again under its key as it is now, or previewed

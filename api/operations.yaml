# The operations API: what the operations agent calls through the MCP bridge on the ops node, on the core's operations
# listener (docs/domains/operations.md「运营接口」). Code on both sides is generated from this file; change the contract
# here first. The definitions it shares with api/admin.yaml are copies of them, kept identical by `just api`; the
# conventions it follows are in internal/platform/README.md「接口约定」.
openapi: 3.0.3
info:
  title: Axiom operations API
  version: v1
  description: >-
    The API the operations agent calls, under `/api/operations/v1` on the operations listener of a core node
    (docs/domains/operations.md「运营接口」). That listener is off by default and accepts only mutual TLS from a node
    certificate of the `ops` purpose; on it, every request also carries an operations credential as
    `Authorization: Bearer op-ax-v1-...`. There are no cookies, no CSRF token, no `Origin` check and no CORS.


    Each operation names the permission it needs (`x-axiom-permission`) and where it acts (`x-axiom-scope`):
    `platform` is the platform's own resources, which need the credential's platform grant; `sites` is the
    credential's sites; `self` is the credential's own record. A resource outside the credential's scope answers
    like one that does not exist (404). Every operation takes a `reason` of 1 to 1000 characters, which goes into the
    operation log with the request's parameters, and may name the agent's run in `X-Axiom-Run-ID`. Each operation is
    one MCP tool, named by `x-mcp-name`. Every response carries `X-Request-ID` and `Cache-Control: no-store`.
tags:
  - {name: Agent, description: "The credential itself and its operation log."}
  - {name: Suppliers, description: "Suppliers, their groups and keys, and the upstream model names waiting to be mapped."}
  - {name: Catalog, description: "Authors, models, their names, specs and reference prices."}
  - {name: Calls, description: "Support summaries and operator traces."}
  - {name: Pricing, description: "Sale prices, their proposals, and publishing them within the price envelope."}
  - {name: Accounts, description: "Credit grants to accounts, which the owner approves."}
  - {name: Alerts, description: "The platform's alert incidents, and the alerts the agent raises to the owner."}
paths:
  /api/operations/v1/me:
    get:
      operationId: whoami
      summary: The credential itself
      description: The credential's ID, sites, platform grant, permissions, proposer vendors and expiry; never its token.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: whoami
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The credential
          content: {application/json: {schema: {$ref: '#/components/schemas/AgentSelf'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/log:
    get:
      operationId: operationLogList
      summary: The credential's own operation log
      description: Every call this credential made of this API, reads included, newest first.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: operation_log_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of the log
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationLogList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/suppliers:
    get:
      operationId: suppliersList
      summary: Suppliers
      description: Newest first. The status filter is exact. No credential of a supplier is ever returned.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.view
      x-axiom-scope: platform
      x-mcp-name: suppliers_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: status, required: false, schema: {$ref: '#/components/schemas/SupplierStatus'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of suppliers
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/suppliers/{supplier_id}:
    get:
      operationId: suppliersGet
      summary: One supplier
      description: >-
        The supplier with its groups, the keys bound to them (their labels, never the keys) and its endpoints, as the
        sync last stored them.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.view
      x-axiom-scope: platform
      x-mcp-name: suppliers_get
      parameters:
        - {in: path, name: supplier_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The supplier
          content: {application/json: {schema: {$ref: '#/components/schemas/SupplierDetail'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/pending-mappings:
    get:
      operationId: pendingMappingsList
      summary: Upstream model names waiting to be mapped
      description: The names suppliers list that no model of the catalog claims yet, optionally of one supplier.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.view
      x-axiom-scope: platform
      x-mcp-name: pending_mappings_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: supplier_id, required: false, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of pending names
          content: {application/json: {schema: {$ref: '#/components/schemas/PendingMappingList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/models:
    get:
      operationId: modelsList
      summary: Models
      description: The catalog's models by slug, optionally of one status, author or slug prefix.
      tags: [Catalog]
      security: [{credential: []}]
      x-axiom-permission: catalog.view
      x-axiom-scope: platform
      x-mcp-name: models_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: status, required: false, schema: {$ref: '#/components/schemas/ModelStatus'}}
        - {in: query, name: author, required: false, schema: {$ref: '#/components/schemas/AuthorSlug'}}
        - {in: query, name: slug_prefix, required: false, schema: {type: string, minLength: 1, maxLength: 200}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of models
          content: {application/json: {schema: {$ref: '#/components/schemas/ModelList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/models/{model_id}:
    get:
      operationId: modelGet
      summary: One model
      description: The model with its names, spec and reference prices.
      tags: [Catalog]
      security: [{credential: []}]
      x-axiom-permission: catalog.view
      x-axiom-scope: platform
      x-mcp-name: model_get
      parameters:
        - {in: path, name: model_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The model
          content: {application/json: {schema: {$ref: '#/components/schemas/Model'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/calls:
    get:
      operationId: callsList
      summary: Call summaries
      description: >-
        The calls of the credential's sites in a window, newest first: metadata and cost only, never a request's or a
        response's content.
      tags: [Calls]
      security: [{credential: []}]
      x-axiom-permission: calls.search
      x-axiom-scope: sites
      x-mcp-name: calls_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - {in: query, name: account_id, schema: {$ref: '#/components/schemas/AccountId'}}
        - {in: query, name: request_id, schema: {type: string, format: uuid}}
        - {in: query, name: model, schema: {type: string, minLength: 1, maxLength: 200}}
        - {in: query, name: status, schema: {$ref: '#/components/schemas/AdminCallStatus'}}
        - {in: query, name: site_id, schema: {$ref: '#/components/schemas/SiteId'}}
      responses:
        '200':
          description: A page of calls
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminCallList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/calls/{call_id}:
    get:
      operationId: callGet
      summary: One call's trace
      description: The call's summary, cost, route and attempts in sequence order; never its content.
      tags: [Calls]
      security: [{credential: []}]
      x-axiom-permission: calls.inspect
      x-axiom-scope: sites
      x-mcp-name: call_get
      parameters:
        - {in: path, name: call_id, required: true, schema: {type: string, maxLength: 64}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The trace
          content: {application/json: {schema: {$ref: '#/components/schemas/AdminCallTrace'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/alerts:
    get:
      operationId: alertsList
      summary: Alert incidents
      description: >-
        The platform's alert incidents, newest first, with the delivery receipts of each: what the fixed rules and
        the agent raised, whether the owner was notified and whether it recovered. `open` keeps the ones not yet
        resolved. The agent's own alerts are of kind `operations.agent_alert`, keyed `<credential ID>/<key>`.
      tags: [Alerts]
      security: [{credential: []}]
      x-axiom-permission: calls.search
      x-axiom-scope: platform
      x-mcp-name: alerts_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: open, required: false, schema: {type: boolean}, description: "Only the incidents not yet resolved."}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of incidents
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationsAlertList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
    post:
      operationId: alertRaise
      summary: Raise an alert to the owner
      description: >-
        Raises an alert of kind `operations.agent_alert` under `key`, at once (200, `succeeded`), through the same
        rules and channels as every other alert. The incident's key is `<credential ID>/<key>`, which the result
        gives: another credential's alert under the same words is another incident. The owner is notified when a rule for that kind and severity is
        bound to a channel. One key is one incident until it is resolved: raising it again while it is open counts
        another occurrence and updates its summary without notifying again, and raising it after `alert_resolve` is a
        new incident. The incident appears in `alerts_list` within about a minute. A credential may raise at most 60
        alerts in any hour on a node, previews and retries included; past that it is a 429. With `dry_run` the same
        checks run and nothing is written.
      tags: [Alerts]
      security: [{credential: []}]
      x-axiom-permission: operations.write
      x-axiom-scope: self
      x-mcp-name: alert_raise
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AlertRaise'}}}
      responses:
        '200':
          description: The operation run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/alerts/resolve:
    post:
      operationId: alertResolve
      summary: Resolve an alert the agent raised
      description: >-
        Resolves the credential's own open `operations.agent_alert` incident under `key`, at once (200, `succeeded`):
        the owner gets
        the recovery notice when the first one reached them, and the key's next `alert_raise` is a new incident. A
        key with no open incident is left as it is. Only the credential's own alerts can be resolved here; the other kinds
        recover by their own rules or are closed by the owner. With `dry_run` the same checks run and nothing is
        written.
      tags: [Alerts]
      security: [{credential: []}]
      x-axiom-permission: operations.write
      x-axiom-scope: self
      x-mcp-name: alert_resolve
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AlertResolve'}}}
      responses:
        '200':
          description: The operation run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/models/{model_id}/status:
    put:
      operationId: modelSetStatus
      summary: Put a draft model on sale or retire a listed one
      description: >-
        `listed` puts a draft model on sale as the admin does, after the same review gate, and runs at once (200,
        `succeeded`). `retired` takes a listed model out of use for good, so it waits for the owner's approval (202,
        `pending_approval`) and runs when the owner approves; a model changed since `rev` then ends the operation
        `rejected` with `stale_revision`. A `rev` that is not the model's current one is a 409 `stale_revision` at
        once. With `dry_run` nothing is written: the answer says where the operation would start.
      tags: [Catalog]
      security: [{credential: []}]
      x-axiom-permission: catalog.manage
      x-axiom-scope: platform
      x-mcp-name: model_set_status
      parameters:
        - {in: path, name: model_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ModelStatusChange'}}}
      responses:
        '200':
          description: The operation run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The operation, waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/suppliers/{supplier_id}/endpoints/{endpoint_id}/enabled:
    put:
      operationId: endpointSetEnabled
      summary: Turn an endpoint on or off for routing
      description: >-
        Turns one of the supplier's endpoints (`suppliers_get` lists them) on or off for routing, as the admin does,
        and runs at once (200, `succeeded`); the result is the endpoint's switch as it now is. Every node routes by it
        from its next reload; only an enabled endpoint whose cost is `known` is routed to, and the supplier sync never
        turns an endpoint back on. A supplier that is being removed or was removed is a 409 `conflict`. With `dry_run`
        the same checks run and nothing is written.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.manage
      x-axiom-scope: platform
      x-mcp-name: endpoint_set_enabled
      parameters:
        - {in: path, name: supplier_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {in: path, name: endpoint_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/EndpointEnabledChange'}}}
      responses:
        '200':
          description: The operation run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/suppliers/{supplier_id}/top-ups:
    post:
      operationId: supplierTopUpPropose
      summary: Propose topping a supplier up
      description: >-
        Proposes that the owner pay `amount_native` of the supplier's own unit into it. The server values it with the
        supplier's confirmed unit value and the current exchange rate into the currency of the cap policy of the
        supplier's owner (the platform, or its site), rounded up to 10⁻⁹, and reserves that against the caps: within
        every autonomous limit the proposal succeeds at once (200); over one it waits for the owner (202); over a hard
        limit, or without a policy, it is a 422 `cap_exceeded` and nothing is written. The agent never pays: the
        reservation holds until it confirms the money arrived (`supplierTopUpConfirm`) or the UTC day ends. A supplier
        without a confirmed unit value, or a currency pair without a rate, is a 422 `unprocessable`; a removed supplier,
        an account's own key, or a proposal that waited past UTC midnight (propose it again), is a 409 `conflict`. A
        retry under the key finds the first proposal whatever has happened to the supplier since. With `dry_run` the same checks run and nothing is written.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: supplier_top_up_propose
      parameters:
        - {in: path, name: supplier_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TopUpProposal'}}}
      responses:
        '200':
          description: The proposal, reserved, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The proposal, reserved and waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/suppliers/{supplier_id}/top-ups/{operation_id}/confirm:
    post:
      operationId: supplierTopUpConfirm
      summary: Confirm that a proposed top-up arrived
      description: >-
        Confirms, with `proof` of the payment, that the money of one of the credential's own succeeded top-up proposals
        for this supplier arrived: the reserved amount becomes committed in the windows it was reserved in, and stays
        counted whatever happens to the money later. A proposal that is another credential's, of another supplier or
        not a top-up is not found; one whose reservation ended (confirmed, refused, or past its UTC day) is a 409
        `conflict`. With `dry_run` the same checks run and nothing is written.
      tags: [Suppliers]
      security: [{credential: []}]
      x-axiom-permission: suppliers.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: supplier_top_up_confirm
      parameters:
        - {in: path, name: supplier_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - {in: path, name: operation_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/TopUpConfirmation'}}}
      responses:
        '200':
          description: The confirmation, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/accounts/{account_id}/credit-grants:
    post:
      operationId: creditGrant
      summary: Propose giving an account credit
      description: >-
        Proposes a gift of `amount`, in the currency of the account's site, to the account, as the admin's
        `grantCredit` gives one: at most 10,000 units, and a batch given an `expires_at` expires then. The owner
        always approves it (202): when approved, the credit is given as the agent's in the approval's transaction. The
        face value, converted at the current reference rate when the cap policy of the site counts in another currency
        and rounded up to 10⁻⁹, is reserved against the site's `money.credit` caps until then; over a hard limit, or
        without a policy, it is a 422 `cap_exceeded` and nothing is written. An amount in another currency than the
        site's is a 400; one out of range, an expiry that has passed, or a currency pair without a rate is a 422
        `unprocessable`; an account outside the credential's sites is not found. A proposal that waited past UTC midnight is a 409
        `conflict`: propose it again. A retry under the key finds the first proposal. With `dry_run` the same checks
        run and nothing is written.
      tags: [Accounts]
      security: [{credential: []}]
      x-axiom-permission: credits.grant
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: credit_grant
      parameters:
        - {in: path, name: account_id, required: true, schema: {$ref: '#/components/schemas/AccountId'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreditGrantProposal'}}}
      responses:
        '200':
          description: The proposal found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The proposal, reserved and waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/operations:
    get:
      operationId: operationsList
      summary: The credential's own operations
      description: Every write this credential asked for, newest first, optionally in one state.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: operations_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: state, required: false, schema: {$ref: '#/components/schemas/OperationState'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/operations/{operation_id}:
    get:
      operationId: operationGet
      summary: One of the credential's operations
      description: The operation as it is now, with its approval; another credential's is not found.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: operation_get
      parameters:
        - {in: path, name: operation_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The operation
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/caps:
    get:
      operationId: capsGet
      summary: The caps on the credential's money and their use
      description: >-
        The cap policy of each scope and category the credential's money writes act in, its sites' and, with the
        platform grant, the platform's, with what the category has reserved and committed in the current UTC day and
        ISO week and how many proposals it made in them. A scope and category without a policy moves no money and is
        not listed. While `paused` is true every proposal there waits for the owner, within the autonomous limits or
        not: the counters were found to differ from the money they count, and only the owner resumes it.
        `price_envelopes` lists the envelope of each site the agent publishes sale prices of, with what its UTC day has
        used; a node that predates them leaves it out.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: caps_get
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The caps
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationsCapUsageList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/prices:
    get:
      operationId: pricesList
      summary: The main site's sale prices and the proposals waiting to be published
      description: >-
        Each model's published sale price and the proposal the automatic publisher made for it, as the admin reads them:
        a proposal whose `status` is `pending` or `blocked` waits for someone to publish it (`pricePublish`) with
        its `candidate_id` and `current_id`. The publisher refreshes the proposals every few seconds, so a proposal read
        here may be replaced before it is published.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.view
      x-axiom-scope: platform
      x-mcp-name: prices_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The publication state
          content: {application/json: {schema: {$ref: '#/components/schemas/PricePublicationList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/prices/{model_id}/publish:
    post:
      operationId: pricePublish
      summary: Publish a sale price proposal
      description: >-
        Publishes the proposal `candidate_id` of the model, read against its current version `current_id` (absent when
        the model has none), as the admin's confirmation does: never below the site's floor. The server weighs it
        against the main site's price envelope (docs/domains/operations.md「售价的累计变动上限」) from the prices it
        reads, never the agent's: within the least margin over cost, the model's daily move and the day's publications
        and models it is published at once (200, `succeeded`); outside any of them, with an unknown cost, or with a move
        no share of the old price measures (a first price, a price added or lost, zero to non-zero) it waits for the
        owner (202). A site without an envelope is a 422 `cap_exceeded`. A proposal or version that is no longer the
        model's is a 409 `stale_revision`, at once or when the owner approves; one with nothing waiting is a 409
        `conflict`. The result has the version published, `change_bps` and `margin_bps`. With `dry_run` the same
        checks run and nothing is written.
      tags: [Pricing]
      security: [{credential: []}]
      x-axiom-permission: pricing.manage
      x-axiom-money: true
      x-axiom-scope: platform
      x-mcp-name: price_publish
      parameters:
        - {in: path, name: model_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/SalePricePublication'}}}
      responses:
        '200':
          description: The publication, run, found again under its key as it is now, or previewed
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '202':
          description: The publication, waiting for the owner's approval
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals:
    get:
      operationId: approvalsList
      summary: The approvals the credential's proposals asked for
      description: >-
        Each approval one of the credential's own writes waits or waited on, newest first, optionally in one state, with
        the operation as it is now; another credential's are not listed. `pending` lists what still waits for the owner.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approvals_list
      parameters:
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: state, required: false, schema: {$ref: '#/components/schemas/OperationsApprovalState'}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of operations, each with its approval
          content: {application/json: {schema: {$ref: '#/components/schemas/OperationList'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}:
    get:
      operationId: approvalGet
      summary: The operation waiting on an approval
      description: The credential's operation that waits or waited on this approval, as it is now; another credential's is not found. Only the owner decides an approval, in the admin.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approval_get
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: The operation
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}/wait:
    get:
      operationId: approvalWait
      summary: Wait for the owner to decide an approval
      description: >-
        Reads the credential's operation that waits on this approval, as `approvalGet` does, and while the owner can
        still decide it reads it again every second, answering as soon as it is decided, withdrawn, canceled or past its
        expiry, or when `wait_seconds` have passed (10 at most), whichever comes first. An answer whose approval is
        still `pending` means nobody decided in the wait: wait again or do something else first. Another credential's
        approval is not found, at once.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.read
      x-axiom-scope: self
      x-mcp-name: approval_wait
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/Reason'
        - $ref: '#/components/parameters/RunId'
        - {in: query, name: wait_seconds, required: false, description: How long to wait at most., schema: {type: integer, minimum: 1, maximum: 10, default: 10}}
      responses:
        '200':
          description: The operation, decided or still waiting
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
  /api/operations/v1/approvals/{approval_id}/withdraw:
    post:
      operationId: approvalWithdraw
      summary: Withdraw a pending proposal
      description: >-
        Takes back one of the credential's own proposals while it waits for the owner: its operation ends `canceled`.
        One already decided, expired or withdrawn is a 409 `conflict`; another credential's is not found. With
        `dry_run` the same checks run and nothing is written.
      tags: [Agent]
      security: [{credential: []}]
      x-axiom-permission: operations.write
      x-axiom-scope: self
      x-mcp-name: approval_withdraw
      parameters:
        - {in: path, name: approval_id, required: true, schema: {$ref: '#/components/schemas/Uuid'}}
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RunId'
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/WithdrawRequest'}}}
      responses:
        '200':
          description: The operation, canceled, or the preview of its withdrawal
          headers:
            Idempotency-Replayed: {$ref: '#/components/headers/IdempotencyReplayed'}
          content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/CredentialRejected'}
        '403': {$ref: '#/components/responses/CredentialForbidden'}
        '404': {$ref: '#/components/responses/OutOfScope'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Failure'}
components:
  securitySchemes:
    credential:
      type: http
      scheme: bearer
      description: >-
        An operations credential's token, `op-ax-v1-` and 49 base62 characters, which the admin shows once when it is
        made or rotated. A missing, malformed, unknown, retired, revoked or expired token is answered alike.
  headers:
    IdempotencyReplayed:
      required: false
      description: "true when this response is the stored result of an earlier request with the same Idempotency-Key; nothing was done again."
      schema: {type: boolean}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        A UUID the caller chooses for one intended change. Sending the request again with the same key, after a lost
        response, returns the first result instead of doing it twice.
      schema: {type: string, pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"}
    Reason:
      in: query
      name: reason
      required: true
      description: Why the agent calls this, in its own words; recorded in the operation log as untrusted text.
      schema: {type: string, minLength: 1, maxLength: 1000}
    RunId:
      in: header
      name: X-Axiom-Run-ID
      required: false
      description: The agent's own ID of the task this call belongs to, recorded with it.
      schema: {type: string, pattern: '^[A-Za-z0-9._:-]{1,64}$'}
    Cursor:
      name: cursor
      in: query
      required: false
      description: 'Where the next page starts: the `next_cursor` of the previous page, unchanged. It is opaque, only valid
        for the same filters, and a malformed one is a 400.'
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: How many items a page holds at most.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
  responses:
    Conflict:
      description: >-
        The request conflicts with the current state (`conflict`, `email_taken`, `name_taken`, `too_many_keys`, `stale_revision`,
        `idempotency_key_reused`, `preset_default_invalid`, `preset_in_use`, `preset_quota`).
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Unprocessable:
      description: >-
        The request is well formed but a rule refuses it (`invalid_invite`, `weak_password`, `not_ready`,
        `unprocessable`, `cap_exceeded`); `message` says which.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    CredentialRejected:
      description: No live operations credential, or a missing, malformed, unknown, retired, revoked or expired token (`unauthenticated`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    CredentialForbidden:
      description: The credential does not hold the permission the operation names (`forbidden`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    OutOfScope:
      description: >-
        There is no such resource, or it is outside the credential's scope: a site it is not given, or the platform's
        own resources without the platform grant. A malformed ID and an unknown one answer alike (`not_found`).
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BadRequest:
      description: The request is malformed or breaks a constraint of the contract (`invalid_request`), or names a routing
        preset it may not choose (`preset_not_selectable`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Failure:
      description: 'Any other failure: `internal` (500), `not_implemented` (501, the operation has no handler yet), `unavailable`
        (503), `presets_suspended` (503, a routing preset or default write, or a key''s choice of a preset, while the
        platform has suspended routing presets). A 500 never carries the internal error''s text.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: A limit on this operation is used up (`rate_limited`); wait `Retry-After` seconds.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    AgentSelf:
      type: object
      additionalProperties: false
      required: [id, name, permissions, platform, proposer_vendors, expires_at]
      properties:
        id: {type: string, description: "The credential's ID, an `opcred_` TypeID."}
        name: {type: string}
        permissions: {type: array, items: {type: string}, description: Sorted.}
        sites:
          type: array
          items: {$ref: '#/components/schemas/SiteId'}
          description: The sites the credential acts on; absent for every site.
        platform: {type: boolean, description: Whether it may act on the platform's own resources.}
        proposer_vendors: {type: array, items: {type: string}}
        expires_at: {type: string, format: date-time}
    OperationLogList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OperationLogEntry'}}
        next_cursor: {type: string}
    OperationLogEntry:
      type: object
      additionalProperties: false
      required: [id, tool, reason, input, status, request_id, started_at, ended_at]
      properties:
        id: {type: string, description: "The entry's ID, which `cursor` takes to read on from it."}
        run_id: {type: string}
        tool: {type: string, description: The MCP name of the operation.}
        reason: {type: string, description: The agent's own words; untrusted.}
        input:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: >-
            The request's path and query parameters and a write's body, all but the reason, or its size alone past 8
            KiB.
        status: {type: integer, description: The HTTP status of the answer.}
        error_code: {type: string}
        request_id: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        operation_id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The operation a write made or found under its key.
    ModelStatusChange:
      type: object
      additionalProperties: false
      required: [status, rev, reason]
      properties:
        status: {type: string, enum: [listed, retired]}
        rev: {type: integer, format: int64, minimum: 0}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: nothing is written and the model is not changed."}
    EndpointEnabledChange:
      type: object
      additionalProperties: false
      required: [enabled, reason]
      properties:
        enabled: {type: boolean, description: "Whether the endpoint may be routed to."}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    TopUpProposal:
      type: object
      additionalProperties: false
      required: [amount_native, reason]
      properties:
        amount_native:
          type: string
          pattern: ^(0|[1-9][0-9]{0,11})(\.[0-9]{1,6})?$
          description: How much of the supplier's own unit (`native_unit`) to pay in, as exact decimal text above zero.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written or reserved."}
    TopUpConfirmation:
      type: object
      additionalProperties: false
      required: [proof, reason]
      properties:
        proof:
          type: string
          minLength: 1
          maxLength: 500
          description: What shows the payment arrived, such as the supplier's receipt number or the balance seen after it; recorded as untrusted text.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    CreditGrantProposal:
      type: object
      additionalProperties: false
      required: [amount, reason]
      properties:
        amount: {$ref: '#/components/schemas/Money'}
        expires_at: {type: string, format: date-time, description: "When the credit expires, in the future. Absent: it does not expire."}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written or reserved."}
    AlertKey:
      type: string
      pattern: '^[A-Za-z0-9._:/-]{1,128}$'
      description: >-
        The incident the alert is about, in the agent's own words, such as `supplier/<id>/balance`: the same key is the
        same incident until it is resolved.
    AlertRaise:
      type: object
      additionalProperties: false
      required: [key, severity, summary, reason]
      properties:
        key: {$ref: '#/components/schemas/AlertKey'}
        severity: {type: string, enum: [info, warning, critical], description: "Which rules notify the owner of it."}
        summary:
          type: string
          minLength: 1
          maxLength: 512
          pattern: '^[^\x00]+$'
          description: >-
            What the owner reads in the notification: at most 512 bytes of UTF-8 (about 170 Chinese characters), no
            NUL. It is shown as the agent's untrusted text.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    AlertResolve:
      type: object
      additionalProperties: false
      required: [key, reason]
      properties:
        key: {$ref: '#/components/schemas/AlertKey'}
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    OperationsAlertList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AlertEvent'}}
        next_cursor: {type: string}
    AlertEvent:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        kind: {type: string}
        key: {type: string}
        severity: {type: string}
        fields: {type: object, additionalProperties: {type: string}}
        occurrences: {type: integer, format: int64}
        state: {type: string, enum: [firing, delivered, resolved], x-enum-varnames: [AlertFiring, AlertDelivered, AlertResolved]}
        fired_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time}
        receipts: {type: array, items: {$ref: "#/components/schemas/AlertReceipt"}}
    AlertReceipt:
      type: object
      properties:
        id: {$ref: "#/components/schemas/Uuid"}
        rule_id: {type: string}
        sequence: {type: integer, description: "0 is the first notification; -1 is recovery; positive values are repeats."}
        state: {type: string, enum: [pending, queued, delivered, failed], x-enum-varnames: [AlertPendingReceipt, AlertQueuedReceipt, AlertDeliveredReceipt, AlertFailedReceipt]}
        at: {type: string, format: date-time}
        delivered_at: {type: string, format: date-time}
    AgentReason:
      type: string
      minLength: 1
      maxLength: 1000
      description: Why the agent asks for this, in its own words; recorded with the operation as untrusted text.
    WithdrawRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    OperationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/Operation'}}
        next_cursor: {type: string}
    Operation:
      type: object
      additionalProperties: false
      required: [tool, target, risk, state, dry_run]
      description: >-
        One write the agent asked for. It acts on one object and is never reused: a retry under its key finds it as it
        is now. A preview (`dry_run`) has no ID, approval or times, and its `state` is where the operation would
        start: `approved` when it would run at once, `pending_approval` when it would wait for the owner; a previewed
        withdrawal answers `canceled`, where it would leave the operation.
      properties:
        operation_id: {$ref: '#/components/schemas/Uuid'}
        tool: {type: string, description: The MCP name of the write.}
        target: {$ref: '#/components/schemas/OperationTarget'}
        risk: {$ref: '#/components/schemas/OperationRisk'}
        state: {$ref: '#/components/schemas/OperationState'}
        dry_run: {type: boolean}
        approval: {$ref: '#/components/schemas/OperationApproval'}
        result:
          type: object
          additionalProperties: true
          x-go-type: jsonx.Raw
          description: What the change answered, once it succeeded.
        error_code: {type: string, description: "Why it ended `rejected`: the code the target refused the change with."}
        next_check_after_seconds: {type: integer, minimum: 1, description: "While it waits: when to read it again."}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    OperationsCapUsageList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/OperationsCapUsage'}}
        price_envelopes: {type: array, items: {$ref: '#/components/schemas/OperationsPriceEnvelopeUsage'}}
    OperationsCapUsage:
      type: object
      additionalProperties: false
      required: [scope, category, currency, limits, rev, paused, day, week]
      properties:
        scope: {type: string, description: "`platform` or a site's ID."}
        category: {$ref: '#/components/schemas/OperationsCapCategory'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        limits: {$ref: '#/components/schemas/OperationsCapLimits'}
        rev: {type: integer, format: int64, minimum: 1}
        paused: {type: boolean, description: "Whether every proposal waits for the owner until the owner repairs the counters."}
        day: {$ref: '#/components/schemas/OperationsCapWindow'}
        week: {$ref: '#/components/schemas/OperationsCapWindow'}
    OperationsCapWindow:
      type: object
      additionalProperties: false
      required: [start, reserved, committed, count]
      description: >-
        What the category holds in one window. Reserved is proposed and not yet confirmed or ended; committed was
        confirmed and stays, whatever happens to the money later. Both count against every limit.
      properties:
        start: {type: string, format: date-time}
        reserved: {$ref: '#/components/schemas/OperationsCapAmount'}
        committed: {$ref: '#/components/schemas/OperationsCapAmount'}
        count: {type: integer, format: int32, minimum: 0, description: "Every proposal made in the window, however it ended."}
    OperationsCapCategory:
      type: string
      enum: [money.top_up, money.credit]
      description: A kind of money the agent moves, each with its own caps; top-ups of suppliers and credit grants to accounts.
    OperationsCapAmount:
      type: string
      pattern: ^(0|[1-9][0-9]{0,17})$
      description: An amount in billionths of one unit of the policy's currency, as integer text.
    OperationsCapLimits:
      type: object
      additionalProperties: false
      required: [single_max, daily_max, weekly_max, object_daily_max, daily_count_max, hard_single_max, hard_daily_max, hard_weekly_max]
      description: >-
        The autonomous limits (a proposal within all of them needs nobody): one proposal, the UTC day, the ISO week, one
        object's UTC day, and the day's number of proposals. The hard limits refuse a proposal outright, approved or
        not: one proposal, the day and the week. Reserved and committed amounts both count.
      properties:
        single_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        weekly_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        object_daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        daily_count_max: {type: integer, format: int32, minimum: 0, maximum: 1000000}
        hard_single_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        hard_daily_max: {$ref: "#/components/schemas/OperationsCapAmount"}
        hard_weekly_max: {$ref: "#/components/schemas/OperationsCapAmount"}
    PricePublicationList:
      type: object
      properties:
        policy: {$ref: "#/components/schemas/PricePolicy"}
        data:
          type: array
          items: {$ref: "#/components/schemas/PricePublication"}
    PricePolicy:
      type: object
      properties:
        rev: {type: integer, format: int64}
        floor_multiplier: {type: string}
        change_ratio: {type: string}
        max_increase_ratio: {type: string}
        byok_fee_bps:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The share of a model's normal sale price charged when an account's own provider key serves the request,
            in basis points (500 is 5%, docs/domains/billing.md「定价」).
    PricePublication:
      type: object
      properties:
        audience: {$ref: "#/components/schemas/PricingAudience"}
        model_id: {$ref: "#/components/schemas/Uuid"}
        candidate_id: {$ref: "#/components/schemas/Uuid"}
        current_id: {$ref: "#/components/schemas/Uuid"}
        status: {type: string, enum: [published, pending, blocked, unpriced]}
        requested: {$ref: "#/components/schemas/PriceSchedule"}
        schedule: {$ref: "#/components/schemas/PriceSchedule"}
        floor: {$ref: "#/components/schemas/PriceSchedule"}
        endpoints:
          description: The proposed price of each endpoint for a cost-plus proposal.
          allOf: [{$ref: "#/components/schemas/PriceEndpointMap"}]
        requested_endpoints:
          description: The rule price of each endpoint before the site floor, for a cost-plus proposal.
          allOf: [{$ref: "#/components/schemas/PriceEndpointMap"}]
        current_endpoints:
          description: The price each endpoint currently serves, when the current version prices endpoints separately.
          allOf: [{$ref: "#/components/schemas/PriceEndpointMap"}]
        current_schedule:
          description: The current model-level price schedule, including the envelope of a per-endpoint version.
          allOf: [{$ref: "#/components/schemas/PriceSchedule"}]
        costs:
          description: The proposal's cost of each endpoint in the site currency, for a cost-plus proposal.
          allOf: [{$ref: "#/components/schemas/PriceEndpointMap"}]
        floors:
          description: The proposal's break-even price of each endpoint in the site currency, for a cost-plus proposal.
          allOf: [{$ref: "#/components/schemas/PriceEndpointMap"}]
        problem: {type: string}
    PricingAudience:
      type: object
      required: [kind]
      description: >-
        Whom a rule prices for: one account, one tier, or everyone. `id` is the account's or tier's ID, absent for
        `all`. Account and tier IDs must belong to this site.
      properties:
        kind: {type: string, enum: [account, tier, all]}
        id: {type: string, maxLength: 64}
    PriceEndpointMap:
      type: object
      description: Per-endpoint prices, keyed by endpoint UUID.
      additionalProperties: {$ref: "#/components/schemas/PriceSchedule"}
    SalePricePublication:
      type: object
      additionalProperties: false
      required: [candidate_id, reason]
      properties:
        candidate_id: {$ref: '#/components/schemas/Uuid'}
        current_id:
          allOf: [{$ref: '#/components/schemas/Uuid'}]
          description: The model's current version as read with the proposal; absent when it has none.
        reason: {$ref: '#/components/schemas/AgentReason'}
        dry_run: {type: boolean, description: "Preview only: the same checks run, and nothing is written."}
    OperationsPriceEnvelope:
      type: object
      additionalProperties: false
      required: [min_margin_bps, model_daily_change_bps, daily_changes, daily_models]
      description: >-
        How far the agent moves a site's sale prices without the owner, in basis points: every price it publishes keeps
        at least `min_margin_bps` of its price over its cost; one model's prices move at most `model_daily_change_bps`
        in a UTC day, up and down added together; a UTC day publishes at most `daily_changes` prices of at most
        `daily_models` models. Publications the owner approves count too.
      properties:
        min_margin_bps: {type: integer, format: int32, minimum: 0, maximum: 10000}
        model_daily_change_bps: {type: integer, format: int64, minimum: 0, maximum: 100000000}
        daily_changes: {type: integer, format: int32, minimum: 0, maximum: 1000000}
        daily_models: {type: integer, format: int32, minimum: 0, maximum: 1000000}
    OperationsPriceEnvelopeUsage:
      type: object
      additionalProperties: false
      required: [site_id, limits, rev, day_start, changes, models, moves]
      properties:
        site_id: {type: string, description: The site's ID.}
        limits: {$ref: '#/components/schemas/OperationsPriceEnvelope'}
        rev: {type: integer, format: int64, minimum: 1}
        day_start: {type: string, format: date-time}
        changes: {type: integer, format: int32, minimum: 0, description: The publications the UTC day counted.}
        models: {type: integer, format: int32, minimum: 0, description: The models whose prices the UTC day moved.}
        moves: {type: array, items: {$ref: '#/components/schemas/OperationsPriceMoves'}}
    OperationsPriceMoves:
      type: object
      additionalProperties: false
      required: [model_id, change_bps, count]
      description: A model moved today, with its moves in basis points added together and how many.
      properties:
        model_id: {$ref: '#/components/schemas/Uuid'}
        change_bps: {type: integer, format: int64, minimum: 0}
        count: {type: integer, format: int32, minimum: 0}
    OperationApproval:
      type: object
      additionalProperties: false
      required: [approval_id, state, tier, expires_at]
      properties:
        approval_id: {$ref: '#/components/schemas/Uuid'}
        state: {$ref: '#/components/schemas/OperationsApprovalState'}
        tier: {$ref: '#/components/schemas/OperationsApprovalTier'}
        expires_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
        reasons:
          type: array
          maxItems: 16
          items: {$ref: '#/components/schemas/OperationsApprovalReason'}
          description: >-
            Why it waits for the owner, as the server decided it when the operation was proposed: which cap or envelope
            limit it goes over, a paused scope, or a class that always asks. Absent when an older node proposed it.
    OperationsApprovalReason:
      type: object
      additionalProperties: false
      required: [code]
      description: One reason an operation waited for the owner.
      properties:
        code:
          type: string
          enum:
            - always
            - cap_paused
            - cap_single
            - cap_daily
            - cap_weekly
            - cap_object_daily
            - cap_daily_count
            - envelope_unmeasured_change
            - envelope_unknown_cost
            - envelope_min_margin
            - envelope_model_daily_change
            - envelope_daily_changes
            - envelope_daily_models
          description: >-
            `always`: its class always waits for the owner (a credit grant, retiring a model). `cap_paused`: the
            owner paused its cap's scope. The other `cap_` codes are the autonomous limits of `summary.cap` a transfer
            goes over: `cap_single` (`single_max`), `cap_daily` (`daily_used` + `amount` over `daily_max`),
            `cap_weekly` (`weekly_max`), `cap_object_daily` (`object_daily_max`), `cap_daily_count` (`daily_count`
            at `daily_count_max`). The `envelope_` codes are what `summary.envelope` does not cover:
            `envelope_unmeasured_change` (`change_bps` is null), `envelope_unknown_cost` (`margin_bps` is null),
            `envelope_min_margin` (`margin_bps` under `min_margin_bps`), `envelope_model_daily_change`
            (`model_change_used` + `change_bps` over `model_daily_change_bps`), `envelope_daily_changes`
            (`daily_changes_used` at `daily_changes`), `envelope_daily_models` (`daily_models_used` at
            `daily_models` and the model not yet moved today). A later server may add codes; a page shows one it
            does not know as a reason it cannot name.
    OperationState:
      type: string
      enum: [pending_approval, approved, executing, succeeded, failed, unknown, canceled, expired, rejected, reverted]
      description: >-
        Where an operation is (docs/domains/operations.md「运营接口」): `pending_approval` and `approved` have not
        started; `rejected`, `expired`, `canceled`, `failed` and `reverted` are final, and so is `succeeded` unless a
        compensating operation reverts it.
    OperationRisk:
      type: string
      enum: [routine, delisting, top_up, price, gift]
      description: The operation's class, which decides whether it waits for the owner.
    OperationTarget:
      type: object
      additionalProperties: false
      required: [kind, id]
      properties:
        kind: {type: string, description: "What the operation acts on, such as `model`."}
        id: {type: string}
    OperationsApprovalState:
      type: string
      enum: [pending, approved, rejected, expired, canceled]
      description: >-
        `pending` until the owner decides, it expires (30 minutes at most, never past the UTC day it was asked on) or
        the agent withdraws it (`canceled`, as is every pending one at the emergency stop or the revocation of its
        credential).
    OperationsApprovalTier:
      type: string
      enum: [human]
      description: Who must decide; only the owner, in the admin, for now.
    AccountId:
      type: string
      pattern: ^acct_[0-9a-hjkmnp-tv-z]{26}$
      description: An account's ID (TypeID).
    AdminAttempt:
      type: object
      additionalProperties: false
      properties:
        seq:
          type: integer
        endpoint_id: &id001
          type: string
        supplier_id: *id001
        source_class: *id001
        egress: *id001
        outcome: *id001
        error_kind: *id001
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        first_token_ms:
          type: integer
    AdminCallList:
      type: object
      additionalProperties: false
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminCallSummary'
        next_cursor: &id001
          type: string
        model_filter: *id001
        status_filter:
          $ref: '#/components/schemas/AdminCallStatus'
        site_filter:
          $ref: '#/components/schemas/SiteId'
        incomplete:
          type: boolean
          description: 'True when the window crosses a month the call log no longer retains (archived and dropped): calls in
            that month are missing, so an empty page does not mean the window had no calls. Calls before `available_since` were
            archived. An old node leaves it out, which the page shows as unavailable rather than complete.'
        available_since:
          type: string
          format: date-time
          description: The first instant of the oldest monthly partition the log still has; calls before it were archived. Absent
            with `incomplete` true when no monthly partition remains, so no window can be answered from the log.
    AdminCallStatus:
      type: string
      enum:
      - ok
      - error
      description: 'The result of a call: `ok` when its error_kind is empty, `error` otherwise. An old node may leave the filter
        echo out of a list.'
    AdminCallSummary:
      type: object
      additionalProperties: false
      properties:
        id: &id001
          type: string
        site_id:
          $ref: '#/components/schemas/SiteId'
        account_id:
          $ref: '#/components/schemas/AccountId'
        at:
          type: string
          format: date-time
        model: *id001
        error_kind: *id001
        latency_ms:
          type: integer
        price:
          $ref: '#/components/schemas/Money'
    AdminCallTrace:
      type: object
      additionalProperties: false
      properties:
        summary:
          $ref: '#/components/schemas/AdminCallSummary'
        cost:
          $ref: '#/components/schemas/Money'
        route:
          x-go-type: jsonx.Raw
          type: object
          additionalProperties: true
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/AdminAttempt'
    AuthorSlug:
      type: string
      pattern: ^[a-z0-9][a-z0-9-]{0,39}$
    BillingItem:
      type: string
      enum:
      - input
      - cache_read
      - cache_write
      - cache_write_1h
      - output
      - reasoning
      - audio_in
      - audio_out
      - image_in
      - image_out
      - web_search
      - code_execution
      - file_search
    ContextTier:
      type: object
      required:
      - above
      - rates
      additionalProperties: false
      properties:
        above:
          type: integer
          format: int64
          minimum: 0
          description: The tier applies when the basis items sum to more than this.
        rates:
          $ref: '#/components/schemas/Rates'
    ContextTiers:
      type: object
      required:
      - basis
      - method
      - tiers
      additionalProperties: false
      description: 'Whole-request tiers: when the basis items sum past a tier''s threshold, the tier''s rates replace the base
        ones.'
      properties:
        basis:
          type: array
          items:
            $ref: '#/components/schemas/BillingItem'
        method:
          type: string
          enum:
          - whole
        tiers:
          type: array
          description: Strictly increasing by `above`.
          items:
            $ref: '#/components/schemas/ContextTier'
    Decimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]{0,17})(\.[0-9]{1,15})?$
      description: An exact decimal number in text, never a JSON number, so no digit is lost on the way.
    Error:
      type: object
      required:
      - error
      description: The body of every failure. The request ID is in the `X-Request-ID` response header, as on every response.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    ErrorCode:
      type: string
      description: The closed list of failure codes. A code is added in a contract change, so a client that translates every
        code fails to compile until it knows the new one.
      enum:
      - invalid_request
      - unauthenticated
      - invalid_credentials
      - invalid_code
      - forbidden
      - mfa_required
      - consent_required
      - origin_rejected
      - not_found
      - conflict
      - login_domain_locked
      - login_domain_required
      - identity_taken
      - identity_already_linked
      - account_not_linked
      - email_taken
      - name_taken
      - too_many_keys
      - stale_revision
      - idempotency_key_reused
      - invalid_invite
      - registration_closed
      - human_check_failed
      - email_domain_not_allowed
      - invalid_verification
      - weak_password
      - not_ready
      - unprocessable
      - cap_exceeded
      - redeem_code_invalid
      - redeem_code_expired
      - redeem_code_disabled
      - redeem_code_used
      - rate_limited
      - internal
      - not_implemented
      - unavailable
      - preset_not_selectable
      - preset_default_invalid
      - preset_in_use
      - preset_quota
      - presets_suspended
    ErrorDetail:
      type: object
      required:
      - code
      - message
      description: '`code` is what a client branches on and translates; `message` is English text for logs and developers.'
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        fields:
          type: array
          description: Which parts of the request broke a constraint, for `invalid_request`.
          items:
            $ref: '#/components/schemas/ErrorField'
    ErrorField:
      type: object
      required:
      - pointer
      - message
      properties:
        pointer:
          type: string
          description: JSON pointer into the request body, or the name of a query or path parameter.
        message:
          type: string
    Model:
      type: object
      required:
      - id
      - slug
      - author
      - status
      - version_basis
      - price_source
      - rev
      - spec
      - names
      - prices
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/ModelSlug'
        author:
          $ref: '#/components/schemas/AuthorSlug'
        status:
          $ref: '#/components/schemas/ModelStatus'
        version_basis:
          $ref: '#/components/schemas/VersionBasis'
        price_source:
          $ref: '#/components/schemas/PriceSource'
        rev:
          type: integer
          format: int64
          minimum: 0
        spec:
          $ref: '#/components/schemas/ModelSpec'
        names:
          type: array
          items:
            $ref: '#/components/schemas/ModelName'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ReferencePrice'
    ModelFormat:
      type: string
      enum:
      - messages
      - responses
      - chat
      - embeddings
      - rerank
      - completions
    ModelList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelSummary'
        next_cursor:
          type: string
          nullable: true
          description: Null on the last page.
    ModelName:
      type: object
      required:
      - name
      - visibility
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        visibility:
          type: string
          enum:
          - public
          - internal
          description: Only public names can be called by users.
    ModelSlug:
      type: string
      maxLength: 187
      pattern: ^[a-z0-9][a-z0-9-]{0,39}/[a-z0-9][a-z0-9._-]{0,99}(:free)?(@[a-z0-9][a-z0-9._-]{0,39})?$
      description: '`<author>/<model>`, with optional `:free` and `@<version>` when the vendor gives one; lower case, as the
        catalog stores it.'
    ModelSpec:
      type: object
      description: The baseline facts about a model (context length, modalities, …), which are open for now, plus the two lists
        the review needs. `items` and `tiers` say which billing items and service tiers the upstream may report; a model goes
        on sale only if both are present, even if empty.
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BillingItem'
        tiers:
          type: array
          items:
            $ref: '#/components/schemas/ServiceTier'
      additionalProperties: true
    ModelStatus:
      type: string
      enum:
      - draft
      - listed
      - retired
      description: '`draft`: seen by the platform only; `listed`: on sale; `retired`: out of use for good.'
    ModelSummary:
      type: object
      required:
      - id
      - slug
      - author
      - status
      - version_basis
      - price_source
      - rev
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        slug:
          $ref: '#/components/schemas/ModelSlug'
        author:
          $ref: '#/components/schemas/AuthorSlug'
        status:
          $ref: '#/components/schemas/ModelStatus'
        version_basis:
          $ref: '#/components/schemas/VersionBasis'
        price_source:
          $ref: '#/components/schemas/PriceSource'
        rev:
          type: integer
          format: int64
          minimum: 0
    Money:
      type: object
      required:
      - amount
      - currency
      description: An exact amount of a site's accounting currency. `amount` is a signed integer in decimal text, in billionths
        of one unit of the currency (docs/domains/billing.md「钱的表示」). It is text because a JSON number would round above 2^53
        (about 9 million units) in the browser. A report sums many stored amounts, so it can be wider than 64 bits; an amount
        that is written to the ledger must still fit 64 bits.
      properties:
        amount:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)$
          maxLength: 39
          example: '1500000000'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          example: USD
    PendingMapping:
      type: object
      required:
      - supplier_id
      - group_id
      - upstream_name
      - formats
      properties:
        supplier_id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        group_codename:
          type: string
        upstream_name:
          type: string
        formats:
          type: array
          items:
            $ref: '#/components/schemas/ModelFormat'
    PendingMappingList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PendingMapping'
        next_cursor:
          type: string
          nullable: true
          description: Null on the last page.
    PriceSchedule:
      type: object
      required:
      - v
      - currency
      - rates
      additionalProperties: false
      description: 'A price list in the canonical form the catalog stores (internal/catalog README「价目表」): prices per billing
        item, optional whole-request tiers by size, and a complete set of prices for each service tier other than the standard
        one. A tier that lists no price for an item has none, it does not inherit the standard one.'
      properties:
        v:
          type: integer
          enum:
          - 1
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: XXX in a supplier's cost plan, which is in the supplier's own unit.
        rates:
          $ref: '#/components/schemas/Rates'
        context_tiers:
          $ref: '#/components/schemas/ContextTiers'
        service_tiers:
          type: object
          additionalProperties: false
          properties:
            flex:
              $ref: '#/components/schemas/ServiceTierRates'
            priority:
              $ref: '#/components/schemas/ServiceTierRates'
            fast:
              $ref: '#/components/schemas/ServiceTierRates'
    PriceSource:
      type: string
      enum:
      - litellm
      - openrouter
      - official
      - manual
    Rates:
      type: object
      description: The price per unit of each billing item the schedule prices; an item left out has no price here.
      additionalProperties: false
      properties:
        input:
          $ref: '#/components/schemas/UnitPrice'
        cache_read:
          $ref: '#/components/schemas/UnitPrice'
        cache_write:
          $ref: '#/components/schemas/UnitPrice'
        cache_write_1h:
          $ref: '#/components/schemas/UnitPrice'
        output:
          $ref: '#/components/schemas/UnitPrice'
        reasoning:
          $ref: '#/components/schemas/UnitPrice'
        audio_in:
          $ref: '#/components/schemas/UnitPrice'
        audio_out:
          $ref: '#/components/schemas/UnitPrice'
        image_in:
          $ref: '#/components/schemas/UnitPrice'
        image_out:
          $ref: '#/components/schemas/UnitPrice'
        web_search:
          $ref: '#/components/schemas/UnitPrice'
        code_execution:
          $ref: '#/components/schemas/UnitPrice'
        file_search:
          $ref: '#/components/schemas/UnitPrice'
        file_parse:
          $ref: '#/components/schemas/UnitPrice'
    ReferencePrice:
      type: object
      required:
      - id
      - currency
      - source
      - published_at
      description: The current version of a model's reference price in one currency.
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        source:
          $ref: '#/components/schemas/PriceSource'
        schedule:
          description: 'Absent when the price was withdrawn: the currency has no price now, but this row is still the current
            one to build on.'
          allOf:
          - $ref: '#/components/schemas/PriceSchedule'
        published_at:
          type: string
          format: date-time
    ServiceTier:
      type: string
      enum:
      - standard
      - flex
      - priority
      - fast
    ServiceTierRates:
      type: object
      required:
      - rates
      additionalProperties: false
      properties:
        rates:
          $ref: '#/components/schemas/Rates'
        context_tiers:
          type: array
          description: The same thresholds as the schedule's, in order; a tier that changes no price has empty rates.
          items:
            $ref: '#/components/schemas/ContextTier'
    SiteId:
      type: string
      pattern: ^site_[0-9a-hjkmnp-tv-z]{26}$
      description: A site's ID (TypeID).
    Supplier:
      type: object
      required:
      - id
      - name
      - kind
      - origin
      - upstream_account
      - native_unit
      - settlement_currency
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          pattern: ^[a-z][a-z0-9]*$
          description: The adapter's name, such as newapi or sub2api.
        origin:
          type: string
          example: https://api.example.com
        upstream_account:
          type: string
          description: The email or username Axiom logs in as.
        generation:
          type: string
          description: The system's generation the adapter detected, such as 1.0.
        detected_version:
          type: string
        native_unit:
          type: string
          enum:
          - quota
          - usd
          description: The unit the supplier counts its balance in.
        settlement_currency:
          type: string
          pattern: ^[A-Z]{3}$
        status:
          $ref: '#/components/schemas/SupplierStatus'
        status_reason:
          type: string
          minLength: 1
          maxLength: 200
        balance_native:
          $ref: '#/components/schemas/Decimal'
        balance_observed_at:
          type: string
          format: date-time
        low_balance_threshold:
          $ref: '#/components/schemas/Decimal'
        unit_value:
          $ref: '#/components/schemas/Decimal'
        unit_value_hint:
          $ref: '#/components/schemas/Decimal'
    SupplierCredential:
      type: object
      required:
      - id
      - group_id
      - upstream_key_ref
      - status
      - max_concurrency
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        upstream_key_ref:
          type: string
        status:
          type: string
          enum:
          - binding
          - active
          - upstream_disabled
          - quota_exhausted
          - expired
          - disabled
          - erased
        cooldown_until:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        max_concurrency:
          type: integer
          minimum: 1
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 100000
          description: The upstream account's rolling-minute RPM ceiling for selecting this credential; absent when Axiom adds
            no ceiling.
    SupplierDetail:
      type: object
      required:
      - supplier
      - groups
      - credentials
      - unbound_keys
      - endpoints
      properties:
        supplier:
          $ref: '#/components/schemas/Supplier'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/SupplierGroup'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/SupplierCredential'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/SupplierEndpoint'
        unbound_keys:
          type: array
          items:
            $ref: '#/components/schemas/UpstreamKey'
    SupplierEndpoint:
      type: object
      required:
      - id
      - group_id
      - model_id
      - upstream_name
      - formats
      - cost_state
      - enabled
      description: 'One model in one of the supplier''s groups, as the sync projected it: what testSupplierEndpoint is given.
        Only an enabled endpoint whose cost is `known` can be called, and so tested.'
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        group_id:
          $ref: '#/components/schemas/Uuid'
        model_id:
          $ref: '#/components/schemas/Uuid'
        upstream_name:
          type: string
          description: The model's name at the supplier.
        formats:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ModelFormat'
        cost_state:
          type: string
          enum:
          - known
          - unknown
          - conflict
        enabled:
          type: boolean
        quantization:
          type: string
          nullable: true
          enum:
          - int4
          - int8
          - fp4
          - mxfp4
          - nvfp4
          - fp6
          - fp8
          - mxfp8
          - fp16
          - bf16
          - fp32
          - unknown
          description: The precision a person recorded for this endpoint. Absent or null when none is recorded, which is not
            the level `unknown`; a request that filters by quantization does not match an endpoint without one.
    SupplierGroup:
      type: object
      required:
      - id
      - upstream_ref
      - name
      - ratio
      - selected
      - present
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        upstream_ref:
          type: string
          description: The supplier's own ID of the group.
        name:
          type: string
        ratio:
          $ref: '#/components/schemas/Decimal'
        selected:
          type: boolean
        codename:
          type: string
          description: What users see in place of the group's name. Set when first selected, never changed.
        present:
          type: boolean
          description: False when the supplier no longer lists the group.
        key_state:
          type: string
          enum:
          - pending
          - ready
          - failed
          - unavailable
          description: 'How the key Axiom uses for this group stands: `ready` when one is stored, `pending` while the sync will
            make one or is reading the text of one a person bound, `failed` when the last attempt did not work (see `key_reason`),
            `unavailable` when no key is needed because the group cannot be called. Absent from a server of an earlier release.'
        key_reason:
          type: string
          enum:
          - not_permitted
          - group_unavailable
          - refused
          description: 'Why the last attempt to make a key failed: the login may not manage keys, the account may not use this
            group, or the supplier refused. Present only with `key_state` `failed`.'
        facts:
          type: object
          description: What the supplier says about the group (platform, subscription type, peak pricing, long context).
          additionalProperties: true
        pool:
          $ref: '#/components/schemas/SupplierPool'
    SupplierList:
      type: object
      required:
      - data
      - next_cursor
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Supplier'
        next_cursor:
          type: string
          nullable: true
          description: Null on the last page.
    SupplierPool:
      type: object
      description: What the management API of a pool last said of the group's accounts. Absent when the supplier is not a pool,
        or a read has not reported it yet.
      required:
      - accounts
      - failed
      - usable
      - low
      - observed_at
      properties:
        accounts:
          type: integer
          minimum: 1
          description: The accounts assigned to the group.
        failed:
          type: integer
          minimum: 0
          description: 'How many of them the pool marks failed: they cannot serve.'
        usable:
          type: integer
          minimum: 0
          description: How many of them the pool may schedule now.
        headroom:
          type: integer
          minimum: 0
          maximum: 100
          description: The mean room left in the tighter quota window of the accounts that can serve, in percent. Absent when
            no account reported a window.
        capacity:
          type: integer
          minimum: 0
          maximum: 100
          description: 'The effective capacity this leaves: headroom times the share of accounts that can serve, in percent.
            Absent when no account reported a window.'
        low:
          type: boolean
          description: Routing halves the group's weight while this is true.
        observed_at:
          type: string
          format: date-time
          description: When these numbers were recorded.
    SupplierStatus:
      type: string
      enum:
      - connecting
      - active
      - low_balance
      - needs_attention
      - paused
      - removing
      - removed
      description: '`connecting`: not yet read; `active`: syncing, and routable while its balance is above zero; `low_balance`:
        syncing, balance under the alert line, routable on the same condition; `needs_attention`: polling stopped until a person
        acts, `status_reason` says why; `paused`: stopped on purpose; `removed`: see `removeSupplier`; `removing` is only what
        a removal of an earlier version left behind, and removing again ends it.'
    UnitPrice:
      type: string
      pattern: ^(0|[1-9][0-9]{0,2})(\.[0-9]{1,15})?$|^1000$
      description: A price per billing unit (one token, or one use) in the currency of its schedule, as exact decimal text with
        at most 15 decimals and at most 1000 per unit.
    UpstreamKey:
      type: object
      required:
      - ref
      - status
      description: A key the supplier lists that Axiom has not bound to a group.
      properties:
        ref:
          type: string
        group_ref:
          type: string
          description: The supplier's ID of the group the key is for.
        status:
          type: string
          enum:
          - active
          - disabled
          - quota_exhausted
          - expired
    Uuid:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: An ID of a supplier, group, model, price row or rule, in the usual lower-case UUID text.
    VersionBasis:
      type: string
      enum:
      - dated
      - floating
      description: '`dated`: the model is one fixed version; `floating`: the vendor moves the model under a name.'

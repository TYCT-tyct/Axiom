        models: {type: integer, format: int32, minimum: 0, description: The models whose prices the UTC day moved.}
        moves: {type: array, items: {$ref: '#/components/schemas/OperationsPriceMoves'}}
    OperationsPriceMoves:
      type: object
      additionalProperties: false
      required: [model_id, change_bps, count]

package: adminapi
output: adminapi.gen.go
generate:
  std-http-server: true
  strict-server: true
# A request body is decoded by the project's JSON policy, with the template the console's API uses (see its header).
additional-imports:
  - package: axiom/internal/platform/jsonx
output-options:
  user-templates:
    strict/strict-http.tmpl: ../consoleapi/templates/strict-http.tmpl

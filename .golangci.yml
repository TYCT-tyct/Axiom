# Lint for all Go code. Every enabled linter catches a class of bug or decay the others miss; settings list only
# departures from the defaults, and thresholds are never loosened to make a change pass.
version: "2"

run:
  # cmd/axiom's load test (docs/performance.md「怎么验证」) is built only with this tag; without it here nothing would lint it.
  build-tags: [load]

linters:
  default: none
  enable:
    # correctness
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - gochecksumtype
    - govet
    - ineffassign
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - staticcheck
    - unused
    # concurrency and context
    - containedctx
    - contextcheck
    - fatcontext
    # security
    - bidichk
    - gosec
    # size and complexity
    - cyclop
    - dupl
    - funlen
    - gocognit
    # explicitness and module rules
    - depguard
    - forbidigo
    - gochecknoinits
    - nolintlint
    # idiom
    - canonicalheader
    - modernize
    - recvcheck
    - revive
    - sloglint
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    cyclop:
      max-complexity: 12
    gocognit:
      min-complexity: 15
    dupl:
      threshold: 100
    errcheck:
      # `_ = f()` and `v, _ := f()` drop errors too; an error that truly may be ignored gets a nolint with a reason.
      check-blank: true
    gochecksumtype:
      # A default branch does not count: adding a variant must force every switch on it to be revisited
      # (exhaustive already behaves this way by default).
      default-signifies-exhaustive: false
    govet:
      enable-all: true
      disable:
        - fieldalignment # layout is tuned where a benchmark says so, not everywhere
        - shadow # shadowing err in nested scopes is idiomatic Go
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: receiver-naming
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: unnecessary-stmt
        - name: unused-receiver
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      static-msg: true
      key-naming-case: snake
      forbidden-keys: [time, level, msg, source]
    depguard:
      rules:
        all:
          deny:
            - pkg: log$
              desc: "log with log/slog: structured, and secrets stay out (docs/architecture.md「工程原则」)"
            - pkg: github.com/stretchr/testify
              desc: "use the standard testing package; compare values with github.com/google/go-cmp"
        database:
          deny:
            - pkg: github.com/jackc/pgx
              desc: "reach the database only through platform/pg's scoped transactions (docs/security.md「租户隔离」)"
            - pkg: database/sql
              desc: "reach the database only through platform/pg's scoped transactions (docs/security.md「租户隔离」)"
        # Generated code is outside every linter (exclusions.generated below): consoleapi.gen.go encodes our own
        # types with encoding/json, and sqlc's *.gen.go in a module outside platform imports pgx for the types
        # pg.Tx satisfies. Every other exception is a nolint comment on the import, with its reason. The packages
        # that may import pgx and database/sql, and encoding/json, are exempted by path under exclusions below, not
        # with `files` globs: those match absolute paths, so `**/internal/platform/**` would also exempt
        # internal/<module>/internal/platform.
        json:
          deny:
            - pkg: encoding/json # a prefix: also encoding/json/v2 and encoding/json/jsontext
              desc: "handle JSON through platform/jsonx, which holds the strictness and depth policy (docs/architecture.md「技术选型」)"
    forbidigo:
      analyze-types: true # so an import alias of fmt cannot hide a call
      forbid:
        - pattern: ^(fmt\.Print(|f|ln)|print|println)$
          msg: "write output through log/slog; only cmd/ prints to stdout"
        - pattern: ^pg\.(PlatformScope|NewScope)$
          pkg: ^axiom/internal/platform/pg$
          msg: "a scope decides which tenants' rows a module reads: only cmd/ builds the platform scope, and only tests build an arbitrary one (internal/platform/README.md)"
        - pattern: ^pg\.(SiteScope|AccountScope)$
          pkg: ^axiom/internal/platform/pg$
          msg: "a scope decides which tenants' rows a module reads: only internal/accounts builds a site or account scope, after authorization (internal/accounts/README.md)"
  exclusions:
    generated: strict
    rules:
      # Table-driven tests are long by nature and repeat a shape on purpose.
      - path: _test\.go
        linters: [funlen, dupl]
      - path: ^(cmd|tools)/ # programs, which print their results and build the platform scope
        linters: [forbidigo]
        text: use of `(fmt\.Print|print|pg\.PlatformScope)
      - path: ^internal/accounts/ # authorization, which builds the tenant scopes
        linters: [forbidigo]
        text: pg\.(SiteScope|AccountScope)
      - path: _test\.go # tests build whatever scope they test
        linters: [forbidigo]
        text: pg\.(PlatformScope|NewScope|SiteScope|AccountScope)
      - path: ^internal/platform/ # the platform opens the database
        linters: [depguard]
        text: from list 'database'
      - path: ^internal/platform/jsonx/ # the one place that handles JSON
        linters: [depguard]
        text: from list 'json'

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      module-path: axiom # without it, gofumpt takes the dotless "axiom/..." for the standard library
    goimports:
      local-prefixes: [axiom]

issues:
  # Show every problem: the defaults cap findings per linter and per line, which hid an exhaustive finding behind
  # another linter's finding on the same line.
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

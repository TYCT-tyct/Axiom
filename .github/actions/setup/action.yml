# What every ci.yml job installs before its checks, in one place: Go, pnpm, Node, the frontend's dependencies and just.
# The checkout stays in each job, because a local action cannot be resolved until the repository is in the workspace.
name: setup
description: Install the toolchain a ci.yml job runs its checks with.

inputs:
  node:
    description: install pnpm, Node and the frontend's dependencies; a Markdown-only change needs none of them
    default: "true"
  playwright:
    description: install the headless Chromium the end-to-end tests run in
    default: "false"
  images:
    description: hosted Docker image groups used by this job (tests, web, or both)
    default: ""
  warm-only:
    description: fill missing download archives on the default branch
    default: "false"

runs:
  using: composite
  steps:
    - if: runner.environment == 'github-hosted' && inputs.warm-only != 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ runner.os }}-ci-tools-${{ inputs.node }}-${{ hashFiles('.github/actions/setup/**') }}
        path: |
          ${{ runner.tool_cache }}/just
          ${{ runner.temp }}/cache-client
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # Save a complete module download before the tests, without competing to save different shard build caches.
        cache: false
    - if: runner.environment == 'github-hosted' && inputs.node == 'true'
      id: go-path
      run: echo "path=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      shell: bash
    - if: runner.environment == 'github-hosted' && inputs.node == 'true'
      id: go-modules
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.go-path.outputs.path }}
        key: go-modules-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'tools/go.mod', 'tools/go.sum') }}
        restore-keys: ${{ inputs.warm-only != 'true' && format('go-modules-v1-{0}-{1}-', runner.os, runner.arch) || '' }}
        lookup-only: ${{ inputs.warm-only }}
    - if: runner.environment == 'github-hosted' && inputs.node == 'true' && steps.go-modules.outputs.cache-hit != 'true'
      name: Download Go modules
      shell: bash
      run: |
        go mod download || { echo "Retrying Go module download"; go mod download; }
        cd tools
        go mod download || { echo "Retrying tools module download"; go mod download; }
    - if: runner.environment == 'github-hosted' && inputs.node == 'true' && steps.go-modules.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.go-path.outputs.path }}
        key: ${{ steps.go-modules.outputs.cache-primary-key }}
    - if: inputs.node == 'true' && inputs.warm-only != 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; the version is web/package.json's packageManager
      with:
        package_json_file: web/package.json
        # Not the default ~/setup-pnpm: runners sharing a host share a home, and two jobs installing pnpm into one
        # directory at once leave it broken
        dest: ${{ runner.temp }}/setup-pnpm
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: web/.node-version
        cache: ${{ runner.environment == 'github-hosted' && inputs.warm-only != 'true' && 'pnpm' || '' }}
        cache-dependency-path: web/pnpm-lock.yaml
    - if: inputs.node == 'true' && inputs.warm-only != 'true'
      run: pnpm --dir web install --frozen-lockfile
      shell: bash
    - if: runner.environment == 'github-hosted' && inputs.node == 'true' && inputs.warm-only != 'true'
      name: Prepare hosted content cache
      shell: bash
      run: |
        client="$RUNNER_TEMP/cache-client"
        if [ ! -f "$client/node_modules/@actions/cache/lib/cache.js" ]; then
          npm install --prefix "$client" --ignore-scripts --no-audit --no-fund --no-package-lock @actions/cache@6.3.0
        fi
        echo "ACTIONS_CACHE_CLIENT=$client/node_modules/@actions/cache/lib/cache.js" >> "$GITHUB_ENV"
    - if: runner.environment == 'github-hosted' && inputs.node == 'true'
      id: font-key
      shell: bash
      run: |
        digest=$(jq -Sc '.sources | map_values(.sha256)' web/scripts/fonts/sources.json | sha256sum)
        echo "key=source-fonts-${digest%% *}" >> "$GITHUB_OUTPUT"
    - if: runner.environment == 'github-hosted' && inputs.node == 'true'
      id: fonts
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.font-key.outputs.key }}
        path: ~/.cache/axiom/xdg/axiom-fonts
        lookup-only: ${{ inputs.warm-only }}
    - if: runner.environment == 'github-hosted' && inputs.node == 'true' && (inputs.warm-only != 'true' || steps.fonts.outputs.cache-hit != 'true')
      name: Verify pinned source fonts
      shell: bash
      run: |
        echo "Source font Actions cache hit: ${{ steps.fonts.outputs.cache-hit == 'true' }}"
        XDG_CACHE_HOME="$HOME/.cache/axiom/xdg" node --input-type=module -e '
          const { sources, sourceFont } = await import("./web/packages/boards/fonts.ts");
          await Promise.all(Object.keys(sources).map(sourceFont));
        '
    # Let the first verified download seed jobs that start later, even if the rest of this job fails.
    - if: runner.environment == 'github-hosted' && inputs.node == 'true' && steps.fonts.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        key: ${{ steps.font-key.outputs.key }}
        path: ~/.cache/axiom/xdg/axiom-fonts
    - if: runner.environment == 'github-hosted' && contains(inputs.images, 'tests')
      uses: ./.github/actions/setup/images
      with:
        group: tests
        warm-only: ${{ inputs.warm-only }}
    - if: runner.environment == 'github-hosted' && contains(inputs.images, 'web')
      uses: ./.github/actions/setup/images
      with:
        group: web
        warm-only: ${{ inputs.warm-only }}
    # Only the headless Chromium the end-to-end tests run in, with the system libraries it needs on a hosted runner.
    # A self-hosted host has the browser's system libraries installed once; installing them per job would take the
    # host's apt lock from parallel jobs at once
    - if: inputs.node == 'true' && inputs.playwright == 'true'
      run: pnpm --dir web exec playwright install $DEPS --only-shell chromium
      shell: bash
      env:
        DEPS: ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}
    # The tarball is cached in the runner's tool cache and checked against the pinned checksum on every use, so a
    # github.com outage only hurts the first job after a version bump.
    - if: inputs.warm-only != 'true'
      run: |
        bash scripts/ci/fetch-release-binary.sh just "$JUST_VERSION" "$JUST_SHA256" casey/just "$JUST_VERSION" "just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz" "$RUNNER_TEMP"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }} # for the API fallback, so parallel jobs do not share the anonymous rate limit
        # Pinned with the release's own checksum (SHA256SUMS), so a swapped download fails.
        JUST_VERSION: "1.58.0"
        JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
    - if: runner.environment == 'github-hosted' && inputs.warm-only != 'true'
      uses: ./.github/actions/setup/cache

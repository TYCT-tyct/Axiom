# What every ci.yml job installs before its checks, in one place: Go, pnpm, Node, the frontend's dependencies and just.
# The checkout stays in each job, because a local action cannot be resolved until the repository is in the workspace.
name: setup
description: Install the toolchain a ci.yml job runs its checks with.

inputs:
  node:
    description: install pnpm, Node and the frontend's dependencies; a Markdown-only change needs none of them
    default: "true"
  playwright:
    description: install the headless Chromium the end-to-end tests run in
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        # A self-hosted host keeps Go's build and module caches (and pnpm's store) on its own disk between jobs, so
        # saving them to the Actions cache only costs time (13 minutes for a 68 GB build cache) and restoring them
        # overwrites the directories other jobs on the host are using
        cache: ${{ runner.environment == 'github-hosted' }}
        cache-dependency-path: "**/go.sum"
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; the version is web/package.json's packageManager
      with:
        package_json_file: web/package.json
        # Not the default ~/setup-pnpm: runners sharing a host share a home, and two jobs installing pnpm into one
        # directory at once leave it broken
        dest: ${{ runner.temp }}/setup-pnpm
    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: web/.node-version
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }} # as for Go above
        cache-dependency-path: web/pnpm-lock.yaml
    - if: inputs.node == 'true'
      run: pnpm --dir web install --frozen-lockfile
      shell: bash
    # Only the headless Chromium the end-to-end tests run in, with the system libraries it needs on a hosted runner.
    # A self-hosted host has the browser's system libraries installed once; installing them per job would take the
    # host's apt lock from parallel jobs at once
    - if: inputs.node == 'true' && inputs.playwright == 'true'
      run: pnpm --dir web exec playwright install $DEPS --only-shell chromium
      shell: bash
      env:
        DEPS: ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }}
    # The tarball is cached in the runner's tool cache and checked against the pinned checksum on every use, so a
    # github.com outage only hurts the first job after a version bump.
    - run: |
        bash scripts/ci/fetch-release-binary.sh just "$JUST_VERSION" "$JUST_SHA256" casey/just "$JUST_VERSION" "just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz" "$RUNNER_TEMP"
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }} # for the API fallback, so parallel jobs do not share the anonymous rate limit
        # Pinned with the release's own checksum (SHA256SUMS), so a swapped download fails.
        JUST_VERSION: "1.58.0"
        JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"

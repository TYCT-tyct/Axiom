# The docs-impact check, shared by ci.yml (new commits) and docs-impact.yml (edited descriptions).
name: docs-impact
description: Fail when module code changed without its domain doc, its README, or a stated reason.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        PR_BODY="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .body)" # bash -e: a failed API call fails the step
        export PR_BODY
        python3 scripts/check_docs_impact.py "$BASE"
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        NUMBER: ${{ github.event.pull_request.number }}
        BASE: ${{ github.event.pull_request.base.sha }}

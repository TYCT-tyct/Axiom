version: 2
updates:
  # A release must be a week old before we take it: most poisoned releases are caught and pulled within days.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gomod
    directories: [/, /tools]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript needs the compiler API TypeScript 7 removed (docs/frontend.md); lift this when it supports 7.
      - dependency-name: typescript
        versions: [">=6"]
      # The types follow the Node release web/.node-version pins; move both together on purpose.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

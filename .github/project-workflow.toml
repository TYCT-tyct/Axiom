# project-workflow settings for this project.
# source: the project-workflow commit the managed files were copied from; only upgrades change it.
# The checks' limits use the defaults in scripts/workflow/check_docs.py. To change one, add it under [limits]
# with a comment saying why, for example:  doc_lines = 400  # the API reference is generated
source = "21e142318a5db6c370f5cf574dc68dbb45e36953"
modules = ["secrets", "docs", "pr", "review", "lanes"]

[merge]
strict = false # PRs merge through the merge train (docs/ops/merge-train.md), which builds the queued PRs merged onto the latest main and gates main on its `merge-train` status, so a PR need not take in main first. manage.py metrics --since 2026-10-14 (measured 2026-10-18): ci median 19.9 min, 1.28 merges/hour, 143 merges; with strict each merge voided the other queued PRs' builds, and two PRs that passed alone broke main together (#150, #182). `merge-train` is added to the ruleset by hand until project-workflow can declare it.

[lanes]
# Repository checks and CI orchestration never enter the program or page build. Deployment skips read these too.
# Preserve the existing Markdown-only path even outside docs/.
light = ["*.[mM][dD]", "scripts/test_*.py", "scripts/check_*.py", "scripts/ci_skips.py", "scripts/train.py",
         "scripts/workflow/*", "scripts/ci/runner-host.sh", "scripts/ci/bench-compare.sh"]
# Provisioning feeds the page build; the allocation comparison must exercise its train-only consumer.
code = ["scripts/ci/runner-host.sh", "scripts/ci/bench-compare.sh"]

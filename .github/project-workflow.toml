# project-workflow settings for this project.
# source: the project-workflow commit the managed files were copied from; only upgrades change it.
# The checks' limits use the defaults in scripts/workflow/check_docs.py. To change one, add it under [limits]
# with a comment saying why, for example:  doc_lines = 400  # the API reference is generated
source = "545f5d0b560cd7da62eec569d685a4a2a4ac6575"

[merge]
strict = true # manage.py metrics --since 2026-10-14 (measured 2026-10-17): ci median 8.3 min, sustained_open_prs 2, suggested_strict true; merging stale branches let two PRs add the same migration version and broke tests that only failed together (#150, #182). Revisit if open PRs stay above ~4.

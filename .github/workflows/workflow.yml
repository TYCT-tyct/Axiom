# Base checks, managed by project-workflow: changed only by upgrades, except Dependabot's action-version bumps.
# Project-specific jobs go in ci.yml, or in describe.yml when they read the PR description.
# Every job here is a check the ruleset protecting main requires (set by the skill's manage.py protect); keep the names.
name: workflow

on:
  pull_request:
    types: [opened, edited, synchronize, reopened] # edited: a changed title or description is checked again
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest discover -s scripts/workflow
      - run: python3 scripts/workflow/check_docs.py

  secrets:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    env:
      # The gitleaks CLI needs no license, unlike gitleaks-action on organization repos. Bumped by hand in project-workflow;
      # the checksum is the release's own (gitleaks_<version>_checksums.txt), so a swapped download fails.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit's whole history is scanned: a secret that was ever committed has leaked
      # --retry alone does not retry a dropped connection (curl exit 56); --retry-all-errors does, and a partial file is
      # rewritten, never appended to. The checksum still rejects whatever arrives broken.
      - run: |
          curl -sSfL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      # --log-opts=HEAD scans what this commit reaches (on a PR: its commits and the base's history), so a leak on another
      # branch fails that branch's own PR, not every PR; --redact keeps found secrets out of the job log
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts=HEAD .'

  pr:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: read # the issues the PR closes, for their acceptance boxes
      pull-requests: read # a closing keyword may name a pull request, which the issues API serves only with this
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/workflow/check_pr.py describe
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

  review:
    # Comments do not trigger pull_request events: review-rerun.yml reruns this job when a review or an answer is posted.
    # It runs last, so a finished run means a finished review: a comment misses both only in the seconds between this job
    # reading the comments and the run finishing. !cancelled() runs it even when another job failed, since a skipped
    # required check counts as passed.
    needs: [docs, secrets, pr]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read # the PR's comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch and earlier PR commits, to tell whether a review still covers the PR's change
      - run: gh api --paginate "repos/$REPO/issues/$NUMBER/comments?per_page=100" --jq '.[] | {body, author_association}' | python3 scripts/workflow/check_pr.py review
        shell: bash # with pipefail: a failed page must fail the check, never pass it on fewer comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

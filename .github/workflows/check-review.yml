# The review module of project-workflow: every PR's latest change has an independent review with no open blocking finding.
# Managed: changed only by upgrades, except Dependabot's action-version bumps. The job's name is the check the ruleset
# protecting main requires (set by the skill's manage.py protect); keep it.
name: check-review

on:
  pull_request:
    types: [opened, edited, synchronize, reopened] # edited: a changed title or description is checked again

# A newer push or edit cancels the PR's older run: only the latest head and description count
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    # Comments do not trigger pull_request events: review-rerun.yml reruns this job when a review or an answer is posted.
    # It is the only job here, so a finished run means a finished review: a comment misses it only in the seconds between
    # this job reading the comments and the run finishing.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read # the PR's comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base branch and earlier PR commits, to tell whether a review still covers the PR's change
      - run: gh api --paginate "repos/$REPO/issues/$NUMBER/comments?per_page=100" --jq '.[] | {body, author_association}' | python3 scripts/workflow/check_pr.py review
        shell: bash # with pipefail: a failed page must fail the check, never pass it on fewer comments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}

# Managed by project-workflow: changed only by upgrades.
# Comments do not trigger pull_request events, so the review check would keep its old result after a review or an answer
# is posted. This reruns the review job of the PR's latest workflow run; it never runs PR code and is not a required check.
name: review-rerun

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  rerun:
    # only review and answer comments, by people the review check trusts, on pull requests
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '独立评审 · ') || startsWith(github.event.comment.body, '作者回应 · '))
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5 # a hung request must not hold a self-hosted runner
    concurrency: review-rerun-${{ github.event.issue.number }} # a second comment sees the first rerun still running
    permissions:
      actions: write # rerun the job
      pull-requests: read # the PR's head commit
    steps:
      # A run still in progress needs nothing: review runs last (needs in workflow.yml) and reads the comment itself, unless
      # it already read the comments in the seconds before the run finishes; the review method keeps a manual rerun for that.
      # Returning at once matters on a single self-hosted runner, which waiting here would keep from finishing that run.
      - run: |
          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          run=$(gh api "repos/$REPO/actions/workflows/workflow.yml/runs?head_sha=$head&event=pull_request&per_page=1" \
            --jq '.workflow_runs[0] | select(.status == "completed") | .id')
          if [ -z "$run" ]; then echo "no finished workflow run for $head: its review job will read the comment"; exit 0; fi
          job=$(gh api "repos/$REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "review") | .id')
          [ -n "$job" ] || { echo "run $run has no review job"; exit 1; } # an empty --job would rerun every job
          gh run rerun "$run" --job "$job" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

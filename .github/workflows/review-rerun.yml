# The review module of project-workflow, with check-review.yml. Managed: changed only by upgrades.
# Comments do not trigger pull_request events, so the review check would keep its old result after a review or an answer
# is posted. This reruns the review job of the PR's newest check-review run; it never runs PR code and is not a required check.
name: review-rerun

on:
  issue_comment:
    types: [created, edited]

permissions: {}

jobs:
  rerun:
    # only review and answer comments, by people the review check trusts, on pull requests
    if: >-
      github.event.issue.pull_request &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '独立评审 · ') || startsWith(github.event.comment.body, '作者回应 · '))
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 5 # a hung request must not hold a self-hosted runner
    concurrency: review-rerun-${{ github.event.issue.number }} # a second comment sees the first rerun still running
    permissions:
      actions: write # rerun the job
      pull-requests: read # the PR's head commit
    steps:
      # A run still in progress needs nothing: review is the run's only job and reads the comment itself, unless it already
      # read the comments in the seconds before the run finishes; the review method keeps a manual rerun for that.
      # Returning at once matters on a single self-hosted runner, which waiting here would keep from finishing that run.
      # A push and a description edit can start two runs for one commit, the later cancelling the earlier (concurrency in
      # check-review.yml), and rerunning a job puts its run back in that group. So only the newest run counts, read in one
      # snapshot: nothing is rerun while a run is going, and a cancelled newest run is reported, never replaced by an older
      # run that checked an older description. A description edit landing between this snapshot and the rerun can still
      # cancel or be cancelled by the rerun; the check then shows cancelled, and the review method says how to recover.
      # workflow-pr is where review ran before the modules: a PR whose branch has not taken in that upgrade still runs it
      # there, and finds its runs by the workflow's name, since that file is gone from the default branch.
      - run: |
          head=$(gh api "repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          read -r total going run < <(gh api "repos/$REPO/actions/runs?head_sha=$head&event=pull_request&per_page=100"             --jq '[.workflow_runs[] | select(.name == "check-review" or .name == "workflow-pr")] as $r | ($r | map(.created_at) | max) as $t
              | "\($r | length) \([$r[] | select(.status != "completed")] | length) \([$r[] | select(.created_at == $t and .conclusion != "cancelled")][0].id // "-")"')
          if [ "$total" = 0 ] || [ "$going" != 0 ]; then echo "a review run for $head is pending or going: its review job will read the comment"; exit 0; fi
          if [ "$run" = - ]; then echo "the newest review run for $head was cancelled: rerun it in full (review method)"; exit 1; fi
          job=$(gh api "repos/$REPO/actions/runs/$run/jobs" --jq '.jobs[] | select(.name == "review") | .id')
          [ -n "$job" ] || { echo "run $run has no review job"; exit 1; } # an empty --job would rerun every job
          gh run rerun "$run" --job "$job" --repo "$REPO"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}

# probe: a comment-only workflow change
# Project checks that read the PR description, apart from ci.yml so that editing a description reruns only these.
# Every job here is a check the ruleset protecting main requires (manage.py protect reads this file), so keep the names.
name: describe

on:
  pull_request:
    types: [opened, edited, synchronize, reopened] # edited: a changed description is checked again

# A newer push or edit cancels the PR's older run: only the latest head and description count
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs-impact:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read # the description, read when the job runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          PR_BODY="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .body)" # bash -e: a failed API call fails the step
          export PR_BODY
          python3 scripts/check_docs_impact.py "$BASE"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}

# Project checks that read the pull request's description, so they rerun when it is edited; build in ci.yml does not.
# Every job here is a check the ruleset protecting main requires (manage.py protect reads this file); keep the names.
name: describe

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  docs-impact:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      pull-requests: read # the description, read when the job runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          PR_BODY="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .body)" # bash -e: a failed API call fails the step
          export PR_BODY
          python3 scripts/check_docs_impact.py "$BASE"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}

# The secrets module of project-workflow: no secret anywhere in the history a commit reaches.
# Managed: changed only by upgrades, except Dependabot's action-version bumps. The job's name is the check the ruleset
# protecting main requires (set by the skill's manage.py protect); keep it.
name: check-secrets

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a PR cancels its older run, which would only hold a runner; pushes to main never cancel each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.RUNS_ON || '"ubuntu-latest"') }}
    env:
      # The gitleaks CLI needs no license, unlike gitleaks-action on organization repos. Bumped by hand in project-workflow;
      # the checksum is the release's own (gitleaks_<version>_checksums.txt), so a swapped download fails.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit's whole history is scanned: a secret that was ever committed has leaked
      # Cached in the runner's tool cache and checked against the checksum on every use (fetch-release-binary.sh)
      - run: bash scripts/ci/fetch-release-binary.sh gitleaks "$GITLEAKS_VERSION" "$GITLEAKS_SHA256" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "$RUNNER_TEMP"
      # --log-opts=HEAD scans what this commit reaches (on a PR: its commits and the base's history), so a leak on another
      # branch fails that branch's own PR, not every PR; --redact keeps found secrets out of the job log
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --log-opts=HEAD .'

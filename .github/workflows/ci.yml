# Project checks; the base checks are in workflow.yml. The ruleset protecting main requires the `build` job below, the
# aggregator of the parts that do the work; the parts themselves are not required checks. Keep that name. Note that
# manage.py protect reads this file and requires every job in it, so it is not run while the ruleset is hand-edited (like
# `merge-train`, see .github/project-workflow.toml).
name: ci

on:
  pull_request:
    # No edited: a description edit would rerun build for nothing, and skipping build on it is no way out, because a
    # skipped required check counts as passed. docs-impact, which reads the description, is in describe.yml.
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review: a draft gets its first build when it is marked ready
  push:
    branches: [main]
  # The merge train (train.yml, scripts/train.py) builds each train branch here. GITHUB_TOKEN's pushes start no workflow,
  # so it dispatches this one: with base, the train is checked like a pull request from base, its PRs' whole change
  # deciding what runs; without base (after a train lands on main), like a push to main.
  workflow_dispatch:
    inputs:
      base:
        description: the commit a train branch was assembled on
        type: string
        default: ""

permissions:
  contents: read

# A newer event on a pull request makes the run for the older one pointless; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What a pull request or a train is checked against; empty on main, which runs everything
  BASE: ${{ github.event.pull_request.base.sha || inputs.base }}

jobs:
  # One cheap job decides what the others skip, so a Markdown-only change starts no job that would only stop again, and
  # the deploy and benchmark rules diff the base once. A Markdown-only PR or train runs `just md-checks` only; main, and
  # every other PR or train, runs the checks below, with the benchmark comparison and the deployment check on a train or
  # main alone.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
      deploy: ${{ steps.decide.outputs.deploy }}
      bench: ${{ steps.decide.outputs.bench }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned by commit, a tag can move
        with:
          fetch-depth: 0 # the diff needs the merge base
      # Exit 10 is the only "not needed" (scripts/ci_skips.py); every other outcome runs the check, so a failed diff
      # never hides a regression. Without a base (main) everything runs.
      - id: decide
        run: |
          docs_only=false; deploy=true; bench=true
          if [ -n "$BASE" ]; then
            if python3 scripts/ci_skips.py md-only "$BASE"; then
              docs_only=true; deploy=false; bench=false
            else
              status=0
              python3 scripts/ci_skips.py deploy-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "deploy-check skipped: only files outside the container changed between $BASE and HEAD"
                deploy=false
              else
                [ "$status" -eq 0 ] || echo "deploy-needed check exited $status; running deploy-check"
              fi
              status=0
              python3 scripts/ci_skips.py bench-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "bench-compare skipped: only Markdown or web/ changed between $BASE and HEAD"
                bench=false
              else
                [ "$status" -eq 0 ] || echo "bench-needed check exited $status; running bench-compare"
              fi
            fi
          fi
          printf 'docs_only=%s\ndeploy=%s\nbench=%s\n' "$docs_only" "$deploy" "$bench" >> "$GITHUB_OUTPUT"

  # The checks of `just check-ci` that need neither a Go test run nor the frontend. A train or main also runs what
  # `just check` adds over `check-ci` (`docs`, `secrets`): workflow.yml does not run for the commits a train merges, and
  # two PRs whose docs pass alone can break a link together.
  static:
    needs: changes
    if: needs.changes.result == 'success'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: read # the issues the flaky list names
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migrations check reads the base commit
      - uses: ./.github/actions/setup
        with:
          node: ${{ needs.changes.outputs.docs_only != 'true' }}
      # Each known-flaky test names an open issue; once the issue closes the entry must go (CONTRIBUTING.md「合并队列」)
      - run: python3 scripts/train.py flaky-check
        env:
          GH_TOKEN: ${{ github.token }}
      # A train adds `secrets`, which workflow.yml runs for a PR but nothing dispatches for a train.
      - if: needs.changes.outputs.docs_only == 'true'
        run: just md-checks ${{ github.event_name != 'pull_request' && 'secrets' || '' }}
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: just script-tests check-static
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: just docs check-static secrets
      # A PR or train is checked like a pull request from its base: merged migrations never change. Main has no base.
      - if: env.BASE != ''
        run: just migrations "$BASE"

  # The Go tests only. `just test` depends on `web-embed`, the frontend the program embeds, so this job installs pnpm and
  # Node like the web job; the build is cached by content on the host (scripts/web_cache.py), as it was in the one job.
  go-test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - run: just test

  # The frontend's checks and its end-to-end tests. `just web` builds the frontend the program embeds before serving it
  # to the tests; that build is cached by content on the host, as in the other jobs.
  web:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
        with:
          playwright: "true"
      - run: just web
      # A later checkout removes test-results on self-hosted runners; keep the failed page and its network evidence.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A train or main only: a PR's change cannot move a benchmark's allocation count without the train catching it, and
  # the comparison is 4-5 minutes of the PR's wall. On main every benchmark runs once under -race (`bench-once`); a
  # train compares allocations against its base, with the existing skip rule.
  bench:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bench == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the comparison checks out the base commit
      - uses: ./.github/actions/setup
      - if: env.BASE == ''
        run: just bench-once
      - if: env.BASE != ''
        run: just bench-compare "$BASE"

  # A train or main only, as for the benchmark: a deployment regression is caught by the train, which ejects the PR that
  # broke it (scripts/train.py). The skip rule is the one ci.yml always had: only files clearly outside the container.
  deploy:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # `just up` stamps the image with this tree's history
      - uses: ./.github/actions/setup
      - run: bash scripts/ci/deploy-check.sh
        timeout-minutes: 40

  # The required check, and the only name the ruleset knows. It runs even when a part failed, because a skipped required
  # check counts as passed on GitHub; a part that was skipped (a Markdown-only change, a PR's bench and deploy) is fine.
  build:
    needs: [changes, static, go-test, web, bench, deploy]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a job this build needs failed or was cancelled"
          exit 1
      - run: echo "every job this build needs passed or was skipped"

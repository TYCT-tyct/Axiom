# Project checks; the managed checks are in check-*.yml. The ruleset protecting main requires the `build` job below, the
# aggregator of the parts that do the work; the parts themselves are not required checks. Keep that name. Note that
# manage.py protect reads this file and requires every job in it, so it is not run while the ruleset is hand-edited (like
# `merge-train`, see .github/project-workflow.toml).
name: ci

on:
  pull_request:
    # No edited: a description edit would rerun build for nothing, and skipping build on it is no way out, because a
    # skipped required check counts as passed. docs-impact, which reads the description, is in describe.yml.
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review: a draft gets its first build when it is marked ready
  push:
    branches: [main]
  # The merge train (train.yml, scripts/train.py) builds each train branch here. GITHUB_TOKEN's pushes start no workflow,
  # so it dispatches this one with base: the train is checked like a pull request from base, its PRs' whole change
  # deciding what runs. Without base it runs like a push to main; the train's landing push (its deploy key) starts that
  # run itself.
  workflow_dispatch:
    inputs:
      base:
        description: the commit a train branch was assembled on
        type: string
        default: ""
      release:
        description: retain the release artifact (main tip only, without base or gate_stress)
        type: boolean
        default: false
      gate_stress:
        description: "web-only diagnostic (four admin scenes x50); use main or a throwaway branch with its own commit, never a PR head (build fails)"
        type: boolean
        default: false

permissions:
  contents: read

# New pull request events supersede older runs; in-progress main runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What a pull request or a train is checked against; empty on main, which runs everything
  BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
  # Chromium and serveweb share a private network namespace; keep the browser image pinned.
  WEB_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f

jobs:
  # Light PRs and trains run md-checks and scope, including script tests; trains also scan secrets.
  # Without a base (main pushes and release dispatches), all checks run. PRs select web and boards by inputs, and trains
  # run the vitals only when the pages' own inputs changed. Go tests, e2e, benchmark comparison and deployment checks
  # run on trains or main alone.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      light: ${{ steps.decide.outputs.light }}
      deploy: ${{ steps.decide.outputs.deploy }}
      bench: ${{ steps.decide.outputs.bench }}
      web: ${{ steps.decide.outputs.web }}
      vitals: ${{ steps.decide.outputs.vitals }}
      boards: ${{ steps.decide.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned by commit, a tag can move
        with:
          fetch-depth: 0 # the diff needs the merge base
      # Exit 10 is the only "not needed" (scripts/ci_skips.py); every other outcome runs the check, so a failed diff
      # never hides a regression. Without a base (main) everything runs.
      - id: decide
        run: |
          light=false; deploy=true; bench=true; web=true; vitals=true; boards=true
          if [ -n "$BASE" ]; then
            status=0
            git diff --quiet "$BASE...HEAD" -- 'web/scripts/boards*' 'web/packages/boards/**' 'web/e2e/boards*.spec.ts' 'web/e2e/design/**' 'web/playwright.config.ts' 'web/playwright.boards.config.ts' '.github/workflows/ci.yml' || status=$?
            if [ "$status" -eq 0 ]; then
              boards=false
            elif [ "$status" -ne 1 ]; then
              echo "board input diff exited $status; running boards"
            fi
            if python3 scripts/ci_skips.py light-only "$BASE"; then
              light=true; deploy=false; bench=false; web=false; vitals=false
            else
              status=0
              python3 scripts/ci_skips.py deploy-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "deploy-check skipped: only files outside the container changed between $BASE and HEAD"
                deploy=false
              else
                [ "$status" -eq 0 ] || echo "deploy-needed check exited $status; running deploy-check"
              fi
              status=0
              python3 scripts/ci_skips.py bench-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "bench-compare skipped: only Markdown or web/ changed between $BASE and HEAD"
                bench=false
              else
                [ "$status" -eq 0 ] || echo "bench-needed check exited $status; running bench-compare"
              fi
              status=0
              python3 scripts/ci_skips.py vitals-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "vitals skipped: nothing the pages are built from changed between $BASE and HEAD"
                vitals=false
              else
                [ "$status" -eq 0 ] || echo "vitals-needed check exited $status; running vitals"
              fi
            fi
          fi
          if [ "${{ github.event_name }}" = pull_request ] && [ -n "$BASE" ]; then
            status=0
            python3 scripts/ci_skips.py web-needed "$BASE" || status=$?
            if [ "$status" -eq 10 ]; then
              echo "web skipped: no frontend, API or build inputs changed"
              web=false
            fi
          fi
          printf 'light=%s\ndeploy=%s\nbench=%s\nweb=%s\nvitals=%s\nboards=%s\n' "$light" "$deploy" "$bench" "$web" "$vitals" "$boards" >> "$GITHUB_OUTPUT"

  # The checks of `just check-ci` that need neither a Go test run nor the frontend. A train or main also runs what
  # `just check` adds over `check-ci` (`docs`, `secrets`): the check-*.yml workflows do not run for the commits a train merges, and
  # two PRs whose docs pass alone can break a link together.
  static:
    needs: changes
    if: needs.changes.result == 'success' && !inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: read # the issues the flaky list names
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migrations check reads the base commit
      - uses: ./.github/actions/setup
        with:
          node: ${{ needs.changes.outputs.light != 'true' }}
      # Each known-flaky test names an open issue; once the issue closes the entry must go (CONTRIBUTING.md「合并队列」)
      - run: python3 scripts/train.py flaky-check
        env:
          GH_TOKEN: ${{ github.token }}
      # A train adds `secrets`, which check-secrets.yml runs for a PR but nothing dispatches for a train.
      # Documents and check scripts also change the rules applied to the whole tree.
      - if: needs.changes.outputs.light == 'true'
        run: just md-checks scope ${{ github.event_name != 'pull_request' && 'secrets' || '' }}
      - if: needs.changes.outputs.light != 'true' && github.event_name == 'pull_request'
        run: just script-tests check-static pr
      # `train` is explicit: a batch can improve a number by more than the tolerance with no single PR crossing it, so
      # the ratchet reports the improvement instead of failing; the PR branch above passes `pr` and keeps it strict.
      - if: needs.changes.outputs.light != 'true' && github.event_name != 'pull_request'
        run: just docs check-static train secrets
      # A PR or train is checked like a pull request from its base: merged migrations never change, and a schema does not
      # newly require a field that old nodes or pages lack during a rolling release. Main has no base.
      - if: env.BASE != '' && needs.changes.outputs.light != 'true'
        run: just migrations "$BASE" && just api-compat "$BASE"

      - name: Compare migration baselines with frozen history
        if: needs.changes.outputs.light != 'true'
        run: |
          name="axiom-migration-proof-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm -f "$name" >/dev/null' EXIT
          docker run -d --name "$name" -e POSTGRES_HOST_AUTH_METHOD=trust postgres:18.6-alpine
          for attempt in $(seq 1 60); do
            if docker exec "$name" pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          python3 scripts/compare_migrations.py --container "$name"

  # The Go tests only. `just test` depends on `web-embed`, the frontend the program embeds, so this job installs pnpm and
  # Node like the web job; the build is cached by content on the host (scripts/web_cache.py), as it was in the one job.
  # A pull request does not run it: the train runs it once for the batch, and finds the PR that broke it (2026-10-28,
  # owner: 「能优化则优化吧。甚至跳过」 — every PR's tests ran twice, once alone and once in its train).
  go-test:
    name: go-test (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.light != 'true' && !inputs.gate_stress && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false # the other shard's log still names its own failures for the train's flaky check
      matrix:
        shard: [1, 2]
    # GITHUB_JOB is the same for both shards: the container label needs the shard, or one shard's cleanup removes the
    # other's live containers
    env:
      AXIOM_TEST_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      # Keep disabling Ryuk in the same job that supplies its replacement cleanup; runner .env owns the cgroup.
      - name: Configure test container policy
        run: |
          echo "AXIOM_TEST_JOB=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB${AXIOM_TEST_SHARD:+-$AXIOM_TEST_SHARD}" >> "$GITHUB_ENV"
          if [ -n "${AXIOM_TEST_CGROUP_PARENT:-}" ]; then
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Clean test containers before tests
        run: bash scripts/ci/clean-test-containers.sh
      - uses: ./.github/actions/setup
      - run: just test ${{ matrix.shard }}/2
      - name: Clean test containers after tests
        if: always()
        run: bash scripts/ci/clean-test-containers.sh

  # Keep frontend checks parallel to the browser suite; neither waits for the other's build.
  web:
    needs: changes
    if: needs.changes.result == 'success' && (inputs.gate_stress || needs.changes.outputs.light != 'true' && needs.changes.outputs.web == 'true')
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run web checks in their network namespace
        run: bash scripts/ci/web-container.sh just web-checks
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # The web vitals are timings, so they run in a job of their own: one test at a time, with no other test on the
  # container's cores. A build whose diff touches nothing the pages are built from ships the same pages, so its timing
  # can only follow the runner (#503): PRs and trains run them only for those inputs, main runs them on every push, and
  # a failure there is main-red.
  vitals:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.vitals == 'true' && !inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run the web vitals in their network namespace
        run: bash scripts/ci/web-container.sh just web-vitals
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: vitals-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 2
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # Each shard keeps the same eight-core container and four-worker rule (#297/#363). Like go-test, not on a pull request unless its frontend inputs changed, so a broken page fails before its train.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ inputs.gate_stress && 1 || 2 }})
    needs: changes
    # a shard takes about 11 minutes; without a limit a hung one held the merge train for an hour (GitHub's default is 6 h)
    timeout-minutes: 30
    if: needs.changes.result == 'success' && (inputs.gate_stress || needs.changes.outputs.light != 'true' && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'))
    strategy:
      fail-fast: false # finish the other shard and keep its evidence when one fails
      matrix:
        shard: ${{ fromJSON(inputs.gate_stress && '[1]' || '[1,2]') }}
    env:
      E2E_SHARD_INDEX: ${{ matrix.shard }}
      E2E_SHARD_COUNT: ${{ inputs.gate_stress && 1 || 2 }}
      GATE_STRESS: ${{ inputs.gate_stress || false }}
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run e2e shard in its network namespace
        run: |
          bash scripts/ci/web-container.sh bash -e -c '
            if [ "$GATE_STRESS" = true ]; then
              gate=(e2e/gate.spec.ts -g "admin (price-publish|supplier-connect-details|account|model-name) ")
              pnpm --dir web exec playwright test "${gate[@]}" --list
            fi
            just web-e2e "$E2E_SHARD_INDEX/$E2E_SHARD_COUNT"
            if [ "$GATE_STRESS" = true ]; then
              AXIOM_VERSION=$(just axiom-version)
              export AXIOM_VERSION
              pnpm --dir web exec playwright test "${gate[@]}" \
                --repeat-each=50 --max-failures=1 --reporter=line
            fi
          '
      # A later checkout removes test-results on self-hosted runners; keep each shard's evidence separately.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 2
      # Cancellation can stop the Docker client before the test process; remove only this attempt's container.
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # Mechanical design proofs are independent of product e2e. Run on relevant PRs and trains, and always on main.
  # 108 comparisons took 24 minutes on one runner, the longest job of every frontend PR (2026-11-17); four shards on
  # separate runners bring it near the e2e's length.
  boards:
    name: boards (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.boards == 'true' && !inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false # finish the other shards and keep their evidence when one fails
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_SHARD_INDEX: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Compare converted boards in their network namespace
        run: bash scripts/ci/web-container.sh pnpm --dir web e2e --config=playwright.boards.config.ts --shard="$E2E_SHARD_INDEX/4"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: boards-test-results-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 2
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # One browser against a real node with PostgreSQL and Valkey (#321). The databases are started on the host (withcluster,
  # which needs Docker); the node and the browser run in the web container, so Chromium keeps its own network namespace
  # (#363) and reaches the databases through the host gateway. Like go-test and e2e, not on a pull request; a failure
  # keeps the browser's trace and the node's log.
  journey:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.light != 'true' && !inputs.gate_stress && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - name: Configure test container policy
        run: |
          echo "AXIOM_TEST_JOB=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB${AXIOM_TEST_SHARD:+-$AXIOM_TEST_SHARD}" >> "$GITHUB_ENV"
          if [ -n "${AXIOM_TEST_CGROUP_PARENT:-}" ]; then
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Clean test containers before tests
        run: bash scripts/ci/clean-test-containers.sh
      - uses: ./.github/actions/setup
      - run: just web-embed
      - name: Run the journey in the web container
        run: go run ./internal/platform/pgtest/cmd/withcluster bash scripts/ci/web-container.sh pnpm --dir web journey
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: journey-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 2
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup
      - name: Clean test containers after tests
        if: always()
        run: bash scripts/ci/clean-test-containers.sh

  # A train or main only: a PR's change cannot move a benchmark's allocation count without the train catching it, and
  # the comparison is 4-5 minutes of the PR's wall. On main every benchmark runs once under -race (`bench-once`); a
  # train compares allocations against its base, with the existing skip rule.
  bench:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.gate_stress &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bench == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the comparison checks out the base commit
      # The same test container policy as go-test (#411): benchmarks start PostgreSQL and Valkey containers too, and a
      # Ryuk that does not start within its wait on a loaded runner failed the whole job (train build 41569176679).
      - name: Configure test container policy
        run: |
          echo "AXIOM_TEST_JOB=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB${AXIOM_TEST_SHARD:+-$AXIOM_TEST_SHARD}" >> "$GITHUB_ENV"
          if [ -n "${AXIOM_TEST_CGROUP_PARENT:-}" ]; then
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Clean test containers before tests
        run: bash scripts/ci/clean-test-containers.sh
      - uses: ./.github/actions/setup
      - if: env.BASE == ''
        run: just bench-once
      - if: env.BASE != ''
        run: bash scripts/ci/bench-compare.sh "$BASE"
      - name: Clean test containers after tests
        if: always()
        run: bash scripts/ci/clean-test-containers.sh

  # A train or main only, as for the benchmark: a deployment regression is caught by the train, which ejects the PR that
  # broke it (scripts/train.py). The skip rule is the one ci.yml always had: only files clearly outside the container.
  # A train builds the release too, so a step only main uses cannot wait until main to fail (the 2026-10-29 buildx
  # failure); only a deliberate release dispatch on main keeps the artifact.
  deploy:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.gate_stress &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    # cosign obtains a short-lived Fulcio certificate for this workflow and ref from GitHub's OIDC token, so no signing
    # key is stored. Only the release job needs the token; every other job keeps the workflow's read-only default.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend and program versions use this tree's history
      - uses: ./.github/actions/setup
      # release-check ends by running deploy-check, so a train rehearses deployment once; this stays for a manual
      # branch dispatch with no base.
      - name: Rehearse train deployment
        if: github.ref != 'refs/heads/main' && inputs.base == ''
        run: bash scripts/ci/deploy-check.sh
        timeout-minutes: 40
      - name: Build and rehearse release by digest
        if: github.ref == 'refs/heads/main' || inputs.base != ''
        run: bash scripts/ci/release-check.sh
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }} # release-asset.sh's API fallback
          RELEASE_DIR: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain release image, signature and provenance
        if: github.ref == 'refs/heads/main' && inputs.release && !inputs.base && !inputs.gate_stress
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          # Deliberate releases are rare; keep the default GitHub maximum for retrieval before long-term archiving.
          retention-days: 90
          compression-level: 0

  # Signs a throwaway image with the release's keyless flow and proves the verifier accepts that digest and its SBOM
  # while refusing a moved signature, another identity/issuer/ref, a tag, a tampered digest, a wrong-subject attestation,
  # and an SBOM swapped together with its recorded hash. Trains and main run it for the same reason they build the
  # release: a signing change that only main uses must fail in the train that causes it. It needs the workflow's OIDC
  # identity and writes to the public transparency log, so a pull request does not run it.
  signing:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.gate_stress &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.light != 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Sign a throwaway image and verify it
        run: bash scripts/ci/signing-check.sh
        env:
          GH_TOKEN: ${{ github.token }} # release-asset.sh's API fallback

  # The required check, and the only name the ruleset knows. It runs even when a part failed, because a skipped required
  # check counts as passed on GitHub. Light builds may skip parts; PRs skip go-test/e2e/bench/deploy/signing and
  # select web, boards and the vitals by path. Intentional skips still produce this required check.
  build:
    # Diagnostics publish a failed build: dispatch on main or a throwaway commit, never a PR head intended to merge.
    name: build
    needs: [changes, static, go-test, web, e2e, boards, vitals, journey, bench, deploy, signing]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      # GitHub accepts a skipped required check, so diagnostics must fail this check rather than skip it.
      - if: inputs.gate_stress
        run: |
          echo "gate-stress is a diagnostic; run the full build to satisfy the required check"
          exit 1
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a job this build needs failed or was cancelled"
          exit 1
      # `needs.e2e.result` aggregates the whole matrix. Only light builds and pull requests may skip its shards.
      - if: needs.changes.outputs.light != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.e2e.result }}' = success
      - if: needs.changes.outputs.vitals == 'true'
        run: test '${{ needs.vitals.result }}' = success
      - if: needs.changes.outputs.boards == 'true' && !inputs.gate_stress
        run: test '${{ needs.boards.result }}' = success
      - if: needs.changes.outputs.light != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.journey.result }}' = success
      - if: needs.changes.outputs.light != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.signing.result }}' = success
      - if: github.ref == 'refs/heads/main' && !inputs.base && !inputs.gate_stress
        run: test '${{ needs.deploy.result }}' = success
      - run: echo "every required job passed; only optional jobs were skipped"

  gate-stress:
    name: gate-stress
    needs: [changes, web, e2e]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - run: test '${{ needs.changes.result }}' = success && test '${{ needs.web.result }}' = success && test '${{ needs.e2e.result }}' = success

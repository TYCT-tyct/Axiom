# Project checks; the base checks are in workflow.yml. Every job here is a check the ruleset protecting main
# requires (manage.py protect reads this file), so keep the names, and add or rename jobs only as the skill says.
name: ci

on:
  pull_request:
    # edited: docs-impact reads the description. Every job reruns on an edit; build cannot be skipped instead, because
    # a skipped required check counts as passed, and docs-impact cannot move to its own workflow, because a check
    # must have one source. So keep description edits few: write it in full before asking for review.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

# A newer event on a pull request makes the run for the older one pointless; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pinned with the release's own checksum (SHA256SUMS), so a swapped download fails.
      JUST_VERSION: "1.58.0"
      JUST_SHA256: "4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned by commit, a tag can move
        with:
          fetch-depth: 0 # the benchmark comparison checks out the base commit
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0; the version is web/package.json's packageManager
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # Only the headless Chromium the end-to-end tests run in, with the system libraries it needs
      - run: pnpm --dir web install --frozen-lockfile && pnpm --dir web exec playwright install --with-deps --only-shell chromium
      - run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/just.tar.gz" "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $RUNNER_TEMP/just.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/just.tar.gz" -C "$RUNNER_TEMP" just
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: just check
      - run: just up # one command deploys this machine and waits for a ready node
        timeout-minutes: 5
      # The node answering runs the program built from this tree, not a stale image; the passwords are its owner's only
      - run: |
          deployed="$(curl -fsS http://127.0.0.1:8080/api/console/v1/version | jq -r .version)"
          built="$(just axiom-version)"
          [ "$deployed" = "$built" ] || { echo "::error::the node runs $deployed, this tree builds $built"; exit 1; }
          [ "$(stat -c %a deploy/.env)" = 600 ] || { echo "::error::deploy/.env is readable by others"; exit 1; }
      # A deployment from before the migration administrator: no such role, an owner role that role did not create, and
      # a deploy/.env without its password, readable by others and lacking a final newline. just up upgrades it in place.
      - run: |
          docker compose -f deploy/compose.yaml exec -T postgres psql -v ON_ERROR_STOP=1 -U postgres -d axiom -c 'DROP OWNED BY axiom_migrator' -c 'DROP ROLE axiom_migrator'
          kept="$(grep -v '^AXIOM_MIGRATOR_PASSWORD=' deploy/.env)"
          printf '%s' "$kept" > deploy/.env && chmod 644 deploy/.env
          just up
          [ "$(grep -v '^AXIOM_MIGRATOR_PASSWORD=' deploy/.env)" = "$kept" ] && [ "$(grep -c '^AXIOM_MIGRATOR_PASSWORD=.' deploy/.env)" = 1 ] || { echo "::error::upgrading deploy/.env changed a password or did not add one"; exit 1; }
          [ "$(stat -c %a deploy/.env)" = 600 ] || { echo "::error::upgrading left deploy/.env readable by others"; exit 1; }
          just up # the next start, which repeats every grant on roles that now have it
        timeout-minutes: 5
      - if: always()
        run: just down
      - if: github.event_name == 'pull_request'
        run: just migrations "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - if: github.event_name == 'pull_request'
        run: just bench-compare "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}

  docs-impact:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # the description, read when the job runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          PR_BODY="$(gh api "repos/$REPO/pulls/$NUMBER" --jq .body)" # bash -e: a failed API call fails the step
          export PR_BODY
          python3 scripts/check_docs_impact.py "$BASE"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}

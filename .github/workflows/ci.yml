# Project checks; the base checks are in workflow.yml. The ruleset protecting main requires the `build` job below, the
# aggregator of the parts that do the work; the parts themselves are not required checks. Keep that name. Note that
# manage.py protect reads this file and requires every job in it, so it is not run while the ruleset is hand-edited (like
# `merge-train`, see .github/project-workflow.toml).
name: ci

on:
  pull_request:
    # No edited: a description edit would rerun build for nothing, and skipping build on it is no way out, because a
    # skipped required check counts as passed. docs-impact, which reads the description, is in describe.yml.
    types: [opened, synchronize, reopened, ready_for_review] # ready_for_review: a draft gets its first build when it is marked ready
  push:
    branches: [main]
  # The merge train (train.yml, scripts/train.py) builds each train branch here. GITHUB_TOKEN's pushes start no workflow,
  # so it dispatches this one: with base, the train is checked like a pull request from base, its PRs' whole change
  # deciding what runs; without base (after a train lands on main), like a push to main.
  workflow_dispatch:
    inputs:
      base:
        description: the commit a train branch was assembled on
        type: string
        default: ""
      gate_stress:
        description: "web-only diagnostic (four admin scenes x50); use main or a throwaway branch with its own commit, never a PR head (build fails)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer event on a pull request makes the run for the older one pointless; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # What a pull request or a train is checked against; empty on main, which runs everything
  BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
  # Chromium and serveweb share a private network namespace; keep the browser image pinned.
  WEB_IMAGE: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f

jobs:
  # One cheap job decides what the others skip, so a Markdown-only change starts no job that would only stop again, and
  # the deploy and benchmark rules diff the base once. A Markdown-only PR or train runs `just md-checks` only; main, and
  # other trains run the full checks below; PRs run static and select web by frontend/build inputs. Go tests, e2e,
  # benchmark comparison and deployment checks run on trains or main alone.
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
      deploy: ${{ steps.decide.outputs.deploy }}
      bench: ${{ steps.decide.outputs.bench }}
      web: ${{ steps.decide.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; pinned by commit, a tag can move
        with:
          fetch-depth: 0 # the diff needs the merge base
      # Exit 10 is the only "not needed" (scripts/ci_skips.py); every other outcome runs the check, so a failed diff
      # never hides a regression. Without a base (main) everything runs.
      - id: decide
        run: |
          docs_only=false; deploy=true; bench=true; web=true
          if [ -n "$BASE" ]; then
            if python3 scripts/ci_skips.py md-only "$BASE"; then
              docs_only=true; deploy=false; bench=false
            else
              status=0
              python3 scripts/ci_skips.py deploy-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "deploy-check skipped: only files outside the container changed between $BASE and HEAD"
                deploy=false
              else
                [ "$status" -eq 0 ] || echo "deploy-needed check exited $status; running deploy-check"
              fi
              status=0
              python3 scripts/ci_skips.py bench-needed "$BASE" || status=$?
              if [ "$status" -eq 10 ]; then
                echo "bench-compare skipped: only Markdown or web/ changed between $BASE and HEAD"
                bench=false
              else
                [ "$status" -eq 0 ] || echo "bench-needed check exited $status; running bench-compare"
              fi
            fi
          fi
          if [ "${{ github.event_name }}" = pull_request ] && [ -n "$BASE" ]; then
            status=0
            python3 scripts/ci_skips.py web-needed "$BASE" || status=$?
            if [ "$status" -eq 10 ]; then
              echo "web skipped: no frontend, API or build inputs changed"
              web=false
            fi
          fi
          printf 'docs_only=%s\ndeploy=%s\nbench=%s\nweb=%s\n' "$docs_only" "$deploy" "$bench" "$web" >> "$GITHUB_OUTPUT"

  # The checks of `just check-ci` that need neither a Go test run nor the frontend. A train or main also runs what
  # `just check` adds over `check-ci` (`docs`, `secrets`): workflow.yml does not run for the commits a train merges, and
  # two PRs whose docs pass alone can break a link together.
  static:
    needs: changes
    if: needs.changes.result == 'success' && !inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    permissions:
      contents: read
      issues: read # the issues the flaky list names
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the migrations check reads the base commit
      - uses: ./.github/actions/setup
        with:
          node: ${{ needs.changes.outputs.docs_only != 'true' }}
      # Each known-flaky test names an open issue; once the issue closes the entry must go (CONTRIBUTING.md「合并队列」)
      - run: python3 scripts/train.py flaky-check
        env:
          GH_TOKEN: ${{ github.token }}
      # A train adds `secrets`, which workflow.yml runs for a PR but nothing dispatches for a train.
      - if: needs.changes.outputs.docs_only == 'true'
        run: just md-checks ${{ github.event_name != 'pull_request' && 'secrets' || '' }}
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name == 'pull_request'
        run: just script-tests check-static
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: just docs check-static secrets
      # A PR or train is checked like a pull request from its base: merged migrations never change, and a schema does not
      # newly require a field that old nodes or pages lack during a rolling release. Main has no base.
      - if: env.BASE != ''
        run: just migrations "$BASE" && just api-compat "$BASE"

  # The Go tests only. `just test` depends on `web-embed`, the frontend the program embeds, so this job installs pnpm and
  # Node like the web job; the build is cached by content on the host (scripts/web_cache.py), as it was in the one job.
  # A pull request does not run it: the train runs it once for the batch, and finds the PR that broke it (2026-10-28,
  # owner: 「能优化则优化吧。甚至跳过」 — every PR's tests ran twice, once alone and once in its train).
  go-test:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && !inputs.gate_stress && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      # Keep disabling Ryuk in the same job that supplies its replacement cleanup; runner .env owns the cgroup.
      - name: Configure test container policy
        run: |
          echo "AXIOM_TEST_JOB=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
          if [ -n "${AXIOM_TEST_CGROUP_PARENT:-}" ]; then
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Clean test containers before tests
        run: bash scripts/ci/clean-test-containers.sh
      - uses: ./.github/actions/setup
      - run: just test
      - name: Clean test containers after tests
        if: always()
        run: bash scripts/ci/clean-test-containers.sh

  # Keep frontend checks parallel to the browser suite; neither waits for the other's build.
  web:
    needs: changes
    if: needs.changes.result == 'success' && (inputs.gate_stress || needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.web == 'true')
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run web checks in their network namespace
        run: bash scripts/ci/web-container.sh just web-checks
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # The web vitals are timings, so they run in a job of their own: one test at a time, with no other test on the
  # container's cores. Like e2e, not on a pull request.
  vitals:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && !inputs.gate_stress && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run the web vitals in their network namespace
        run: bash scripts/ci/web-container.sh just web-vitals
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: vitals-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # Each shard keeps the same eight-core container and four-worker rule (#297/#363). Like go-test, not on a pull request.
  e2e:
    name: e2e (${{ matrix.shard }}/${{ inputs.gate_stress && 1 || 2 }})
    needs: changes
    if: needs.changes.result == 'success' && (inputs.gate_stress || needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request')
    strategy:
      fail-fast: false # finish the other shard and keep its evidence when one fails
      matrix:
        shard: ${{ fromJSON(inputs.gate_stress && '[1]' || '[1,2]') }}
    env:
      E2E_SHARD_INDEX: ${{ matrix.shard }}
      E2E_SHARD_COUNT: ${{ inputs.gate_stress && 1 || 2 }}
      GATE_STRESS: ${{ inputs.gate_stress || false }}
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - uses: ./.github/actions/setup
      - name: Run e2e shard in its network namespace
        run: |
          bash scripts/ci/web-container.sh bash -e -c '
            if [ "$GATE_STRESS" = true ]; then
              gate=(e2e/gate.spec.ts -g "admin (price-publish|supplier-connect-details|account|model-name) ")
              pnpm --dir web exec playwright test "${gate[@]}" --list
            fi
            just web-e2e "$E2E_SHARD_INDEX/$E2E_SHARD_COUNT"
            if [ "$GATE_STRESS" = true ]; then
              AXIOM_VERSION=$(just axiom-version)
              export AXIOM_VERSION
              pnpm --dir web exec playwright test "${gate[@]}" \
                --repeat-each=50 --max-failures=1 --reporter=line
            fi
          '
      # A later checkout removes test-results on self-hosted runners; keep each shard's evidence separately.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: e2e-test-results-${{ matrix.shard }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Cancellation can stop the Docker client before the test process; remove only this attempt's container.
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup

  # One browser against a real node with PostgreSQL and Valkey (#321). The databases are started on the host (withcluster,
  # which needs Docker); the node and the browser run in the web container, so Chromium keeps its own network namespace
  # (#363) and reaches the databases through the host gateway. Like go-test and e2e, not on a pull request; a failure
  # keeps the browser's trace and the node's log.
  journey:
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.docs_only != 'true' && !inputs.gate_stress && github.event_name != 'pull_request'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend's version stamp comes from this tree's history
      - name: Configure test container policy
        run: |
          echo "AXIOM_TEST_JOB=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
          if [ -n "${AXIOM_TEST_CGROUP_PARENT:-}" ]; then
            echo "TESTCONTAINERS_RYUK_DISABLED=true" >> "$GITHUB_ENV"
          fi
      - name: Clean test containers before tests
        run: bash scripts/ci/clean-test-containers.sh
      - uses: ./.github/actions/setup
      - run: just web-embed
      - name: Run the journey in the web container
        run: go run ./internal/platform/pgtest/cmd/withcluster bash scripts/ci/web-container.sh pnpm --dir web journey
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: journey-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: bash scripts/ci/web-container.sh cleanup
      - name: Clean test containers after tests
        if: always()
        run: bash scripts/ci/clean-test-containers.sh

  # A train or main only: a PR's change cannot move a benchmark's allocation count without the train catching it, and
  # the comparison is 4-5 minutes of the PR's wall. On main every benchmark runs once under -race (`bench-once`); a
  # train compares allocations against its base, with the existing skip rule.
  bench:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.gate_stress &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.bench == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the comparison checks out the base commit
      - uses: ./.github/actions/setup
      - if: env.BASE == ''
        run: just bench-once
      - if: env.BASE != ''
        run: bash scripts/ci/bench-compare.sh "$BASE"

  # A train or main only, as for the benchmark: a deployment regression is caught by the train, which ejects the PR that
  # broke it (scripts/train.py). The skip rule is the one ci.yml always had: only files clearly outside the container.
  deploy:
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      !inputs.gate_stress &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.deploy == 'true'
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON_HEAVY || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the frontend and program versions use this tree's history
      - uses: ./.github/actions/setup
      - name: Rehearse train deployment
        if: github.ref != 'refs/heads/main'
        run: bash scripts/ci/deploy-check.sh
        timeout-minutes: 40
      - name: Build and rehearse release by digest
        if: github.ref == 'refs/heads/main'
        run: bash scripts/ci/release-check.sh
        timeout-minutes: 40
        env:
          RELEASE_DIR: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain release image and provenance
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; Node 24
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  # The required check, and the only name the ruleset knows. It runs even when a part failed, because a skipped required
  # check counts as passed on GitHub. Markdown-only builds may skip parts; PRs skip go-test/e2e/bench/deploy and may
  # skip web by path. Intentional skips still produce this required check.
  build:
    # Diagnostics publish a failed build: dispatch on main or a throwaway commit, never a PR head intended to merge.
    name: build
    needs: [changes, static, go-test, web, e2e, vitals, journey, bench, deploy]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      # GitHub accepts a skipped required check, so diagnostics must fail this check rather than skip it.
      - if: inputs.gate_stress
        run: |
          echo "gate-stress is a diagnostic; run the full build to satisfy the required check"
          exit 1
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "a job this build needs failed or was cancelled"
          exit 1
      # `needs.e2e.result` aggregates the whole matrix. Only Markdown-only builds and pull requests may skip its shards.
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.e2e.result }}' = success
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.vitals.result }}' = success
      - if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'pull_request'
        run: test '${{ needs.journey.result }}' = success
      - if: github.ref == 'refs/heads/main' && !inputs.gate_stress
        run: test '${{ needs.deploy.result }}' = success
      - run: echo "every required job passed; only optional jobs were skipped"

  gate-stress:
    name: gate-stress
    needs: [changes, web, e2e]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.gate_stress
    runs-on: ${{ fromJSON((inputs.base && vars.RUNS_ON_TRAIN) || vars.RUNS_ON || '"ubuntu-latest"') }}
    steps:
      - run: test '${{ needs.changes.result }}' = success && test '${{ needs.web.result }}' = success && test '${{ needs.e2e.result }}' = success

body{margin:0}
a{color:inherit;text-decoration:none}
.board{font-family:'Axiom Sans','Axiom CJK','PingFang SC',sans-serif;text-autospace:normal;line-break:strict;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text1);
  --bw:1px;--hair:var(--hair1x);--line:var(--line1x);--lineStrong:var(--lineStrong1x)}
@media (min-resolution:2dppx){.board{--bw:.5px;--hair:var(--hair2x);--line:var(--line2x);--lineStrong:var(--lineStrong2x)}}
.board *{box-sizing:border-box}
.board ::selection{background:var(--selection);color:var(--text1)}
.mono{font-family:'Axiom Mono','Axiom CJK',ui-monospace,monospace;font-weight:400}
.kern{margin-right:-.42em}
.ph{display:inline-block;white-space:nowrap}
.t12{font-size:12px;line-height:18px}
.dim{color:var(--text2)}
.c{text-align:center}
.board a:focus-visible,.board button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* breakpoints, as variables (in production: media queries) */
.vp-m{--margin:20px;--hdr:56px;--dsp:40px;--dlh:44px;--g1:16px;--g3:32px;--fg:16px}
.vp-t{--margin:40px;--hdr:72px;--dsp:64px;--dlh:68px;--g1:20px;--g3:40px;--fg:20px}
.vp-d{--margin:120px;--hdr:72px;--dsp:80px;--dlh:84px;--g1:20px;--g3:40px;--fg:20px;--hd:48px;--hlh:56px}

.frame{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.vp-d{height:1500px}
.vp-m{width:360px;height:780px;box-shadow:0 0 0 var(--bw) var(--hair)}
.vp-t{width:768px;height:1024px;box-shadow:0 0 0 var(--bw) var(--hair)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lens{position:relative;z-index:0;--li:-16px -32px;--lf:24px;--lv:var(--veil)}
.lens-sm{--li:-8px -12px;--lf:12px;--lv:var(--veilStrong)}
.lens::before{content:'';position:absolute;inset:var(--li);z-index:-1;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:var(--lv);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);mask-composite:intersect}
.vp-m .lens{--li:-12px -16px;--lf:16px}

.bar{position:absolute;top:0;left:0;right:0;height:var(--hdr);padding:0 var(--margin);display:flex;align-items:center;justify-content:space-between;z-index:3;font-size:16px;line-height:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;color:var(--text1)}
.nav{display:flex;align-items:center;gap:4px}
.mid{position:absolute;left:50%;translate:-50% 0}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:inherit;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.ghost:hover{background:var(--hover);color:var(--text1)}
.ghost:active{background:var(--press)}
.ghost.icon{width:36px;padding:0;color:var(--text1)}
.bar .ghost.icon{margin-right:-8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:8px;font-size:16px;line-height:26px;font-weight:500;white-space:nowrap;transition:background-color 250ms ease-out,color 250ms ease-out,box-shadow 250ms ease-out,opacity 250ms ease-out}
.btn.sm{height:36px;padding:0 14px}
.primary{background:var(--text1);color:var(--bg)}
.primary:hover{opacity:.88}
.primary:active{opacity:.8}
.outline{color:var(--text1);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.outline:hover{background:var(--hover);box-shadow:inset 0 0 0 var(--bw) var(--lineStrong)}
.outline:active{background:var(--press)}

.main{position:absolute;left:0;right:0;top:0;height:var(--fh,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--hdr) var(--margin) 0;text-align:center}
.vp-d .main{--fh:900px}
.main h1{margin:0;font-size:var(--dsp);line-height:var(--dlh);letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1)}
.lede{margin:var(--g1) 0 0;font-size:16px;line-height:26px;color:var(--text2)}
.cta{display:flex;gap:12px;margin-top:32px}
.vp-m .cta{flex-direction:column;align-self:stretch}
.vp-m .cta .btn{width:100%}
.fam{margin:var(--g3) 0 0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:var(--fg);row-gap:8px;font-size:12px;line-height:18px;letter-spacing:.04em;color:var(--text2)}

.s1{position:absolute;top:1020px;left:var(--margin);right:var(--margin);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.s1t{grid-column:1 / span 5;display:flex;flex-direction:column;align-items:flex-start}
.s1t h2{margin:0 0 24px;font-size:var(--hd);line-height:var(--hlh);letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1)}
.s1t p{margin:0;font-size:16px;line-height:26px;color:var(--text2)}
.s1t p + p{margin-top:16px}
.code{grid-column:7 / span 6;border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair)}
.tabs{display:flex;align-items:center;gap:2px;padding:6px;font-size:12px;line-height:18px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tab{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:6px;color:var(--text2)}
.tab.on{background:var(--press);color:var(--text1)}
.cpy{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.cpy:hover{background:var(--hover);color:var(--text1)}
.code pre{margin:0;padding:20px 24px;font-size:12px;line-height:22px;white-space:pre;overflow:hidden;color:var(--text2)}
.code .kw,.pop .kw{color:var(--text1)}

.gridov{position:absolute;top:0;bottom:0;left:120px;right:120px;z-index:4;pointer-events:none;grid-template-columns:repeat(12,1fr);column-gap:24px}
.gridov i{background:var(--gridc)}

.frames{display:flex;justify-content:center;gap:120px;padding:120px 0 0;align-items:flex-start;box-shadow:inset 0 var(--bw) 0 var(--hair)}
.flabel{margin-bottom:12px}

/* spec */
.spec{padding:120px 120px 160px}
.blk + .blk{margin-top:120px}
.spec h2{margin:0 0 24px;font-size:16px;line-height:26px;font-weight:500}
.spec h2.sub{margin-top:64px}
.cols{display:grid;gap:96px}
.c75{grid-template-columns:7fr 5fr}
.c11{grid-template-columns:1fr 1fr}
.gap-top{margin-top:64px}
.srow{display:grid;grid-template-columns:64px repeat(12,1fr);gap:4px;align-items:center}
.srow + .srow{margin-top:4px}
.urow{margin-bottom:8px}
.u{padding-top:8px;box-shadow:inset 0 var(--bw) 0 var(--line);color:var(--text1)}
.sw{height:36px;border-radius:6px;box-shadow:inset 0 0 0 var(--bw) var(--edge)}
.chip{display:inline-block;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 var(--bw) var(--edge);flex:none}
.tbl{font-size:12px;line-height:18px}
.tr{display:grid;align-items:center;column-gap:16px;min-height:40px;padding:8px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tr.th{min-height:0;padding:0 0 8px;color:var(--text2)}
.tr > span{display:flex;align-items:center;gap:8px;min-width:0}
.tk{display:flex;align-items:center;gap:8px}
.tk .mono + .chip{margin-left:12px}
.t-role .tr{grid-template-columns:96px 1fr}
.t-type .tr{grid-template-columns:repeat(7,1fr)}
.spec-i{display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:16px;padding:20px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.spec-i:first-child{padding-top:0}
.s-dsp{font-size:80px;line-height:84px;letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1);display:block}
.s-hd{font-size:48px;line-height:56px;letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1);display:block}
.s-body{font-size:16px;line-height:26px}
.t-grid .tr{grid-template-columns:repeat(7,1fr)}
.t-rhy .tr{grid-template-columns:1fr 120px 120px}
.t-comp .tr{grid-template-columns:96px 360px 88px 72px 72px 88px 1fr}
.t-edge .tr{grid-template-columns:72px 56px 1fr 1fr 1fr}
.t-sh .tr{grid-template-columns:72px 1fr 1fr}
.t-mo .tr{grid-template-columns:112px 56px 72px 1fr}
.space{display:flex;flex-direction:column;gap:8px}
.sp-i{display:grid;grid-template-columns:168px 1fr;align-items:center;gap:16px}
.sp-i i{display:block;height:12px;background:var(--cyanSolid);border-radius:0}
.radii{display:flex;gap:32px;align-items:flex-end}
.rd{display:flex;flex-direction:column;gap:6px}
.rd > i{display:block;width:56px;height:56px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-o{width:56px;height:56px;padding:6px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-i{width:100%;height:100%;border-radius:6px;background:var(--press)}
.code.mini{width:max-content}
.code.mini .tabs{box-shadow:none}
.pop{padding:12px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair),var(--popShadow);font-size:12px;line-height:20px;color:var(--text2);width:220px}


.cx .serif{font-family:'AX Serif','Axiom CJK',serif;font-weight:600;letter-spacing:-.01em}
.cx .sec{position:absolute;inset:0;z-index:1}
.cx .hd h2{margin:0;color:var(--text1)}
.cx .intro{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.cx .intro p{margin:0;font-size:16px;line-height:26px;color:var(--text2)}
.cx .more{display:inline-flex;align-items:center;gap:4px;color:var(--text1);text-decoration:none;transition:color 250ms ease-out}
.cx .more:hover{color:var(--accent)}
.cx .wires{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.cx .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* the card: what you change, and nothing else */
.cx .code{position:relative;border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair)}
.cx .ch{display:flex;align-items:center;height:40px;padding:0 6px 0 16px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.cx .fl{font-size:12px;line-height:18px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx .cpy{position:relative;margin-left:auto;flex:none}
.cx .cpy svg{transition:opacity 250ms ease-out}
.cx .cpy .ok{position:absolute;inset:7px;opacity:0;color:var(--okc)}
.cx .cpy[data-state=done] svg:first-child{opacity:0}
.cx .cpy[data-state=done] .ok{opacity:1}
.cx .code pre{margin:0;padding:12px 0;font-size:12px;line-height:22px;color:var(--text2);white-space:normal}
.cx .ln{display:grid;grid-template-columns:40px 16px 1fr;padding-right:24px;min-height:22px;white-space:pre;transition:background-color 250ms ease-out,opacity 250ms ease-out}
.cx .ln.off{display:none}
.cx .no{text-align:right;padding-right:12px;color:var(--text2);opacity:.45;user-select:none}
.cx .mk{color:transparent;user-select:none}
.cx .tx{min-width:0}
.cx .g{color:var(--accent)}
.cx .z{color:transparent}
.cx .adr{color:var(--accent)}
.cx .ln.cm{opacity:.7}
.cx .ln.ad,.cx .ln.rn{color:var(--text1)}
.cx .ln.n,.cx .ln.cm{opacity:.6}
.cx .ln.ad{background:var(--addBg)}
.cx .ln.ad .mk{color:var(--okc)}
/* a request passing through the address line */
.cx .ln.ad.pl{background:var(--passBg)}
.cx .kc{display:none;align-items:center;height:18px;padding:0 6px;margin:2px 0;border-radius:6px;vertical-align:top;background:var(--chipBg);color:var(--accent);
  font-family:'Axiom Sans','Axiom CJK',sans-serif;font-size:12px;line-height:18px;text-decoration:none;white-space:nowrap;transition:background-color 250ms ease-out,opacity 250ms ease-out}
.cx .kc.on{display:inline-flex}
.cx .kc.wait{display:inline-flex;opacity:0}
.cx .kc:hover{background:var(--chipHover)}
/* the models */
.cx .models{list-style:none;margin:0;padding:0;font-size:12px;line-height:22px}
.cx .md{color:var(--text2);cursor:default;transition:color 250ms ease-out;white-space:nowrap}
.cx .md.hit,.cx .md.hov{color:var(--text1)}
.cx .md.all .more{font-family:'Axiom Sans','Axiom CJK',sans-serif}
.cx button.tl{border:0;background:transparent;font:inherit;cursor:pointer;padding:0}


/* the cable from the config card to the machine's one input: drawn by the page, in the same tube language */
.cx .wire{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
.cx .cab-o{fill:none;stroke:var(--anatomy-hi);stroke-linecap:butt}
.cx .cab-i{fill:none;stroke:var(--anatomy-shade-2);stroke-linecap:butt}
.cx .cab-s{fill:none;stroke:var(--anatomy-top);stroke-linecap:butt}
.cx .cab-d{fill:none;stroke:var(--anatomy-shade-0);stroke-linecap:butt}
.cx .cpulse .t,.cx .pulse .t{fill:var(--anatomy-lit)}
.cx .cab-o{transition:stroke 250ms ease-out}
.cx .wire.hot .cab-o{stroke:var(--anatomy-lit)}
.cx .sock-b{fill:var(--anatomy-shade-1);stroke:var(--anatomy-mid);stroke-width:var(--bw)}
.cx .plg{fill:var(--anatomy-top);stroke:var(--anatomy-hi);stroke-width:var(--bw)}
.cx .wire.hot .plg{stroke:var(--anatomy-lit)}
.cx .cpulse .glow{fill:var(--anatomy-lit);opacity:.3;filter:blur(3px)}
.cx .cpulse .core{fill:var(--anatomy-lit)}
.cx .disp-glass{fill:var(--dispBg)}
.cx .disp-m,.cx .disp-v{font-family:'Axiom Mono',ui-monospace,monospace;fill:var(--dispInk)}
.cx .disp-v{fill:var(--dispDim);letter-spacing:.06em}
.cx .mod.on .mlamp .iso-fill,.cx .mod.on .mlamp .iso-shade,.cx .mod.on .mlamp .iso-top{fill:var(--anatomy-lit)}
.cx .mod.on .mlamp .iso-edge{stroke:var(--anatomy-lit)}
.cx .mod.on .vname .iso-face-text,.cx .dname.on .iso-face-text{fill:var(--anatomy-lit)}
.cx .mod.on > .iso-solid:first-child > .iso-edge{stroke:var(--anatomy-lit)}
.cx .ln.ad.pl{background:var(--passBg)}

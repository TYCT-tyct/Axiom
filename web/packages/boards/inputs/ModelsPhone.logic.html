  pf0 = () => this.pickFilter(0); pf1 = () => this.pickFilter(1); pf2 = () => this.pickFilter(2); pf3 = () => this.pickFilter(3); pf4 = () => this.pickFilter(4);
  rowHover(k) { const x = this.shown()[k]; if (!x) return; this.hold = true; this.select(x.i); }
  rl = () => { this.hold = false; };
  componentWillUnmount() { this.dead = true; clearInterval(this.tick); clearTimeout(this.ldT); if (this.io) this.io.disconnect(); if (this.r) this.r.destroy(); }
  renderVals() {
    const dark = this.dark(), T = themeOf(dark), s = T.s;
    const v = { ...s, vars: T.vars + `; --ok: ${s.grass9}; --warn: ${s.amber9}; --bad: ${s.tomato9}; --up: ${s.grass11}; --dn: ${s.tomato11}; --failText: ${s.tomato11}; --pickRing: ${dark ? 'rgba(0,162,199,0.32)' : 'rgba(0,162,199,0.22)'}`,
      glyph: T.glyph, ground: T.ground, seaFilter: T.seaFilter, tintMul: T.tintMul, tintBlend: T.tintBlend,
      setStage: this.setStage, setCanvas: this.setCanvas, setList: this.setList, setPanel: this.setPanel, setRoutes: this.setRoutes, setLeads: this.setLeads, setPick: this.setPick, rl: this.rl };
    // live numbers, written in like the entrance
    const st = this.state.st, tk = Math.floor((st || 0) / 50);
    const dec = (txt, t) => { if (t == null) return txt; const n = Math.floor((t / 620) * (txt.length + 3)); return [...txt].map((c, i) => (i < n ? c : (i < n + 3 && c !== ' ' ? GLYPHS[Math.floor(hash(i, tk) * GLYPHS.length)] : (c === ' ' ? ' ' : ' ')))).join(''); };
    v.s0 = dec(String(STATS.models), st); v.s1 = dec(STATS.routes.toLocaleString('en-US'), st); v.s2 = dec(fmtTokens(this.state.tokens), st);
    for (let i = 0; i < FILTERS.length; i++) { v['f' + i] = i === this.state.filter ? 'on' : ''; v['fs' + i] = i === this.state.filter ? 'true' : 'false'; v['pf' + i] = this['pf' + i]; }
    // the list
    const list = this.shown();
    for (let k = 0; k < NR; k++) {
      const x = list[k], p = 'r' + k;
      v['rh' + k] = this['rh' + k] || (this['rh' + k] = () => this.rowHover(k));
      if (!x) { Object.assign(v, { [p + 'c']: 'off', [p + 'n']: '', [p + 'p']: '', [p + 'd']: '', [p + 'r']: '', [p + 't']: '', [p + 'tc']: '' }); continue; }
      const m = x.m, low = Math.min(...m.routes.map((r) => r.in));
      v[p + 'c'] = x.i === this.state.sel ? 'on' : ''; v[p + 'n'] = m.id; v[p + 'p'] = yuan(low); v[p + 'd'] = m.dev; v[p + 'r'] = m.routes.length + ' 条线路';
      v[p + 't'] = (m.trend > 0 ? '+' : '') + m.trend + '%'; v[p + 'tc'] = m.trend > 0 ? 'upc' : 'dnc';
    }
    // the panel for the selected model
    const m = MODELS[Math.max(0, this.state.sel)], pick = this.pickOf(m, this.state.down), mx = Math.max(...m.routes.map((r) => r.in));
    const mt = this.state.mt, mtk = Math.floor((mt || 0) / 50), nm = m.id;
    const kk = mt == null ? Infinity : Math.floor((mt / 380) * (nm.length + 3)), a = Math.min(nm.length, kk), g = Math.max(0, Math.min(nm.length - a, kk + 3 - a));
    v.pmA = nm.slice(0, a); v.pmG = [...nm.slice(a, a + g)].map((c, i) => GLYPHS[Math.floor(hash(a + i, mtk) * GLYPHS.length)]).join(''); v.pmC = nm.slice(a + g);
    v.pDev = m.dev; v.pCtx = m.ctx; v.pMax = m.max;
    for (let j = 0; j < NROUTE; j++) {
      const r = m.routes[j], p = 'u' + j;
      if (!r) { Object.assign(v, { [p + 'c']: 'off', [p + 'n']: '', [p + 'a']: '', [p + 'b']: '', [p + 'w']: '0%', [p + 't']: '', [p + 'u']: '' }); for (let q = 0; q < NT; q++) v[`q${j}_${q}`] = ''; continue; }
      const down = j === this.state.down;
      v[p + 'c'] = (j === pick ? 'chosen' : '') + (down ? ' down' : '');
      v[p + 'n'] = r.n; v[p + 'a'] = yuan(r.in); v[p + 'b'] = yuan(r.out); v[p + 'w'] = Math.round((r.in / mx) * 100) + '%';
      v[p + 't'] = down ? '超时' : r.ttft.toFixed(2) + 's'; v[p + 'u'] = r.up.toFixed(2) + '%';
      for (let q = 0; q < NT; q++) v[`q${j}_${q}`] = q === NT - 1 && down ? 'x' : (['', 'w', 'x'][r.ticks[q]]);
    }
    const pr = m.routes[pick];
    if (this.state.fail != null) {
      v.pickCls = 'fail'; v.pkA = '已切换到'; v.pkR = pr.n; v.pkB = `线路 ${m.routes[this.state.fail].n} 超时，请求已自动重试`;
    } else {
      v.pickCls = ''; v.pkA = '当前选择'; v.pkR = pr.n;
      const cheapest = m.routes.every((r) => r.in >= pr.in);
      v.pkB = (cheapest ? '价格最低' : '达标线路里价格最低') + `，7 天可用率 ${pr.up.toFixed(2)}%`;
    }
    v.say = `${m.id}，当前选择线路 ${pr.n}`;
    const now = new Date(); v.upd = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
    return v;
  }
}

body{margin:0}
a{color:inherit;text-decoration:none}
.board{font-family:'Axiom Sans','Axiom CJK','PingFang SC',sans-serif;text-autospace:normal;line-break:strict;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text1);
  --bw:1px;--hair:var(--hair1x);--line:var(--line1x);--lineStrong:var(--lineStrong1x)}
@media (min-resolution:2dppx){.board{--bw:.5px;--hair:var(--hair2x);--line:var(--line2x);--lineStrong:var(--lineStrong2x)}}
.board *{box-sizing:border-box}
.board ::selection{background:var(--selection);color:var(--text1)}
.mono{font-family:'Axiom Mono','Axiom CJK',ui-monospace,monospace;font-weight:400}
.kern{margin-right:-.42em}
.ph{display:inline-block;white-space:nowrap}
.t12{font-size:12px;line-height:18px}
.dim{color:var(--text2)}
.c{text-align:center}
.board a:focus-visible,.board button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* breakpoints, as variables (in production: media queries) */
.vp-m{--margin:20px;--hdr:56px;--dsp:40px;--dlh:44px;--g1:16px;--g3:32px;--fg:16px}
.vp-t{--margin:40px;--hdr:72px;--dsp:64px;--dlh:68px;--g1:20px;--g3:40px;--fg:20px}
.vp-d{--margin:120px;--hdr:72px;--dsp:80px;--dlh:84px;--g1:20px;--g3:40px;--fg:20px;--hd:48px;--hlh:56px}

.frame{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.vp-d{height:1500px}
.vp-m{width:360px;height:780px;box-shadow:0 0 0 var(--bw) var(--hair)}
.vp-t{width:768px;height:1024px;box-shadow:0 0 0 var(--bw) var(--hair)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lens{position:relative;z-index:0;--li:-16px -32px;--lf:24px;--lv:var(--veil)}
.lens-sm{--li:-8px -12px;--lf:12px;--lv:var(--veilStrong)}
.lens::before{content:'';position:absolute;inset:var(--li);z-index:-1;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:var(--lv);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);mask-composite:intersect}
.vp-m .lens{--li:-12px -16px;--lf:16px}

.bar{position:absolute;top:0;left:0;right:0;height:var(--hdr);padding:0 var(--margin);display:flex;align-items:center;justify-content:space-between;z-index:3;font-size:16px;line-height:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;color:var(--text1)}
.nav{display:flex;align-items:center;gap:4px}
.mid{position:absolute;left:50%;translate:-50% 0}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:inherit;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.ghost:hover{background:var(--hover);color:var(--text1)}
.ghost:active{background:var(--press)}
.ghost.icon{width:36px;padding:0;color:var(--text1)}
.bar .ghost.icon{margin-right:-8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:8px;font-size:16px;line-height:26px;font-weight:500;white-space:nowrap;transition:background-color 250ms ease-out,color 250ms ease-out,box-shadow 250ms ease-out,opacity 250ms ease-out}
.btn.sm{height:36px;padding:0 14px}
.primary{background:var(--text1);color:var(--bg)}
.primary:hover{opacity:.88}
.primary:active{opacity:.8}
.outline{color:var(--text1);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.outline:hover{background:var(--hover);box-shadow:inset 0 0 0 var(--bw) var(--lineStrong)}
.outline:active{background:var(--press)}

.main{position:absolute;left:0;right:0;top:0;height:var(--fh,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--hdr) var(--margin) 0;text-align:center}
.vp-d .main{--fh:900px}
.main h1{margin:0;font-size:var(--dsp);line-height:var(--dlh);letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1)}
.lede{margin:var(--g1) 0 0;font-size:16px;line-height:26px;color:var(--text2)}
.cta{display:flex;gap:12px;margin-top:32px}
.vp-m .cta{flex-direction:column;align-self:stretch}
.vp-m .cta .btn{width:100%}
.fam{margin:var(--g3) 0 0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:var(--fg);row-gap:8px;font-size:12px;line-height:18px;letter-spacing:.04em;color:var(--text2)}

.s1{position:absolute;top:1020px;left:var(--margin);right:var(--margin);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.s1t{grid-column:1 / span 5;display:flex;flex-direction:column;align-items:flex-start}
.s1t h2{margin:0 0 24px;font-size:var(--hd);line-height:var(--hlh);letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1)}
.s1t p{margin:0;font-size:16px;line-height:26px;color:var(--text2)}
.s1t p + p{margin-top:16px}
.code{grid-column:7 / span 6;border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair)}
.tabs{display:flex;align-items:center;gap:2px;padding:6px;font-size:12px;line-height:18px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tab{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:6px;color:var(--text2)}
.tab.on{background:var(--press);color:var(--text1)}
.cpy{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.cpy:hover{background:var(--hover);color:var(--text1)}
.code pre{margin:0;padding:20px 24px;font-size:12px;line-height:22px;white-space:pre;overflow:hidden;color:var(--text2)}
.code .kw,.pop .kw{color:var(--text1)}

.gridov{position:absolute;top:0;bottom:0;left:120px;right:120px;z-index:4;pointer-events:none;grid-template-columns:repeat(12,1fr);column-gap:24px}
.gridov i{background:var(--gridc)}

.frames{display:flex;justify-content:center;gap:120px;padding:120px 0 0;align-items:flex-start;box-shadow:inset 0 var(--bw) 0 var(--hair)}
.flabel{margin-bottom:12px}

/* spec */
.spec{padding:120px 120px 160px}
.blk + .blk{margin-top:120px}
.spec h2{margin:0 0 24px;font-size:16px;line-height:26px;font-weight:500}
.spec h2.sub{margin-top:64px}
.cols{display:grid;gap:96px}
.c75{grid-template-columns:7fr 5fr}
.c11{grid-template-columns:1fr 1fr}
.gap-top{margin-top:64px}
.srow{display:grid;grid-template-columns:64px repeat(12,1fr);gap:4px;align-items:center}
.srow + .srow{margin-top:4px}
.urow{margin-bottom:8px}
.u{padding-top:8px;box-shadow:inset 0 var(--bw) 0 var(--line);color:var(--text1)}
.sw{height:36px;border-radius:6px;box-shadow:inset 0 0 0 var(--bw) var(--edge)}
.chip{display:inline-block;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 var(--bw) var(--edge);flex:none}
.tbl{font-size:12px;line-height:18px}
.tr{display:grid;align-items:center;column-gap:16px;min-height:40px;padding:8px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tr.th{min-height:0;padding:0 0 8px;color:var(--text2)}
.tr > span{display:flex;align-items:center;gap:8px;min-width:0}
.tk{display:flex;align-items:center;gap:8px}
.tk .mono + .chip{margin-left:12px}
.t-role .tr{grid-template-columns:96px 1fr}
.t-type .tr{grid-template-columns:repeat(7,1fr)}
.spec-i{display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:16px;padding:20px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.spec-i:first-child{padding-top:0}
.s-dsp{font-size:80px;line-height:84px;letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1);display:block}
.s-hd{font-size:48px;line-height:56px;letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1);display:block}
.s-body{font-size:16px;line-height:26px}
.t-grid .tr{grid-template-columns:repeat(7,1fr)}
.t-rhy .tr{grid-template-columns:1fr 120px 120px}
.t-comp .tr{grid-template-columns:96px 360px 88px 72px 72px 88px 1fr}
.t-edge .tr{grid-template-columns:72px 56px 1fr 1fr 1fr}
.t-sh .tr{grid-template-columns:72px 1fr 1fr}
.t-mo .tr{grid-template-columns:112px 56px 72px 1fr}
.space{display:flex;flex-direction:column;gap:8px}
.sp-i{display:grid;grid-template-columns:168px 1fr;align-items:center;gap:16px}
.sp-i i{display:block;height:12px;background:var(--cyanSolid);border-radius:0}
.radii{display:flex;gap:32px;align-items:flex-end}
.rd{display:flex;flex-direction:column;gap:6px}
.rd > i{display:block;width:56px;height:56px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-o{width:56px;height:56px;padding:6px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-i{width:100%;height:100%;border-radius:6px;background:var(--press)}
.code.mini{width:max-content}
.code.mini .tabs{box-shadow:none}
.pop{padding:12px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair),var(--popShadow);font-size:12px;line-height:20px;color:var(--text2);width:220px}


.fx .serif{font-family:'AX Serif','Axiom CJK',serif;font-weight:600;letter-spacing:-.01em}
.fx .sec{position:absolute;inset:0;z-index:1}
.fx h2{margin:0;color:var(--text1)}
.fx .t1{color:var(--text1)}
.fx .ac{color:var(--accent)}
.fx .r{text-align:right;justify-self:end}
.fx .hd{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
.fx .links{display:flex;gap:24px}
.fx .links a,.fx .lk{display:inline-flex;align-items:center;gap:6px;color:var(--text1);text-decoration:underline;text-decoration-thickness:var(--bw);text-underline-offset:4px;text-decoration-color:var(--line2x);transition:text-decoration-color 250ms ease-out}
.fx .links a{font-size:16px;line-height:26px}
.fx .links a:hover,.fx .lk:hover{text-decoration-color:var(--text1)}
.fx .q{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:16px;width:100%;cursor:pointer;font-size:16px;line-height:26px;color:var(--text2);transition:color 250ms ease-out}
.fx .q:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;border-radius:6px}
.fx .q:hover,.fx .q.on,.fx .fq.on .q{color:var(--text1)}
.fx .qn{flex:none;width:20px;font-size:12px;line-height:18px;color:var(--text2);transition:color 250ms ease-out}
.fx .q.on .qn,.fx .fq.on .qn{color:var(--accent)}
.fx .qq{flex:1;min-width:0}
.fx .ans{margin:0;font-size:16px;line-height:26px;color:var(--text1);text-wrap:pretty}

/* the window: a small piece of the product, 12px inside */
.fx .win{width:100%;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line),var(--winShadow);font-size:12px;line-height:18px;color:var(--text2);overflow:hidden}
.fx .wh{display:flex;align-items:center;height:32px;padding:0 12px;color:var(--text2);box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair);white-space:nowrap;overflow:hidden}
.fx .wb{display:flex;flex-direction:column;gap:8px;padding:16px}
.fx .wf,.fx .wr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fx .wf{margin-top:4px}
.fx .tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;background:var(--hover);color:var(--text1);white-space:nowrap}
.fx .tag.of{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 var(--bw) var(--accent)}
.fx .chs{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px}
.fx .cl{display:flex;white-space:nowrap;overflow:hidden;color:var(--text1)}
.fx .cm{color:var(--text2)}
.fx .rt{display:grid;grid-template-columns:32px 1fr auto;align-items:center;height:28px}
.fx .rth{height:auto;padding-bottom:6px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.fx .tg{position:relative;width:28px;height:16px;border-radius:8px;background:var(--line2x)}
.fx .tg i{position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--bg)}
.fx .fm{display:grid;grid-template-columns:32px 1fr 64px 64px;row-gap:8px;column-gap:8px;align-items:center}
.fx .fm.sum{grid-template-columns:1fr auto;margin-top:2px;padding-top:10px;box-shadow:inset 0 var(--bw) 0 var(--hair)}
.fx .big{font-size:16px;line-height:26px}
.fx .lg{display:grid;grid-template-columns:60px 1fr 52px 52px;column-gap:8px;white-space:nowrap;align-items:center;height:24px}
.fx .lgh{height:auto;padding-bottom:6px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.fx .w4 .wf{justify-content:flex-start}
.fx .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.fx .ky{display:grid;grid-template-columns:1fr 56px 64px;align-items:center;height:32px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 var(--bw) var(--line)}
.fx .ky.gone{box-shadow:none;background:var(--hover)}
.fx .ky.gone span:first-child{text-decoration:line-through}
.fx .kv{display:flex;align-items:center;justify-content:space-between;height:32px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.fx .kv:last-of-type{box-shadow:none}
.fx s{text-decoration-thickness:var(--bw)}
.fx .fan,.fx .stp{display:block;max-width:100%;overflow:visible}
.fx .fan .fb{fill:var(--bg);stroke:var(--line);stroke-width:var(--bw)}
.fx .fan .fb.ax{stroke:var(--accent)}
.fx .fan .ft{fill:var(--text2);font-size:12px;transition:fill 250ms ease-out}
.fx .fan .ft.mono{font-family:'Axiom Mono','Axiom CJK',monospace}
.fx .fan .ft.t1,.fx .fan .ft.on{fill:var(--text1)}
.fx .fan .fp{fill:none;stroke:var(--line);stroke-width:var(--bw);transition:stroke 250ms ease-out}
.fx .fan .fp.on{stroke:var(--accent)}
.fx .fan .fd{fill:var(--line2x);transition:fill 250ms ease-out}
.fx .fan .fd.on{fill:var(--accent)}
.fx .stp .sg{stroke:var(--hair);stroke-width:var(--bw);stroke-dasharray:2 3}
.fx .stp .sp{fill:none;stroke:var(--line2x);stroke-width:var(--bw)}
.fx .stp .sp.on{stroke:var(--accent)}
.fx .stp .sd{fill:var(--accent)}
/* what happens a beat after the answer shows: the retry, the new key, the new price */
@keyframes fxIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes fxFade{from{opacity:0}to{opacity:1}}
.fx .on .late{animation:fxFade 250ms ease-out 500ms both}
.fx .on .late2{animation:fxIn 250ms ease-out 850ms both}
.fx .pane.on .ans{animation:fxIn 250ms ease-out 200ms both}
.fx .pane.on .win{animation:fxIn 250ms ease-out 280ms both}
@media (prefers-reduced-motion: reduce){.fx .late,.fx .late2,.fx .ans,.fx .win{animation:none !important}}

/* ---- desktop: questions left, answer card right; the chosen question's underline runs on into the card */
.d .sec{padding:120px 120px 0}
.d h2{font-size:48px;line-height:56px}
.d .bd{position:relative;display:grid;grid-template-columns:486px 588px;column-gap:126px;margin-top:56px}
.d .qs{position:relative;display:flex;flex-direction:column;margin-left:-16px}
.d .q{position:relative;z-index:1;height:48px;padding:0 48px 0 16px}
/* the chosen question sits in a pill that slides between rows; its chevron points at the card */
.d .pill{position:absolute;left:0;right:0;top:0;height:48px;border-radius:8px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line);transition:transform 250ms ease-out;pointer-events:none}
.d .patch{position:absolute;left:0;top:0;z-index:3;overflow:visible;pointer-events:none}
.d .patch .pad{fill:var(--line2x);transition:fill 250ms ease-out}
.d .patch .pad.on{fill:var(--accent)}
.d .patch .ring{fill:none;stroke:var(--accent);stroke-width:var(--bw);opacity:.6}
.d .patch .tr{fill:none;stroke:var(--accent);stroke-width:var(--bw);opacity:var(--trO)}
.d .patch .pu{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round;filter:var(--glow)}
.d .patch .sock{fill:var(--panel);stroke:var(--accent);stroke-width:var(--bw)}
.d .patch .sockc{fill:var(--accent)}
.d .card{position:relative;height:433px;border-radius:12px;background:var(--panel);overflow:hidden}
.d .card::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--bw) var(--hair);pointer-events:none;z-index:2}
.d .pane{display:none;position:absolute;inset:0;flex-direction:column}
.d .pane.on{display:flex}
.d .pane .ans{padding:28px 32px 0;max-width:524px}
/* the stage: an engineering dot grid that fades out toward the edges, the window sits on it */
.d .stage{position:relative;margin-top:auto;height:288px;display:flex;align-items:center;justify-content:center;background:var(--bg);box-shadow:inset 0 var(--bw) 0 var(--hair)}
.d .stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,var(--dotc) 0.75px,transparent 1px);background-size:12px 12px;background-position:6px 6px;-webkit-mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 70% 75% at 50% 50%,#000 30%,transparent 100%)}
.d .win{position:relative;width:440px}

/* ---- tablet and phone: an accordion; the open answer carries its window */
.t .sec,.m .sec{display:flex;flex-direction:column}
.t .fq,.m .fq{position:relative;border-radius:0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair);transition:margin 250ms ease-out,background-color 250ms ease-out,box-shadow 250ms ease-out}
/* the open question becomes a card: question, answer, then the window on its own ground at the bottom */
.t .fq.on,.m .fq.on{border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:none}
.t .fq.on::after,.m .fq.on::after{content:'';position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 var(--bw) var(--line);pointer-events:none;z-index:2}
.t .fq:has(+ .fq.on),.m .fq:has(+ .fq.on){box-shadow:none}
.t .q,.m .q{min-height:56px;padding:15px 0;color:var(--text1);transition:padding 250ms ease-out}
.t .qi,.m .qi{flex:none;display:inline-flex;color:var(--text2);transition:transform 250ms ease-out,color 250ms ease-out}
.t .fq.on .qi,.m .fq.on .qi{transform:rotate(180deg);color:var(--text1)}
.t .fqa,.m .fqa{display:grid;grid-template-rows:0fr;transition:grid-template-rows 250ms ease-out}
.t .fqa>div,.m .fqa>div{overflow:hidden}
.t .fq.on .fqa,.m .fq.on .fqa{grid-template-rows:1fr}
.t .ans,.m .ans{color:var(--text2)}
.t .fq.on .fin,.m .fq.on .fin{animation:fxFade 250ms ease-out both}
.t .fin,.m .fin{display:flex;flex-direction:column}
.t .stage,.m .stage{position:relative;background:var(--bg);box-shadow:inset 0 var(--bw) 0 var(--hair)}

.t .sec{padding:96px 40px 0;gap:40px}
.t h2{font-size:40px;line-height:48px}
.t .fq.on{margin:8px -20px}
.t .fq.on .q{padding-left:20px;padding-right:20px}
.t .ans{padding:0 20px 24px 56px;max-width:580px}
.t .stage{padding:32px 0;display:flex;justify-content:center}
.t .stage::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,var(--dotc) 0.75px,transparent 1px);background-size:12px 12px;background-position:6px 6px;-webkit-mask-image:radial-gradient(ellipse 70% 80% at 50% 50%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 70% 80% at 50% 50%,#000 30%,transparent 100%)}
.t .win{position:relative;width:420px}

.m .sec{padding:64px 20px 0;gap:32px}
.m .hd{flex-direction:column;align-items:flex-start;gap:12px}
.m h2{font-size:28px;line-height:36px}
.m .fq.on{margin:8px -12px}
.m .fq.on .q{padding-left:12px;padding-right:12px}
.m .ans{padding:0 12px 20px 48px}
.m .win{border-radius:0;background:transparent;box-shadow:none}
.m .wh{padding:0 12px}
.m .wb{padding:12px 12px 16px}
.m .fm{grid-template-columns:32px 1fr 64px}
.m .fm .x{display:none}

body{margin:0}
a{color:inherit;text-decoration:none}
.board{font-family:'Axiom Sans','Axiom CJK','PingFang SC',sans-serif;text-autospace:normal;line-break:strict;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--text1);
  --bw:.5px;--hair:var(--hair1x);--line:var(--line1x);--lineStrong:var(--lineStrong1x)}
@media (min-resolution:2dppx){.board{--bw:.5px;--hair:var(--hair2x);--line:var(--line2x);--lineStrong:var(--lineStrong2x)}}
.board *{box-sizing:border-box}
.board ::selection{background:var(--selection);color:var(--text1)}
.mono{font-family:'Axiom Mono','Axiom CJK',ui-monospace,monospace;font-weight:400}
.kern{margin-right:-.42em}
.ph{display:inline-block;white-space:nowrap}
.t12{font-size:12px;line-height:18px}
.dim{color:var(--text2)}
.c{text-align:center}
.board a:focus-visible,.board button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* breakpoints, as variables (in production: media queries) */
.vp-m{--margin:20px;--hdr:56px;--dsp:40px;--dlh:44px;--g1:16px;--g3:32px;--fg:16px}
.vp-t{--margin:40px;--hdr:72px;--dsp:64px;--dlh:68px;--g1:20px;--g3:40px;--fg:20px}
.vp-d{--margin:120px;--hdr:72px;--dsp:80px;--dlh:84px;--g1:20px;--g3:40px;--fg:20px;--hd:48px;--hlh:56px}

.frame{position:relative;overflow:hidden;isolation:isolate;background:var(--bg)}
.vp-d{height:1500px}
.vp-m{width:360px;height:780px;box-shadow:0 0 0 var(--bw) var(--hair)}
.vp-t{width:768px;height:1024px;box-shadow:0 0 0 var(--bw) var(--hair)}
.layer{position:absolute;inset:0;pointer-events:none}
.layer canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.lens{position:relative;z-index:0;--li:-16px -32px;--lf:24px;--lv:var(--veil)}
.lens-sm{--li:-8px -12px;--lf:12px;--lv:var(--veilStrong)}
.lens::before{content:'';position:absolute;inset:var(--li);z-index:-1;pointer-events:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);background:var(--lv);
  -webkit-mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent),linear-gradient(to bottom,transparent,#000 var(--lf),#000 calc(100% - var(--lf)),transparent);mask-composite:intersect}
.vp-m .lens{--li:-12px -16px;--lf:16px}

.bar{position:absolute;top:0;left:0;right:0;height:var(--hdr);padding:0 var(--margin);display:flex;align-items:center;justify-content:space-between;z-index:3;font-size:16px;line-height:26px}
.brand{display:flex;align-items:center;gap:10px;font-weight:500;letter-spacing:-.01em;color:var(--text1)}
.nav{display:flex;align-items:center;gap:4px}
.mid{position:absolute;left:50%;translate:-50% 0}
.ghost{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 12px;border-radius:8px;border:0;background:transparent;font:inherit;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.ghost:hover{background:var(--hover);color:var(--text1)}
.ghost:active{background:var(--press)}
.ghost.icon{width:36px;padding:0;color:var(--text1)}
.bar .ghost.icon{margin-right:-8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:8px;font-size:16px;line-height:26px;font-weight:500;white-space:nowrap;transition:background-color 250ms ease-out,color 250ms ease-out,box-shadow 250ms ease-out,opacity 250ms ease-out}
.btn.sm{height:36px;padding:0 14px}
.primary{background:var(--text1);color:var(--bg)}
.primary:hover{opacity:.88}
.primary:active{opacity:.8}
.outline{color:var(--text1);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.outline:hover{background:var(--hover);box-shadow:inset 0 0 0 var(--bw) var(--lineStrong)}
.outline:active{background:var(--press)}

.main{position:absolute;left:0;right:0;top:0;height:var(--fh,100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--hdr) var(--margin) 0;text-align:center}
.vp-d .main{--fh:900px}
.main h1{margin:0;font-size:var(--dsp);line-height:var(--dlh);letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1)}
.lede{margin:var(--g1) 0 0;font-size:16px;line-height:26px;color:var(--text2)}
.cta{display:flex;gap:12px;margin-top:32px}
.vp-m .cta{flex-direction:column;align-self:stretch}
.vp-m .cta .btn{width:100%}
.fam{margin:var(--g3) 0 0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:var(--fg);row-gap:8px;font-size:12px;line-height:18px;letter-spacing:.04em;color:var(--text2)}

.s1{position:absolute;top:1020px;left:var(--margin);right:var(--margin);display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px;align-items:start}
.s1t{grid-column:1 / span 5;display:flex;flex-direction:column;align-items:flex-start}
.s1t h2{margin:0 0 24px;font-size:var(--hd);line-height:var(--hlh);letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1)}
.s1t p{margin:0;font-size:16px;line-height:26px;color:var(--text2)}
.s1t p + p{margin-top:16px}
.code{grid-column:7 / span 6;border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair)}
.tabs{display:flex;align-items:center;gap:2px;padding:6px;font-size:12px;line-height:18px;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tab{height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:6px;color:var(--text2)}
.tab.on{background:var(--press);color:var(--text1)}
.cpy{margin-left:auto;width:28px;height:28px;border:0;border-radius:6px;display:grid;place-items:center;background:transparent;color:var(--text2);cursor:pointer;transition:background-color 250ms ease-out,color 250ms ease-out}
.cpy:hover{background:var(--hover);color:var(--text1)}
.code pre{margin:0;padding:20px 24px;font-size:12px;line-height:22px;white-space:pre;overflow:hidden;color:var(--text2)}
.code .kw,.pop .kw{color:var(--text1)}

.gridov{position:absolute;top:0;bottom:0;left:120px;right:120px;z-index:4;pointer-events:none;grid-template-columns:repeat(12,1fr);column-gap:24px}
.gridov i{background:var(--gridc)}

.frames{display:flex;justify-content:center;gap:120px;padding:120px 0 0;align-items:flex-start;box-shadow:inset 0 var(--bw) 0 var(--hair)}
.flabel{margin-bottom:12px}

/* spec */
.spec{padding:120px 120px 160px}
.blk + .blk{margin-top:120px}
.spec h2{margin:0 0 24px;font-size:16px;line-height:26px;font-weight:500}
.spec h2.sub{margin-top:64px}
.cols{display:grid;gap:96px}
.c75{grid-template-columns:7fr 5fr}
.c11{grid-template-columns:1fr 1fr}
.gap-top{margin-top:64px}
.srow{display:grid;grid-template-columns:64px repeat(12,1fr);gap:4px;align-items:center}
.srow + .srow{margin-top:4px}
.urow{margin-bottom:8px}
.u{padding-top:8px;box-shadow:inset 0 var(--bw) 0 var(--line);color:var(--text1)}
.sw{height:36px;border-radius:6px;box-shadow:inset 0 0 0 var(--bw) var(--edge)}
.chip{display:inline-block;width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 var(--bw) var(--edge);flex:none}
.tbl{font-size:12px;line-height:18px}
.tr{display:grid;align-items:center;column-gap:16px;min-height:40px;padding:8px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.tr.th{min-height:0;padding:0 0 8px;color:var(--text2)}
.tr > span{display:flex;align-items:center;gap:8px;min-width:0}
.tk{display:flex;align-items:center;gap:8px}
.tk .mono + .chip{margin-left:12px}
.t-role .tr{grid-template-columns:96px 1fr}
.t-type .tr{grid-template-columns:repeat(7,1fr)}
.spec-i{display:grid;grid-template-columns:96px 1fr;align-items:baseline;gap:16px;padding:20px 0;box-shadow:inset 0 calc(-1 * var(--bw)) 0 var(--hair)}
.spec-i:first-child{padding-top:0}
.s-dsp{font-size:80px;line-height:84px;letter-spacing:-.025em;font-weight:var(--hw);color:var(--text1);display:block}
.s-hd{font-size:48px;line-height:56px;letter-spacing:-.02em;font-weight:var(--hw);color:var(--text1);display:block}
.s-body{font-size:16px;line-height:26px}
.t-grid .tr{grid-template-columns:repeat(7,1fr)}
.t-rhy .tr{grid-template-columns:1fr 120px 120px}
.t-comp .tr{grid-template-columns:96px 360px 88px 72px 72px 88px 1fr}
.t-edge .tr{grid-template-columns:72px 56px 1fr 1fr 1fr}
.t-sh .tr{grid-template-columns:72px 1fr 1fr}
.t-mo .tr{grid-template-columns:112px 56px 72px 1fr}
.space{display:flex;flex-direction:column;gap:8px}
.sp-i{display:grid;grid-template-columns:168px 1fr;align-items:center;gap:16px}
.sp-i i{display:block;height:12px;background:var(--cyanSolid);border-radius:0}
.radii{display:flex;gap:32px;align-items:flex-end}
.rd{display:flex;flex-direction:column;gap:6px}
.rd > i{display:block;width:56px;height:56px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-o{width:56px;height:56px;padding:6px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--line)}
.nv-i{width:100%;height:100%;border-radius:6px;background:var(--press)}
.code.mini{width:max-content}
.code.mini .tabs{box-shadow:none}
.pop{padding:12px 14px;border-radius:12px;background:var(--panel);box-shadow:inset 0 0 0 var(--bw) var(--hair),var(--popShadow);font-size:12px;line-height:20px;color:var(--text2);width:220px}


.ax{font-family:'Axiom Sans','Axiom CJK','PingFang SC',sans-serif;font-size:14px;line-height:22px;color:var(--t1);background:var(--page);-webkit-font-smoothing:antialiased;font-feature-settings:'tnum' 1}
.ax .fr{position:relative;overflow:hidden;background:var(--page)}
.ax h1,.ax h2,.ax p{margin:0}
.ax h1{font-size:24px;line-height:32px;font-weight:500;letter-spacing:-.01em}
.ax h2{font-size:16px;line-height:24px;font-weight:500}
.ax p{color:var(--t2)}
.ax .mut{color:var(--t2)}
.ax .mono{font-family:'Axiom Mono','Axiom CJK',monospace;font-size:12px}
.ax .num{text-align:right;font-variant-numeric:tabular-nums}
.ax .t24{font-size:24px;line-height:32px;font-weight:500}
.ax .t16{font-size:16px;line-height:24px;font-weight:500}
.ax .t14{font-size:14px;line-height:22px}
.ax .t12{font-size:12px;line-height:18px}
.ax .m{font-family:'Axiom Mono',monospace;font-size:12px;color:var(--t2)}
.ax .dsb{padding:56px 64px}
.ax .dtop{margin-bottom:40px}
.ax .dtop p{margin-top:6px}
.ax .sec2{padding:40px 0 48px;box-shadow:inset 0 var(--bw) 0 var(--line)}
.ax .sec2.two{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.ax .bh{margin-bottom:20px}
.ax .bh p{margin-top:4px;font-size:12px;line-height:18px;max-width:560px}
/* palette */
.ax .pals{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ax .pal{padding:20px;border-radius:16px}
.ax .pal.light{background:#f9f9f8;color:#21201c;box-shadow:inset 0 0 0 var(--bw) rgba(0,0,0,.06)}
.ax .pal.dark{background:#111110;color:#eeeeec;box-shadow:inset 0 0 0 var(--bw) rgba(255,255,255,.06)}
.ax .pal.dark .m{color:#b5b3ad}
.ax .pal.light .m{color:#63635e}
.ax .palh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.ax .palh b{font-weight:500}
.ax .sws{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 10px}
.ax .swa{display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:18px}
.ax .swa i{display:block;height:40px;border-radius:8px;box-shadow:inset 0 0 0 var(--bw) rgba(127,127,127,.18);margin-bottom:6px}
.ax .chs{display:flex;align-items:center;gap:6px;margin-top:16px;font-size:12px}
.ax .chs span{margin-right:8px}
.ax .chs i{display:block;width:28px;height:12px;border-radius:4px}
.ax .rules{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:20px;font-size:12px;line-height:18px}
.ax .rules div{display:flex;flex-direction:column;gap:2px}
.ax .rules b{font-weight:500}
.ax .rules span{color:var(--t2)}
/* type + odometer */
.ax .ty{display:flex;flex-direction:column;gap:14px;margin-bottom:20px}
.ax .ty > div{display:grid;grid-template-columns:40px 1fr;align-items:baseline}
.ax .tl{font-size:12px;color:var(--t3)}
.ax .odo{display:inline-flex;align-items:flex-start;height:1.34em;line-height:1.34em;overflow:hidden;vertical-align:bottom;font-variant-numeric:tabular-nums}
.ax .dg{display:inline-block;width:1ch;height:1.34em;overflow:hidden;transition:width var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.ax .dg.z,.ax .sep.z{width:0;opacity:0}
.ax .sep{display:inline-block;overflow:hidden;width:.32em;transition:width var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.ax .ds{display:flex;flex-direction:column;transform:translateY(calc(var(--k) * -1.34em));transition:transform var(--dur) var(--ease);transition-delay:calc(var(--j) * 28ms)}
.ax .ds span{display:block;height:1.34em;text-align:center}
.ax .dec{display:inline-flex;font-size:12px;color:var(--t2);line-height:1.34em;margin-top:.12em}
.ax .dec .dg,.ax .dec .ds span{height:1.34em}
.ax .sp{display:flex;flex-direction:column;gap:8px}
.ax .sp div{display:flex;align-items:center;gap:12px}
.ax .sp i{display:block;height:10px;border-radius:3px;background:var(--accentSoft)}
/* icons */
.ax .ic{width:20px;height:20px;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ax .ic .f{opacity:0;fill:currentColor;stroke:currentColor;transition:opacity var(--dur) var(--ease)}
.ax .ic .o{transition:opacity var(--dur) var(--ease)}
.ax .ic g > *,.ax .ic .o *,.ax .ic .f *{transition:transform var(--dur) var(--easeB);transform-box:fill-box;transform-origin:center}
.ax .ics{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:24px}
.ax .icg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* ================================================================ v9: inside a workspace */

  transition:box-shadow var(--dur) var(--ease),background-color var(--dur) var(--ease)}
.ov .qstr:hover{background:var(--hover)}
.ov .qstr.on{box-shadow:inset 0 0 0 1.5px var(--wc);background:color-mix(in srgb,var(--wc) 6%,transparent)}
.ov .qsti{display:flex;align-items:center;justify-content:center;width:32px;height:32px;margin-bottom:6px;border-radius:8px;background:var(--hover);color:var(--t1)}
.ov .qsti svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ov .qsti .ic{width:18px;height:18px}
.ov .qstr.on .qsti{background:color-mix(in srgb,var(--wc) 16%,transparent);color:color-mix(in srgb,var(--wc) 85%,var(--t1))}
.ov .qstr b{font-size:14px;font-weight:500}
.ov .qstr > span{font-size:12px;line-height:18px;color:var(--t2)}
.ov .qstr em{margin-top:4px;font-style:normal;font-size:12px;color:var(--t3)}
.ov .qstck{position:absolute;top:14px;right:14px;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:var(--wc);color:#fff;opacity:0;transform:scale(0.6);transition:opacity 250ms var(--ease),transform 250ms var(--easeB)}
.ov .qstck .ic{width:12px;height:12px}
.ov .qstr.on .qstck{opacity:1;transform:none}
.ov .qchv:not(.on){display:none!important}
.ov .qchain{display:flex;align-items:stretch;gap:0;margin:6px 0 10px;padding:16px;border-radius:12px;background:var(--hover);overflow-x:auto;scrollbar-width:none}
.ov .qcn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;flex:none;min-width:96px;padding:10px 12px;border-radius:12px;background:var(--cardBg);box-shadow:var(--cardSh)}
.ov .qcn b{font-size:14px;font-weight:500;white-space:nowrap}
.ov .qcn span{font-size:12px;color:var(--t2);white-space:nowrap}
.ov .qcn > .ic{width:16px;height:16px;color:var(--t2)}
.ov .qcn.req{background:transparent;box-shadow:inset 0 0 0 var(--bw) var(--line2)}
.ov .qcn.end{background:color-mix(in srgb,var(--bad) 8%,var(--cardBg))}
.ov .qcn.end > .ic{color:var(--bad)}
.ov .qcni{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--wc) 16%,transparent);color:color-mix(in srgb,var(--wc) 85%,var(--t1));font-size:12px;font-style:normal}
.ov .qca{position:relative;display:flex;align-items:center;justify-content:center;flex:1;min-width:76px;padding:0 6px}
.ov .qca::before{content:'';position:absolute;left:6px;right:6px;top:50%;height:1.5px;background:repeating-linear-gradient(90deg,var(--t3) 0 4px,transparent 4px 7px);opacity:0.6}
.ov .qca::after{content:'';position:absolute;right:4px;top:calc(50% - 4px);border:4px solid transparent;border-left:5px solid var(--t3);opacity:0.6}
.ov .qca em{position:relative;padding:0 6px;font-style:normal;font-size:12px;color:var(--t3);background:var(--hover);white-space:nowrap}

/* ---- budget */
.ov .qbtop2{display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;align-items:center}
.ov .qgauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.ov .qgauge svg{width:220px;height:124px;overflow:visible}
.ov .qgauge path{fill:none;stroke-width:14;stroke-linecap:round}
.ov .qgauge .tr{stroke:var(--hover)}
.ov .qgauge .pj{stroke:color-mix(in srgb,var(--wc) 28%,transparent)}
.ov .qgauge .fg{stroke:var(--wc)}
.ov .qgauge .mk{fill:var(--cardBg);stroke:color-mix(in srgb,var(--wc) 60%,var(--t1));stroke-width:2.5}
.ov .qgv{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:-58px}
.ov .qgv span{font-size:12px;color:var(--t2)}
.ov .qgl2{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--t2)}
.ov .qgl2 span{display:inline-flex;align-items:center;gap:6px}
.ov .qgl2 i{width:10px;height:4px;border-radius:2px}
.ov .qgl2 i.fg{background:var(--wc)}
.ov .qgl2 i.pj{background:color-mix(in srgb,var(--wc) 28%,transparent)}
.ov .qbrows .qrow:first-child{padding-top:0}
.ov .qcps{display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:none;padding:2px}
.ov .qcp{display:flex;flex-direction:column;gap:4px;flex:1;min-width:128px;padding:14px;border-radius:12px;background:var(--hover)}
.ov .qcp b{font-size:14px;font-weight:500}
.ov .qcp > span:last-child{font-size:12px;line-height:18px;color:var(--t2)}
.ov .qcpi{display:flex;align-items:center;justify-content:center;width:28px;height:28px;margin-bottom:4px;border-radius:8px;background:var(--cardBg);box-shadow:var(--sh1);color:var(--t1)}
.ov .qcpi .ic{width:15px;height:15px}
.ov .qcp.ok .qcpi{color:var(--ok)}
.ov .qcp.warn{background:color-mix(in srgb,var(--warn) 11%,transparent)}
.ov .qcp.warn .qcpi{color:var(--warnT)}
.ov .qcp.end{background:color-mix(in srgb,var(--wc) 10%,transparent)}
.ov .qcpa{position:relative;flex:none;width:22px}
.ov .qcpa::after{content:'';position:absolute;left:5px;top:calc(50% - 5px);border:5px solid transparent;border-left:7px solid var(--line2)}

@container ov (max-width: 600px){
  .ov .qlivec{grid-template-columns:minmax(0,1fr);gap:16px;padding:16px}
  .ov .qlvs{gap:18px;flex-wrap:wrap}
  .ov .qg2w{grid-template-columns:minmax(0,1fr)}
  .ov .qch2{padding-left:24px}
  .ov .qltb{flex-wrap:wrap}
  .ov .qsrch{flex:1 1 100%}
  .ov .qltb .qchips{flex:1 1 auto;overflow-x:auto}

  .ov .qcpa{width:auto;height:16px}

/* ================================================================ v10: personal is flat, the team is a preview */
/* what shows where: P personal, S team, W team workspace, M me */
.ov .lvP :is(.onW,.onM,.onSM,.onS2){display:none!important}
.ov .lvS :is(.onPW,.onP),.ov .lvW :is(.onP,.onS2),.ov .lvW .notW{display:none!important}
.ov .lvM.spT :is(.onPW,.onP),.ov .lvM.spP .onS2{display:none!important}

/* the sidebar: personal and team sit side by side, so switching fades vertically; going deeper slides sideways */
.ov .lvP .pnP{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:transform 250ms var(--ease),opacity 250ms var(--ease) 90ms,visibility 0s}
.ov .lvM .pnP{transform:translateX(-40px)}
.ov .lvS .pnP,.ov .lvW .pnP{transform:translateY(-10px)}
.ov .lvP .pnS,.ov .lvP .pnW{transform:translateY(10px)}
.ov .lvP .pnM{transform:translateX(40px)}

/* personal has no workspace colour: it uses the product accent */
.ov .spP{--wc:var(--accentSolid)}

/* account menu: the team edition is not open yet */
.ov .qsoon{display:inline-flex;align-items:center;height:18px;margin-left:8px;padding:0 6px;border-radius:4px;vertical-align:1px;
  background:color-mix(in srgb,var(--team) 12%,transparent);color:color-mix(in srgb,var(--team) 75%,var(--t1));font-style:normal;font-size:12px;font-weight:400;line-height:18px}

/* ================================================================ v11 shell */
.ov .gbar.g11{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,400px) minmax(0,1fr);gap:16px}
.ov .g11l,.ov .g11r{display:flex;align-items:center;gap:4px;min-width:0}
.ov .g11r{justify-content:flex-end}
.ov .g11 .gsr{width:100%;margin:0;flex:none;background:transparent;box-shadow:inset 0 0 0 var(--bw) var(--line2);transition:background-color var(--dur) var(--ease)}
.ov .g11 .gsr:hover{background:var(--hover);box-shadow:inset 0 0 0 var(--bw) var(--line2)}
.ov .g11 .gbal,.ov .phn .gbal{height:34px;margin:0;padding:0 10px;border-radius:8px;background:transparent;box-shadow:none;transition:background-color var(--dur) var(--ease)}
.ov .g11 .gbal:hover,.ov .g11 .pw:has(> .pm.open) > .gbal{background:var(--hover);box-shadow:none}
.ov .ghlp{position:relative;width:34px;height:34px;border-radius:8px}
.ov .pw:has(> .pm.open) > .ghlp{background:var(--hover);color:var(--t1)}
.ov .ghlp > .ic{width:20px;height:20px}
.ov .ghlp .hdot{display:none;position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--page)}
.ov .ghlp.warn .hdot{display:block}
.ov .g11 .qgav{margin-left:6px}
.ov .qbc .qbcb.up b{font-weight:400;color:var(--t2);transition:color var(--dur) var(--ease)}
.ov .qbc .qbcb.up:hover b{color:var(--t1)}
.ov .qbc .qbcs{margin:0;font-size:14px;font-weight:400;color:var(--t3);opacity:1}
.ov .qhlp{width:240px}
.ov .phn .qhlp{width:auto}
.ov .qhlp .qsd{margin-left:auto}
.ov .qsd.warn{color:var(--warnT)}
.ov .v8 .sfl{grid-template-columns:30px;justify-content:start}
.ov .qdlgx.stp1 .qdlg0.qap2{display:none}
.ov .qmrp{display:none}
.ov .qmd8.report .qmrp{display:block}
.ov .qrph{margin:0 0 20px;font-size:16px;line-height:24px;font-weight:500}
.ov .qmrp .qta{height:88px;align-items:flex-start;padding-top:8px;line-height:22px;color:var(--t3)}
.ov .qctx{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;padding:12px 14px;border-radius:8px;background:var(--hover);font-size:12px;line-height:16px}
.ov .qctx em{font-style:normal;color:var(--t3)}
.ov .qctx span{color:var(--t1)}
.ov .qmrp .qmh h2{font-size:16px;line-height:24px}
@container ov (max-width: 1100px){ .ov .g11 .gbal > span:first-child{display:none} .ov .gbar.g11{grid-template-columns:minmax(0,1fr) minmax(160px,280px) max-content} }

/* ================================================================ v12 base rules */
.ov .qcard,.ov .card,.ov .qst,.ov .qdone,.ov .qdrop,.ov .qpre,.ov .qdst,.ov .qstrip,.ov .qmoved,.ov .qmsec,.ov .qswb,.ov .tbx{border-radius:12px}
.ov .qseg,.ov .tseg,.ov .qseg2{padding:2px;border-radius:8px}
.ov .qseg > i{top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / var(--n));border-radius:6px}
.ov .tseg > i{top:2px;bottom:2px;left:2px;width:calc((100% - 4px) / 3);border-radius:6px}
.ov .qseg2 button{border-radius:6px}
.ov .pmi{border-radius:6px}
.ov .phn .pmi{border-radius:8px}
.ov .gsr kbd{border-radius:2px}
.ov .qteam,.ov .qtxt{background:var(--team);box-shadow:none}
.ov .spT .g8::after,.ov .qwk::before,.ov .qspk path{display:none}
.ov .qwk.add,.ov .qdrop{background-image:none}
.ov .qcard.hero,.ov .spT .qcard.hero,.ov .qlivec{background:var(--cardBg)}
.ov .qapl{background:var(--hover)}
.ov .qwk:hover{transform:none;box-shadow:0 0 0 var(--bw) var(--line3)}
.ov .gbal.warn .bd,.ov .qlvbars i.now,.ov .qmarr i{animation:none}
.ov .lvW .pnW .ni.on{background:var(--selected)}
.ov .lvW .pnW .ni.on .ic{color:var(--t1)}
.ov .qtbl.hov tbody tr.on td:first-child{box-shadow:inset 0 calc(var(--bw) * -1) 0 var(--line)}
.ov .fch,.ax .sw2{border-radius:999px}
/* shell polish */
.ov .pico0 .gbar .qbcb .qbci > :is(.qpsp,.qteam,.qws){display:none}
.ov .pico0 .gbar .qbcb{padding:0 8px}
.ov .gbar.g11{padding-left:22px}
.ov .g11 .glogo{padding-right:2px}
.ov .g11r{gap:8px}
.ov .g11 .gbal,.ov .g11 .qbcb,.ov .g11 .gsr{height:32px}
.ov .ghlp{width:32px;height:32px}
.ov .qgav .qav{width:32px;height:32px}
.ov .g11 .qgav{margin-left:0}
.ov .gbar .qav,.ov .qme .qav{background:var(--selected);color:var(--t1)}
.ov .qteam{background:var(--t1)}
.ov .qteam svg circle{fill:var(--page)}
.ov .v8 .sfl{padding-left:5px}
.ov .cold .sfl{padding-left:0}
.ov .sbar .nm{display:none}
.ov .qspi.on:not(:hover),.ov .qwsr.on:not(:hover){background:transparent}
.ov .qwsr .qspk{display:none}
.ov .qwsm8{width:280px}
/* overview polish */
.ov .p-ov .qkpi b{display:block;height:32px;white-space:nowrap}
.ov .p-ov .qkpi .qsp{display:none}
.ov .p-ov .qchc{display:flex;flex-direction:column}
.ov .p-ov .qch2{flex:1;display:flex;flex-direction:column}
.ov .p-ov .qch2 > svg{flex:1 1 190px;height:auto;min-height:190px}
.ov .p-ov .qyax{height:auto;bottom:26px}
.ov .p-ov .qrq{height:40px;font-size:12px}
.ov .p-ov .qrq.qrqh{height:32px;color:var(--t2)}
/* year card: full-width heatmap, flat by default, lifts into 3D */
.ov .qyr{position:relative;margin-bottom:16px;padding:20px 24px}
.ov .qyrt{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.ov .qyrt h2{font-size:16px;line-height:24px;font-weight:500}
.ov .qyrlg .gap{flex:1}
.ov .qyrlg .yrTot{color:var(--t1)}
.ov .qyrsg{display:flex;gap:8px}
.ov .qyr .yrL{position:relative}
.ov .qyr .yrsv{display:block;width:100%;height:auto;overflow:visible;cursor:pointer}
.ov .qyr .yrsv text{fill:var(--t2);font-size:12px}
.ov .qyr .yrsv g.pre{opacity:.5}
.ov .qyr .yrsv g:hover rect,.ov .qyr .yrsv g:hover .t{stroke:var(--t1);stroke-width:1px;vector-effect:non-scaling-stroke}
.ov .qyr .yrsv.in g{animation:yrIn 250ms ease-out both;animation-delay:calc(var(--w) * 8ms)}
@keyframes yrIn{from{opacity:0}}
.ov .qyrlg{display:flex;align-items:center;justify-content:flex-end;gap:4px;margin-top:12px;font-size:12px;line-height:18px;color:var(--t2)}
.ov .qyrlg i{width:10px;height:10px;border-radius:2px}
.ov .qyrlg i.bad{margin-left:12px;background:var(--bad)}
.ov .qyrlg span + i{margin-left:4px}
.ov .qyrlg i + span{margin-left:4px}
.ov .qyr .yrC,.ov .yrc1 .qyr .yrR{display:none}
.ov .yrc1 .qyr .yrC{display:inline}
.ov .qyr .yrtip{position:absolute;z-index:2;min-width:0;padding:6px 10px;border-radius:8px;background:var(--pop);box-shadow:var(--shPop);font-size:12px;line-height:18px;color:var(--t1);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity 250ms ease-out;font-variant-numeric:tabular-nums}
.ov .qyr .yrtip.on{opacity:1}
@container ov (max-width: 1100px){ .ov .qyr{padding:16px 20px} }
.ov .qyr.ph{padding:16px;width:100%;box-sizing:border-box;align-self:stretch}
.ov .qyr.ph .yrsv{height:auto;width:100%;cursor:default}
.ov .qyr.ph .yrsv text{fill:var(--t2);font-size:12px}
.ov .qyrh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;font-size:12px;color:var(--t2)}
.ov .qyrh b{font-size:16px;font-weight:500;color:var(--t1)}
/* overview, round 2 */
.ov .qnote{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:12px 16px;border-radius:12px;background:color-mix(in srgb, var(--warn) 10%, var(--cardBg));box-shadow:inset 0 0 0 var(--bw) color-mix(in srgb, var(--warn) 50%, var(--cardBg))}
.ov .qnote .qatd{flex:none;width:8px;height:8px;margin:0;border-radius:50%;background:var(--warn)}
.ov .qnote > div{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;min-width:0;flex:1}
.ov .qnote b{font-size:14px;line-height:22px;font-weight:500}

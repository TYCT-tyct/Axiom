<script type="text/x-dc" data-dc-script data-props='{"mode": {"editor": "enum", "options": ["浅色", "深色"], "default": "浅色", "section": "Clawd"}, "trigger": {"editor": "enum", "options": ["指到模型", "立刻来"], "default": "指到模型", "section": "Clawd"}, "size": {"editor": "range", "min": 0.04, "max": 0.15, "step": 0.005, "default": 0.065, "section": "Clawd"}, "$preview": {"width": 1440, "height": 900}}'>
const PHONE = false;
const ROSTER = [{ kind: 'classic', size: 0.8 }, { kind: 'hammerhead', size: 0.62 }, { kind: 'classic', size: 0.46 }];
const FONT = '"Geist Mono", ui-monospace, Menlo, monospace';
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0, lit: false };
    this.setRoot = (el) => { if (el && el !== this.root) { this.root = el; } };
    this.setSea = (el) => { if (el && el !== this.sea) { this.sea = el; this.boot(); } };
    this.setClawd = (el) => { if (el && el !== this.ccv) { this.ccv = el; this.boot(); } };
    this.setList = (el) => { if (el && el !== this.list) { this.list = el; this.wireList(); } };
  }
  dark() { return (this.props.mode ?? '浅色') === '深色'; }
  boot() {
    const go = () => {
      if (this.dead || this.eng || !this.sea || !this.ccv || !window.AxiomOceanOrig || !window.ClawdScene) return;
      const light = !this.dark();
      this.eng = new window.AxiomOceanOrig.Engine(this.sea, ROSTER, { font: FONT, light, whale: null, bgLight: '#030302', bgDark: '#111113', sizeK: 0.5, maxLen: 520, warm: 2, virtualScale: 1 });
      this.egg = new window.AxiomClawdEgg(this.root, this.eng, {
        canvas: this.ccv, dark: () => this.dark(), phone: PHONE, scope: this.root, rows: '.mr',
        once: false, delay: 0, sizeFrac: this.props.size ?? 0.065,
        onLight: (rows, on) => { this.setState({ lit: on }); }
      });
      if (this.pending) { this.pending = false; this.egg.summon(null, true); }
    };
    if (document.fonts) document.fonts.load('400 16px "Geist Mono"');
    if (window.AxiomOceanOrig && window.ClawdScene) go(); else window.addEventListener('load', go, { once: true });
  }
  wireList() {
    const pick = (e) => { const li = e.target.closest('.mr'); if (!li) return; const i = +li.dataset.i; if (i !== this.state.sel) this.setState({ sel: i }); };
    this.list.addEventListener('pointerover', pick);
    this.list.addEventListener('click', pick);
  }
  componentDidUpdate(prev) {
    if (!this.eng) return;
    if (prev.mode !== this.props.mode) { this.eng.setLight(!this.dark()); if (this.egg) this.egg.setTheme(this.dark()); }
    if (prev.size !== this.props.size && this.egg) this.egg.cw.setOptions({ sizeFrac: this.props.size ?? 0.065 });
    if (prev.trigger !== this.props.trigger && this.props.trigger === '立刻来') { if (this.egg) this.egg.summon(null, true); else this.pending = true; }
  }
  componentWillUnmount() { this.dead = true; if (this.egg) this.egg.destroy(); if (this.eng) this.eng.destroy(); }
  renderVals() {
    const v = { setRoot: this.setRoot, setSea: this.setSea, setClawd: this.setClawd, setList: this.setList, modeCls: this.dark() ? 'dark' : 'light' };
    for (let i = 0; i < 7; i++) v['r' + i + 'c'] = (i === this.state.sel ? 'on' : '') + (this.state.lit && i < 2 || this.state.lit && i === 5 ? ' cw-lit' : '');
    return v;
  }
}
</script>

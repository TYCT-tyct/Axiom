      if (MODE === 'd') { L(this.hs, 'wheel', this.onWheel, { passive: false }); const isl = root.querySelector('.isl'); L(isl, 'mouseenter', () => this.setState({ isl: true })); L(isl, 'mouseleave', () => this.setState({ isl: false })); }

      this.io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) e.target.classList.add('in'); }), { root: this.hs, threshold: 0.12 });

    const W = window;
    if (W.AxiomOceanOrig && W.AxiomLogin && W.AxiomTrans && W.AxiomPrefs && W.AxiomEnter) go(); else window.addEventListener('load', go, { once: true });
  }
  // the appearance changed (the dive has landed): the screens below follow
  themed(dark) {
    if (this.isDark() === dark) return;
    const before = this.isDark() ? '深色' : '浅色';
    this.setState({ dark });
    if (this.egg) this.egg.setTheme(dark);
    this.kids.forEach((c, k) => c && c.componentDidUpdate && c.componentDidUpdate({ ...DEFS[k], theme: before }));
  }
  // the seabed's footer: its language and appearance switches are the header's, from down there
  langSeg(code) { if (!this.root) return; for (const sg of this.root.querySelectorAll('.under .seg[aria-label="语言"] .sg')) sg.classList.toggle('on', (sg.textContent.trim() === 'EN') === (code !== 'zh-CN' && code !== 'zh-TW')); }
  measure() { if (!this.hs) return; this.off = [0, ...[...this.hs.querySelectorAll('.under > .hfm')].map((el) => el.offsetTop)]; }
  // ---- clicks: the island, the menu and the tour (going to the sign-in page is the transition's own)
  onClick = (e) => {
    const a = e.target && e.target.closest && e.target.closest('a, button, .seg .sg'); if (!a || !this.root.contains(a)) return;
    if (a.matches('.isl .im, .sheet .brand')) { e.preventDefault(); this.setState({ menu: false }); this.glide(0); return; }
    if (a.matches('.menu')) { e.preventDefault(); this.setState({ menu: true }); return; }
    if (a.matches('.shx')) { this.setState({ menu: false }); return; }
    if (a.matches('.sml')) { this.setState({ menu: false }); this.glide((this.off || [])[+a.dataset.sec] || 0); return; }
    if (a.matches('.tour')) { this.tour(); return; }
    const sg = e.target.closest('.under .seg .sg');
    if (sg && this.pf) {
      const lab = sg.getAttribute('aria-label');
      if (lab === '浅色' || lab === '深色') { if ((lab === '深色') !== this.isDark()) this.pf.toggleTheme(); }
      else this.pf.choose(sg.textContent.trim() === 'EN' ? 'en' : 'zh-CN', sg);
      return;
    }
    if (a.hasAttribute('data-go') && this.state.menu) this.setState({ menu: false });
  };
  // ---- scrolling: the wheel sets a target and the page glides to it, so long dives stay smooth
  onWheel = (e) => {
    if (!this.hs || (this.props.scroll ?? '惯性顺滑') !== '惯性顺滑' || (this.root && this.root.dataset.state !== 'home')) return;
    e.preventDefault();
    const pg = this.hs, max = pg.scrollHeight - pg.clientHeight;
    this.tgt = Math.max(0, Math.min(max, (this.tgt ?? pg.scrollTop) + e.deltaY));
  };
  ease() {

  glide(y) {

    const step = (now) => { const q = Math.min(1, (now - s) / ms), e = q < 0.5 ? 4 * q * q * q : 1 - Math.pow(-2 * q + 2, 3) / 2; pg.scrollTop = from + (y - from) * e; if (q < 1) this.sr = requestAnimationFrame(step); };

  tour() {

  }
  // ---- one depth for the sea and the island
  onScroll = () => {
    if (this.sq) return;
    this.sq = requestAnimationFrame(() => {
      this.sq = 0; const pg = this.hs; if (!pg) return;
      const top = pg.scrollTop, VH = pg.clientHeight, max = Math.max(1, pg.scrollHeight - VH), d = Math.min(1, top / max), OFF = this.off || [0];
      // the sea dims as you go down
      if (this.depthEl) this.depthEl.style.opacity = (0.42 * Math.pow(d, 1.3)).toFixed(3);
      const probe = top + VH * 0.35; let i = 0; while (i < OFF.length - 1 && OFF[i + 1] <= probe) i++;
      const span = (i < OFF.length - 1 ? OFF[i + 1] : OFF[i] + VH) - OFF[i], k = clamp01((probe - OFF[i]) / Math.max(1, span));
      const depth = i >= SECS.length - 1 ? SECS[SECS.length - 1][1] : Math.round(SECS[i][1] + (SECS[i + 1][1] - SECS[i][1]) * k);
      const s = { solid: top > 8, sec: Math.min(i, SECS.length - 1), depth, bottom: d > 0.985 };
      if (Object.keys(s).some((q) => s[q] !== this.state[q])) this.setState(s);
    });
  };
  componentDidUpdate(prev) {
    if (!this.eng) return;
    if (prev.system !== this.props.system) this.pf.setSystem(this.sys());
    if (prev.speed !== this.props.speed) { this.tr.set({ slow: this.slow() }); if (this.egg) this.egg.set({ slow: this.slow() }); }
    if (prev.whale !== this.props.whale && this.props.whale === '立刻来' && this.egg) this.egg.summon(null, true);

  }
  componentWillUnmount() {

    this.kids.forEach((c) => c && c.componentWillUnmount && c.componentWillUnmount());
    for (const [el, ev, fn, o] of this.on || []) el.removeEventListener(ev, fn, o);
    if (this.io) this.io.disconnect(); if (this.ro) this.ro.disconnect();
    for (const x of [this.egg, this.ent, this.tr, this.pf, this.eng]) if (x) x.destroy();
  }
  renderVals() {
    const dark = this.isDark(), T = themeOf(dark), st = this.state;
    const v = { setCanvas: this.setCanvas, vars: T.vars, modeCls: dark ? 'dark' : 'light' };
    v.barCls = st.solid ? 'away' : '';
    v.islCls = st.solid ? (st.bottom ? 'on hide' : 'on' + (st.isl ? ' open' : '')) : '';
    v.sheetCls = st.menu ? 'on' : ''; v.sheetHide = st.menu ? 'false' : 'true';
    v.secTxt = SECS[st.sec][0]; v.depthTxt = fmtD(st.depth);
    v.tourCls = st.solid ? 'gone' : '';
    SECS.forEach((s, i) => { v['t' + i] = i === st.sec ? 'on' : ''; });
    this.kids.forEach((c, k) => { if (!c) return; const cv = c.renderVals(); for (const key in cv) v['m' + k + '_' + key] = cv[key]; });
    return v;
  }
}

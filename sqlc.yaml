# One entry per module that owns queries: its schema is sqlc/schemas.sql and that module's own migrations, nothing
# else, so a query on another module's table fails to generate. Its queries are in queries/ beside the Go package,
# and everything is generated into the package as *.gen.go, so `just generated` sees a stale file.
# internal/platform/README.md「查询（sqlc）」 has the rules.
version: "2"
sql:
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/platform/pg/migrations]
    queries: internal/platform/audit/queries
    gen:
      go:
        package: audit
        out: internal/platform/audit
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/platform/pg/migrations]
    queries: internal/platform/idem/queries
    gen:
      go:
        package: idem
        out: internal/platform/idem
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
  - engine: postgresql
    # accounts reads the readiness flag the platform heartbeat publishes; the rest of platform's tables stay outside
    # its queries by convention.
    schema: [sqlc/schemas.sql, internal/platform/pg/migrations, internal/accounts/migrations]
    queries: internal/accounts/queries
    gen:
      go:
        package: accounts
        out: internal/accounts
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        # IDs are the standard library's uuid.UUID, as everywhere in Go (README.md「ID」).
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          - {db_type: uuid, nullable: true, go_type: {import: uuid, type: UUID, pointer: true}}
          - {db_type: timestamptz, nullable: true, go_type: {import: time, type: Time, pointer: true}}
          # The operations credentials take the service's clock (Config.Now), so their tests can move it.
          - {column: accounts.agent_credentials.created_at, go_type: {import: time, type: Time}}
          - {column: accounts.agent_credentials.expires_at, go_type: {import: time, type: Time}}
          - {column: accounts.agent_credential_tokens.created_at, go_type: {import: time, type: Time}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/catalog/migrations]
    queries: internal/catalog/queries
    gen:
      go:
        package: catalog
        out: internal/catalog
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          - {db_type: uuid, nullable: true, go_type: {import: uuid, type: UUID, pointer: true}}
          - {db_type: timestamptz, go_type: {import: time, type: Time}}
          - {db_type: timestamptz, nullable: true, go_type: {import: time, type: Time, pointer: true}}
          - {db_type: text, nullable: true, go_type: {type: string, pointer: true}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/suppliers/internal/store/migrations]
    queries: internal/suppliers/internal/store/queries
    gen:
      go:
        package: store
        out: internal/suppliers/internal/store
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        # Plain Go types for what modules pass around, so their code names no pgx type (depguard bans pgx outside
        # platform; sqlc's own output is the exception).
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          - {db_type: uuid, nullable: true, go_type: {import: uuid, type: UUID, pointer: true}}
          - {db_type: "pg_catalog.numeric", go_type: string}
          - {db_type: timestamptz, go_type: {import: time, type: Time}}
          - {db_type: timestamptz, nullable: true, go_type: {import: time, type: Time, pointer: true}}
          - {db_type: "pg_catalog.int8", go_type: int64}
          - {db_type: "pg_catalog.int8", nullable: true, go_type: {type: int64, pointer: true}}
          - {db_type: "pg_catalog.int4", nullable: true, go_type: {type: int32, pointer: true}}
          - {db_type: text, nullable: true, go_type: {type: string, pointer: true}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/observability/migrations]
    queries: internal/observability/internal/store/queries
    gen:
      go:
        package: store
        out: internal/observability/internal/store
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          - {db_type: timestamptz, go_type: {import: time, type: Time}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/billing/migrations]
    queries: internal/billing/queries
    gen:
      go:
        package: billing
        out: internal/billing
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          # Route UUID arrays use pgx's typed codec instead of reflective slice wrapping.
          - {column: "billing.reservations.models", go_type: {import: "github.com/jackc/pgx/v5/pgtype", type: "FlatArray[uuid.UUID]"}}
          - {column: "billing.reservations.endpoints", go_type: {import: "github.com/jackc/pgx/v5/pgtype", type: "FlatArray[uuid.UUID]"}}
          - {column: "billing.reservations.price_versions", go_type: {import: "github.com/jackc/pgx/v5/pgtype", type: "FlatArray[uuid.UUID]"}}
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          - {db_type: uuid, nullable: true, go_type: {import: uuid, type: UUID, pointer: true}}
          - {db_type: timestamptz, go_type: {import: time, type: Time}}
          - {db_type: timestamptz, nullable: true, go_type: {import: time, type: Time, pointer: true}}
          - {db_type: "pg_catalog.int8", go_type: int64}
          - {db_type: "pg_catalog.int8", nullable: true, go_type: {type: int64, pointer: true}}
          - {db_type: "pg_catalog.int4", nullable: true, go_type: {type: int32, pointer: true}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/payments/migrations]
    queries: internal/payments/queries
    gen:
      go:
        package: payments
        out: internal/payments
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          - {db_type: uuid, nullable: true, go_type: {import: uuid, type: UUID, pointer: true}}
          # An exchange rate's terms are exact fractions, wider than int64: they cross as their decimal text.
          - {db_type: "pg_catalog.numeric", go_type: string}
          - {db_type: timestamptz, go_type: {import: time, type: Time}}
          - {db_type: "pg_catalog.int8", go_type: int64}
          - {db_type: "pg_catalog.int8", nullable: true, go_type: {type: int64, pointer: true}}
          - {db_type: "pg_catalog.bool", nullable: true, go_type: {type: bool, pointer: true}}
          - {db_type: text, nullable: true, go_type: {type: string, pointer: true}}
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/operations/migrations]
    queries: internal/operations/queries
    gen:
      go:
        package: operations
        out: internal/operations
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true
        overrides:
          - {db_type: uuid, go_type: {import: uuid, type: UUID}}
          # Exact amounts cross as their decimal text, not a float.
          - {db_type: "pg_catalog.numeric", go_type: string}
          # month is a date: its UTC first day identifies the target.
          - {column: "operations.targets.month", go_type: {import: time, type: Time}}
          - {column: "operations.operation_log.started_at", go_type: {import: time, type: Time}}
          - {column: "operations.operation_log.ended_at", go_type: {import: time, type: Time}}
          - {column: "operations.commercial_targets.month", go_type: {import: time, type: Time}}
          - {column: "operations.target_revisions.month", go_type: {import: time, type: Time}}
          - {db_type: text, nullable: true, go_type: {type: string, pointer: true}}

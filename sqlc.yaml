# One entry per module that owns queries: its schema is that module's migrations (and those of the modules it
# depends on, when its queries read their tables), its queries are in queries/ beside the Go package. Everything is
# generated into the package as *.gen.go, so `just generated` sees a stale file. internal/platform/README.md
# 「sqlc」 has the rules.
version: "2"
sql:
  - engine: postgresql
    schema: [sqlc/schemas.sql, internal/platform/pg/migrations]
    queries: internal/platform/audit/queries
    gen:
      go:
        package: audit
        out: internal/platform/audit
        sql_package: pgx/v5
        output_files_suffix: .gen
        output_db_file_name: db.gen.go
        output_models_file_name: models.gen.go
        emit_methods_with_db_argument: true
        omit_unused_structs: true

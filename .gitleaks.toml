# gitleaks reads this file from the directory it scans (`just secrets`, and the secrets job in workflow.yml).
title = "Axiom"

[extend]
useDefault = true

# The generated API packages embed their OpenAPI contract as base64 of the gzipped spec, split over lines of an array.
# That text looks like a high-entropy key to the generic-api-key rule and holds only the compressed contract, which is
# in api/*.yaml in the clear. Only these generated files are skipped; a secret anywhere else still fails.
[[allowlists]]
description = "embedded OpenAPI contract in generated code"
paths = ['''internal/platform/(adminapi|consoleapi|operationsapi)/[^/]+\.gen\.go''']

# The Stripe webhook tests sign fixtures with a placeholder secret. It is not a credential: only
# webhook.GenerateTestSignedPayload uses it, no live endpoint sees it, and the channel verifies with the merchant's own
# secret. It is already in this branch's history, where this file cannot reach it, so the value is allowed by exact
# match rather than replaced; a real whsec_ key still fails, as does any other value in the same tests.
[[allowlists]]
description = "placeholder Stripe webhook secret in the payments tests"
regexes = ['''^whsec_test_secret_0123456789$''']

# The WeChat Pay tests encrypt their fixtures with a placeholder APIv3 key. It is not a credential: only the tests use
# it, and the channel encrypts and decrypts with the merchant's own key. The first version was a 32-character hex
# string, the shape of a real key, and it is already in an earlier commit of this branch, which cannot be rewritten;
# the tests now use a value no scanner can mistake for a key. Allow that exact string and nothing else: any other
# high-entropy value in the same tests still fails.
[[allowlists]]
description = "placeholder WeChat Pay APIv3 key in an earlier commit of the payments tests"
regexes = ['''^0123456789abcdef0123456789abcdef$''']

# The EzPay signature vectors fix the MD5 digest of the canonical query strings signed with the placeholder key. A
# 32-character hex digest has the shape of a generic API key, but it is the expected output of the test, not a
# credential: no live endpoint sees it. The values are already in commit b00beb8b, which cannot be rewritten, so allow
# those two exact digests and nothing else; a real key in the same tests still fails.
[[allowlists]]
description = "EzPay signature digest vectors in an earlier commit of the payments tests"
regexes = ['''^a044d7461cfe6481920ca58ce533adf7$''', '''^b7338b55a6e7bc634a11dddf98134824$''']

# The content export tests list the file names `axiom content keygen` writes. The generic-api-key rule reads the
# keyword "key" before `", "` as an assignment and takes the next name for its value. It is a file name, not a
# credential, and it is already in commit 5b0351ad, which cannot be rewritten, so allow that exact string and nothing
# else; a real key in the same tests still fails.
[[allowlists]]
description = "owner key file name in the content export tests"
regexes = ['''^owner-signing-2\.pub$''']

# The operations alert tests raise and resolve an alert under the key `supplier/acme/balance`. The generic-api-key rule
# reads the keyword before it (a `token` argument, a `"key":` member) as an assignment and the key, at entropy 3.56, as
# its value. It is an alert's merge key, not a credential, and it is already in commits 9d1dba02 and a81dd28e, which
# cannot be rewritten, so allow that exact string and nothing else; a real key in the same tests still fails.
[[allowlists]]
description = "alert key in the operations alert tests"
regexes = ['''^supplier/acme/balance$''']

# The Login artboard displays this fixed demo key in its animation and clipboard examples; it never authenticates a
# request. Preserve the authored input and generated engine, including their already-pushed history. Both the exact
# value and one of these two paths must match; other values in either file and this value elsewhere still fail.
[[allowlists]]
description = "fixed display key in the Login artboard and its generated engine"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/packages/boards/(inputs/login-ui\.js\.txt|src/engines/login-ui\.js)$''']
regexes = ['''^sk-ax-3f9a8c2e71b04d6e9a5f0c3b$''']

# Steps decodes this fixed display value into its simulated key row; Site embeds the same Steps animation. The
# request animation only updates state and never sends a request. Keep the authored bytes and pushed history,
# allowing only this exact value in these five boards' pinned logic and generated controllers.
[[allowlists]]
description = "fixed display key in the Steps animation and the Site boards embedding it"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^web/packages/boards/(inputs/(Steps|Site|SitePhone|SiteTablet|SiteTabletWide)\.logic\.html|src/(Steps|Site|SitePhone|SiteTablet|SiteTabletWide)/logic\.ts)$''']
regexes = ['''^sk-ax-7f3c9a1e5b02$''']
